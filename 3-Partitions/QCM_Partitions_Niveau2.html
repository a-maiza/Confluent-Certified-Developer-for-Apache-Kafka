<script>
var QUESTIONS_RAW = [
  /* ===== 1. FROM COURSE — Why partitioning enables scalability ===== */
  {
    source: "cours",
    type: "single",
    question: "A startup is designing a Kafka-based event pipeline expected to handle 50TB of data per day. Their initial architecture uses a single topic with 1 partition. The infrastructure team warns this will not scale. What is the fundamental scalability constraint that partitioning solves, and what is the correct architectural decision?",
    options: [
      { text: "A single partition is limited by the broker's CPU speed. Adding partitions distributes CPU processing across brokers.", explanation: "Incorrect. While multiple partitions can involve multiple brokers, the primary constraint is not CPU. The fundamental bottleneck is that a single partition resides on a single disk of a single node — storage capacity and I/O throughput are bounded by that machine.", correct: false },
      { text: "A single-partition topic is limited to the storage and throughput capacity of one broker node. Increasing the partition count distributes the topic across multiple brokers, enabling horizontal scaling beyond single-machine limits.", explanation: "Correct. Without partitioning, a topic is confined to one node — throughput and storage are capped at that node's capabilities. Partitions allow a topic to span multiple brokers, so total capacity equals the aggregate of all participating nodes.", correct: true },
      { text: "A single partition limits the number of consumer groups that can read the topic. More partitions allow more consumer groups to subscribe.", explanation: "Incorrect. Multiple consumer groups can read from a single-partition topic — each group maintains its own offset independently. Partition count limits parallelism within a consumer group, not the number of groups.", correct: false },
      { text: "Single-partition topics cannot use replication. Adding partitions enables replicas to be placed on separate brokers.", explanation: "Incorrect. Replication is independent of partition count — even a single-partition topic can and should have replicas on multiple brokers for fault tolerance.", correct: false }
    ],
    globalExplanation: "Partitioning is Kafka's fundamental horizontal scaling mechanism. A single partition is an append-only log stored on one broker's disk — it cannot exceed that node's capacity. By splitting a topic into multiple partitions distributed across brokers, Kafka allows a topic's total storage and throughput to scale linearly with cluster size. This is why partition count is one of the most critical decisions in a Kafka deployment."
  },
  /* ===== 2. FROM COURSE — Ordering guarantee scope ===== */
  {
    source: "cours",
    type: "single",
    question: "A financial platform produces trade events to a Kafka topic with 5 partitions. A downstream consumer needs to ensure that events for the SAME trade are always processed in the order they were produced. However, the team notices that events for different trades appear interleaved in unpredictable order. Is this expected behavior, and what is the correct approach?",
    options: [
      { text: "Unexpected. Kafka guarantees global ordering across all partitions within a topic, regardless of configuration.", explanation: "Incorrect. Kafka provides NO global ordering guarantee across partitions. Messages written to different partitions are independent and can be read in any interleaved order.", correct: false },
      { text: "Expected. Kafka only guarantees order within a single partition. To ensure per-trade ordering, the trade ID must be used as the message key so all events for the same trade route to the same partition.", explanation: "Correct. Order is guaranteed only within a partition. Using the trade ID as the message key ensures hash(tradeId) % numPartitions always routes all events for the same trade to the same partition, preserving their production order for that partition's consumer.", correct: true },
      { text: "Expected. To fix this, set `max.inflight.requests.per.connection=1` on the producer — this enforces global ordering across all partitions.", explanation: "Incorrect. `max.inflight.requests.per.connection=1` prevents reordering during retries within a single partition, but it does not enforce any ordering across different partitions. Inter-partition ordering is fundamentally impossible in Kafka.", correct: false },
      { text: "Unexpected. Increasing the replication factor to 3 ensures events are replicated in order across brokers, providing global ordering.", explanation: "Incorrect. Replication factor affects fault tolerance and durability — it has no impact on message ordering. Ordering is a property of partitions, not replicas.", correct: false }
    ],
    globalExplanation: "Kafka's ordering guarantee is scoped to the partition: messages within a single partition are always read in the order they were written. There is no cross-partition ordering guarantee. The standard pattern for entity-level ordering is to use the entity's identifier (trade ID, user ID, sensor ID) as the message key, which deterministically routes all events for that entity to the same partition via `hash(key) % numPartitions`."
  },
  /* ===== 3. FROM COURSE — Null key = round-robin, no ordering ===== */
  {
    source: "cours",
    type: "single",
    question: "A telemetry platform produces temperature readings from sensor 42 to a Kafka topic. Events are produced without a message key. The consumer team reports that temperature readings for sensor 42 arrive out of chronological order. A developer proposes setting `acks=all` to fix the ordering issue. Will this solve the problem?",
    options: [
      { text: "Yes — `acks=all` ensures all replicas acknowledge the write in sequence, preserving producer order.", explanation: "Incorrect. `acks=all` controls how many replicas must acknowledge before the producer considers a write successful — it is a durability setting, not an ordering mechanism. It has no influence on which partition a message is routed to.", correct: false },
      { text: "No — without a key, messages are distributed round-robin across partitions. Sensor 42's readings land in multiple partitions, making cross-partition ordering impossible. The fix is to set the message key to the sensor ID.", explanation: "Correct. Null-key messages use round-robin distribution — consecutive readings from sensor 42 go to different partitions. Since Kafka only guarantees ordering within a partition, readings for the same sensor appear out of order at the consumer. Using the sensor ID as the key ensures all readings route to the same partition.", correct: true },
      { text: "No — the fix is to set `enable.idempotence=true` on the producer to prevent out-of-order retries.", explanation: "Incorrect. Idempotence prevents duplicate messages during retries within a single partition, but does not affect which partition a message is routed to. Without a key, messages still distribute round-robin across partitions.", correct: false },
      { text: "Yes — setting `linger.ms=0` ensures messages are sent immediately in order, before the producer has time to batch across partitions.", explanation: "Incorrect. `linger.ms=0` affects batch assembly timing on the producer side but does not change the partition assignment algorithm. Messages without a key still go to different partitions regardless of `linger.ms`.", correct: false }
    ],
    globalExplanation: "Messages without a key (null key) are distributed across partitions using round-robin (or the Sticky Partitioner in Kafka 2.4+). This distributes load evenly but destroys any ordering guarantees across messages from the same producer. For sensor telemetry where per-sensor ordering matters, the sensor ID must be the message key: `hash(sensorId) % numPartitions` guarantees all readings for a given sensor land on the same partition."
  },
  /* ===== 4. FROM COURSE — Key routing guarantees same partition ===== */
  {
    source: "cours",
    type: "single",
    question: "An IoT platform produces events for 10,000 different devices. Each device sends status updates that must be processed in order. The architecture team decides to use the device ID as the message key. A developer asks: 'With 50 partitions, are we guaranteed that ALL updates for device-7 always go to partition 12 (determined by the current hash)?' What is the correct answer?",
    options: [
      { text: "Yes, permanently — `hash(device-7) % 50 = 12` is a deterministic and immutable mapping as long as the partition count stays at 50.", explanation: "Correct. The hash function applied to a key is deterministic — the same key always produces the same hash. As long as the partition count remains 50, `hash('device-7') % 50` always produces the same result. The ordering guarantee is stable as long as the number of partitions does not change.", correct: true },
      { text: "No — Kafka re-evaluates the hash on every message and may assign different partitions each time.", explanation: "Incorrect. The hash function is deterministic and stable. For a given key and partition count, the result is always the same. Kafka does not randomly re-evaluate per message.", correct: false },
      { text: "Yes, but only if `enable.idempotence=true` is set — otherwise hash collisions can send the message to a different partition.", explanation: "Incorrect. Idempotence has nothing to do with partition routing. Hash collisions in partition assignment (different keys mapping to the same partition) are expected and normal, but a specific key always maps to the same partition deterministically.", correct: false },
      { text: "No — the broker periodically rebalances partition assignments to equalize load, which can change where a key maps to.", explanation: "Incorrect. Partition assignment of MESSAGES (based on key hash) is a producer-side calculation and is never changed by the broker. Broker-side rebalancing refers to replica/leadership redistribution, which does not affect the key → partition mapping formula.", correct: false }
    ],
    globalExplanation: "Key-based partition routing uses a deterministic hash: `murmur2(key) % numPartitions`. For a fixed partition count, any given key always maps to the same partition — providing a stable ordering guarantee for all messages of that key. The critical caveat: if the partition count is changed, the formula changes, and the same key may map to a DIFFERENT partition, breaking the ordering guarantee for messages across the boundary."
  },
  /* ===== 5. FROM COURSE — Effect of adding partitions on key routing ===== */
  {
    source: "cours",
    type: "single",
    question: "A payment processing system has used a 10-partition topic for 6 months, with `transactionId` as the message key. All transactions are being processed in order. The ops team wants to increase throughput and increases the partition count from 10 to 15. What is the risk to the ordering guarantee?",
    options: [
      { text: "No risk — Kafka automatically remaps existing messages to the new partition scheme during the partition increase.", explanation: "Incorrect. Kafka does NOT move or re-index existing messages when partitions are added. Existing messages remain in their original partitions with their original offsets. Only NEW messages are affected by the new partition count.", correct: false },
      { text: "The ordering guarantee is broken at the transition boundary. Some transaction IDs that previously mapped to partition X (with 10 partitions) now map to a different partition Y (with 15 partitions). New and old messages for the same key may now live in different partitions.", explanation: "Correct. `hash(key) % 10` and `hash(key) % 15` produce different results for most keys. Historical messages for `transactionId-ABC` are in their old partition; new messages for the same ID go to a potentially different partition. Any consumer reading sequentially will encounter the ordering break.", correct: true },
      { text: "The risk is only on partition 0 — Kafka always reroutes new messages to partition 0 during transitions.", explanation: "Incorrect. There is no special behavior for partition 0 during partition increases. Every key's mapping is recalculated with the new modulo, affecting all keys differently.", correct: false },
      { text: "No risk — Kafka's sticky partitioner ensures keys maintain their partition affinity during partition count changes.", explanation: "Incorrect. The Sticky Partitioner applies to null-key messages and is unrelated to key-based routing. Key-based routing always uses `hash(key) % numPartitions`, which changes when `numPartitions` changes.", correct: false }
    ],
    globalExplanation: "Increasing partition count is one of the most dangerous operations for ordering guarantees. When `numPartitions` changes, `hash(key) % numPartitions` produces different results, redistributing keys across partitions. Historical messages remain in original partitions; new messages go to new partitions. For consumers that rely on per-key ordering, this creates a split-brain scenario: the same key now has messages in two different partitions. This is why partition count decisions should be made carefully upfront."
  },
  /* ===== 6. FROM COURSE — No global ordering even within same producer ===== */
  {
    source: "cours",
    type: "single",
    question: "A developer produces a sequence of 9 messages to a 3-partition topic without using a message key. They expect a consumer reading all 3 partitions to receive the messages in production order: m1, m2, m3, m4, m5, m6, m7, m8, m9. Will this expectation be met?",
    options: [
      { text: "Yes — even without a key, Kafka preserves the global production order across partitions for messages from the same producer.", explanation: "Incorrect. Kafka provides no global ordering guarantee across partitions. This is a fundamental architectural property — partitions are independent logs on different nodes.", correct: false },
      { text: "No — without a key, messages are distributed round-robin (m1→P0, m2→P1, m3→P2, m4→P0, ...). A consumer reading all partitions will receive messages in per-partition order but not in the original cross-partition production order.", explanation: "Correct. Round-robin distribution sends m1 to P0, m2 to P1, m3 to P2, m4 to P0, etc. A consumer reading P0 sees [m1, m4, m7] in order. A consumer reading all partitions sees messages interleaved across partitions — the global order m1, m2, m3... is not preserved.", correct: true },
      { text: "No — without a key, messages are randomly distributed, so even within a single partition the order is not guaranteed.", explanation: "Incorrect. Ordering within a partition is always guaranteed regardless of key usage. The issue is cross-partition ordering, not intra-partition ordering.", correct: false },
      { text: "Yes — using `acks=1` on the producer ensures that the broker acknowledges each message in order, preserving global sequence.", explanation: "Incorrect. `acks=1` is a producer durability setting — it does not affect the partition routing algorithm or impose any cross-partition ordering.", correct: false }
    ],
    globalExplanation: "Without a message key, round-robin distribution deliberately spreads messages across partitions for load balancing. The consumer receives messages in per-partition order (within each partition, the sequence is preserved), but the global production order is lost. This is the correct trade-off when ordering is not required: maximum load distribution. When production order must be preserved, a message key is mandatory."
  },
  /* ===== 7. FROM COURSE — Distribution vs ordering trade-off ===== */
  {
    source: "cours",
    type: "multiple",
    question: "A data engineering team is designing a Kafka topic for two different types of events: (1) user clickstream events where ordering does not matter, and (2) bank transfer events where the order of operations per account is critical. Which TWO design decisions correctly match each use case?",
    options: [
      { text: "For clickstream events: produce without a message key to achieve uniform load distribution across all partitions.", explanation: "Correct. Clickstream events are independent — ordering is not required. Null-key (round-robin or sticky) distribution spreads the load evenly across partitions, maximizing throughput and broker parallelism.", correct: true },
      { text: "For bank transfer events: use the account ID as the message key to ensure all operations for the same account route to the same partition and are processed in order.", explanation: "Correct. Using the account ID as a key ensures `hash(accountId) % numPartitions` deterministically routes all transfers for the same account to the same partition, preserving their production order for downstream processors.", correct: true },
      { text: "For bank transfer events: produce without a key but set `acks=all` to ensure durability and ordering.", explanation: "Incorrect. `acks=all` ensures durability (all ISRs acknowledge) but does not guarantee ordering for messages sent without a key — they still distribute round-robin across partitions.", correct: false },
      { text: "For clickstream events: use a random UUID as the message key to ensure even distribution while maintaining the ordering guarantee.", explanation: "Incorrect. Using a random UUID as a key wastes a hash computation and provides no semantic benefit. More importantly, it doesn't guarantee even distribution (hash collisions can skew), and ordering per UUID is meaningless. Null key is simpler and correct for this use case.", correct: false }
    ],
    globalExplanation: "The fundamental partition routing decision is: ordered processing per entity → use entity ID as key; even load distribution without ordering requirements → use null key. These two patterns are complementary and can coexist in the same system with different topics. The key is not just a routing mechanism — it carries business semantics (entity identity) that makes the ordering guarantee meaningful."
  },
  /* ===== 8. FROM COURSE — Kafka partition count scale ===== */
  {
    source: "cours",
    type: "single",
    question: "A solutions architect is planning a Kafka cluster (v4.0) for a global streaming platform. They need to support 500 topics with an average of 500 partitions each (250,000 total partitions). A stakeholder questions whether this is within Kafka's supported limits. What is the correct answer?",
    options: [
      { text: "No — Kafka supports a maximum of 100,000 partitions per cluster. 250,000 partitions would require multiple clusters.", explanation: "Incorrect. The limit cited is incorrect. Kafka has been continuously increasing its partition capacity across versions.", correct: false },
      { text: "Yes — Kafka (around v4.0) supports approximately 2 million partitions per cluster. 250,000 partitions is well within this limit.", explanation: "Correct. Apache Kafka around version 4.0 supports approximately 2 million partitions per cluster. 250,000 partitions (500 topics × 500 partitions) represents only 12.5% of the maximum supported capacity.", correct: true },
      { text: "No — Kafka limits topics to a maximum of 1,000 partitions each. 500 partitions per topic exceeds this limit.", explanation: "Incorrect. There is no hard limit of 1,000 partitions per topic. Topics can have thousands of partitions, and the cluster-level limit (not per-topic) is approximately 2 million total partitions.", correct: false },
      { text: "Yes — Kafka has no practical partition limit; the only constraint is available disk space across the cluster.", explanation: "Incorrect. Kafka does have a tested and documented partition limit (~2 million per cluster in v4.0). Beyond this limit, controller performance degrades, and ZooKeeper (pre-KRaft) or KRaft metadata management becomes a bottleneck.", correct: false }
    ],
    globalExplanation: "Kafka's partition capacity has grown significantly over versions. Around Kafka 4.0, the supported limit is approximately 2 million partitions per cluster. This is a cluster-wide constraint, not per-topic. The partition limit is primarily governed by the metadata management layer: in KRaft mode (Kafka 3.3+), the controller stores partition metadata in its log, and very large numbers of partitions can impact controller performance and recovery time."
  },
  /* ===== 9. FROM COURSE — Hot partition with key-based routing ===== */
  {
    source: "cours",
    type: "single",
    question: "A social media platform uses user ID as the message key for a `user-actions` topic with 20 partitions. One celebrity account generates 40% of all events. Operations monitoring shows partition 7 (where the celebrity's key hashes to) is consistently at 10× the load of other partitions. What is the root cause?",
    options: [
      { text: "Partition 7 has a faulty disk that slows down reads and writes, causing message buildup.", explanation: "Incorrect. The described symptom — 40% of events concentrated on one partition correlating exactly with a high-volume key — is a classic hot partition caused by key-based routing, not hardware failure.", correct: false },
      { text: "The hash function has a flaw that always maps most keys to partition 7.", explanation: "Incorrect. Kafka uses the murmur2 hash, which distributes keys relatively uniformly across partitions. The problem is not the hash function — it is that one specific key produces vastly more events than others.", correct: false },
      { text: "Key-based routing concentrates all messages with the same key on one partition. When one key generates disproportionate traffic (celebrity account), its partition becomes a 'hot partition' with significantly higher load.", explanation: "Correct. The hash-based routing guarantee (same key → same partition) is a feature for ordering, but it becomes a liability when key cardinality is highly skewed. All events for the celebrity user route to partition 7, making it receive 40% of total load while other partitions share the remaining 60%.", correct: true },
      { text: "The celebrity account is assigned to partition 7 because it was the first user to register — Kafka assigns early users to low-numbered partitions.", explanation: "Incorrect. Kafka does not maintain any relationship between registration order and partition assignment. Partition assignment is purely determined by `murmur2(key) % numPartitions` at message production time.", correct: false }
    ],
    globalExplanation: "Hot partitions occur when key cardinality is skewed — a small number of keys generate a large fraction of messages. Key-based routing is deterministic but not load-aware: it cannot redistribute a high-volume key across multiple partitions without sacrificing the ordering guarantee. Solutions include: (1) a custom Partitioner that detects hot keys and salts them; (2) using a composite key (e.g., `userId + bucketId`); (3) accepting the hot partition and over-provisioning that broker's resources."
  },
  /* ===== 10. FROM COURSE — Partition is an ordered log ===== */
  {
    source: "cours",
    type: "single",
    question: "A developer describes a Kafka partition to a new team member as follows: 'A partition is like a shared message queue where multiple producers can push messages and the queue automatically sorts them globally.' Which part of this description is incorrect?",
    options: [
      { text: "Multiple producers cannot write to the same partition.", explanation: "Incorrect — this is wrong as a correction. Multiple producers CAN write to the same partition (they all route to the partition leader). The described flaw is elsewhere.", correct: false },
      { text: "A partition does NOT automatically sort messages globally. It is an append-only ordered log where messages are appended in arrival order and read in that same order — no sorting occurs.", explanation: "Correct. A Kafka partition is an immutable, append-only log. Messages are written in arrival order and assigned sequential offsets (0, 1, 2...). There is no sorting mechanism — the order IS the append order. The 'global sorting' description is completely wrong.", correct: true },
      { text: "A partition is not associated with a queue — it is associated with a topic.", explanation: "Incorrect. While this is technically a distinction worth making (queue vs. log), the more fundamental error in the description is the 'globally sorted' claim. Partitions are indeed not traditional queues, but the sorting claim is the primary inaccuracy.", correct: false },
      { text: "Kafka partitions cannot be written to by multiple producers simultaneously — only one producer can hold a lock on a partition at a time.", explanation: "Incorrect. Kafka does not use partition-level write locks. Multiple producers can concurrently write to the same partition via the partition leader broker, which serializes the writes at the leader.", correct: false }
    ],
    globalExplanation: "A Kafka partition is an append-only, immutable ordered log. Messages are appended sequentially and assigned monotonically increasing offsets (0, 1, 2, ...). Consumers read messages in offset order — this IS the ordering guarantee. There is no sorting, no prioritization, and no global reordering. The log abstraction is fundamental to understanding Kafka's behavior: it explains retention policies, offset management, and why ordering is per-partition."
  },
  /* ===== 11. BEYOND COURSE — Choosing partition count ===== */
  {
    source: "inference",
    type: "single",
    question: "A platform architect is designing a new Kafka topic for a payment processing system. The system must handle a peak throughput of 50,000 messages/second. Benchmarking shows each broker can sustain 10,000 messages/second per partition with the target message size. The topic will be consumed by a consumer group. What is the recommended minimum partition count?",
    options: [
      { text: "1 partition — Kafka's internal batching handles any throughput automatically.", explanation: "Incorrect. A single partition can only be written to and consumed by one thread/process at a time. 10,000 msg/s per partition × 1 partition = 10,000 msg/s total — far below the 50,000 msg/s requirement.", correct: false },
      { text: "At least 5 partitions — so that 5 partitions × 10,000 msg/s per partition = 50,000 msg/s throughput capacity, while also enabling up to 5 parallel consumers.", explanation: "Correct. Partition count determines maximum parallelism for both producers and consumers. 5 partitions × 10,000 msg/s per partition meets the 50,000 msg/s target. Additionally, the consumer group can scale to exactly 5 parallel consumers (one per partition) to match production throughput.", correct: true },
      { text: "50 partitions — always use 10× the target throughput in partitions for safety margin.", explanation: "Incorrect. There is no universal '10× safety' rule. Excessive partitions increase overhead: more open file handles, more replication traffic, slower controller operations, and longer recovery times after failures. Partitions should be sized to throughput requirements plus a reasonable growth buffer.", correct: false },

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var totalTime = 90 * QUESTIONS_RAW.length;
var timeLeft = totalTime;
var timerInterval = null;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  QUESTIONS = fisherYates(QUESTIONS_RAW).map(function(q) {
    return {
      source: q.source,
      type: q.type,
      question: q.question,
      options: fisherYates(q.options.slice()),
      globalExplanation: q.globalExplanation
    };
  });
}

function startGlobalTimer() {
  clearInterval(timerInterval);
  timeLeft = totalTime;
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      suivanteAuto();
    }
  }, 1000);
}

function renderTimer() {
  var el = document.getElementById('timerWrap');
  if (!el) return;
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = '⏱ ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var pct = timeLeft / totalTime;
  el.className = 'timer-wrap';
  if (pct < 0.1) el.className += ' danger';
  else if (pct < 0.2) el.className += ' warning';
}

function suivanteAuto() {
  if (!answered) { processAnswer(); }
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    paintScore();
  }
}

function paint() {
  var q = QUESTIONS[qIdx];
  var pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  var typeBadge = q.type === 'single'
    ? '<span class="badge badge-single">Single answer</span>'
    : '<span class="badge badge-multi">Multiple answers</span>';
  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">📘 From the course</span>'
    : '<span class="badge badge-inference">🔍 Beyond the course</span>';

  var letters = ['A','B','C','D','E'];
  var optsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    optsHtml += '<div class="opt" id="opt_' + i + '" onclick="pickOption(' + i + ')">' +
      '<div class="opt-label">' +
      '<span class="opt-letter">' + letters[i] + '.</span>' +
      '<span class="opt-text">' + q.options[i].text + '</span>' +
      '</div>' +
      '<div class="opt-exp" id="optexp_' + i + '"></div>' +
      '</div>';
  }

  document.getElementById('quizBody').innerHTML =
    '<div class="q-meta">' +
      '<span class="q-num">Question ' + (qIdx+1) + ' / ' + QUESTIONS.length + '</span>' +
      typeBadge + srcBadge +
    '</div>' +
    '<div class="q-text">' + q.question + '</div>' +
    '<div class="options">' + optsHtml + '</div>' +
    '<div class="global-exp" id="globalExpBlock">' +
      '<div class="global-exp-title">💡 Key Concept</div>' +
      '<div class="global-exp-text" id="globalExpText"></div>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-primary" onclick="valider()">Validate</button>' +
      '<button class="btn btn-secondary" id="btnNext" onclick="suivante()" disabled>Next question →</button>' +
    '</div>';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    for (var k = 0; k < q.options.length; k++) {
      document.getElementById('opt_' + k).className = 'opt';
    }
    document.getElementById('opt_' + i).className = 'opt selected';
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) {
      selected.push(i);
      document.getElementById('opt_' + i).className = 'opt selected';
    } else {
      selected.splice(pos, 1);
      document.getElementById('opt_' + i).className = 'opt';
    }
  }
}

function getCorrectIndices() {
  var q = QUESTIONS[qIdx];
  var c = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) c.push(i);
  }
  return c;
}

function processAnswer() {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[qIdx];
  var correctIdxs = getCorrectIndices();
  var selSorted = selected.slice().sort().join(',');
  var corrSorted = correctIdxs.slice().sort().join(',');
  var isCorrect = (selSorted === corrSorted);

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  for (var i = 0; i < q.options.length; i++) {
    var opt = document.getElementById('opt_' + i);
    var expDiv = document.getElementById('optexp_' + i);
    var isCorr = q.options[i].correct;
    var isSel = selected.indexOf(i) !== -1;
    opt.style.cursor = 'default';
    if (isCorr && isSel) opt.className = 'opt correct';
    else if (!isCorr && isSel) opt.className = 'opt wrong';
    else if (isCorr && !isSel) opt.className = 'opt missed';
    expDiv.className = 'opt-exp show';
    var icon = isCorr
      ? '<span class="opt-exp-icon" style="color:#27ae60">✓</span>'
      : '<span class="opt-exp-icon" style="color:#C0392B">✗</span>';
    expDiv.innerHTML = icon + q.options[i].explanation;
  }

  document.getElementById('globalExpText').textContent = q.globalExplanation;
  document.getElementById('globalExpBlock').className = 'global-exp show';
  var btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function valider() {
  if (answered) return;
  processAnswer();
}

function suivante() {
  if (!answered) return;
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    clearInterval(timerInterval);
    paintScore();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('timerWrap').style.display = 'none';
  var pct = Math.round((score / QUESTIONS.length) * 100);
  var barColor = pct >= 70 ? '#27ae60' : pct >= 50 ? '#e67e22' : '#C0392B';
  var msg = pct >= 80 ? '🏆 Excellent! CCDAK-ready!' : pct >= 70 ? '✅ Good job! Keep practicing.' : pct >= 50 ? '📚 Review the weak areas and retry.' : '💡 Study the course materials and try again.';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizBody').innerHTML =
    '<div class="score-card">' +
      '<div class="score-title">Quiz Complete!</div>' +
      '<div class="score-sub">Kafka Partitions — Level 2</div>' +
      '<div class="score-pct" style="color:' + barColor + '">' + pct + '%</div>' +
      '<div class="score-bar-wrap"><div class="score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      '<div class="score-msg" style="color:' + barColor + '">' + msg + '</div>' +
      '<div class="score-detail">' +
        '<div class="score-detail-box"><div class="score-detail-label">📘 From the course</div><div class="score-detail-val">' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</div></div>' +
        '<div class="score-detail-box"><div class="score-detail-label">🔍 Beyond the course</div><div class="score-detail-val">' + scoreInfCorrect + ' / ' + scoreInfTotal + '</div></div>' +
        '<div class="score-detail-box"><div class="score-detail-label">Total Score</div><div class="score-detail-val">' + score + ' / ' + QUESTIONS.length + '</div></div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="recommencer()">🔄 Restart the test</button>' +
    '</div>';
}

function recommencer() {
  qIdx = 0; selected = []; answered = false; score = 0;
  scoreCoursTotal = 0; scoreCoursCorrect = 0;
  scoreInfTotal = 0; scoreInfCorrect = 0;
  prepareQuestions();
  document.getElementById('timerWrap').style.display = '';
  paint();
  startGlobalTimer();
}

prepareQuestions();
window.onload = function() { paint(); startGlobalTimer(); };
</script>
</body>
</html>
