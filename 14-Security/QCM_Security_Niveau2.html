<script>
var LETTERS = ['A','B','C','D','E'];

var QUESTIONS_RAW = [

/* ==================== FROM THE COURSE ==================== */

{
  source:"cours", type:"single",
  question:"A FinTech company processes sensitive payment events through Kafka. Their security policy mandates that all data in transit must be encrypted AND that client identity must be verified using SASL credentials before any connection is accepted. A developer needs to configure the security.protocol on all producers and consumers. Which value satisfies BOTH requirements simultaneously?",
  options:[
    {text:"security.protocol=SSL",
     explanation:"SSL enables TLS encryption for all data in transit, but it does NOT activate SASL-based authentication. Clients authenticate only via certificates (mTLS) if ssl.client.auth=required is set — not via SASL credentials like username/password or Kerberos. This satisfies encryption but not SASL credential verification.",
     correct:false},
    {text:"security.protocol=SASL_PLAINTEXT",
     explanation:"SASL_PLAINTEXT enables SASL authentication (credentials are verified), but the data channel is completely unencrypted. Payment events would flow over the network in plaintext — violating the encryption mandate. Authentication alone is insufficient here.",
     correct:false},
    {text:"security.protocol=SASL_SSL",
     explanation:"SASL_SSL layers SASL authentication on top of a TLS-encrypted transport. The channel is encrypted (satisfying the encryption mandate) AND client identity is verified via the configured SASL mechanism (PLAIN, GSSAPI, SCRAM). This is the production-grade choice for sensitive data.",
     correct:true},
    {text:"security.protocol=PLAINTEXT",
     explanation:"PLAINTEXT provides neither encryption nor authentication. This is the least secure option and completely unacceptable for sensitive financial data. It would fail both requirements simultaneously.",
     correct:false}
  ],
  globalExplanation:"SASL_SSL is the most secure security.protocol value, combining TLS encryption with SASL-based client authentication. The property name is self-documenting: SASL_ prefix enables authentication (via sasl.mechanism), SSL suffix enables TLS encryption. For production workloads with sensitive data, SASL_SSL is the standard choice."
},

{
  source:"cours", type:"single",
  question:"An operations team deploys a Kafka cluster with SSL/TLS enabled. Broker certificates are issued by an internal Certificate Authority. Producer applications connecting from application servers throw: 'SSLHandshakeException: hostname in certificate did not match'. The internal CA is trusted (truststore is correctly configured). The team wants to resolve this while maintaining maximum security. What is the correct action?",
  options:[
    {text:"Set ssl.endpoint.identification.algorithm='' on all clients to disable hostname verification",
     explanation:"Disabling hostname verification eliminates the MITM defense provided by ssl.endpoint.identification.algorithm=HTTPS. An attacker could present any valid certificate for a different hostname and intercept traffic without detection. This sacrifices security for convenience and must never be done in production.",
     correct:false},
    {text:"Reissue broker certificates with the correct broker hostnames included in the Subject Alternative Name (SAN) field, keeping ssl.endpoint.identification.algorithm at its default value",
     explanation:"The correct and secure fix. ssl.endpoint.identification.algorithm defaults to 'HTTPS', enforcing RFC 2818 hostname verification. The error occurs because the certificate SAN field does not match the hostnames clients use to connect. Reissuing certs with correct SANs resolves the mismatch while preserving full MITM protection.",
     correct:true},
    {text:"Replace the internal CA with a public CA-signed certificate",
     explanation:"Public CA certificates would address trust issues (truststore), but the error is a hostname mismatch — not a trust issue. The internal CA is already trusted per the problem statement. Switching to a public CA does not fix a SAN field mismatch and adds unnecessary complexity and cost.",
     correct:false},
    {text:"Set ssl.endpoint.identification.algorithm=NONE on all clients",
     explanation:"NONE is not a valid value for ssl.endpoint.identification.algorithm. The only valid values are 'HTTPS' (default, enables hostname verification) and '' (empty string, disables it). Using NONE would cause a configuration error, not disable verification.",
     correct:false}
  ],
  globalExplanation:"ssl.endpoint.identification.algorithm=HTTPS (default) enforces that the broker certificate's CN or SAN matches the hostname used by clients — this is the critical MITM defense. When hostname verification fails, the correct production fix is to reissue certificates with accurate SAN entries. Setting this property to empty string disables protection and is only acceptable in isolated development environments."
},

{
  source:"cours", type:"single",
  question:"A data governance team needs to grant service account 'reporting-svc' read-only access to topic 'financial-events', but only when connecting from the host 'analytics-server-01'. The Kafka cluster uses ZooKeeper-based ACLs managed by SimpleAclAuthorizer. Which kafka-acls.sh command correctly implements this requirement?",
  options:[
    {text:"kafka-acls.sh --authorizer-properties zookeeper.connect=zk:2181 --add --allow-principal User:reporting-svc --operation Read --topic financial-events",
     explanation:"This command grants Read access from ALL hosts ('*' is the implicit default when --allow-host is omitted). It violates the host-restriction requirement — reporting-svc could connect from any machine, not just analytics-server-01.",
     correct:false},
    {text:"kafka-acls.sh --authorizer-properties zookeeper.connect=zk:2181 --add --allow-principal User:reporting-svc --allow-host analytics-server-01 --operation Read --topic financial-events",
     explanation:"Correct. --add creates the ACL entry. --allow-principal User:reporting-svc specifies the beneficiary. --allow-host analytics-server-01 restricts by source hostname. --operation Read grants consume access. --topic financial-events targets the resource. This precisely implements the host-restricted read requirement.",
     correct:true},
    {text:"kafka-acls.sh --authorizer-properties zookeeper.connect=zk:2181 --add --deny-principal User:reporting-svc --allow-host analytics-server-01 --operation Read --topic financial-events",
     explanation:"--deny-principal creates a DENY ACL entry, which is the opposite of granting access. This would explicitly block reporting-svc from reading the topic from analytics-server-01 — the inverse of what is needed.",
     correct:false},
    {text:"kafka-acls.sh --authorizer-properties zookeeper.connect=zk:2181 --grant --allow-principal User:reporting-svc --allow-host analytics-server-01 --operation Read --topic financial-events",
     explanation:"--grant is not a valid kafka-acls.sh flag. The valid action flags are --add (create ACL), --remove (delete ACL), and --list (view ACLs). Using --grant would result in an error.",
     correct:false}
  ],
  globalExplanation:"kafka-acls.sh uses --add to create allow ACLs and --deny-principal to create deny ACLs. The --allow-host flag restricts the ACL to a specific source hostname or IP. Without --allow-host, the ACL applies from all hosts (wildcard '*'). This host-level restriction is a critical principle of least privilege in Kafka ACL design."
},

{
  source:"cours", type:"single",
  question:"An enterprise company's Kafka cluster must authenticate clients against their existing Active Directory Kerberos infrastructure (MIT Kerberos). Their security team requires mutual authentication: both the broker and the client must verify each other's identity using cryptographic tickets rather than passwords. Which sasl.mechanism should be configured on both clients and brokers?",
  options:[
    {text:"SASL mechanism: PLAIN",
     explanation:"SASL/PLAIN transmits credentials as base64(username+password) with no integration with Kerberos or Active Directory. It does not support mutual authentication — only the client authenticates to the broker. Incompatible with the Kerberos infrastructure requirement.",
     correct:false},
    {text:"SASL mechanism: SCRAM-SHA-512",
     explanation:"SCRAM provides strong challenge-response authentication without transmitting passwords, but it requires credentials stored in Kafka's own user store (ZooKeeper/KRaft) — not in Active Directory. It does not integrate with Kerberos and does not support Kerberos mutual authentication.",
     correct:false},
    {text:"SASL mechanism: GSSAPI",
     explanation:"GSSAPI (Generic Security Services API) is the SASL mechanism that wraps Kerberos. It integrates natively with Active Directory via Kerberos tickets, supports mutual authentication (broker verifies client AND client verifies broker using tickets), and never transmits passwords over the network. This is the standard enterprise Kafka authentication mechanism for Kerberos environments.",
     correct:true},
    {text:"SASL mechanism: OAUTHBEARER",
     explanation:"OAUTHBEARER integrates with OAuth2/OIDC identity providers using JWT tokens. While Active Directory can act as an OIDC provider with additional configuration, OAUTHBEARER does not directly use Kerberos tickets and is not the natural fit for 'existing Kerberos infrastructure'. GSSAPI is the canonical Kerberos mechanism.",
     correct:false}
  ],
  globalExplanation:"GSSAPI is the SASL mechanism that provides Kerberos authentication in Kafka. It integrates directly with Active Directory via standard Kerberos tickets, supports mutual authentication (both parties verify each other), and requires no password transmission. When using GSSAPI, clients must also set sasl.kerberos.service.name to match the broker's Kerberos principal service name prefix."
},

{
  source:"cours", type:"single",
  question:"A developer configures a Kafka Java client for Kerberos authentication. She sets security.protocol=SASL_SSL, sasl.mechanism=GSSAPI, and configures sasl.jaas.config with the correct Krb5LoginModule, useKeyTab=true, keytab path, and principal. The broker is confirmed to use GSSAPI. However, the client fails with a GSSException during the SASL handshake. A colleague suggests a single broker-matching property is missing from the client config. Which property is it?",
  options:[
    {text:"ssl.truststore.location",
     explanation:"ssl.truststore.location is an SSL property required to trust the broker's TLS certificate. A missing truststore would cause an SSLHandshakeException during the TLS layer — before the SASL/GSSAPI handshake even begins. The error here is a GSSException, occurring during SASL, not SSL.",
     correct:false},
    {text:"sasl.kerberos.service.name",
     explanation:"This is the missing property. sasl.kerberos.service.name tells the Kafka client what service name prefix the broker's Kerberos principal uses (e.g., 'kafka' for kafka/broker-host@REALM). Without it, the client cannot construct the correct Kerberos service ticket request to the KDC, causing the GSSAPI handshake to fail.",
     correct:true},
    {text:"sasl.login.callback.handler.class",
     explanation:"sasl.login.callback.handler.class specifies a custom callback handler for complex authentication flows. Standard GSSAPI with a keytab does not require it. The error would also be different — this property's absence causes no error in a standard Kerberos setup.",
     correct:false},
    {text:"sasl.mechanism=KERBEROS",
     explanation:"KERBEROS is not a valid sasl.mechanism value. The correct value for Kerberos authentication is GSSAPI. The developer already set sasl.mechanism=GSSAPI correctly. Changing it to KERBEROS would cause an 'Unknown SASL mechanism' error.",
     correct:false}
  ],
  globalExplanation:"sasl.kerberos.service.name is a required client-side property for GSSAPI/Kerberos authentication. It specifies the service name portion of the broker's Kerberos principal (e.g., if the broker principal is kafka/broker1.example.com@REALM, set sasl.kerberos.service.name=kafka). This value must exactly match the broker's actual Kerberos principal service name or authentication fails."
},

{
  source:"cours", type:"multiple",
  question:"An operations team sets up a new Kafka cluster with SimpleAclAuthorizer. They configure allow.everyone.if.no.acl.found=false for a secure-by-default posture. Two service accounts — 'kafka-admin' and 'alertmanager' — must bypass all ACL checks entirely. The rest of the cluster must enforce ACLs normally. Which TWO configurations are required to achieve this? (Choose TWO)",
  options:[
    {text:"super.users=User:kafka-admin;User:kafka-admin on all broker server.properties",
     explanation:"This has a typo (kafka-admin listed twice) and incorrect syntax would cause issues, but more importantly the correct version super.users=User:kafka-admin;User:alertmanager uses semicolons and the User: prefix. The User: prefix is mandatory — Kafka uses KafkaPrincipal format (PrincipalType:Name).",
     correct:false},
    {text:"super.users=User:kafka-admin;User:alertmanager in broker server.properties",
     explanation:"Correct. The super.users property uses the format User:name1;User:name2. Semicolon is the separator, and the User: prefix is the required KafkaPrincipal type. Super users bypass ALL ACL checks — they are the Kafka equivalent of root/admin. Both accounts are correctly listed here.",
     correct:true},
    {text:"authorizer.class.name=kafka.security.auth.SimpleAclAuthorizer in broker server.properties",
     explanation:"Correct. Without this property, no Authorizer is active and the ACL system is completely disabled — every user has full access. This property activates ACL enforcement. Without it, super.users has no effect because there are no ACLs to bypass. Note: In newer Kafka versions, use kafka.security.authorizer.AclAuthorizer instead.",
     correct:true},
    {text:"allow.everyone.if.no.acl.found=true for admin users only",
     explanation:"allow.everyone.if.no.acl.found is a global broker property — it cannot be scoped to specific users. Setting it to true opens ALL resources without ACLs to ALL users, completely defeating the secure-by-default requirement. This is a dangerous anti-pattern.",
     correct:false},
    {text:"ssl.client.auth=required for admin service accounts",
     explanation:"ssl.client.auth controls mutual TLS certificate requirements — it has nothing to do with ACL bypass or super user designation. Configuring mTLS would not grant kafka-admin or alertmanager any ACL exemption.",
     correct:false}
  ],
  globalExplanation:"Two things are needed for a working ACL-enforced cluster with super users: (1) authorizer.class.name to activate the ACL engine, and (2) super.users in the correct format User:name;User:name with semicolon separators. Without the authorizer, there are no ACLs to enforce or bypass. Without super.users in the right format, privileged accounts are treated as regular users."
},

{
  source:"cours", type:"single",
  question:"A Kafka producer is configured with security.protocol=SSL and correct ssl.keystore.location, ssl.keystore.password, and ssl.key.password. The broker uses a certificate issued by an internal CA. At startup, the producer throws: 'PKIX path building failed: unable to find valid certification path to requested target'. What is the most likely missing configuration?",
  options:[
    {text:"ssl.key.password is incorrectly set — it should match ssl.keystore.password",
     explanation:"ssl.key.password and ssl.keystore.password are independent properties. The keystore password unlocks the keystore file; the key password unlocks the private key within it. An incorrect ssl.key.password causes a 'failed to recover key' error — not a PKIX path building failure.",
     correct:false},
    {text:"ssl.truststore.location pointing to a truststore containing the internal CA certificate",
     explanation:"'PKIX path building failed' is a standard Java SSL error meaning the client cannot verify the server's certificate chain. This occurs when the producer's truststore does not contain the CA certificate that signed the broker's SSL certificate. Adding the internal CA certificate to a truststore and setting ssl.truststore.location resolves this.",
     correct:true},
    {text:"ssl.keystore.location is incorrect — the path to the producer's keystore is wrong",
     explanation:"An incorrect keystore path causes a 'FileNotFoundException' or 'keystore not found' error — not a PKIX path validation failure. The PKIX error occurs after the TLS handshake begins and the client tries to verify the server's certificate chain.",
     correct:false},
    {text:"ssl.endpoint.identification.algorithm must be set to '' to skip certificate verification",
     explanation:"Disabling hostname verification (ssl.endpoint.identification.algorithm='') would suppress hostname mismatch errors, not PKIX path building failures. PKIX path failures are trust-related (cannot verify certificate chain) — not hostname-related. Disabling verification would also remove MITM protection.",
     correct:false}
  ],
  globalExplanation:"'PKIX path building failed' always indicates a trust chain failure — the client cannot verify the server certificate up to a trusted root CA. In Kafka SSL configuration, this means ssl.truststore.location is either missing or does not contain the CA certificate that signed the broker's certificate. The truststore is the client's 'list of trusted certificate issuers' — without the internal CA, the broker's cert cannot be validated."
},

{
  source:"cours", type:"single",
  question:"A Kafka cluster runs with SimpleAclAuthorizer and allow.everyone.if.no.acl.found set to its default value. A new topic 'compliance-audit' is created. A monitoring service authenticates successfully via SASL but is not listed in super.users. No ACL entries exist for 'compliance-audit'. The monitoring service attempts to consume from the topic. What is the outcome?",
  options:[
    {text:"The monitoring service consumes successfully because it passed SASL authentication",
     explanation:"Authentication (verifying identity) and authorization (granting permissions) are completely separate mechanisms in Kafka. Successful SASL authentication proves who you are — it grants no permissions. A fully authenticated user with no ACL entries is still denied by the authorizer.",
     correct:false},
    {text:"The monitoring service receives an AuthorizationException — access is denied because no ACL grants it access and the default is deny",
     explanation:"allow.everyone.if.no.acl.found defaults to false. With SimpleAclAuthorizer active and no ACL entries for the topic, any non-super-user receives an AuthorizationException. Kafka logs: 'Principal User:monitor-svc is not authorized to access topics: [compliance-audit]'. This is the intended deny-by-default behavior.",
     correct:true},
    {text:"The monitoring service receives read-only access by default as a fallback security measure",
     explanation:"Kafka has no 'read-only by default' fallback. The ACL model is binary: either an explicit allow ACL exists, or the request is denied. There is no automatic read-only grant for authenticated users.",
     correct:false},
    {text:"The request succeeds but Kafka generates a WARNING log entry about missing ACLs",
     explanation:"Kafka does not have a 'warn but allow' ACL mode. With an Authorizer configured and allow.everyone.if.no.acl.found=false, the authorization decision is strictly deny — the connection is rejected, not logged as a warning.",
     correct:false}
  ],
  globalExplanation:"Kafka ACLs follow a deny-by-default model when an Authorizer is active: 'deny unless explicitly permitted'. allow.everyone.if.no.acl.found=false (the default) means any resource with no ACLs is inaccessible to non-super users. This is deliberate security-first design. The exam rule: no ACL + active Authorizer + default config = AuthorizationException for regular principals."
},

{
  source:"cours", type:"single",
  question:"A DevOps engineer is deploying Kafka producers in a containerized environment (Docker/Kubernetes). She wants to configure SASL/PLAIN authentication without using a separate JAAS configuration file (no -Djava.security.auth.login.config JVM flag). She needs to specify login credentials inline within the producer's client properties file. Which Kafka property enables this?",
  options:[
    {text:"sasl.mechanism=PLAIN",
     explanation:"sasl.mechanism selects which SASL protocol to use (PLAIN, GSSAPI, SCRAM-SHA-256, etc.) but does not carry credential data. Setting this alone tells Kafka the mechanism type but provides no username, password, or login module configuration.",

/* ==================== GLOBAL STATE ==================== */
var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var timerInterval = null;
var timeLeft = 0;
var totalTime = 0;
var courseTotal = 0;
var courseCorrect = 0;
var inferenceTotal = 0;
var inferenceCorrect = 0;

/* ==================== UTILITY ==================== */
function fisherYates(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

/* ==================== PREPARE ==================== */
function prepareQuestions() {
  var raw = deepClone(QUESTIONS_RAW);
  fisherYates(raw);
  QUESTIONS = [];
  courseTotal = 0; inferenceTotal = 0;
  for (var i = 0; i < raw.length; i++) {
    var q = raw[i];
    fisherYates(q.options);
    QUESTIONS.push(q);
    if (q.source === 'cours') courseTotal++;
    else inferenceTotal++;
  }
  totalTime = 90 * QUESTIONS.length;
  timeLeft = totalTime;
}

/* ==================== TIMER ==================== */
function startGlobalTimer() {
  clearInterval(timerInterval);
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) { validerAuto(); }
      else { suivanteAuto(); }
    }
  }, 1000);
}

function suivanteAuto() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) { paintScore(); }
  else { paint(); }
}

function renderTimer() {
  var el = document.getElementById('timerEl');
  if (!el) return;
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  el.className = 'timer';
  var pct = totalTime > 0 ? timeLeft / totalTime : 1;
  if (pct < 0.10) el.className = 'timer danger';
  else if (pct < 0.20) el.className = 'timer warn';
}

/* ==================== PAINT QUESTION ==================== */
function paint() {
  if (qIdx >= QUESTIONS.length) { paintScore(); return; }
  var q = QUESTIONS[qIdx];
  selected = [];
  answered = false;

  document.getElementById('progressBar').style.width =
    Math.round((qIdx / QUESTIONS.length) * 100) + '%';

  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">&#128216; From the course</span>'
    : '<span class="badge badge-inf">&#128269; Beyond the course</span>';
  var typBadge = q.type === 'single'
    ? '<span class="badge badge-single">Single answer</span>'
    : '<span class="badge badge-multi">Multiple answers</span>';
  document.getElementById('questionMeta').innerHTML =
    '<span class="q-num">Q' + (qIdx+1) + ' / ' + QUESTIONS.length + '</span>' +
    srcBadge + typBadge;

  document.getElementById('questionText').textContent = q.question;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  for (var i = 0; i < q.options.length; i++) {
    var opt = q.options[i];
    var div = document.createElement('div');
    div.className = 'option';
    div.id = 'opt_' + i;

    var row = document.createElement('div');
    row.className = 'opt-row';
    row.id = 'optrow_' + i;
    row.setAttribute('onclick', 'pickOption(' + i + ')');
    row.innerHTML =
      '<span class="opt-letter">' + LETTERS[i] + '</span>' +
      '<span class="opt-text">' + esc(opt.text) + '</span>';

    var expDiv = document.createElement('div');
    expDiv.className = 'opt-exp';
    expDiv.id = 'optexp_' + i;
    expDiv.textContent = opt.explanation;

    div.appendChild(row);
    div.appendChild(expDiv);
    container.appendChild(div);
  }

  document.getElementById('globalExp').style.display = 'none';
  document.getElementById('globalExpText').textContent = '';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').disabled = true;
}

/* ==================== INTERACTION ==================== */
function pickOption(idx) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    for (var i = 0; i < q.options.length; i++) {
      var o = document.getElementById('opt_' + i);
      if (o) o.className = 'option';
    }
    selected = [idx];
    var sel = document.getElementById('opt_' + idx);
    if (sel) sel.className = 'option selected';
  } else {
    var pos = selected.indexOf(idx);
    var el = document.getElementById('opt_' + idx);
    if (pos === -1) {
      selected.push(idx);
      if (el) el.className = 'option selected';
    } else {
      selected.splice(pos, 1);
      if (el) el.className = 'option';
    }
  }
}

function valider() {
  if (answered) return;
  processAnswer();
}

function validerAuto() {
  if (answered) return;
  processAnswer();
}

function processAnswer() {
  answered = true;
  var q = QUESTIONS[qIdx];

  var correctIdxs = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) correctIdxs.push(i);
  }

  var isCorrect = false;
  if (selected.length > 0 && selected.length === correctIdxs.length) {
    var s1 = selected.slice().sort().join(',');
    var s2 = correctIdxs.slice().sort().join(',');
    isCorrect = (s1 === s2);
  }

  if (isCorrect) {
    score++;
    if (q.source === 'cours') courseCorrect++;
    else inferenceCorrect++;
  }

  /* Style options and reveal per-option explanations */
  for (var i = 0; i < q.options.length; i++) {
    var optEl = document.getElementById('opt_' + i);
    var expEl = document.getElementById('optexp_' + i);
    var rowEl = document.getElementById('optrow_' + i);
    if (!optEl) continue;

    var isSel  = selected.indexOf(i) !== -1;
    var isCorr = correctIdxs.indexOf(i) !== -1;

    if (rowEl) rowEl.setAttribute('onclick', '');

    var expClass = 'opt-exp ';
    var expIcon  = '';

    if (isCorr) {
      expIcon = '<span class="exp-icon">&#10003;</span> ';
      if (isSel) {
        optEl.className = 'option correct';
        expClass += 'exp-correct';
      } else {
        optEl.className = 'option missed';
        expClass += 'exp-missed';
      }
    } else {
      expIcon = '<span class="exp-icon">&#10007;</span> ';
      if (isSel) {
        optEl.className = 'option incorrect';
        expClass += 'exp-incorrect';
      } else {
        optEl.className = 'option neutral-done';
        expClass += 'exp-neutral';
      }
    }

    if (expEl) {
      expEl.className = expClass;
      expEl.innerHTML = expIcon + esc(q.options[i].explanation);
      expEl.style.display = 'block';
    }
  }

  /* Global explanation */
  var gexp = document.getElementById('globalExp');
  var gtext = document.getElementById('globalExpText');
  if (gexp && gtext) {
    gtext.textContent = q.globalExplanation;
    gexp.style.display = 'block';
  }

  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
}

function suivante() {
  qIdx++;
  paint();
}

/* ==================== SCORE SCREEN ==================== */
function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';

  var total = QUESTIONS.length;
  var pct   = total > 0 ? Math.round((score / total) * 100) : 0;
  var cPct  = courseTotal    > 0 ? Math.round(courseCorrect    / courseTotal    * 100) : 0;
  var iPct  = inferenceTotal > 0 ? Math.round(inferenceCorrect / inferenceTotal * 100) : 0;

  document.getElementById('scoreTitle').textContent = 'Test Complete! 🎉';

  var bar = document.getElementById('scoreBar');
  bar.style.width = pct + '%';
  bar.className = 'score-bar ' + (pct >= 75 ? 'great' : pct >= 50 ? 'ok' : 'fail');
  document.getElementById('scorePct').textContent = pct + '% (' + score + '/' + total + ' correct)';

  var msg = '';
  if (pct >= 85) msg = '🏆 Outstanding! You are exam-ready for CCDAK.';
  else if (pct >= 70) msg = '👍 Good work! Review the missed concepts and you\'ll be ready.';
  else if (pct >= 50) msg = '📚 Keep studying — focus on the questions you got wrong.';
  else msg = '💪 Review the Kafka Security chapter thoroughly and retry.';
  document.getElementById('scoreMsg').textContent = msg;

  var timeUsed = totalTime - timeLeft;
  var avgTime  = total > 0 ? Math.round(timeUsed / total) : 0;

  document.getElementById('scoreCards').innerHTML =
    '<div class="score-card"><div class="sc-label">Total Score</div><div class="sc-val">' + score + '/' + total + '</div><div class="sc-sub">' + pct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">&#128216; From the course</div><div class="sc-val">' + courseCorrect + '/' + courseTotal + '</div><div class="sc-sub">' + cPct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">&#128269; Beyond the course</div><div class="sc-val">' + inferenceCorrect + '/' + inferenceTotal + '</div><div class="sc-sub">' + iPct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">Avg Time / Question</div><div class="sc-val">' + avgTime + 's</div><div class="sc-sub">of 90s allotted</div></div>';
}

/* ==================== RESTART ==================== */
function recommencer() {
  qIdx = 0;
  score = 0;
  selected = [];
  answered = false;
  courseCorrect = 0;
  inferenceCorrect = 0;

  prepareQuestions();

  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';

  paint();
  startGlobalTimer();
}

/* ==================== INIT ==================== */
prepareQuestions();
window.onload = function() {
  paint();
  startGlobalTimer();
};
</script>
