<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCDAK Quiz — Kafka Security, ACLs, SSL & SASL</title>
    <style>
        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#378ADD;color:#fff}.btn.secondary{background:#eef2f7;color:#1f2937}.btn:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}.explain{display:none;margin-top:18px;border-top:1px solid #e5e7eb;padding-top:16px}.explain h3{margin:14px 0 6px;font-size:16px;color:#111827}.explain p,.explain li{line-height:1.52}.warn{font-weight:800;color:#b91c1c}.scoreBox{text-align:center;padding:22px}.scoreNum{font-size:48px;font-weight:900;color:#378ADD}.resultBar{height:18px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin:18px 0}.resultFill{height:100%;background:#378ADD;width:0}.pill{display:inline-block;border:1px solid #d1d5db;border-radius:999px;padding:7px 11px;margin:4px;background:#fff}.hidden{display:none}
    </style>
</head>
<body>
<div class="wrap">
    <div class="top"><div id="progress" class="bar"></div></div>
    <div id="quiz" class="card">
        <div class="head">
            <div><h1>CCDAK Quiz — Kafka Security, ACLs, SSL & SASL</h1><div id="meta" class="muted"></div></div>
            <div id="timer" class="timer">01:30</div>
        </div>
        <span id="badge" class="badge"></span>
        <h2 id="question">Loading quiz…</h2>
        <div id="options" class="opts"></div>
        <div id="status" class="muted"></div>
        <div class="actions">
            <button id="validateBtn" class="btn">Validate</button>
            <button id="nextBtn" class="btn secondary" disabled>Next Question →</button>
            <button id="restartBtn" class="btn secondary">Restart</button>
        </div>
        <div id="explanation" class="explain"></div>
    </div>
    <div id="final" class="card hidden"></div>
</div>
<script>
    (function(){
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'single',q:'Where are ACLs stored in a Kafka cluster running in ZooKeeper mode by default?',opts:[{t:'In the Kafka topic _acls.',c:false},{t:'Inside the broker data directory.',c:false},{t:'In ZooKeeper under /kafka-acl/.',c:true},{t:'In a separate ACL server.',c:false}],exp:{key:'In ZooKeeper-mode Kafka clusters, ACL metadata is stored in ZooKeeper.',correct:['Kafka brokers read ACL information from the /kafka-acl/ znode so authorization metadata is shared consistently.'],wrong:['There is no _acls topic in ZooKeeper mode. Broker data directories store log data, not ACL metadata. Kafka does not use a separate ACL server.'],tip:'ZooKeeper mode: ACLs in /kafka-acl/. KRaft mode: ACLs in __cluster_metadata.'}},
    {type:'single',q:'Which Kafka CLI tool is used to add, remove, and list ACL rules?',opts:[{t:'kafka-acls.sh',c:true},{t:'kafka-configs.sh',c:false},{t:'kafka-topics.sh',c:false},{t:'kafka-console-producer.sh',c:false}],exp:{key:'Kafka has a dedicated CLI for ACL administration.',correct:['kafka-acls.sh manages authorization rules in a running Kafka cluster.'],wrong:['kafka-configs.sh changes configs. kafka-topics.sh manages topics. kafka-console-producer.sh sends records.'],tip:'ACL management command = kafka-acls.sh.'}},
    {type:'single',q:'Which of the following is NOT a valid Kafka ACL resource type?',opts:[{t:'Topic',c:false},{t:'Consumer Group',c:false},{t:'Cluster',c:false},{t:'Partition',c:true}],exp:{key:'Kafka ACLs apply to resources such as Topic, Group, Cluster, TransactionalId, and DelegationToken.',correct:['Partition is not an ACL resource type. ACLs are applied at the topic level rather than individual partition level.'],wrong:['Topic, Group, and Cluster are valid resource types.'],tip:'ACLs are not defined per partition.'}},
    {type:'single',q:'What is the purpose of ACLs in Kafka?',opts:[{t:'Encrypt messages for secure communication.',c:false},{t:'Authorize client access to Kafka resources and operations.',c:true},{t:'Compress messages for efficient storage.',c:false},{t:'Validate message schemas.',c:false}],exp:{key:'ACLs are Kafka’s authorization mechanism.',correct:['They determine which authenticated principals can perform operations such as Read, Write, Create, or Describe on Kafka resources.'],wrong:['Encryption is SSL/TLS. Compression is producer/topic behavior. Schema validation is handled by Schema Registry and serializers.'],tip:'Authentication proves identity; ACLs authorize actions.'}},
    {type:'single',q:'How are ACLs stored and managed in Kafka KRaft mode?',opts:[{t:'In a controller node local filesystem.',c:false},{t:'In the __cluster_metadata topic and managed using Kafka tools.',c:true},{t:'In a dedicated ACL server managed through REST.',c:false},{t:'In broker local configuration files.',c:false}],exp:{key:'KRaft mode removes ZooKeeper and stores cluster metadata inside Kafka.',correct:['The StandardAuthorizer stores ACL metadata in the __cluster_metadata metadata topic.'],wrong:['ACLs are not kept in local files or a separate ACL server. Static broker config files do not store dynamic ACL rules.'],tip:'KRaft security metadata is part of Kafka metadata.'}},
    {type:'single',q:'What happens when a client tries an operation that is not allowed by ACLs?',opts:[{t:'The operation succeeds but a warning is logged.',c:false},{t:'The operation is rejected and the client receives an authorization error.',c:true},{t:'The operation succeeds but the message is flagged unauthorized.',c:false},{t:'The operation is delayed until ACLs are added.',c:false}],exp:{key:'Kafka brokers enforce ACLs during request handling.',correct:['If the principal lacks permission, the broker rejects the request and returns an authorization error.'],wrong:['Kafka does not silently allow unauthorized operations or wait for ACL changes.'],tip:'Authorization failure means request denied.'}},
    {type:'single',q:'What does the CreateTopics ACL operation allow?',opts:[{t:'Creating new topics in the cluster.',c:true},{t:'Producing messages to a topic.',c:false},{t:'Deleting topics.',c:false},{t:'Modifying existing topic configs.',c:false}],exp:{key:'Kafka ACL operations map to specific actions.',correct:['CreateTopics authorizes topic creation requests.'],wrong:['Producing uses Write. Deleting uses Delete. Config modification uses AlterConfigs or related operations.'],tip:'Create is not the same as Write.'}},
    {type:'single',q:'What is the difference between Read and Write ACL operations?',opts:[{t:'Read allows consuming messages; Write allows producing messages.',c:true},{t:'Read allows producing; Write allows consuming.',c:false},{t:'Read allows config changes; Write allows deletion.',c:false},{t:'They are equivalent.',c:false}],exp:{key:'Producer and consumer permissions are separate in Kafka.',correct:['Read is needed to consume from topics. Write is needed to produce to topics.'],wrong:['The other options reverse or confuse Kafka ACL operations.'],tip:'Consumers usually need Topic Read and Group Read.'}},
    {type:'single',q:'How can you grant a client permission to describe topics and consumer groups?',opts:[{t:'Grant DescribeConfigs.',c:false},{t:'Grant Describe.',c:true},{t:'Grant AlterConfigs.',c:false},{t:'Grant IdempotentWrite.',c:false}],exp:{key:'Describe allows metadata visibility.',correct:['The Describe operation lets clients view metadata for resources such as topics and groups.'],wrong:['DescribeConfigs is for configuration descriptions. AlterConfigs modifies configs. IdempotentWrite relates to idempotent producers.'],tip:'Monitoring tools often require Describe permissions.'}},
    {type:'single',q:'What is the purpose of ssl.keystore.location and ssl.keystore.password on a Kafka broker?',opts:[{t:'Specify the truststore for verifying client certificates.',c:false},{t:'Specify the broker keystore containing its private key and certificate.',c:true},{t:'Specify the client truststore.',c:false},{t:'Specify the broker truststore.',c:false}],exp:{key:'A keystore contains a private key and certificate used to identify the local party.',correct:['The broker keystore lets the broker present its certificate during TLS handshakes.'],wrong:['Truststores store trusted certificates/CA certificates, not the broker private key.'],tip:'Keystore = my private key/cert. Truststore = certificates I trust.'}},
    {type:'single',q:'What is the role of ssl.truststore.location and ssl.truststore.password?',opts:[{t:'Store the broker private key.',c:false},{t:'Specify a truststore used to verify remote certificates.',c:true},{t:'Store trusted broker keystores.',c:false},{t:'Disable TLS verification.',c:false}],exp:{key:'A truststore contains trusted certificates or certificate authorities.',correct:['Clients use a truststore to verify broker certificates. Brokers can also use truststores to verify client certificates when mTLS is enabled.'],wrong:['Private keys belong in keystores. A truststore does not disable verification.'],tip:'Truststore = who this process trusts.'}},
    {type:'single',q:'How do you enable SSL/TLS encryption for communication between Kafka brokers?',opts:[{t:'Set ssl.enabled.protocols=SSL.',c:false},{t:'Set security.inter.broker.protocol=SSL.',c:true},{t:'Set ssl.client.auth=required.',c:false},{t:'Set ssl.endpoint.identification.algorithm=HTTPS.',c:false}],exp:{key:'Inter-broker communication uses the security.inter.broker.protocol setting.',correct:['Setting security.inter.broker.protocol=SSL makes brokers communicate over TLS.'],wrong:['ssl.enabled.protocols controls allowed TLS protocol versions. ssl.client.auth controls client certificate authentication. endpoint identification controls hostname verification.'],tip:'Inter-broker TLS = security.inter.broker.protocol=SSL or SASL_SSL.'}},
    {type:'single',q:'What does ssl.client.auth configure?',opts:[{t:'SSL/TLS protocol version.',c:false},{t:'Whether SSL/TLS encryption is enabled.',c:false},{t:'Client certificate authentication mode: none, requested, or required.',c:true},{t:'Client certificate file location.',c:false}],exp:{key:'ssl.client.auth controls mutual TLS client authentication behavior on the broker.',correct:['Values include none, requested, and required. required means clients must present valid certificates.'],wrong:['TLS enablement and certificate locations are controlled by other SSL configs.'],tip:'ssl.client.auth=required means mTLS is enforced.'}},
    {type:'single',q:'What happens when ssl.client.auth is set to required?',opts:[{t:'Clients must provide a valid trusted certificate.',c:true},{t:'Client certificates are optional.',c:false},{t:'Client authentication is disabled.',c:false},{t:'The broker only chooses the default TLS version.',c:false}],exp:{key:'required enforces client certificate authentication.',correct:['The broker requests and validates a client certificate. Connections without valid trusted certificates are rejected.'],wrong:['Optional behavior corresponds to requested. Disabled behavior corresponds to none.'],tip:'required = strict client cert validation.'}},
    {type:'single',q:'What is the default value of ssl.client.auth?',opts:[{t:'none',c:true},{t:'requested',c:false},{t:'required',c:false},{t:'optional',c:false}],exp:{key:'Kafka does not require client certificates by default.',correct:['The default is none, meaning the broker does not require client certificate authentication.'],wrong:['requested and required must be explicitly configured. optional is not the Kafka value; requested is the optional-like mode.'],tip:'TLS encryption can exist without client certificate authentication.'}},
    {type:'single',q:'What is the purpose of sasl.kerberos.service.name?',opts:[{t:'Specify the full Kerberos principal name for the broker.',c:false},{t:'Set the Kerberos realm.',c:false},{t:'Configure the KDC hostname.',c:false},{t:'Define the Kerberos service name used by Kafka for SASL/GSSAPI authentication.',c:true}],exp:{key:'Kerberos principals include a service component, commonly kafka.',correct:['sasl.kerberos.service.name must match the service name used in the Kafka Kerberos principal/keytab setup.'],wrong:['Realm, KDC host, and full principal are configured elsewhere in Kerberos/JAAS configuration.'],tip:'Typical value: kafka.'}},
    {type:'single',q:'What is the role of sasl.jaas.config in Kafka SASL authentication?',opts:[{t:'Specify JAAS login module and credentials/options inline.',c:true},{t:'Set the SASL mechanism only.',c:false},{t:'Configure SASL callbacks only.',c:false},{t:'Enable or disable SASL authentication by itself.',c:false}],exp:{key:'JAAS config tells Kafka how to log in for a SASL mechanism.',correct:['sasl.jaas.config can include the login module, username/principal, password/keytab, and related options directly in client or broker config.'],wrong:['sasl.mechanism chooses the mechanism. Callbacks and security protocol are separate settings.'],tip:'JAAS config supplies credentials; sasl.mechanism selects the auth method.'}},
    {type:'single',q:'What is the purpose of sasl.mechanism?',opts:[{t:'Specify the SASL authentication mechanism such as PLAIN, SCRAM, or GSSAPI.',c:true},{t:'Configure SASL callbacks.',c:false},{t:'Set the JAAS config file path.',c:false},{t:'Enable or disable SASL by itself.',c:false}],exp:{key:'Kafka supports multiple SASL mechanisms.',correct:['sasl.mechanism selects which SASL mechanism the client or broker uses for authentication.'],wrong:['JAAS credentials are configured separately. Enabling SASL also requires a SASL security protocol/listener setup.'],tip:'Common mechanisms: PLAIN, SCRAM-SHA-256, SCRAM-SHA-512, GSSAPI.'}},
    {type:'single',q:'What security protocol does Kafka use by default for client-broker communication?',opts:[{t:'SSL/TLS',c:false},{t:'SASL_PLAINTEXT',c:false},{t:'PLAINTEXT',c:true},{t:'SASL_SSL',c:false}],exp:{key:'Kafka defaults to no encryption and no authentication unless security is configured.',correct:['PLAINTEXT is the default security protocol.'],wrong:['SSL, SASL_PLAINTEXT, and SASL_SSL must be configured explicitly.'],tip:'Default Kafka is not production-secure; harden with TLS/SASL/ACLs.'}},
    {type:'single',q:'Which Kafka security protocol provides encryption in transit without SASL authentication?',opts:[{t:'PLAINTEXT',c:false},{t:'SASL_PLAINTEXT',c:false},{t:'SSL',c:true},{t:'SASL_SSL',c:false}],exp:{key:'SSL means TLS encryption. Authentication depends on configuration.',correct:['The SSL protocol encrypts traffic. It can authenticate brokers via certificates and can support client certificate authentication if configured, but it does not use SASL.'],wrong:['PLAINTEXT has no encryption. SASL_PLAINTEXT authenticates without TLS encryption. SASL_SSL combines SASL authentication with TLS encryption.'],tip:'SSL = TLS channel. SASL_SSL = TLS + SASL auth.'}},
    {type:'single',q:'Which Kafka security protocol provides both TLS encryption and SASL authentication for client-broker communication?',opts:[{t:'PLAINTEXT',c:false},{t:'SASL_PLAINTEXT',c:false},{t:'SSL',c:false},{t:'SASL_SSL',c:true}],exp:{key:'SASL_SSL combines two security layers.',correct:['TLS provides encryption and server identity protection; SASL provides authentication mechanisms such as SCRAM, PLAIN, or Kerberos.'],wrong:['PLAINTEXT has neither. SASL_PLAINTEXT has SASL but no TLS encryption. SSL has TLS but not SASL.'],tip:'For strong client-broker security, SASL_SSL is a common production choice.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');if(!el)return;el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" data-i="'+i+'"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html;var nodes=box.querySelectorAll('.opt');for(var n=0;n<nodes.length;n++){nodes[n].onclick=function(){pickOption(parseInt(this.getAttribute('data-i'),10));};}}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Kafka security, ACLs, SSL, and SASL.';else if(pct>=70)msg='Solid result; review ACL storage, security protocols, TLS stores, and SASL configs.';else msg='Needs review: focus on ACL operations/resources, ZooKeeper vs KRaft storage, SSL stores, and SASL mechanisms.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" id="restartFinal">Restart Quiz</button></div>';document.getElementById('restartFinal').onclick=recommencer;document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
    function init(){document.getElementById('validateBtn').onclick=valider;document.getElementById('nextBtn').onclick=suivante;document.getElementById('restartBtn').onclick=recommencer;shuffleOptions();paint();}
    if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}
    })();
</script>
</body>
</html>
