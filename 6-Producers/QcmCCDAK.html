        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background: <script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'multiple',q:'What happens when you set <code>max.in.flight.requests.per.connection</code> to a value greater than 1 in a Kafka producer? Select all that apply.',opts:[{t:'It can increase producer throughput.',c:true},{t:'It necessarily increases producer latency.',c:false},{t:'It can lead to out-of-order delivery if retries occur and idempotence/order guarantees are not configured correctly.',c:true},{t:'It has no effect on producer behavior.',c:false}],exp:{key:'This setting controls how many unacknowledged produce requests may be in flight on one broker connection.',correct:['More in-flight requests can improve throughput because the producer can pipeline requests.','If an earlier request fails and is retried after later requests succeed, ordering can be affected unless idempotence and compatible settings protect ordering.'],wrong:['It does not necessarily increase latency; it may reduce waiting.','It has a major effect on pipelining and ordering risk.'],tip:'Throughput vs ordering: higher in-flight can help performance but increases ordering risk without idempotence.'}},
    {type:'single',q:'What is the effect of setting <code>acks=0</code> in a Kafka producer?',opts:[{t:'The producer waits for the leader to acknowledge.',c:false},{t:'The producer waits for all in-sync replicas to acknowledge.',c:false},{t:'The producer does not wait for any broker acknowledgment.',c:true},{t:'The producer throws an exception if the broker does not acknowledge.',c:false}],exp:{key:'<code>acks=0</code> is fire-and-forget.',correct:['The producer considers the send successful once the record is handed to the client/network path; it does not wait for broker confirmation.'],wrong:['Leader acknowledgment is <code>acks=1</code>.','All ISR acknowledgment is <code>acks=all</code>.','No broker acknowledgment is expected, so missing acknowledgment is not itself an error.'],tip:'<code>acks=0</code> gives lowest latency and weakest durability.'}},
    {type:'single',q:'What is the relationship between <code>request.timeout.ms</code> and <code>delivery.timeout.ms</code> in a Kafka producer?',opts:[{t:'<code>request.timeout.ms</code> should always be greater than <code>delivery.timeout.ms</code>.',c:false},{t:'<code>delivery.timeout.ms</code> should be greater than or equal to <code>request.timeout.ms</code>, and normally also account for linger/retries.',c:true},{t:'They should always be the same.',c:false},{t:'They are completely independent.',c:false}],exp:{key:'<code>delivery.timeout.ms</code> is the upper bound for a send attempt from the application point of view. <code>request.timeout.ms</code> is the timeout for an individual request.',correct:['The delivery timeout should be large enough to allow request timeout, linger, and retry behavior to occur.'],wrong:['If delivery timeout is too small, the producer can fail records before requests/retries have enough time.','They serve different purposes.','They are related through the producer delivery lifecycle.'],tip:'Think: delivery timeout is the overall envelope; request timeout is one request inside it.'}},
    {type:'multiple',q:'A Kafka producer needs to send messages to a topic. Which properties are mandatory? Select two.',opts:[{t:'<code>compression.type</code>',c:false},{t:'<code>partitioner.class</code>',c:false},{t:'<code>bootstrap.servers</code>',c:true},{t:'<code>key.serializer</code>',c:false},{t:'<code>value.serializer</code>',c:true},{t:'<code>client.id</code>',c:false}],exp:{key:'A producer needs broker bootstrap information and a serializer for values.',correct:['<code>bootstrap.servers</code> tells the producer how to discover the cluster.','<code>value.serializer</code> is required so Kafka can convert value objects to bytes.'],wrong:['Compression, partitioner, and client ID are optional.','In many Java Producer configurations, <code>key.serializer</code> is also required by the client config even for null keys; however, for this exam-style question, the intended mandatory pair is bootstrap servers and value serializer.'],tip:'Practical Java note: configure both key and value serializers to avoid surprises.'}},
    {type:'single',q:'What is the purpose of <code>compression.type</code> in a Kafka producer?',opts:[{t:'Specify the compression algorithm used by the producer.',c:true},{t:'Specify the compression algorithm the broker must apply after receiving data.',c:false},{t:'Only enable or disable compression without choosing an algorithm.',c:false},{t:'Set the compression level directly.',c:false}],exp:{key:'Producer compression compresses record batches before sending them.',correct:['Valid values include <code>none</code>, <code>gzip</code>, <code>snappy</code>, <code>lz4</code>, and <code>zstd</code>. Brokers store compressed batches as received when possible.'],wrong:['The broker does not generally recompress producer data just because of this setting.','The setting chooses the compression type.','Compression level is separate for algorithms that support it.'],tip:'Compression reduces network and storage usage but costs CPU.'}},
    {type:'multiple',q:'What are common effects of enabling producer-side compression? Select all that apply.',opts:[{t:'Reduced network bandwidth usage.',c:true},{t:'Potentially increased producer CPU usage.',c:true},{t:'Potentially increased consumer CPU usage for decompression.',c:true},{t:'Guaranteed lower end-to-end latency.',c:false}],exp:{key:'Compression trades CPU for smaller payloads.',correct:['Compressed batches use fewer bytes on the wire.','The producer spends CPU compressing.','Consumers spend CPU decompressing.'],wrong:['Latency may improve if network is the bottleneck, but compression can also add CPU latency. It is not guaranteed lower.'],tip:'Use compression when bandwidth/storage is valuable; benchmark CPU and latency.'}},
    {type:'single',q:'What is the relationship between <code>batch.size</code> and <code>linger.ms</code>?',opts:[{t:'They are mutually exclusive.',c:false},{t:'<code>linger.ms</code> only matters if <code>batch.size=0</code>.',c:false},{t:'<code>batch.size</code> only matters if <code>linger.ms=0</code>.',c:false},{t:'They work together to decide when batches are sent.',c:true}],exp:{key:'Kafka producers batch records per partition.',correct:['A batch is sent when it is full enough, when linger expires, or when other send conditions require flushing.'],wrong:['They are not mutually exclusive and both affect batching behavior.'],tip:'Batch size controls bytes; linger controls wait time.'}},
    {type:'multiple',q:'What is the effect of increasing <code>batch.size</code>? Select all that apply.',opts:[{t:'It increases the maximum size of an individual message.',c:false},{t:'It allows more bytes/records to be grouped into a producer batch.',c:true},{t:'It directly increases the maximum time a batch waits.',c:false},{t:'It can increase producer buffer memory usage.',c:true}],exp:{key:'<code>batch.size</code> is a maximum batch size in bytes, not a message-size limit.',correct:['Larger batches can improve throughput by reducing request overhead.','Larger batches may require more buffering memory.'],wrong:['Individual message limits are controlled by settings such as <code>max.request.size</code> and broker/topic limits.','Wait time is controlled by <code>linger.ms</code>.'],tip:'Large batches improve throughput only if your workload can fill them.'}},
    {type:'single',q:'What is the relationship between <code>linger.ms</code> and <code>request.timeout.ms</code>?',opts:[{t:'They control the same thing.',c:false},{t:'<code>linger.ms</code> should always be higher than <code>request.timeout.ms</code>.',c:false},{t:'They control different phases; request timeout should be high enough to allow the request after any linger delay.',c:true},{t:'They are unrelated and never need coordination.',c:false}],exp:{key:'<code>linger.ms</code> delays sending to form batches. <code>request.timeout.ms</code> limits waiting for a broker response after a request is sent.',correct:['They are different, but if timing values are badly configured, sends can time out too aggressively.'],wrong:['Linger does not replace request timeout.','Linger should not exceed request timeout in a way that makes delivery timing unrealistic.','They both affect end-to-end send behavior.'],tip:'Also consider <code>delivery.timeout.ms</code>, the overall send deadline.'}},
    {type:'single',q:'What happens if <code>linger.ms=0</code>?',opts:[{t:'The producer never sends messages.',c:false},{t:'The producer waits indefinitely for batches to fill.',c:false},{t:'The producer does not intentionally wait to accumulate more records before sending.',c:true},{t:'The producer uses the default linger time.',c:false}],exp:{key:'<code>linger.ms=0</code> means no artificial delay for batching.',correct:['Records may still be batched if they arrive close together, but the producer will not wait just to build a larger batch.'],wrong:['It does not disable sending.','It is the opposite of waiting indefinitely.','0 is a valid configured value.'],tip:'Low linger favors latency; higher linger can improve throughput.'}},
    {type:'single',q:'In the Kafka producer API, what is the purpose of <code>acks</code>?',opts:[{t:'Specify how many acknowledgments the producer requires before considering a request complete.',c:true},{t:'Specify the number of replicas in the topic.',c:false},{t:'Specify retry count.',c:false},{t:'Specify number of partitions required.',c:false}],exp:{key:'<code>acks</code> controls producer write acknowledgment durability.',correct:['<code>acks=0</code>, <code>acks=1</code>, and <code>acks=all</code> represent increasing acknowledgment strength.'],wrong:['Replication factor and partition count are topic configs.','Retries are controlled separately.'],tip:'Producer durability starts with <code>acks</code>.'}},
    {type:'single',q:'How does <code>min.insync.replicas</code> interact with <code>acks</code>?',opts:[{t:'They are completely independent.',c:false},{t:'<code>acks=all</code> uses <code>min.insync.replicas</code> to decide whether writes can succeed.',c:true},{t:'<code>min.insync.replicas</code> is only relevant for <code>acks=1</code>.',c:false},{t:'<code>min.insync.replicas</code> changes the number of topic partitions.',c:false}],exp:{key:'<code>min.insync.replicas</code> is enforced for durable writes when producer uses <code>acks=all</code>.',correct:['If ISR count is below <code>min.insync.replicas</code>, writes with <code>acks=all</code> fail.'],wrong:['The settings interact.','<code>acks=1</code> does not wait for ISR acknowledgments in the same way.','It has nothing to do with partition count.'],tip:'Durable recipe: RF=3, min ISR=2, acks=all.'}},
    {type:'single',q:'A producer sends with <code>acks=all</code> to a partition with RF=3. Only 2 replicas are in sync. What happens if <code>min.insync.replicas=2</code>?',opts:[{t:'The write can succeed if both in-sync replicas acknowledge.',c:true},{t:'The write succeeds without acknowledgment.',c:false},{t:'The write waits until the third replica rejoins ISR.',c:false},{t:'The write must fail because RF is 3 but ISR is 2.',c:false}],exp:{key:'<code>acks=all</code> means all current in-sync replicas, not all assigned replicas. <code>min.insync.replicas</code> defines the minimum ISR size required.',correct:['With ISR=2 and min ISR=2, the requirement is satisfied, so the write can succeed after the leader and in-sync follower acknowledge.'],wrong:['The producer still requires acknowledgment.','The out-of-sync replica is not required for success while it is outside ISR.','RF=3 does not require all 3 replicas to be in ISR for every successful write unless min ISR is 3.'],tip:'All ISR ≠ all replicas. Watch this CCDAK trap.'}},
    {type:'multiple',q:'Can a producer with <code>acks=all</code> and very high retries still experience data loss or failed delivery? Select all that apply.',opts:[{t:'No, this guarantees no data loss under all circumstances.',c:false},{t:'Yes, writes can fail if ISR drops below <code>min.insync.replicas</code>.',c:true},{t:'Yes, data loss can occur with unclean leader election after ISR replicas fail.',c:true},{t:'Yes, if the producer process crashes before unsent/unacknowledged records are durably handled by the application.',c:true}],exp:{key:'Strong producer settings reduce risk but do not remove every failure mode.',correct:['If ISR is too small, brokers reject writes.','Unclean leader election can elect an out-of-sync replica and lose acknowledged data.','A producer crash can lose records still in the client buffer or records whose outcome the app has not handled safely.'],wrong:['No Kafka producer setting guarantees safety under all possible failures.'],tip:'For strongest producer safety, combine acks=all, idempotence, min ISR, RF, clean leader election, and application-level error handling.'}},
    {type:'single',q:'Which producer configuration is NOT required for a Java producer?',opts:[{t:'<code>bootstrap.servers</code>',c:false},{t:'<code>key.serializer</code>',c:false},{t:'<code>value.serializer</code>',c:false},{t:'<code>partitioner.class</code>',c:true}],exp:{key:'The default partitioner is used if <code>partitioner.class</code> is not configured.',correct:['<code>partitioner.class</code> is optional.'],wrong:['Java producers require bootstrap servers and serializers for keys and values.'],tip:'Default partitioner is sufficient for most producer use cases.'}},
    {type:'single',q:'Which statement about producers and consumers is true?',opts:[{t:'They must use the same programming language.',c:false},{t:'They must know about each other directly.',c:false},{t:'They are decoupled by Kafka topics.',c:true},{t:'Producers must know all consumer group IDs.',c:false}],exp:{key:'Kafka topics decouple producers from consumers.',correct:['Producers write to topics; consumers read from topics independently.'],wrong:['Language is irrelevant if serialization format is understood.','Producers do not address consumers directly.','Consumer groups are consumer-side concerns.'],tip:'Topic = durable decoupling layer.'}},
    {type:'single',q:'What happens if a producer sends a message and does not receive an acknowledgment from the broker?',opts:[{t:'It always considers the message successful.',c:false},{t:'It waits forever.',c:false},{t:'It retries or fails according to timeout and retry configuration.',c:true},{t:'It immediately sends the next message and forgets the failed one in every case.',c:false}],exp:{key:'Producer failure behavior depends on <code>acks</code>, retries, timeouts, and idempotence.',correct:['If acknowledgment is not received in time, the producer may retry. If the delivery timeout is exceeded, the send fails.'],wrong:['Success requires the configured acknowledgment.','Producer waits are bounded by timeouts.','The producer does not simply forget failed records unless configured/handled that way.'],tip:'Delivery outcome is bounded by <code>delivery.timeout.ms</code>.'}},
    {type:'single',q:'What does <code>acks=all</code> mean?',opts:[{t:'The producer waits for all replicas, including out-of-sync replicas.',c:false},{t:'The producer waits only for the leader.',c:false},{t:'The producer waits for all in-sync replicas.',c:true},{t:'The producer waits for no acknowledgment.',c:false}],exp:{key:'<code>acks=all</code> waits for the ISR, not every assigned replica.',correct:['All current in-sync replicas must acknowledge, and min ISR must be satisfied.'],wrong:['Out-of-sync replicas are not part of the required acknowledgment set.','Leader-only is <code>acks=1</code>.','No ack is <code>acks=0</code>.'],tip:'Exam wording: all ISR, not all replicas.'}},
    {type:'single',q:'What happens if <code>acks=all</code> and <code>min.insync.replicas</code> is not satisfied?',opts:[{t:'The producer retries forever until min ISR is met.',c:false},{t:'The broker ignores min ISR and writes successfully.',c:false},{t:'The producer receives an error indicating not enough replicas.',c:true},{t:'The producer waits indefinitely.',c:false}],exp:{key:'If ISR count is below min ISR, durable writes are rejected.',correct:['The broker returns a not-enough-replicas style error. The producer may retry depending on config, but the immediate write cannot succeed.'],wrong:['It does not wait forever or ignore the setting.','Retries are bounded by delivery timeout and retry policy.'],tip:'min ISR too high can reduce availability.'}},
    {type:'single',q:'What is the relationship between <code>acks</code> and <code>request.required.acks</code>?',opts:[{t:'They are the same concept in different producer APIs/config generations.',c:true},{t:'<code>request.required.acks</code> is a consumer setting.',c:false},{t:'They are completely unrelated.',c:false},{t:'<code>acks</code> configures partitions while <code>request.required.acks</code> configures replicas.',c:false}],exp:{key:'<code>request.required.acks</code> was used in older producer APIs; <code>acks</code> is the modern producer setting.',correct:['Both refer to producer acknowledgment requirements.'],wrong:['Consumers do not use this to fetch data.','They are related to the same durability concept.'],tip:'Modern config: use <code>acks</code>.'}},
    {type:'single',q:'How does Kafka zero-copy handle data transformation?',opts:[{t:'It applies transformations automatically.',c:false},{t:'It supports pluggable transformations inside zero-copy.',c:false},{t:'It sends bytes as-is without transformation.',c:true},{t:'It transforms data after copying it into app memory.',c:false}],exp:{key:'Zero-copy is a transfer optimization, not a transformation framework.',correct:['Kafka can transfer stored bytes efficiently from page cache to socket without changing them.'],wrong:['Data transformations belong to producers, consumers, Kafka Streams, Connect SMTs, or processing layers.'],tip:'Zero-copy = move bytes efficiently, not modify bytes.'}},
    {type:'single',q:'What is the purpose of <code>linger.ms</code>?',opts:[{t:'Maximum time to wait for broker response.',c:false},{t:'Maximum time to wait before sending a batch.',c:true},{t:'Maximum time to wait for acknowledgment.',c:false},{t:'Maximum time to write to disk.',c:false}],exp:{key:'<code>linger.ms</code> lets the producer wait briefly to accumulate a larger batch.',correct:['Increasing linger can improve throughput by batching more records together.'],wrong:['Broker response timeout is <code>request.timeout.ms</code>.','Overall send timeout is <code>delivery.timeout.ms</code>.'],tip:'Linger is a batching latency knob.'}},
    {type:'single',q:'How does <code>batch.size</code> affect producer behavior?',opts:[{t:'Maximum number of messages in a batch.',c:false},{t:'Maximum size in bytes of a batch.',c:true},{t:'Minimum messages required for a batch.',c:false},{t:'Minimum message size to batch.',c:false}],exp:{key:'<code>batch.size</code> is byte-based.',correct:['It limits the maximum bytes per partition batch.'],wrong:['It does not count messages directly.','It does not define a minimum.'],tip:'Batch size is bytes; max.poll.records is record count on consumers.'}},
    {type:'single',q:'What happens if the producer exhausts <code>buffer.memory</code>?',opts:[{t:'It blocks up to <code>max.block.ms</code>, then throws if memory is still unavailable.',c:true},{t:'It discards oldest messages automatically.',c:false},{t:'It discards newest messages automatically.',c:false},{t:'It stops the producer process immediately.',c:false}],exp:{key:'Producer buffer memory limits unsent records waiting in the client.',correct:['When buffer memory is exhausted, calls such as <code>send()</code> can block while waiting for memory. If the wait exceeds <code>max.block.ms</code>, an exception is thrown.'],wrong:['Kafka producer does not silently discard buffered records to free memory.','It does not automatically kill the process.'],tip:'Backpressure appears as blocking and eventually timeout.'}},
    {type:'single',q:'What is the default value of producer <code>acks</code> in modern Kafka clients?',opts:[{t:'0',c:false},{t:'1',c:false},{t:'all',c:true},{t:'none',c:false}],exp:{key:'Modern Kafka producers default to stronger delivery settings, including idempotence by default in recent versions, which implies <code>acks=all</code>.',correct:['For current Kafka clients, the effective default is <code>acks=all</code>. Older materials often say <code>acks=1</code>, which is outdated.'],wrong:['<code>acks=1</code> was the historical default in older versions.','<code>none</code> is not a valid acks value.'],tip:'For CCDAK/current Confluent context, remember modern safe defaults may differ from old Kafka tutorials.'}},
    {type:'single',q:'What happens when <code>acks=all</code>?',opts:[{t:'No acknowledgment is required.',c:false},{t:'Only the leader acknowledges.',c:false},{t:'All in-sync replicas must acknowledge before success.',c:true},{t:'A minimum number of arbitrary replicas acknowledge, regardless of ISR.',c:false}],exp:{key:'<code>acks=all</code> waits for all current ISR replicas.',correct:['The write is successful only after the ISR acknowledgment requirement is satisfied.'],wrong:['No ack is <code>acks=0</code>.','Leader-only is <code>acks=1</code>.','Kafka uses ISR, not arbitrary replicas.'],tip:'acks=all is strongest when min ISR > 1.'}},
    {type:'single',q:'How does <code>max.in.flight.requests.per.connection</code> affect producer behavior when <code>acks=1</code>?',opts:[{t:'It limits unacknowledged requests per broker connection.',c:true},{t:'It limits total messages in memory.',c:false},{t:'It controls compression.',c:false},{t:'It has no effect with <code>acks=1</code>.',c:false}],exp:{key:'This setting controls request pipelining per connection.',correct:['With <code>acks=1</code>, the producer can have multiple requests waiting for leader acknowledgments.'],wrong:['Memory is controlled by buffer settings.','Compression uses <code>compression.type</code>.','It still affects pipelining with <code>acks=1</code>.'],tip:'In-flight requests are request-level, not record-level.'}},
    {type:'single',q:'What is the purpose of <code>enable.idempotence</code>?',opts:[{t:'Prevent duplicate writes caused by producer retries for a partition/session.',c:true},{t:'Enable compression.',c:false},{t:'Set batch size.',c:false},{t:'Disable acknowledgments.',c:false}],exp:{key:'Idempotent producers use producer IDs and sequence numbers so brokers can deduplicate retried records.',correct:['It strengthens delivery semantics by preventing duplicates from retries within the producer session.'],wrong:['Compression, batching, and acknowledgments are separate settings, although idempotence imposes compatible acks/retry requirements.'],tip:'Idempotence protects against duplicate retry writes, not all application-level duplicates.'}},
    {type:'single',q:'What happens with <code>max.in.flight.requests.per.connection=1</code> and <code>enable.idempotence=true</code>?',opts:[{t:'The producer can still batch records, but sends only one request at a time per broker connection.',c:true},{t:'The producer disables batching.',c:false},{t:'The producer disables retries.',c:false},{t:'The producer disables compression.',c:false}],exp:{key:'Max in-flight of 1 serializes produce requests per connection, protecting order but limiting pipelining.',correct:['Batching can still happen before requests are sent. The restriction is one unacknowledged request per connection.'],wrong:['Batching, retries, and compression are not automatically disabled.'],tip:'Max in-flight 1 is strongest ordering but may reduce throughput.'}},
    {type:'single',q:'How can enabling idempotence affect producer performance?',opts:[{t:'It always significantly improves throughput.',c:false},{t:'It has absolutely no overhead.',c:false},{t:'It may slightly reduce throughput due to sequencing and coordination overhead.',c:true},{t:'It always increases memory usage massively.',c:false}],exp:{key:'Idempotence adds safety with some bookkeeping.',correct:['Producer IDs, sequence numbers, and stricter acknowledgement behavior can add small overhead, but reliability improves.'],wrong:['It is not primarily a throughput optimization.','There is some coordination overhead.','Memory impact is not necessarily massive.'],tip:'Most production systems accept the small overhead for safer retries.'}},
    {type:'single',q:'What does <code>acks=all</code> ensure?',opts:[{t:'Acknowledgment after write to all assigned replicas.',c:false},{t:'Acknowledgment after write to leader only.',c:false},{t:'Acknowledgment after write to all in-sync replicas.',c:true},{t:'No acknowledgment.',c:false}],exp:{key:'The acknowledgment set is the ISR.',correct:['The leader responds after in-sync replicas have acknowledged according to the ISR rules.'],wrong:['Assigned replicas outside ISR are not required.','Leader-only is <code>acks=1</code>.','No ack is <code>acks=0</code>.'],tip:'Do not confuse replicas with in-sync replicas.'}},
    {type:'single',q:'What is the purpose of <code>client.id</code>?',opts:[{t:'Identify the client in logs, metrics, and requests.',c:true},{t:'Set max requests.',c:false},{t:'Choose compression.',c:false},{t:'Control buffer memory.',c:false}],exp:{key:'<code>client.id</code> is an optional logical identifier for observability.',correct:['It helps operators trace metrics and logs for a specific producer or consumer application.'],wrong:['It does not control throughput, compression, or memory.'],tip:'Use meaningful client IDs for monitoring.'}},
    {type:'single',q:'What happens if multiple Kafka clients use the same <code>client.id</code>?',opts:[{t:'They share configuration and connection pools.',c:false},{t:'Brokers treat them as one logical client for correctness.',c:false},{t:'Kafka allows it, but logs/metrics become harder to distinguish.',c:true},{t:'Brokers reject duplicate client IDs.',c:false}],exp:{key:'<code>client.id</code> is not enforced as a unique identity by brokers.',correct:['Duplicate client IDs usually work, but observability and troubleshooting become confusing.'],wrong:['They do not share runtime state.','Client ID does not define correctness grouping.','Duplicates are not automatically rejected.'],tip:'Duplicate client IDs are allowed but bad for monitoring clarity.'}},
    {type:'single',q:'If a producer sends a keyed message to a topic with 5 partitions, how is the partition chosen by default?',opts:[{t:'Randomly.',c:false},{t:'By hashing the key and mapping it to a partition.',c:true},{t:'Always partition 0.',c:false},{t:'The broker chooses after receiving the record.',c:false}],exp:{key:'The default partitioner uses the key to choose a stable partition.',correct:['Messages with the same key go to the same partition as long as partition count and partitioner behavior remain stable.'],wrong:['It is not random for keyed records.','It is not always partition 0.','Partitioning is normally producer-side.'],tip:'Key determines partition; partition determines ordering scope.'}},
    {type:'single',q:'What happens if a producer sends a message without a key?',opts:[{t:'The message is discarded.',c:false},{t:'The default partitioner distributes unkeyed records across partitions, often using sticky partitioning in modern clients.',c:true},{t:'The message is sent to all partitions.',c:false},{t:'The broker always sends it to the least-loaded partition.',c:false}],exp:{key:'Unkeyed records are distributed by producer partitioner behavior.',correct:['Modern Kafka uses sticky partitioning for better batching, not simple per-record random distribution. Older explanations may say round-robin.'],wrong:['Unkeyed messages are valid.','A record goes to one partition, not all.','The broker does not choose based on least data.'],tip:'Modern default: sticky partitioning for null keys improves batching.'}},
    {type:'single',q:'Can a producer guarantee total ordering for messages with different keys?',opts:[{t:'Yes, Kafka always preserves total topic order.',c:false},{t:'No, different keys may go to different partitions, so only per-partition order is guaranteed.',c:true},{t:'Only if the topic has many partitions.',c:false},{t:'Only if compression is disabled.',c:false}],exp:{key:'Kafka ordering is per partition.',correct:['Different keys may land in different partitions; there is no global topic order across partitions.'],wrong:['Kafka does not guarantee total topic order for multi-partition topics.','More partitions reduce global ordering.','Compression does not define ordering scope.'],tip:'Need strict global order? Use one partition or a design that preserves ordering key.'}},
    {type:'single',q:'What happens when a producer sends to a broker that is no longer leader for the partition?',opts:[{t:'The producer receives a not-leader/metadata error and refreshes metadata before retrying.',c:true},{t:'The producer waits until that broker becomes leader again.',c:false},{t:'The message is automatically routed by that broker to another ISR.',c:false},{t:'The message is always discarded immediately.',c:false}],exp:{key:'Producers use metadata to find partition leaders.',correct:['If metadata is stale, the broker returns a leader-related error. The producer refreshes metadata and retries if allowed.'],wrong:['It does not wait for the old leader.','Brokers do not generally proxy producer writes to the correct leader.','Retry/error handling decides final outcome.'],tip:'Leader errors usually mean refresh metadata.'}},
    {type:'single',q:'RF=3, <code>min.insync.replicas=2</code>. Producer uses <code>acks=all</code>. Two replicas are not in sync. What happens?',opts:[{t:'The producer receives acknowledgment successfully.',c:false},{t:'The producer gets a not-enough-replicas error and the write is not successful.',c:true},{t:'The producer waits indefinitely.',c:false},{t:'The leader writes and acknowledges anyway.',c:false}],exp:{key:'If only one replica is in ISR, min ISR of 2 is not satisfied.',correct:['With <code>acks=all</code>, the broker rejects the write because the ISR count is below <code>min.insync.replicas</code>.'],wrong:['The write cannot be acknowledged successfully.','Kafka does not wait indefinitely.','The leader alone is insufficient when min ISR is 2.'],tip:'ISR count below min ISR = writes fail for acks=all.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Kafka producer configuration.';else if(pct>=70)msg='Solid result; review acks, ISR, idempotence, batching, and partitioning.';else msg='Needs review: focus on acks, min ISR, batching, retries, idempotence, and ordering.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
