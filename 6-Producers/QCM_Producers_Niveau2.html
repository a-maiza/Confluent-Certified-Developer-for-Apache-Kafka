<script>
var QUESTIONS_RAW = [
  /* ======== 1. FROM COURSE — bootstrap.servers ======== */
  {
    source: "cours",
    type: "single",
    question: "A DevOps team manages a Kafka cluster with 80 brokers spread across 3 data centers. A new Java microservice must connect to this cluster. The team's Kafka architect says that listing all 80 brokers in the client configuration is unnecessary and adds maintenance overhead. What value should the developer provide for `bootstrap.servers`?",
    options: [
      { text: "List all 80 broker addresses so the client is always guaranteed to connect even if some brokers are down.", explanation: "Incorrect. Listing all 80 brokers is unnecessary. The producer only needs enough brokers to establish the initial connection. Adding all 80 creates maintenance overhead and is not recommended by Kafka best practices.", correct: false },
      { text: "Provide 2–3 broker addresses per data center (6–9 total) so the client can bootstrap and discover the full cluster metadata.", explanation: "Correct. Kafka's bootstrap process only needs a few brokers to retrieve full cluster metadata. Listing 2–3 brokers per DC provides redundancy without the maintenance burden of enumerating all 80 brokers.", correct: true },
      { text: "Provide only one broker address, as the producer will auto-discover all others after connecting.", explanation: "Incorrect. While a single broker technically works, it creates a single point of failure during bootstrap. If that broker is down, the producer cannot connect at all. Best practice recommends multiple entries for resilience.", correct: false },
      { text: "Leave `bootstrap.servers` empty and configure `zookeeper.connect` instead, which is the current recommended approach.", explanation: "Incorrect. Kafka clients do NOT connect to ZooKeeper directly. `bootstrap.servers` is mandatory for producers and must contain Kafka broker addresses, not ZooKeeper.", correct: false }
    ],
    globalExplanation: "The `bootstrap.servers` property specifies a list of broker addresses the producer uses to bootstrap the connection and retrieve full cluster metadata. Once the producer connects to any listed broker, it discovers all other brokers automatically. Providing 2–3 brokers per datacenter ensures resilience without listing every broker in the cluster."
  },
  /* ======== 2. FROM COURSE — acks=all ======== */
  {
    source: "cours",
    type: "single",
    question: "A trading platform processes stock trade confirmations. Regulatory requirements mandate that no trade confirmation can be lost — each message must be durably committed to Kafka before the producer considers the write successful. The platform can tolerate slightly higher write latency in exchange for this guarantee. Which `acks` setting satisfies this requirement?",
    options: [
      { text: "`acks=0` — the producer does not wait for any acknowledgment, maximizing throughput.", explanation: "Incorrect. `acks=0` provides no delivery guarantee. Messages can be lost silently if brokers are unavailable or fail before writing, which violates the no-loss regulatory requirement.", correct: false },
      { text: "`acks=1` — the partition leader acknowledges the write immediately.", explanation: "Incorrect. With `acks=1`, data is acknowledged by the leader but not yet replicated to followers. If the leader crashes immediately after acknowledging, the message can be lost before followers catch up.", correct: false },
      { text: "`acks=all` (or `-1`) — the partition leader waits for all in-sync replicas to acknowledge the write.", explanation: "Correct. `acks=all` ensures the write is committed to all in-sync replicas before the producer receives an acknowledgment. Combined with `min.insync.replicas`, this provides the strongest durability guarantee, preventing data loss even if the leader fails immediately after.", correct: true },
      { text: "`acks=2` — a custom value that waits for exactly 2 replicas to acknowledge.", explanation: "Incorrect. The valid values for `acks` are `0`, `1`, and `all` (or `-1`). There is no `acks=2` setting. Attempting to set an unsupported value will result in an `InvalidRequiredAcksException`.", correct: false }
    ],
    globalExplanation: "The `acks` configuration controls the producer's durability guarantee. `acks=all` is the safest option, requiring acknowledgment from all in-sync replicas (ISR). For production systems where message loss is unacceptable, `acks=all` combined with `min.insync.replicas >= 2` on the broker side is the recommended pattern."
  },
  /* ======== 3. FROM COURSE — Key for ordering ======== */
  {
    source: "cours",
    type: "single",
    question: "A logistics company tracks shipment updates where all events for the same shipment must be processed in order by consumers. Shipments are identified by a `shipmentId` field in each event. The current producer sends events without a key and the team observes out-of-order processing. What change guarantees ordering for events of the same shipment?",
    options: [
      { text: "Increase the number of topic partitions to reduce contention.", explanation: "Incorrect. Adding more partitions does not solve the ordering problem. Without a key, messages are distributed round-robin across all partitions, so events for the same shipment will still land on different partitions.", correct: false },
      { text: "Set the message key to `shipmentId` when producing events.", explanation: "Correct. Kafka's default partitioner hashes the message key to determine the partition. All messages with the same key (same `shipmentId`) are guaranteed to go to the same partition, and consumers read each partition in order.", correct: true },
      { text: "Set `max.inflight.requests.per.connection=1` on the producer.", explanation: "Incorrect. While this ensures strict in-flight ordering within the producer, it does not address the root cause: without a key, events for the same shipment can land on different partitions, making consumer-side ordering impossible regardless of in-flight settings.", correct: false },
      { text: "Enable `enable.idempotence=true` to guarantee in-order delivery.", explanation: "Incorrect. Idempotence prevents duplicate messages during retries but does not control which partition a message is sent to. Without a message key, events for the same shipment will still be scattered across partitions.", correct: false }
    ],
    globalExplanation: "Kafka's partitioner routes all messages with the same non-null key to the same partition using `hash(key) % numPartitions`. Since Kafka provides strict ordering within a partition, setting the message key to a business entity identifier (like `shipmentId`) is the standard pattern to guarantee ordered processing per entity."
  },
  /* ======== 4. FROM COURSE — linger.ms for batching ======== */
  {
    source: "cours",
    type: "single",
    question: "A batch reporting service produces 50,000 small JSON events per second to a Kafka topic. The team notices the producer is sending many small requests, leading to high network overhead. They want to improve throughput by allowing the producer to accumulate more records per batch. The service can tolerate up to 50ms of additional latency. Which configuration achieves this?",
    options: [
      { text: "Set `batch.size=16384` and keep `linger.ms=0` (default).", explanation: "Incorrect. With `linger.ms=0`, the producer sends a batch as soon as a thread is available — it does not wait to accumulate more records. The batch.size limit is rarely reached at `linger.ms=0` for steady but moderate throughput.", correct: false },
      { text: "Set `linger.ms=50` so the producer waits up to 50ms to fill a batch before sending.", explanation: "Correct. `linger.ms` introduces a deliberate delay before sending, allowing more records to accumulate in the batch. This trades a small increase in latency for significantly better throughput and fewer network requests.", correct: true },
      { text: "Set `compression.type=gzip` to reduce payload size without changing batching behavior.", explanation: "Incorrect. Compression reduces the payload size of each request but does not change how the producer accumulates records into batches. The number of requests remains unchanged — only their size decreases.", correct: false },
      { text: "Set `acks=0` to skip acknowledgments and reduce round-trip time.", explanation: "Incorrect. While `acks=0` eliminates the acknowledgment round-trip, it does not aggregate more records per batch and sacrifices all delivery guarantees, which is inappropriate for a reporting service.", correct: false }
    ],
    globalExplanation: "`linger.ms` configures how long the producer waits before sending a batch even if it is not yet full. The default value of 0 means the producer sends immediately, which can result in many small requests. Increasing `linger.ms` (e.g., 20–100ms) allows the accumulator to fill larger batches, significantly improving throughput at the cost of a small latency increase."
  },
  /* ======== 5. FROM COURSE — enable.idempotence ======== */
  {
    source: "cours",
    type: "single",
    question: "A fintech startup processes payment events where each payment must be produced to Kafka exactly once. Due to network instability, the producer occasionally retries requests. The team discovers that some payments appear duplicated in the Kafka topic, causing double-charges. Which configuration eliminates producer-side duplication from retries?",
    options: [
      { text: "Set `retries=0` to disable all producer retries.", explanation: "Incorrect. Disabling retries eliminates duplication but introduces the risk of data loss on transient errors. The requirement is exactly-once delivery, not at-most-once.", correct: false },
      { text: "Set `enable.idempotence=true` on the producer.", explanation: "Correct. Idempotent producers assign each batch a unique sequence number. The broker tracks these numbers and deduplicates retried requests, ensuring each message is written exactly once even when the producer retries due to network issues.", correct: true },
      { text: "Set `acks=1` to receive faster acknowledgments and avoid the need for retries.", explanation: "Incorrect. `acks=1` has nothing to do with deduplication. It only controls when the producer considers a write successful. Retries can still produce duplicates regardless of the `acks` setting.", correct: false },
      { text: "Increase `request.timeout.ms` to give the broker more time to respond before retrying.", explanation: "Incorrect. Increasing the timeout reduces the frequency of timeouts that trigger retries, but it does not prevent duplicates when retries do occur. Network failures and broker restarts can still cause duplicate messages.", correct: false }
    ],
    globalExplanation: "Idempotent producers (enabled via `enable.idempotence=true`) work by assigning each ProducerRecord batch a Producer ID (PID) and monotonically increasing sequence numbers. The broker deduplicates any batch that arrives with a sequence number it has already seen, guaranteeing exactly-once delivery at the producer-broker level for a single session."
  },
  /* ======== 6. FROM COURSE — retriable errors ======== */
  {
    source: "cours",
    type: "single",
    question: "A Kafka producer is running in production and the on-call engineer receives an alert: the producer logs are showing `NotLeaderOrFollowerException` for partition 3 of the `orders` topic. The engineer checks the broker logs and sees that a leader election is in progress for that partition. What is the expected behavior and correct action?",
    options: [
      { text: "The application code must catch this exception and implement custom retry logic, as the producer does not handle leader elections automatically.", explanation: "Incorrect. `NotLeaderOrFollowerException` is classified as a retriable error. The Kafka producer SDK handles this automatically by fetching fresh metadata and retrying the request — no custom retry code is needed.", correct: false },
      { text: "The producer automatically retries the request after refreshing metadata. No code change is needed; the producer recovers transparently.", explanation: "Correct. `NotLeaderOrFollowerException` is a retriable error. The producer will refresh its partition metadata and retry the send once the new leader is elected, up to the `retries` limit with a delay defined by `retry.backoff.ms`.", correct: true },
      { text: "This is a non-retriable error. The producer must be restarted to reconnect to the correct leader.", explanation: "Incorrect. This error is explicitly retriable. The producer does not need to be restarted — it handles leader elections automatically by updating its internal metadata cache.", correct: false },
      { text: "The engineer should set `acks=0` to avoid leader-dependency and prevent this exception from occurring.", explanation: "Incorrect. `acks=0` means the producer does not wait for any acknowledgment, but it still sends to the partition leader. A leader election will still occur, and this setting provides weaker delivery guarantees, not a solution to the underlying error.", correct: false }
    ],
    globalExplanation: "Kafka classifies producer errors as retriable or non-retriable. `NotLeaderOrFollowerException` (and its predecessor `NotLeaderForPartitionException`) is retriable: the producer will automatically refresh cluster metadata and retry. The key retriable errors include: NotLeaderOrFollowerException, LeaderNotAvailableException, and NotEnoughReplicasException. Contrast with non-retriable errors like `MessageSizeTooLargeException` that require human intervention."
  },
  /* ======== 7. FROM COURSE — non-retriable error ======== */
  {
    source: "cours",
    type: "single",
    question: "A data pipeline produces large binary blobs to a Kafka topic. After a schema change, the payload size increased from 500KB to 2MB. The broker's `message.max.bytes` is configured to 1MB. The team sets `retries=100` on the producer but still observes `RecordTooLargeException` in the logs. Why does the error persist?",
    options: [
      { text: "`RecordTooLargeException` is a retriable error, but `retries=100` is too low. Setting `retries=Integer.MAX_VALUE` will resolve it.", explanation: "Incorrect. `RecordTooLargeException` is a non-retriable error. No number of retries will resolve it because the message is structurally too large for the broker's configured limit — the payload must be reduced or the broker limit must be increased.", correct: false },
      { text: "`RecordTooLargeException` is a non-retriable error. The issue requires either reducing the message size or increasing `max.request.size` on the producer and `message.max.bytes` on the broker.", explanation: "Correct. Message-size errors are non-retriable because retrying does not change the fact that the message exceeds the allowed limit. The fix requires a configuration or architecture change: split the payload, reference external storage, or increase the size limits consistently across producer, broker, and consumer.", correct: true },
      { text: "The error is caused by `compression.type=none`. Setting `compression.type=gzip` will reduce the payload below the 1MB limit.", explanation: "Incorrect. While compression may reduce payload size, 2MB compressed with gzip still may exceed 1MB. More importantly, the root cause is a configuration mismatch that must be addressed at the architectural level, not by hoping compression solves it.", correct: false },
      { text: "The problem is a broker-side timeout. Increasing `request.timeout.ms` will give the broker more time to accept the large message.", explanation: "Incorrect. `request.timeout.ms` is about network round-trip timeouts, not message size limits. The broker rejects the message immediately upon parsing its size, regardless of timeout settings.", correct: false }
    ],
    globalExplanation: "Kafka distinguishes between retriable errors (which producers handle automatically) and non-retriable errors (which require operator intervention). `RecordTooLargeException` is non-retriable because no amount of retrying changes the fact that the payload exceeds the configured size limit. Fixing this requires coordinated changes to `max.request.size` (producer), `message.max.bytes` (broker), and `fetch.message.max.bytes` (consumer)."
  },
  /* ======== 8. FROM COURSE — batch.size + linger.ms dual config ======== */
  {
    source: "cours",
    type: "multiple",
    question: "A real-time analytics platform produces 100,000 small events per second. The current producer configuration uses defaults (`batch.size=16384`, `linger.ms=0`) and the team observes excessive network requests and CPU overhead. The team wants to increase batching efficiency significantly. Which TWO configuration changes will together achieve this goal?",
    options: [
      { text: "Set `batch.size=131072` (128KB) to allow larger batches to accumulate.", explanation: "Correct. Increasing `batch.size` allows each batch to hold more records before being sent. For high-throughput scenarios, a larger batch size (64KB–512KB) significantly improves network efficiency.", correct: true },
      { text: "Set `linger.ms=100` to allow the producer to wait up to 100ms for the batch to fill.", explanation: "Correct. Increasing `linger.ms` ensures the producer waits to accumulate more records before sending, complementing the larger `batch.size`. Together, these two settings dramatically reduce the number of requests per second.", correct: true },
      { text: "Set `acks=0` to skip acknowledgments and reduce per-request overhead.", explanation: "Incorrect. While `acks=0` removes acknowledgment overhead, it eliminates all delivery guarantees. It does not affect batching efficiency and is not recommended unless data loss is acceptable.", correct: false },
      { text: "Set `max.inflight.requests.per.connection=1` to serialize all requests.", explanation: "Incorrect. Reducing in-flight requests to 1 actually decreases throughput by preventing the producer from pipelining requests. This setting is used for strict ordering with retries, not batching efficiency.", correct: false },
      { text: "Set `buffer.memory=67108864` (64MB) to double the buffer size.", explanation: "Incorrect. Increasing buffer memory allows more records to queue up before the producer blocks, which helps under back-pressure scenarios, but it does not directly improve batching or reduce request frequency when the default buffer is not the bottleneck.", correct: false }
    ],
    globalExplanation: "Producer batching is governed by two complementary settings: `batch.size` (maximum bytes per batch) and `linger.ms` (wait time for the batch to fill). A batch is sent when EITHER condition is met — the batch is full OR the linger time expires. Increasing both together ensures large, efficient batches at high throughput. At 100K events/sec with small payloads, default settings (16KB, 0ms) produce many tiny batches; tuning both values together is the standard optimization."
  },
  /* ======== 9. FROM COURSE — idempotence vs max.inflight ======== */
  {
    source: "cours",
    type: "single",
    question: "A developer wants to ensure that a Kafka producer does not produce duplicate messages during retries AND maintains message ordering even with retries enabled. A colleague suggests setting `max.inflight.requests.per.connection=1` as the solution. What is the correct approach for modern Kafka producers?",
    options: [
      { text: "Set `max.inflight.requests.per.connection=1`. This prevents both duplicates and reordering at the cost of reduced throughput.", explanation: "Partially correct but suboptimal. `max.inflight=1` does prevent reordering from retries, but it does NOT prevent duplicate messages — a retried request can still produce a duplicate if the original succeeded but the acknowledgment was lost. It also significantly reduces throughput.", correct: false },
      { text: "Set `enable.idempotence=true`. This automatically configures retries, in-flight limits, and acks optimally while preventing both duplicates and reordering.", explanation: "Correct. Enabling idempotence implicitly sets `acks=all`, `retries=Integer.MAX_VALUE`, and `max.inflight.requests.per.connection<=5`. The broker uses sequence numbers to deduplicate AND detect out-of-order delivery, solving both problems with better throughput than `max.inflight=1`.", correct: true },
      { text: "Set `retries=0` and `max.inflight.requests.per.connection=1` to prevent both issues entirely.", explanation: "Incorrect. Setting `retries=0` eliminates retry-based reordering and duplicates, but it also means any transient error results in data loss — the message is simply dropped. This is at-most-once semantics, not exactly-once.", correct: false },
      { text: "Set `acks=all` and `retries=Integer.MAX_VALUE`. This combination ensures ordering and eliminates duplicates.", explanation: "Incorrect. `acks=all` ensures durability, and high `retries` ensures delivery, but neither prevents duplicate messages during retries. Without idempotence, a retried message that was successfully written but not acknowledged will be written again.", correct: false }
    ],
    globalExplanation: "Before idempotence was introduced, setting `max.inflight=1` was the only way to prevent reordering during retries, but it did not prevent duplicates. `enable.idempotence=true` solves both problems: the broker uses Producer IDs and sequence numbers to detect duplicates AND out-of-order batches. Modern best practice is to always enable idempotence rather than relying on `max.inflight=1`."
  },
  /* ======== 10. FROM COURSE — compression.type ======== */
  {
    source: "cours",
    type: "single",
    question: "A data engineering team produces large JSON log events (avg. 8KB each) at high volume to a Kafka cluster. Network bandwidth between producers and brokers is the primary bottleneck. The production servers have spare CPU capacity. The team wants the best network efficiency. Which `compression.type` is most appropriate?",
    options: [
      { text: "`compression.type=none` — no compression, so producers send raw JSON and minimize CPU usage.", explanation: "Incorrect. Without compression, all 8KB JSON events are sent over the wire at full size. This aggravates the network bottleneck that was already identified as the primary constraint.", correct: false },
      { text: "`compression.type=gzip` — high compression ratio, good for large JSON payloads, acceptable CPU overhead given spare capacity.", explanation: "Correct. Gzip achieves the highest compression ratio among Kafka's built-in codecs, making it ideal for large, text-based payloads like JSON. Since the servers have spare CPU, the CPU cost of gzip compression is acceptable in exchange for significantly reduced network traffic.", correct: true },
      { text: "`compression.type=snappy` — best compression ratio available in Kafka, designed for maximum size reduction.", explanation: "Incorrect. Snappy is optimized for speed (fast compression/decompression) rather than ratio. It achieves lower compression ratios than gzip or zstd. Gzip and zstd are better choices when compression ratio is the priority.", correct: false },
      { text: "`compression.type=lz4` — fastest compression algorithm, reducing both network load and CPU overhead simultaneously.", explanation: "Incorrect. LZ4 is optimized for speed, not ratio. While it has very low CPU overhead, its compression ratio is lower than gzip/zstd. When network bandwidth is the bottleneck and CPU is available, gzip or zstd are better choices.", correct: false }
    ],
    globalExplanation: "Kafka supports four compression types: `gzip` (highest ratio, highest CPU), `snappy` (medium ratio, low CPU), `lz4` (lowest ratio, lowest CPU), and `zstd` (near-gzip ratio, low CPU — best overall balance). When the bottleneck is network bandwidth and CPU is available, `gzip` or `zstd` are optimal. Compression is transparent to consumers — Kafka stores the compression type in the message batch header, and consumers decompress automatically."
  },
  /* ======== 11. FROM COURSE — transactional.id for EOS ======== */
  {
    source: "cours",
    type: "single",
    question: "A data pipeline reads events from a source Kafka topic, transforms them, and writes results to a destination topic. The team needs to guarantee that for every input event consumed, exactly one transformed output is produced — even if the producer application crashes mid-transaction. What configuration enables this read-process-write exactly-once guarantee?",
    options: [
      { text: "Set `enable.idempotence=true` on the producer. This is sufficient for end-to-end exactly-once semantics.", explanation: "Incorrect. Idempotence alone only prevents producer-side duplicates within a single session. It does not coordinate the offset commit on the consumer side with the Kafka write, so a crash between committing and producing can still lead to duplicates or reprocessing.", correct: false },
      { text: "Set `transactional.id` on the producer and use Kafka transactions to atomically commit the consumer offset and the output record in a single transaction.", explanation: "Correct. `transactional.id` enables Kafka's transaction API. Using `producer.beginTransaction()`, writing records, committing consumer offsets via `producer.sendOffsetsToTransaction()`, and calling `producer.commitTransaction()` atomically ties the offset commit to the write, achieving exactly-once read-process-write semantics.", correct: true },
      { text: "Set `acks=all` and `retries=Integer.MAX_VALUE` on the producer. This combination guarantees exactly-once delivery.", explanation: "Incorrect. `acks=all` with high retries ensures at-least-once delivery, not exactly-once. Messages can still be duplicated if a retry succeeds after the original write was committed but the acknowledgment was lost.", correct: false },

      { text: "Kafka 2.4 introduced the Sticky Partitioner, which assigns null-key messages to a single partition until the batch is full, then switches to the next partition.", explanation: "Correct. The Sticky Partitioner (KIP-480) replaced round-robin for null-key messages. Instead of distributing each message to a different partition, it 'sticks' to one partition until the batch is full or `linger.ms` expires, then switches. This significantly reduces the number of small batches sent across multiple partitions.", correct: true },
      { text: "Kafka 2.4 changed the default `linger.ms` from 0 to 5ms, improving batching for all producers.", explanation: "Incorrect. The default `linger.ms` was not changed to 5ms in Kafka 2.4. The improvement came from the Sticky Partitioner algorithm change for null-key messages.", correct: false },
      { text: "Kafka 2.4 introduced network-level compression by default, reducing the overhead of small batches.", explanation: "Incorrect. Kafka 2.4 did not introduce network-level compression by default. `compression.type` defaults to `none` across Kafka versions. The batching improvement came from the Sticky Partitioner.", correct: false }
    ],
    globalExplanation: "⚠️ This concept was not explicitly in the course but is frequently tested in the CCDAK exam. Prior to Kafka 2.4, the DefaultPartitioner used round-robin for null-key messages, spreading each event to a different partition and creating many small batches. KIP-480 introduced the StickyPartitioner (default from Kafka 2.4+): it assigns consecutive null-key messages to the same partition until the batch is full or linger.ms expires, then 'sticks' to the next partition. This dramatically improves batching efficiency for null-key producers."
  },
  /* ======== 25. BEYOND COURSE — Partition selection precedence ======== */
  {
    source: "inference",
    type: "single",
    question: "A developer creates a `ProducerRecord` with `topic=\"events\"`, `partition=3`, `key=\"user-42\"`, and `value=\"payload\"`. The default partitioner is in use. Which partition will this record be sent to?",
    options: [
      { text: "Partition determined by `hash(\"user-42\") % numPartitions`, because the key takes precedence over explicit partition.", explanation: "Incorrect. When an explicit partition number is provided in the ProducerRecord constructor, it always takes precedence over key-based hashing. The key is ignored for partition selection when a partition is explicitly specified.", correct: false },
      { text: "Partition 3, because an explicit partition number in ProducerRecord always takes precedence over the key and the partitioner.", explanation: "Correct. Kafka's partition selection follows a strict precedence: (1) explicit partition in ProducerRecord → (2) key-based hash via partitioner → (3) sticky/round-robin for null keys. An explicit partition number overrides all other logic.", correct: true },
      { text: "The record is rejected with an error because both a key and an explicit partition cannot be specified simultaneously.", explanation: "Incorrect. There is no restriction on specifying both a key and a partition in a ProducerRecord. The key is simply not used for partition selection when an explicit partition is given — it is still sent as part of the record for consumer-side use.", correct: false },
      { text: "A partition determined by the custom partitioner configured via `partitioner.class`, which overrides all ProducerRecord fields.", explanation: "Incorrect. Even with a custom partitioner, Kafka short-circuits partition selection if an explicit partition is set in the ProducerRecord. Custom partitioners are only invoked when no explicit partition is provided.", correct: false }
    ],
    globalExplanation: "⚠️ This concept was not explicitly in the course but is frequently tested in the CCDAK exam. Kafka's partition selection precedence is: (1) if ProducerRecord specifies an explicit partition → use it, partitioner not invoked; (2) else if key is non-null → invoke partitioner (default: murmur2 hash of key % numPartitions); (3) else (null key) → sticky partitioner (Kafka 2.4+) or round-robin (Kafka < 2.4). The key is always preserved in the record for consumer-side processing, even when not used for routing."
  }
];

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var totalTime = 90 * QUESTIONS_RAW.length;
var timeLeft = totalTime;
var timerInterval = null;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  QUESTIONS = fisherYates(QUESTIONS_RAW).map(function(q) {
    var opts = q.options.slice();
    opts = fisherYates(opts);
    return {
      source: q.source,
      type: q.type,
      question: q.question,
      options: opts,
      globalExplanation: q.globalExplanation
    };
  });
}

function startGlobalTimer() {
  clearInterval(timerInterval);
  timeLeft = totalTime;
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      suivanteAuto();
    }
  }, 1000);
}

function renderTimer() {
  var el = document.getElementById('timerWrap');
  if (!el) return;
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = '⏱ ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var pct = timeLeft / totalTime;
  el.className = 'timer-wrap';
  if (pct < 0.1) el.className += ' danger';
  else if (pct < 0.2) el.className += ' warning';
}

function suivanteAuto() {
  if (!answered) {
    processAnswer();
  }
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    paintScore();
  }
}

function paint() {
  var q = QUESTIONS[qIdx];
  var pct = ((qIdx) / QUESTIONS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  var badgeType = q.type === 'single'
    ? '<span class="badge badge-single">Single answer</span>'
    : '<span class="badge badge-multi">Multiple answers</span>';
  var badgeSrc = q.source === 'cours'
    ? '<span class="badge badge-cours">📘 From the course</span>'
    : '<span class="badge badge-inference">🔍 Beyond the course</span>';

  var optsHtml = '';
  var letters = ['A','B','C','D','E'];
  for (var i = 0; i < q.options.length; i++) {
    optsHtml += '<div class="opt" id="opt_' + i + '" onclick="pickOption(' + i + ')">' +
      '<div class="opt-label">' +
      '<span class="opt-letter">' + letters[i] + '.</span>' +
      '<span class="opt-text">' + q.options[i].text + '</span>' +
      '</div>' +
      '<div class="opt-exp" id="optexp_' + i + '"></div>' +
      '</div>';
  }

  document.getElementById('quizBody').innerHTML =
    '<div class="q-meta">' +
      '<span class="q-num">Question ' + (qIdx+1) + ' / ' + QUESTIONS.length + '</span>' +
      badgeType + badgeSrc +
    '</div>' +
    '<div class="q-text">' + q.question + '</div>' +
    '<div class="options">' + optsHtml + '</div>' +
    '<div class="global-exp" id="globalExpBlock">' +
      '<div class="global-exp-title">💡 Key Concept</div>' +
      '<div class="global-exp-text" id="globalExpText"></div>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-primary" onclick="valider()">Validate</button>' +
      '<button class="btn btn-secondary" id="btnNext" onclick="suivante()" disabled>Next question →</button>' +
    '</div>';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    for (var k = 0; k < q.options.length; k++) {
      document.getElementById('opt_' + k).className = 'opt';
    }
    document.getElementById('opt_' + i).className = 'opt selected';
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) {
      selected.push(i);
      document.getElementById('opt_' + i).className = 'opt selected';
    } else {
      selected.splice(pos, 1);
      document.getElementById('opt_' + i).className = 'opt';
    }
  }
}

function getCorrectIndices() {
  var q = QUESTIONS[qIdx];
  var c = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) c.push(i);
  }
  return c;
}

function processAnswer() {
  answered = true;
  var q = QUESTIONS[qIdx];
  var correctIdxs = getCorrectIndices();
  var selSorted = selected.slice().sort().join(',');
  var corrSorted = correctIdxs.slice().sort().join(',');
  var isCorrect = (selSorted === corrSorted);

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  var letters = ['A','B','C','D','E'];
  for (var i = 0; i < q.options.length; i++) {
    var opt = document.getElementById('opt_' + i);
    var expDiv = document.getElementById('optexp_' + i);
    var isCorr = q.options[i].correct;
    var isSel = selected.indexOf(i) !== -1;
    opt.style.cursor = 'default';

    if (isCorr && isSel) {
      opt.className = 'opt correct';
    } else if (!isCorr && isSel) {
      opt.className = 'opt wrong';
    } else if (isCorr && !isSel) {
      opt.className = 'opt missed';
    }

    expDiv.className = 'opt-exp show';
    var icon = isCorr ? '<span class="opt-exp-icon" style="color:#27ae60">✓</span>' : '<span class="opt-exp-icon" style="color:#C0392B">✗</span>';
    expDiv.innerHTML = icon + q.options[i].explanation;
  }

  document.getElementById('globalExpText').textContent = q.globalExplanation;
  document.getElementById('globalExpBlock').className = 'global-exp show';

  var btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function valider() {
  if (answered) return;
  processAnswer();
}

function suivante() {
  if (!answered) return;
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    clearInterval(timerInterval);
    paintScore();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('timerWrap').style.display = 'none';
  var pct = Math.round((score / QUESTIONS.length) * 100);
  var barColor = pct >= 70 ? '#27ae60' : pct >= 50 ? '#e67e22' : '#C0392B';
  var msg = pct >= 80 ? '🏆 Excellent! CCDAK-ready!' : pct >= 70 ? '✅ Good job! Keep practicing.' : pct >= 50 ? '📚 Keep studying — almost there.' : '💡 Review the course and try again.';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizBody').innerHTML =
    '<div class="score-card">' +
      '<div class="score-title">Quiz Complete!</div>' +
      '<div class="score-sub">Kafka Producers — Level 2</div>' +
      '<div class="score-pct" style="color:' + barColor + '">' + pct + '%</div>' +
      '<div class="score-bar-wrap"><div class="score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      '<div class="score-msg" style="color:' + barColor + '">' + msg + '</div>' +
      '<div class="score-detail">' +
        '<div class="score-detail-box">' +
          '<div class="score-detail-label">📘 From the course</div>' +
          '<div class="score-detail-val">' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</div>' +
        '</div>' +
        '<div class="score-detail-box">' +
          '<div class="score-detail-label">🔍 Beyond the course</div>' +
          '<div class="score-detail-val">' + scoreInfCorrect + ' / ' + scoreInfTotal + '</div>' +
        '</div>' +
        '<div class="score-detail-box">' +
          '<div class="score-detail-label">Total Score</div>' +
          '<div class="score-detail-val">' + score + ' / ' + QUESTIONS.length + '</div>' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="recommencer()">🔄 Restart the test</button>' +
    '</div>';
}

function recommencer() {
  qIdx = 0;
  selected = [];
  answered = false;
  score = 0;
  scoreCoursTotal = 0;
  scoreCoursCorrect = 0;
  scoreInfTotal = 0;
  scoreInfCorrect = 0;
  prepareQuestions();
  document.getElementById('timerWrap').style.display = '';
  paint();
  startGlobalTimer();
}

prepareQuestions();
window.onload = function() {
  paint();
  startGlobalTimer();
};
</script>
</body>
