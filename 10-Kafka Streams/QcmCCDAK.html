<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCDAK Quiz — Kafka Streams, Co-partitioning & State</title>
    <style>
        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}pre{white-space:pre-wrap;background:#0f172a;color:#e5e7eb;border-radius:10px;padding:12px;overflow:auto;font-size:13px}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#378ADD;color:#fff}.btn.secondary{background:#eef2f7;color:#1f2937}.btn:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}.explain{display:none;margin-top:18px;border-top:1px solid #e5e7eb;padding-top:16px}.explain h3{margin:14px 0 6px;font-size:16px;color:#111827}.explain p,.explain li{line-height:1.52}.warn{font-weight:800;color:#b91c1c}.scoreBox{text-align:center;padding:22px}.scoreNum{font-size:48px;font-weight:900;color:#378ADD}.resultBar{height:18px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin:18px 0}.resultFill{height:100%;background:#378ADD;width:0}.pill{display:inline-block;border:1px solid #d1d5db;border-radius:999px;padding:7px 11px;margin:4px;background:#fff}.hidden{display:none}
    </style>
</head>
<body onload="initQuiz()">
<div class="wrap">
    <div class="top"><div id="progress" class="bar"></div></div>
    <div id="quiz" class="card">
        <div class="head">
            <div><h1>CCDAK Quiz — Kafka Streams, Co-partitioning & State</h1><div id="meta" class="muted"></div></div>
            <div id="timer" class="timer">01:30</div>
        </div>
        <span id="badge" class="badge"></span>
        <h2 id="question"></h2>
        <div id="options" class="opts"></div>
        <div id="status" class="muted"></div>
        <div class="actions">
            <button id="validateBtn" class="btn" onclick="valider()">Validate</button>
            <button id="nextBtn" class="btn secondary" onclick="suivante()" disabled>Next Question →</button>
            <button class="btn secondary" onclick="recommencer()">Restart</button>
        </div>
        <div id="explanation" class="explain"></div>
    </div>
    <div id="final" class="card hidden"></div>
</div>
<script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'single',q:'Two topics, <code>TopicA</code> and <code>TopicB</code>, are co-partitioned with 6 partitions each. What is critical for maintaining data consistency when processing related records across both topics?',opts:[{t:'Ensure both topics have the same replication factor.',c:false},{t:'Use the same keying/partitioning strategy so related keys go to the same partition number in both topics.',c:true},{t:'Configure <code>TopicB</code> with more partitions than <code>TopicA</code>.',c:false},{t:'Increase <code>max.poll.records</code>.',c:false}],exp:{key:'Co-partitioning requires the same number of partitions and compatible partitioning by key.',correct:['Related records must use the same key and partitioning logic so key K lands in partition N in both topics. This enables local joins and consistent correlation.'],wrong:['Replication factor affects durability, not co-partitioned relationship. More partitions breaks co-partitioning. Poll size affects batching, not key alignment.'],tip:'Co-partitioning = same partition count + same key partitioning.'}},
    {type:'single',q:'For a streaming app processing two co-partitioned topics <code>TopicX</code> and <code>TopicY</code>, what helps maintain ordering and correlation?',opts:[{t:'Configure both topics with compaction for deduplication.',c:false},{t:'Consume both topics in separate unrelated threads.',c:false},{t:'Use a unique consumer group for each topic.',c:false},{t:'Use the same key for related messages and process them in the same application/group topology.',c:true}],exp:{key:'Kafka Streams joins and correlations depend on matching keys and co-partitioned inputs.',correct:['Same keys and same partitioning let related records be processed by the same stream task.'],wrong:['Compaction does not guarantee correlation. Separate consumer groups break coordinated processing. Threads alone are not the core requirement.'],tip:'For joins, key alignment is more important than consumer-thread count.'}},
    {type:'single',q:'In a Kafka Streams clickstream enrichment app, what should be the cleanup policy for a <code>user-profiles-topic</code> read as a <code>KTable</code>?<pre>StreamsBuilder builder = new StreamsBuilder();
    KStream&lt;String, String&gt; clicks = builder.stream("clickstream-topic");
    KTable&lt;String, String&gt; profiles = builder.table("user-profiles-topic");
    KStream&lt;String, String&gt; enrichedClicks = clicks.join(profiles,
        (click, profile) -&gt; click + " enriched with " + profile);
    enrichedClicks.to("enriched-clickstream-topic");</pre>',opts:[{t:'<code>compression.type=snappy</code>',c:false},{t:'<code>cleanup.policy=delete</code>',c:false},{t:'<code>cleanup.policy=compact</code>',c:true}],exp:{key:'A KTable represents latest state per key, often backed by a compacted changelog topic.',correct:['Compaction keeps the latest profile for each user key, which is ideal for a profile lookup table.'],wrong:['Delete retention can remove state needed for table reconstruction. Compression is useful but not the defining table configuration.'],tip:'KTable source topics are commonly compacted.'}},
    {type:'single',q:'A Kafka Streams app aggregates transaction amounts by user ID. Which Serde setup matches the code best?<pre>KStream&lt;String, BigDecimal&gt; transactions = builder.stream("transactions-topic",
        Consumed.with(Serdes.String(), Serdes.BigDecimal()));
    KTable&lt;String, BigDecimal&gt; aggregatedTransactions = transactions
        .groupByKey()
        .reduce(BigDecimal::add, Materialized.as("aggregated-transactions-store"));</pre>',opts:[{t:'Key Serde = <code>Serdes.String()</code>, Value Serde = <code>Serdes.BigDecimal()</code>.',c:true},{t:'Key Serde = <code>Serdes.Long()</code>, Value Serde = <code>Serdes.Double()</code>.',c:false},{t:'Key Serde = <code>Serdes.String()</code>, Value Serde = <code>Serdes.String()</code>.',c:false}],exp:{key:'The key is a user ID string and the value is a financial amount.',correct:['String keys and BigDecimal values preserve the intended data types for grouping and accurate aggregation.'],wrong:['Long/Double does not match the code and may lose financial precision. String values would require parsing and are not appropriate here.'],tip:'Financial amounts usually need exact decimal types, not floating point.'}},
    {type:'single',q:'A Streams app filters ERROR logs from an <code>application-logs</code> topic. Which listed topic setting is most relevant if the goal is to avoid size-based deletion of logs before processing?',opts:[{t:'<code>retention.bytes=-1</code>',c:true},{t:'<code>cleanup.policy=compact</code>',c:false},{t:'<code>min.insync.replicas=2</code>',c:false}],exp:{key:'For append-only log events, delete retention is normal; compaction is usually inappropriate unless keyed latest-state semantics are desired.',correct:['<code>retention.bytes=-1</code> disables size-based retention, reducing the risk that high-volume logs are deleted due to total topic size before they can be consumed.'],wrong:['Compaction would keep only the latest record per key and may remove log events. min ISR improves write durability, not filter performance.'],tip:'For event logs, prefer delete retention with enough time/size; avoid compaction unless you need latest value per key.'}},
    {type:'single',q:'A Streams app computes hourly order counts using a state store. Which option most directly improves fault-tolerant recovery of the state store changelog?',opts:[{t:'Configure the changelog/internal topic replication factor, for example <code>replication.factor=3</code> / <code>replication.factor</code> for Streams internal topics.',c:true},{t:'<code>state.store.log.compaction=true</code>',c:false},{t:'<code>commit.interval.ms=100</code>',c:false}],exp:{key:'Kafka Streams state stores are backed by changelog topics for recovery. Replicating those changelog topics improves resilience.',correct:['The correct idea is replication of state store changelog/internal topics. The exact config name in Kafka Streams is not <code>state.store.replication.factor</code>; use Streams internal topic replication settings such as <code>replication.factor</code>.'],wrong:['<code>state.store.log.compaction</code> is not a valid standard Streams setting. Lower commit interval affects processing/commit frequency, not changelog durability by itself.'],tip:'State recovery depends on changelog topics; make internal topics durable.'}},
    {type:'single',q:'Is Kafka Streams DSL ANSI SQL compliant?',opts:[{t:'Yes',c:false},{t:'No',c:true},{t:'Partially',c:false},{t:'It depends on the version',c:false}],exp:{key:'Kafka Streams DSL is a Java API, not SQL.',correct:['It offers high-level stream operations but does not implement ANSI SQL.'],wrong:['ksqlDB is the SQL-like layer in the Kafka ecosystem, not the Kafka Streams DSL.'],tip:'Streams DSL = Java fluent API. ksqlDB = SQL-like stream processing.'}},
    {type:'single',q:'What is the primary language/API ecosystem for Kafka Streams applications?',opts:[{t:'Python',c:false},{t:'Java',c:true},{t:'Scala',c:false},{t:'SQL',c:false}],exp:{key:'Kafka Streams is a Java client library.',correct:['Kafka Streams is primarily written and used in Java, though JVM languages can interoperate.'],wrong:['SQL-like processing is ksqlDB. Python is not the native Kafka Streams API.'],tip:'Kafka Streams apps are normal JVM applications.'}},
    {type:'single',q:'What is the role of RocksDB in Kafka Streams?',opts:[{t:'It stores output topics.',c:false},{t:'It stores local intermediate/stateful processing state.',c:true},{t:'It stores application code.',c:false},{t:'It is not used by Kafka Streams.',c:false}],exp:{key:'RocksDB is the default persistent local state store engine in Kafka Streams.',correct:['Stateful operations such as joins, aggregations, and windowing use local state stores often backed by RocksDB.'],wrong:['Output topics are Kafka topics. Code is stored in application artifacts, not RocksDB.'],tip:'RocksDB local state + Kafka changelog = fault-tolerant state.'}},
    {type:'single',q:'In a Kafka Streams application, where is the processing topology defined?',opts:[{t:'In a special Kafka topic named <code>streams-configs</code>.',c:false},{t:'In ZooKeeper under <code>/kafka-streams</code>.',c:false},{t:'In the Kafka Streams application code itself.',c:true},{t:'Only in a separate external config file.',c:false}],exp:{key:'The topology is created by the application using the DSL or Processor API.',correct:['Your code builds the graph of processors, sources, stores, and sinks.'],wrong:['Kafka Streams does not store topology definitions in ZooKeeper or a special configs topic.'],tip:'Streams topology ships with the application.'}},
    {type:'single',q:'A Kafka Streams input topic has Avro values and generated Avro classes are available. What should <code>default.value.serde</code> typically use?',opts:[{t:'<code>Serdes.String()</code>',c:false},{t:'<code>Serdes.ByteArray()</code>',c:false},{t:'<code>SpecificAvroSerde</code>',c:true},{t:'<code>GenericAvroSerde</code>',c:false}],exp:{key:'Specific Avro Serde maps records to generated classes.',correct:['Use <code>SpecificAvroSerde</code> when your app uses generated Avro types. Use GenericAvroSerde when working with GenericRecord.'],wrong:['String and ByteArray do not provide typed Avro deserialization.'],tip:'Specific Avro = generated class. Generic Avro = GenericRecord.'}},
    {type:'single',q:'A Kafka Streams app performs a simple stateless <code>map</code> transformation. Which tuning option is most likely to improve downstream parallelism?',opts:[{t:'Increase the number of partitions of the output topic.',c:true},{t:'Enable state store caching.',c:false},{t:'Increase commit interval as the main fix.',c:false},{t:'Disable logging.',c:false}],exp:{key:'Stateless processing does not use state stores, so state cache tuning is not the main lever.',correct:['More output partitions can allow more parallelism for downstream consumers and may improve throughput if the rest of the topology supports it.'],wrong:['State store caching helps stateful operations. Disabling logs is not a safe performance strategy. Commit interval is not the primary lever for stateless map throughput.'],tip:'Stateless performance usually depends on partitions, threads, batching, and downstream capacity.'}},
    {type:'single',q:'A Kafka Streams app with a large RocksDB state store runs in Docker. What most improves restart performance?',opts:[{t:'Increase JVM heap only.',c:false},{t:'Mount a persistent high-performance SSD volume for the Kafka Streams state directory.',c:true},{t:'Increase replicas for input topics.',c:false},{t:'Use a faster CPU only.',c:false}],exp:{key:'Large local state restores can be expensive if state is lost on restart.',correct:['A persistent fast disk for <code>state.dir</code> can preserve local RocksDB state across container restarts and speed up restoration.'],wrong:['Heap does not hold the full RocksDB state. Input topic replication does not directly speed state restore. CPU helps but disk/local state is often the bottleneck.'],tip:'For stateful Streams in containers, persist <code>state.dir</code>.'}},
    {type:'single',q:'A Kafka Streams app joins two high-volume streams. Which is LEAST likely to improve normal processing throughput?',opts:[{t:'Ensure input streams are co-partitioned.',c:false},{t:'Increase standby replicas for state stores.',c:true},{t:'Tune cache buffering.',c:false},{t:'Increase <code>num.stream.threads</code> up to partition parallelism.',c:false}],exp:{key:'Standby replicas help failover and recovery, not steady-state throughput in most cases.',correct:['More standby replicas consume extra resources for fault tolerance and faster failover, but they usually do not make normal processing faster.'],wrong:['Co-partitioning, cache tuning, and more stream threads can directly affect join throughput.'],tip:'Standbys = resilience, not primary throughput.'}},
    {type:'multiple',q:'Which stream processing operations are typically stateful? Select all that apply.',opts:[{t:'Filter',c:false},{t:'Map',c:false},{t:'Aggregate',c:true},{t:'Join',c:true},{t:'Peek',c:false}],exp:{key:'Stateful operations remember information across records.',correct:['Aggregations maintain accumulated values. Joins maintain records/state to match related events or tables.'],wrong:['Filter, map, and peek usually process each record independently.'],tip:'If the operation needs memory over time, it is stateful.'}},
    {type:'single',q:'What is the purpose of state stores in Kafka Streams?',opts:[{t:'Persist intermediate state and enable fault tolerance/queryable state.',c:true},{t:'Cache input messages only.',c:false},{t:'Store final output topics.',c:false},{t:'Maintain application configuration.',c:false}],exp:{key:'State stores hold the local state required by stateful operations.',correct:['They support aggregations, joins, windowing, recovery, and sometimes interactive queries.'],wrong:['Final outputs are Kafka topics or external sinks. Config is not stored in state stores.'],tip:'State store = local materialized state.'}},
    {type:'single',q:'How does Kafka Streams recover state after failure?',opts:[{t:'Always replay all original input topics from the beginning.',c:false},{t:'Restore from a generic snapshot topic only.',c:false},{t:'Rebuild local state from the state store changelog topic.',c:true},{t:'Retrieve state from an external database.',c:false}],exp:{key:'Each persistent state store has a changelog topic.',correct:['Kafka Streams replays changelog records to restore the local state store.'],wrong:['It does not require replaying every input topic from the beginning if changelogs are available. External DB is not required.'],tip:'Changelog topics are the source of truth for state recovery.'}},
    {type:'single',q:'A Streams app processes an input topic with 6 partitions and performs a stateful aggregation. How many stream tasks/local state store partitions exist by default?',opts:[{t:'1',c:false},{t:'3',c:false},{t:'6',c:true},{t:'12',c:false}],exp:{key:'Kafka Streams parallelism is based on input topic partitions.',correct:['A stateful operation creates task-local state for each assigned partition/task. With 6 input partitions, there are 6 task partitions/state shards.'],wrong:['The count is not one global store. It follows partition/task parallelism.'],tip:'Number of active tasks is driven by partitions.'}},
    {type:'single',q:'What is the main advantage of Kafka Streams DSL over the Processor API?',opts:[{t:'It always performs faster.',c:false},{t:'It provides a higher-level, declarative/fluent API for stream processing logic.',c:true},{t:'It supports stateful operations while Processor API does not.',c:false},{t:'It is the only API that integrates with external systems.',c:false}],exp:{key:'The DSL is higher-level and more concise.',correct:['DSL operations such as map, filter, groupBy, aggregate, and join simplify topology definition.'],wrong:['Both DSL and Processor API support stateful processing. Processor API offers lower-level control.'],tip:'DSL for simplicity; Processor API for fine-grained control.'}},
    {type:'single',q:'With Kafka Streams DSL, how do you usually prepare a <code>KStream</code> for stateful aggregation?',opts:[{t:'Use <code>map</code> only.',c:false},{t:'Use <code>filter</code> only.',c:false},{t:'Use <code>groupByKey</code> or <code>groupBy</code> to create a grouped stream, then aggregate/reduce/count.',c:true},{t:'Use <code>mapValues</code> only.',c:false}],exp:{key:'Stateful aggregations operate on grouped streams.',correct:['<code>groupByKey()</code> creates a <code>KGroupedStream</code>, enabling <code>count</code>, <code>reduce</code>, or <code>aggregate</code>.'],wrong:['Map, filter, and mapValues are usually stateless transformations.'],tip:'Group first, then aggregate.'}},
    {type:'single',q:'What is the role of <code>StateStore</code> in Kafka Streams?',opts:[{t:'Store intermediate results/state for stream processing operations.',c:true},{t:'Store Streams application configuration properties.',c:false},{t:'Store Kafka cluster metadata.',c:false},{t:'Store consumer offsets only.',c:false}],exp:{key:'StateStore is the abstraction for local key-value/window/session state.',correct:['Stateful processors read and write local state stores during processing.'],wrong:['Cluster metadata and offsets are managed elsewhere.'],tip:'StateStore is your local processing database.'}},
    {type:'single',q:'In an e-commerce app, which data is best modeled as a <code>KTable</code>?',opts:[{t:'User clickstream events.',c:false},{t:'User order event stream.',c:false},{t:'User profile information.',c:true},{t:'Raw session event stream.',c:false}],exp:{key:'KTable models latest value per key / changelog state.',correct:['User profiles are naturally keyed by user ID and updated over time, making them suitable as a KTable.'],wrong:['Clickstream, orders, and raw sessions are event streams, often modeled as KStreams.'],tip:'KTable = current state. KStream = sequence of events.'}},
    {type:'single',q:'In an IoT app, how should continuous sensor readings be modeled for real-time processing?',opts:[{t:'As a KTable latest-value table only.',c:false},{t:'As a KStream, with each sensor reading as an event record.',c:true},{t:'As a GlobalKTable.',c:false},{t:'Only as a static windowed table.',c:false}],exp:{key:'Sensor readings are continuous events.',correct:['Each reading is a new event in an unbounded stream, so KStream is the natural representation.'],wrong:['A table would represent current/latest state, not the full event stream. GlobalKTable is for replicated reference data.'],tip:'Telemetry readings = KStream.'}},
    {type:'single',q:'For real-time website behavior analytics, which data is most appropriate as a <code>KStream</code>?',opts:[{t:'User demographic information.',c:false},{t:'User navigation events.',c:true},{t:'Static user profile table.',c:false},{t:'Authentication configuration data.',c:false}],exp:{key:'Navigation events are continuous behavioral events.',correct:['Clicks, page views, and navigation actions are naturally modeled as KStream records.'],wrong:['Demographics/profile/configuration are more table-like or static reference data.'],tip:'Behavior events flow; profiles update.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Kafka Streams co-partitioning and state.';else if(pct>=70)msg='Solid result; review KStream vs KTable, state stores, changelogs, and co-partitioning.';else msg='Needs review: focus on co-partitioned joins, RocksDB, changelogs, state stores, and Streams DSL basics.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
</body>
</html>
