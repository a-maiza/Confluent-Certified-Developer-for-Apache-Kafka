<script>
var QUESTIONS = [
  {
    source: "cours",
    type: "single",
    question: "A ride-sharing platform ingests GPS location events from millions of drivers into Kafka topics. A data engineering team starts with simple filtering (removing null coordinates) in a standard Kafka consumer. Over time, product requests evolve to require: computing the average speed per driver over a rolling 5-minute window, detecting when a driver is near a surge zone (join with a zone topic), and raising an alert if no GPS event is received in 30 seconds (absence detection). The current consumer-based approach is becoming unmanageable. What is the root cause, and what is the recommended solution?",
    options: [
      {
        text: "The consumer is undersized. Increase the number of consumer instances and partition count to handle load.",
        explanation: "✗ Scaling partitions and consumer instances improves throughput, but does not add stateful capabilities. Rolling windows, stream joins, and absence detection require state management that the Kafka consumer API simply does not provide."
      },
      {
        text: "Kafka consumers do not natively support stateful operations like windowing, stream joins, or absence detection. The team should adopt Apache Flink or Kafka Streams as a dedicated stream processing framework.",
        explanation: "✓ The Kafka consumer API is designed for reading records — not for stateful computation. Windowed aggregations, stream joins, and timeout detection require a stream processing framework (Flink or Kafka Streams) with built-in state management, fault tolerance, and time semantics."
      },
      {
        text: "Use Kafka AdminClient to create additional intermediate topics for each computation, chaining multiple consumers.",
        explanation: "✗ Chaining consumers via intermediate topics is a manual workaround that recreates a stream processing framework from scratch — without fault tolerance, proper time semantics, or state management. This is exactly the anti-pattern the course warns against."
      },
      {
        text: "Switch from Kafka consumer to Kafka producer and push results to a separate analytics cluster.",
        explanation: "✗ Changing from consumer to producer inverts the data flow direction entirely. It does not add computational capabilities and makes no architectural sense for the described requirements."
      }
    ],
    answers: [1],
    globalExplanation: "The Kafka consumer API provides no native support for stateful operations. As soon as requirements include windowing, joins between streams, or temporal absence detection, the consumer code effectively becomes a fragile, custom-built stream processing framework. The correct solution is to delegate these operations to a purpose-built framework — Apache Flink or Kafka Streams — which handle state stores, fault tolerance, and time windowing natively."
  },
  {
    source: "cours",
    type: "single",
    question: "A data platform team at a logistics company is starting a new Apache Flink project to process shipment events in real time. The team has strong Java expertise. A team member proposes using the Flink DataStream API because it is 'the original Flink API.' The tech lead disagrees. Which Flink API should they use for the new project, and why?",
    options: [
      {
        text: "DataStream API — it is the most battle-tested API and offers the best performance for new Java projects.",
        explanation: "✗ While DataStream API is battle-tested, it is the LOWEST-LEVEL API and is not recommended for new projects. It requires more boilerplate, is harder to learn, and is less actively developed than the Table API."
      },
      {
        text: "Flink SQL — it is the only API that supports both streaming and batch processing.",
        explanation: "✗ Flink SQL does support both streaming and batch, but it is NOT the only API to do so. The Table API also supports both. Additionally, Flink SQL may not be ideal if the team prefers fluent Java code over SQL syntax."
      },
      {
        text: "Table API — it is the high-level, actively developed Java API recommended for new Flink projects, offering fluent method chains similar to SQL operations.",
        explanation: "✓ The Table API is the recommended choice for new Flink projects. It provides a high-level, fluent Java/Python interface with SQL-like method chaining (select, filter, join, groupBy), is actively developed, and is easier to learn than the DataStream API."
      },
      {
        text: "Kafka Streams — it is the preferred Java API for Flink projects using Kafka as a source.",
        explanation: "✗ Kafka Streams is a completely separate library from Apache Flink. It is part of Apache Kafka, not a Flink API. Recommending Kafka Streams when the question asks about a Flink API demonstrates a fundamental confusion between the two frameworks."
      }
    ],
    answers: [2],
    globalExplanation: "Apache Flink offers three APIs: DataStream API (low-level, legacy — avoid for new projects), Table API (high-level Java/Python, actively developed — recommended), and Flink SQL (SQL syntax over streams). For new Java projects, the Table API is the recommended starting point. DataStream API should only be used when low-level control is required and the team has advanced Flink expertise."
  },
  {
    source: "cours",
    type: "multiple",
    question: "A data science team at a financial institution needs to build a fraud detection pipeline entirely in SQL. They need to: (1) write pure SQL queries over a Kafka topic of transaction events, (2) call a custom Python scoring function to compute fraud probability for each transaction, and (3) detect duplicate transactions across a 10-minute window. Which TWO Flink capabilities enable these requirements?",
    options: [
      {
        text: "Flink SQL — allows writing stream processing pipelines using standard SQL syntax directly over Kafka topics.",
        explanation: "✓ Flink SQL enables pure SQL queries over Kafka topics treated as streaming tables. It supports windowing (for duplicate detection) and all standard SQL operators — satisfying requirements (1) and (3)."
      },
      {
        text: "User-Defined Functions (UDFs) in Flink SQL — callable from SQL, implemented in Python or Java, enabling custom logic like a fraud scoring model.",
        explanation: "✓ Flink SQL supports UDFs implemented in Python or Java that can be called directly from SQL queries. This enables the custom Python fraud scoring function (requirement 2) to be integrated into the SQL pipeline."
      },
      {
        text: "Kafka Streams DSL — provides a Java API that generates SQL queries from method chains.",
        explanation: "✗ Kafka Streams has no SQL interface and does not generate SQL. It is a separate Java library for building stream processing topologies via a DSL — unrelated to Flink SQL capabilities."
      },
      {
        text: "Flink DataStream API — the recommended API for UDFs when SQL performance is insufficient.",
        explanation: "✗ DataStream API is a low-level Java programming model, not recommended for new projects. UDFs in Flink SQL do not require dropping down to DataStream API — they are natively supported via the UDF registration mechanism."
      }
    ],
    answers: [0, 1],
    globalExplanation: "Flink SQL is the correct tool for pure SQL stream processing over Kafka. User-Defined Functions (UDFs) extend Flink SQL with custom logic (Python or Java) callable from SQL queries. Together they cover all three requirements: SQL pipelines over Kafka, custom Python scoring, and windowed duplicate detection. This combination is a frequently tested Flink scenario on the CCDAK exam."
  },
  {
    source: "cours",
    type: "single",
    question: "A startup's engineering team builds real-time recommendation features using Kafka. They are evaluating Apache Flink versus Kafka Streams. Their requirements are: the team writes exclusively in Java, they operate at moderate traffic volumes (~50,000 events/second), they do not want to manage a separate cluster, and they want to embed the processing logic inside their existing Spring Boot microservices. Which framework best fits their requirements?",
    options: [
      {
        text: "Apache Flink — it supports Java and can be embedded in Spring Boot applications without a separate cluster.",
        explanation: "✗ Flink is designed to run on a dedicated Flink cluster (or managed service). While it can be run in local mode for development, production deployments require a separate Flink cluster, contradicting the 'no separate cluster' requirement."
      },
      {
        text: "Kafka Streams — it is a Java library embedded directly in the application, requires no separate cluster, and is ideal for small to medium scale workloads.",
        explanation: "✓ Kafka Streams is a Java library (jar) that runs embedded inside any Java application, including Spring Boot. It requires NO separate cluster — just a Kafka cluster. It is explicitly designed for small-to-medium scale, matching the 50,000 events/second requirement."
      },
      {
        text: "Flink SQL — it supports Java through its SQL API and can be embedded in existing applications without infrastructure.",
        explanation: "✗ Flink SQL requires a Flink runtime cluster to execute SQL jobs. It is not an embeddable library in the same way as Kafka Streams — it requires deploying and managing a Flink JobManager and TaskManagers."
      },
      {
        text: "Kafka Streams — but only if the team migrates from Spring Boot to a standalone Java main() application.",
        explanation: "✗ Kafka Streams integrates seamlessly with Spring Boot (and there is even a Spring for Apache Kafka project). No migration away from Spring Boot is required. Kafka Streams is just a library dependency."
      }
    ],
    answers: [1],
    globalExplanation: "Kafka Streams is the correct choice when the team is Java-based, works at small-to-medium scale, and wants to avoid managing a separate processing cluster. It is a library that embeds into any Java application (including Spring Boot). Apache Flink targets much larger scales and requires a dedicated cluster, making it overkill for this scenario."
  },
  {
    source: "cours",
    type: "single",
    question: "A fraud detection team builds a Kafka Streams application that must detect when a customer makes more than 5 transactions within a fixed 15-minute period. Each 15-minute window must be completely independent — no transaction can appear in more than one window. The windows must start and end at fixed intervals (e.g., 00:00–00:15, 00:15–00:30). Which Kafka Streams window type should they use?",
    options: [
      {
        text: "Hopping Window with size=15 minutes and advance=5 minutes, so transactions are captured in overlapping windows.",
        explanation: "✗ Hopping windows OVERLAP — a transaction near the window boundary would appear in MULTIPLE windows (e.g., a transaction at 00:14:59 appears in both the 00:00–00:15 and the 00:10–00:25 windows). This violates the 'no transaction in more than one window' requirement."
      },
      {
        text: "Tumbling Window with size=15 minutes — fixed, non-overlapping windows where each transaction belongs to exactly one window.",
        explanation: "✓ Tumbling windows are fixed-size and non-overlapping. Each 15-minute window is completely independent, starts immediately when the previous ends, and every transaction belongs to exactly ONE window. This perfectly matches the fraud detection requirement."
      },
      {
        text: "Session Window with inactivity gap=15 minutes — windows close after 15 minutes of customer inactivity.",
        explanation: "✗ Session windows are dynamically sized based on activity gaps between events. They do NOT start at fixed intervals and their size varies per customer. A customer with no gap between transactions would have a single very large window, not fixed 15-minute periods."
      },
      {
        text: "Sliding Window with time difference=15 minutes — windows advance for every new event.",
        explanation: "✗ Sliding windows overlap based on the time difference between records. Every new record creates a new window anchored around it, meaning a transaction at 00:14 and one at 00:01 would share a 15-minute sliding window. This violates the 'fixed independent intervals' requirement."
      }
    ],
    answers: [1],
    globalExplanation: "Tumbling windows are the correct choice for fixed, non-overlapping time intervals where each event belongs to exactly one window. They start at fixed calendar boundaries and end after the configured size. Hopping windows overlap, session windows are activity-based, and sliding windows advance per record — none satisfy the 'fixed, non-overlapping, exclusive membership' requirement."
  },
  {
    source: "cours",
    type: "single",
    question: "A payment processing company runs a Kafka Streams application that maintains a running balance per account using a persistent state store. After a crash, the application takes 45 minutes to recover because it replays the entire input topic from the beginning. The SRE team needs to reduce recovery time to under 5 minutes without losing any state. What is the recommended approach?",
    options: [
      {
        text: "Switch to in-memory state stores to eliminate disk I/O and speed up state rebuilding.",
        explanation: "✗ In-memory state stores are lost on crash and must be FULLY rebuilt from the changelog topic or input topic. This would make recovery WORSE (full rebuild every time), not better. Persistent stores are the correct choice for fast recovery."
      },
      {
        text: "Store the Kafka Streams application state on a persistent volume. On restart, only the delta (missing state since last flush) needs to be restored from the changelog topic.",
        explanation: "✓ Persistent volumes allow Kafka Streams to checkpoint state to durable disk. On restart, the state is loaded from the local checkpoint on disk, and only the delta (records produced to the changelog topic since the last flush) needs to be restored from Kafka — dramatically reducing recovery time."
      },
      {
        text: "Set auto.offset.reset=earliest on the Kafka Streams consumer to ensure all records are replayed from the beginning on restart.",
        explanation: "✗ auto.offset.reset=earliest causes the consumer to start from the beginning of the topic — which is exactly the current behavior causing the 45-minute recovery. This property would worsen the problem, not solve it."
      },
      {
        text: "Increase the number of Streams instances to parallelize state rebuilding across multiple nodes.",
        explanation: "✗ Adding more instances distributes tasks but does not eliminate the need to replay the input topic to rebuild state. Without persistent state stores, each instance still needs to rebuild its assigned partitions from scratch."
      }
    ],
    answers: [1],
    globalExplanation: "Persistent state stores (backed by RocksDB) combined with persistent volumes are the best-practice solution for fast Kafka Streams recovery. State is checkpointed to disk at regular intervals. On restart, the local disk snapshot is loaded first, and only the incremental delta (from the changelog Kafka topic) is replayed — reducing recovery from a full topic replay to a small delta restore."
  },
  {
    source: "cours",
    type: "single",
    question: "A fintech company builds a Kafka Streams application that joins a stream of payment authorization events with a stream of merchant risk scores. Both streams are co-partitioned on merchant_id. The team needs to match payment authorizations with the corresponding risk score received within the last 10 minutes. Which join type and configuration should they use?",
    options: [
      {
        text: "KTable-to-KTable inner join (non-windowed) — risk scores are stable reference data and KTable-to-KTable joins require no time window.",
        explanation: "✗ Payment authorization events are not a changelog stream appropriate for KTable. KTable-to-KTable joins work when BOTH sides represent the latest state per key — not when one side is a continuous event stream that needs a time-bounded join."
      },
      {
        text: "KStream-to-KTable join (non-windowed) with the risk score stream as the KTable — only the latest risk score per merchant is matched.",
        explanation: "✗ This works if only the LATEST risk score should be joined with each authorization. However, if risk scores change and the team needs to match authorizations with risk scores received WITHIN the last 10 minutes specifically (not just the latest), a windowed KStream-to-KStream join is more appropriate."
      },
      {
        text: "KStream-to-KStream windowed inner join with a 10-minute window — both streams are event streams that need time-bounded matching.",
        explanation: "✓ Both payment authorizations and risk scores are event streams (KStream). To match events within a 10-minute time window, a windowed KStream-to-KStream inner join is correct. The window bounds which risk score events can be joined with each authorization."
      },
      {
        text: "KStream-to-GlobalKTable join (non-windowed) — GlobalKTable eliminates the co-partitioning requirement and holds the latest risk score.",
        explanation: "✗ GlobalKTable holds only the LATEST value per key (no time window). If the requirement is to match records within a 10-minute window (not just the latest), GlobalKTable cannot satisfy the temporal constraint. Also, since both topics are already co-partitioned, GlobalKTable's main advantage (no co-partitioning) is not needed."
      }
    ],
    answers: [2],
    globalExplanation: "When both sides of a join are unbounded event streams and a time-bounded match is required, a windowed KStream-to-KStream join is the correct choice. Both authorization events and risk score events are independent events (KStream), and the 10-minute window bounds which events can be matched. KTable-based joins only expose the LATEST value per key — inappropriate when temporal matching within a window is required."
  },
  {
    source: "cours",
    type: "single",
    question: "An e-commerce platform maintains a Kafka topic called `product-prices` where each record represents the latest price for a given product_id. New records for the same product_id overwrite the previous price. A Kafka Streams application needs to enrich an order event stream by looking up the current price for each ordered product. Which abstraction should the developer use for the `product-prices` topic and what type of join should they perform?",
    options: [
      {
        text: "Read product-prices as a KStream, then perform a windowed KStream-to-KStream inner join with the order stream.",
        explanation: "✗ A KStream processes every record as an independent event. Multiple records for the same product_id would be treated as separate events, not as price updates. A windowed join would only match prices recorded within the window, missing prices set outside the window."
      },
      {
        text: "Read product-prices as a KTable, then perform a non-windowed KStream-to-KTable join to look up the current price per product_id for each order event.",
        explanation: "✓ A KTable represents the LATEST value per key — exactly what a price changelog topic provides. A non-windowed KStream-to-KTable join looks up the current (latest) price for each order's product_id at the time the order arrives. This is the canonical pattern for enriching a stream with reference data."
      },
      {
        text: "Read product-prices as a KStream, then perform a non-windowed KStream-to-KStream join — non-windowed stream joins do not require time bounds.",
        explanation: "✗ KStream-to-KStream joins are ALWAYS windowed in Kafka Streams. Non-windowed KStream-to-KStream joins do not exist — they would require retaining all records from both streams indefinitely."
      },
      {
        text: "Read product-prices as a GlobalKTable and perform a windowed join to match prices within the last 24 hours.",
        explanation: "✗ GlobalKTable joins are non-windowed — they look up the current (latest) value, not records within a time window. Applying a windowed join on a GlobalKTable is not possible in the Kafka Streams DSL."
      }
    ],
    answers: [1],
    globalExplanation: "A compacted changelog topic where each record represents the LATEST value per key maps naturally to a KTable in Kafka Streams. KStream-to-KTable joins are non-windowed and look up the current state of the KTable at join time — the canonical pattern for stream enrichment with reference/lookup data. The KTable always holds the latest value per key, making it perfect for current price lookups."
  },
  {
    source: "cours",
    type: "single",
    question: "A healthcare company's Kafka Streams application must process patient monitoring events and guarantee that each vital sign reading is processed exactly once — no duplicates, no data loss — even if a Kafka broker fails during processing. The CTO asks the engineering team what single configuration change is required to achieve this guarantee. What is the correct answer?",
    options: [
      {
        text: "Set enable.idempotence=true on the Kafka producer used by the Streams application.",
        explanation: "✗ enable.idempotence=true prevents duplicate records produced by a single producer due to retries, but it does NOT provide end-to-end exactly-once semantics for the read-process-write cycle of a Kafka Streams application. The consumer read offset and producer write must be atomically committed together."
      },
      {
        text: "Set processing.guarantee=exactly_once in the Kafka Streams configuration.",
        explanation: "✓ This is the correct and complete answer. Setting processing.guarantee=exactly_once enables Kafka transactions in Kafka Streams, ensuring that the consumer offset commit and producer record write are atomic. No code changes are needed — only this configuration property change."
      },
      {
        text: "Set acks=all and min.insync.replicas=2 on all output topics used by the Streams application.",
        explanation: "✗ acks=all with min.insync.replicas=2 ensures DURABILITY (records survive broker failures) but does NOT provide exactly-once semantics. A record could still be written twice if the producer retries without idempotence or transactions."
      },
      {
        text: "Set isolation.level=read_committed on the Kafka Streams consumer to filter out uncommitted records.",
        explanation: "✗ isolation.level=read_committed filters out records from uncommitted transactions on the READ side, but does not make the Streams application WRITE transactionally. Without processing.guarantee=exactly_once, the application still writes without transactions."
      }
    ],
    answers: [1],
    globalExplanation: "Kafka Streams provides built-in exactly-once semantics via the processing.guarantee=exactly_once configuration. This enables transactional read-process-write: the consumer offset commit and producer writes are wrapped in a Kafka transaction, ensuring atomic delivery. The default value is at_least_once — this default is a frequent exam trap. No code changes are required."
  },
  {
    source: "cours",

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {

    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;

}

  } else {
    setTimeout(function() { showScore(); }, 1500);
  }
}

function pickOption(idx) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'multiple') {
    var pos = selected.indexOf(idx);
    if (pos === -1) selected.push(idx);
    else selected.splice(pos, 1);
  } else {
    selected = [idx];
  }
  paintButtons();
  document.getElementById('btnValidate').disabled = selected.length === 0;
}

function valider() {
  if (answered || selected.length === 0) return;
  answered = true;
  recordScore();
  paintAnswered();
}

function recordScore() {
  var q = QUESTIONS[qIdx];
  var ans = q.answers;
  var isCorrect = false;
  if (selected.length === ans.length) {
    var ok = true;
    for (var i = 0; i < ans.length; i++) {
      if (selected.indexOf(ans[i]) === -1) { ok = false; break; }
    }
    isCorrect = ok;
  }
  if (isCorrect) score++;
  if (q.source === 'cours') {
    scoresCours.total++;
    if (isCorrect) scoresCours.correct++;
  } else {
    scoresInfer.total++;
    if (isCorrect) scoresInfer.correct++;
  }
}

function paintButtons() {
  var q = QUESTIONS[qIdx];
  for (var i = 0; i < q.options.length; i++) {
    var btn = document.getElementById('opt_' + i);
    if (!btn) continue;
    btn.className = 'option-btn';
    if (selected.indexOf(i) !== -1) btn.className += ' selected';
  }
}

function paintAnswered() {
  var q = QUESTIONS[qIdx];
  for (var i = 0; i < q.options.length; i++) {
    var btn = document.getElementById('opt_' + i);
    var expl = document.getElementById('expl_' + i);
    if (!btn) continue;
    btn.disabled = true;
    btn.className = 'option-btn';
    var isAns = q.answers.indexOf(i) !== -1;
    var isSel = selected.indexOf(i) !== -1;
    if (isAns && isSel) {
      btn.className += ' correct';
      if (expl) expl.className = 'opt-expl show expl-ok';
    } else if (!isAns && isSel) {
      btn.className += ' wrong';
      if (expl) expl.className = 'opt-expl show expl-ko';
    } else if (isAns && !isSel) {
      btn.className += ' missed';
      if (expl) expl.className = 'opt-expl show expl-missed';
    } else {
      if (expl) expl.className = 'opt-expl show expl-neutral';
    }
  }
  var ge = document.getElementById('globalExpl');
  if (ge) ge.className = 'global-expl show';
  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
}

function suivante() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) { showScore(); return; }
  selected = [];
  answered = false;
  render();
}

function recommencer() {
  qIdx = 0; selected = []; answered = false;
  score = 0;
  scoresCours = { correct: 0, total: 0 };
  scoresInfer = { correct: 0, total: 0 };
  timeLeft = totalTime;
  shuffleAll();
  render();
  startGlobalTimer();
}

var LETTERS = ['A','B','C','D','E'];

function render() {
  var q = QUESTIONS[qIdx];
  var pct = Math.round((qIdx / QUESTIONS.length) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('headerSub').textContent = 'Q' + (qIdx + 1) + ' / ' + QUESTIONS.length;

  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">📜 From the course</span>'
    : '<span class="badge badge-inference">🔍 Beyond the course</span>';
  var typeBadge = q.type === 'multiple'
    ? '<span class="badge badge-multi">Multiple answers</span>'
    : '<span class="badge badge-single">Single answer</span>';

  var optHTML = '<ul class="options-list">';
  for (var i = 0; i < q.options.length; i++) {
    optHTML += '<li class="option-wrap">'
      + '<button class="option-btn" id="opt_' + i + '" onclick="pickOption(' + i + ')">'
      + '<span class="opt-letter">' + LETTERS[i] + '</span>'
      + '<span>' + q.options[i].text + '</span>'
      + '</button>'
      + '<div class="opt-expl" id="expl_' + i + '">' + q.options[i].explanation + '</div>'
      + '</li>';
  }
  optHTML += '</ul>';

  var geHTML = '<div class="global-expl" id="globalExpl">'
    + '<h4>💡 Key Concept</h4>'
    + '<p>' + q.globalExplanation + '</p>'
    + '</div>';

  document.getElementById('quizArea').innerHTML =
    '<div class="q-meta"><span class="q-num">Question ' + (qIdx+1) + ' of ' + QUESTIONS.length + '</span></div>'
    + '<div class="badges">' + typeBadge + srcBadge + '</div>'
    + '<div class="q-text">' + q.question + '</div>'
    + optHTML
    + '<div class="actions">'
    + '<button class="btn-validate" id="btnValidate" onclick="valider()" disabled>Validate</button>'
    + '<button class="btn-next" id="btnNext" onclick="suivante()" disabled>Next question →</button>'
    + '</div>'
    + geHTML;
}

function showScore() {
  clearInterval(timerInterval);
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('headerSub').textContent = 'Results';
  var pct = Math.round((score / QUESTIONS.length) * 100);
  var color = pct >= 80 ? '#27ae60' : pct >= 60 ? '#f39c12' : '#e74c3c';
  var msg = pct >= 80
    ? '🎉 Excellent! You are ready for the CCDAK exam.'
    : pct >= 60
    ? '👍 Good work! A few more revision sessions recommended.'
    : '📚 Keep studying — you are making progress!';
  var timeUsed = totalTime - timeLeft;
  var avgTime = QUESTIONS.length > 0 ? Math.round(timeUsed / QUESTIONS.length) : 0;

  document.getElementById('quizArea').innerHTML =
    '<div class="score-screen">'
    + '<h2>' + score + ' / ' + QUESTIONS.length + ' &mdash; ' + pct + '%</h2>'
    + '<p class="score-msg">' + msg + '</p>'
    + '<div class="score-bar-wrap"><div class="score-bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>'
    + '<div class="score-detail">'
    + '<div class="score-box blue"><div class="lbl">📜 From the course</div><div class="val">' + scoresCours.correct + '/' + scoresCours.total + '</div><div class="sub">Direct course questions</div></div>'
    + '<div class="score-box purple"><div class="lbl">🔍 Beyond the course</div><div class="val">' + scoresInfer.correct + '/' + scoresInfer.total + '</div><div class="sub">Inferred CCDAK questions</div></div>'
    + '<div class="score-box"><div class="lbl">Global score</div><div class="val">' + pct + '%</div><div class="sub">CCDAK passing threshold: ~75%</div></div>'
    + '<div class="score-box orange"><div class="lbl">⏱ Avg time / question</div><div class="val">' + avgTime + 's</div><div class="sub">90s allocated per question</div></div>'
    + '</div>'
    + '<button class="btn-restart" onclick="recommencer()">🔄 Restart the test</button>'
    + '</div>';
}

shuffleAll();
render();
startGlobalTimer();
</script>
</body>
</html>
