        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background: <script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'multiple',q:'Which information is stored in Kafka’s <code>__consumer_offsets</code> topic? Select two.',opts:[{t:'The latest committed offset for each consumer group, topic, and partition.',c:true},{t:'The live list of consumers currently in each consumer group.',c:false},{t:'Offset commit records keyed by group, topic, and partition.',c:true},{t:'The last produced message for each topic partition.',c:false},{t:'The earliest committed offset for each consumer group.',c:false}],exp:{key:'<code>__consumer_offsets</code> stores committed offsets and group metadata records. The most important exam concept is committed offsets per group/topic/partition.',correct:['Committed offsets allow consumers to resume after restarts.','The offset commit key includes group, topic, and partition, so it identifies the group-partition offset being stored.'],wrong:['The live membership list is coordinated by the group coordinator, not simply stored as a static list.','Produced messages are stored in their own topic partitions.','Kafka stores the current committed offset, not a historical earliest committed offset.'],tip:'Offset commits are group-scoped, not individual-consumer scoped.'}},
    {type:'single',q:'Two consumers C1 and C2 in the same group subscribe to T1, T2, and T3. Each topic has 4 partitions. With the Range Assignor, how many partitions will each consumer get?',opts:[{t:'C1: 6 partitions, C2: 6 partitions.',c:true},{t:'C1: 4 partitions, C2: 8 partitions.',c:false},{t:'C1: 2 partitions from each topic, C2: 2 partitions from each topic.',c:true},{t:'C1: 1 partition from each topic, C2: 3 partitions from each topic.',c:false}],exp:{key:'Range assignment is applied per topic. With 4 partitions and 2 consumers, each consumer gets 2 partitions per topic.',correct:['Across 3 topics, each consumer gets 2 partitions × 3 topics = 6 partitions. Option A and option C describe the same correct distribution.'],wrong:['The 4/8 and 1/3-per-topic distributions are not balanced for this case.'],tip:'Range Assignor can be balanced per topic but may create imbalance across consumers when subscriptions differ.'}},
    {type:'single',q:'Four consumers C1, C2, C3, C4 subscribe to T1 and T2. T1 has 3 partitions and T2 has 2 partitions. With Round Robin Assignor, which consumer receives T1 partition 2?',opts:[{t:'C1',c:false},{t:'C2',c:false},{t:'C3',c:true},{t:'C4',c:false}],exp:{key:'Round Robin Assignor distributes topic partitions sequentially across consumers.',correct:['With partitions ordered as T1-0, T1-1, T1-2, T2-0, T2-1, T1-2 is assigned to the third consumer, C3.'],wrong:['C1, C2, and C4 do not receive T1-2 in the standard ordered round-robin example.'],tip:'Round Robin is about spreading partitions across consumers, not contiguous ranges per topic.'}},
    {type:'single',q:'Three consumers C1, C2, C3 consume topic T with 10 partitions using the Sticky Assignor. If C1 leaves, what happens?',opts:[{t:'All partitions are reassigned evenly from scratch.',c:false},{t:'C2 and C3 keep existing partitions as much as possible, and C1’s partitions are reassigned.',c:true},{t:'All partitions are randomly reassigned.',c:false},{t:'C1’s partitions remain unassigned.',c:false}],exp:{key:'Sticky assignment tries to preserve existing assignments while still balancing the group.',correct:['When C1 leaves, its partitions must move, but C2 and C3 should retain as many existing partitions as possible.'],wrong:['Full random or full-from-scratch reassignment causes unnecessary movement.','Partitions from a departed consumer cannot remain unassigned if active consumers are available.'],tip:'Sticky Assignor minimizes partition movement during rebalances.'}},
    {type:'single',q:'A Kafka Streams app receives <code>OffsetOutOfRange</code> on an input partition. What is the most typical recovery behavior?',opts:[{t:'Reset according to the configured reset policy, commonly to earliest for full rebuild/replay.',c:true},{t:'Always reset to latest and skip missing data.',c:false},{t:'Always shut down immediately.',c:false},{t:'Ignore that partition forever.',c:false}],exp:{key:'Offset out of range means the requested offset is no longer available, often because retention deleted old records.',correct:['Kafka Streams recovery depends on configuration and state, but resetting to earliest is a common safe answer when the goal is to rebuild from available input data.'],wrong:['Latest can skip data and is not universally recommended.','Shutdown is not the only possible action.','Ignoring the partition causes permanent data loss for that input.'],tip:'Offset reset policy matters: earliest replays available data; latest skips to new data.'}},
    {type:'single',q:'A consumer reads a topic whose message values are JSON. Which consumer property is most directly relevant?',opts:[{t:'<code>key.deserializer=JsonDeserializer</code>',c:false},{t:'<code>value.deserializer=JsonDeserializer</code>',c:true},{t:'<code>key.deserializer=StringDeserializer</code>',c:false},{t:'<code>value.deserializer=StringDeserializer</code>',c:false}],exp:{key:'Kafka consumers deserialize keys and values separately.',correct:['If the message value is JSON and you want objects, configure the value deserializer accordingly.'],wrong:['The key format is not specified.','StringDeserializer may be used if you want raw JSON strings, but for JSON object deserialization the value JsonDeserializer is the direct answer.'],tip:'Key format and value format are independent.'}},
    {type:'single',q:'A consumer wants to read from a specific topic partition. Which API should it use?',opts:[{t:'<code>KafkaConsumer.subscribe(String topic, int partition)</code>',c:false},{t:'<code>KafkaConsumer.assign(Collection&lt;TopicPartition&gt; partitions)</code>',c:true},{t:'<code>KafkaConsumer.subscribe(Collection&lt;TopicPartition&gt; partitions)</code>',c:false},{t:'<code>KafkaConsumer.assign(String topic, int partition)</code>',c:false}],exp:{key:'Manual partition assignment uses <code>assign()</code> with <code>TopicPartition</code> objects.',correct:['<code>assign(Collection&lt;TopicPartition&gt;)</code> explicitly binds a consumer to specific partitions.'],wrong:['<code>subscribe()</code> is for topic subscription and group-managed assignment.','The listed String-topic/int-partition overloads are not the correct API.'],tip:'Subscribe = group assignment. Assign = manual partitions.'}},
    {type:'single',q:'What happens if a consumer is assigned a partition that does not exist?',opts:[{t:'It ignores the missing partition and continues normally.',c:false},{t:'It receives an error/exception for the invalid topic or partition.',c:true},{t:'It creates the partition automatically.',c:false},{t:'It waits forever until the partition is created.',c:false}],exp:{key:'Consumers cannot create partitions and cannot fetch from invalid partition IDs.',correct:['The application should handle errors such as unknown topic/partition or invalid assignment.'],wrong:['Ignoring invalid partitions is not normal behavior.','Consumers do not create partitions.','Waiting forever is not the expected API behavior.'],tip:'Validate topic metadata before manual assignment.'}},
    {type:'single',q:'Can a consumer dynamically change its manually assigned partitions without restarting?',opts:[{t:'Yes, by calling <code>subscribe()</code> with new topics.',c:false},{t:'Yes, by calling <code>assign()</code> with a new set of partitions.',c:true},{t:'No, assignment is fixed at startup.',c:false},{t:'No, assignment is fixed for the consumer lifetime.',c:false}],exp:{key:'Manual assignment can be changed by calling <code>assign()</code> again.',correct:['Calling <code>assign()</code> with a new set replaces the consumer’s manual assignment.'],wrong:['<code>subscribe()</code> switches to group-managed subscription semantics, not manual partition replacement.','Assignment is not fixed for the full lifetime.'],tip:'Do not mix subscribe and assign in the same consumer workflow.'}},
    {type:'single',q:'A consumer in a group crashes and restarts. Where does it resume?',opts:[{t:'From the last committed offset for each assigned partition.',c:true},{t:'Always from the earliest available offset.',c:false},{t:'Always from the latest available offset.',c:false},{t:'Always with a completely new set of partitions.',c:false}],exp:{key:'Committed offsets are the recovery point for consumer groups.',correct:['After restart and rebalance, the consumer resumes from committed offsets for partitions it receives.'],wrong:['Earliest/latest only apply when no committed offset exists or the committed offset is invalid, depending on <code>auto.offset.reset</code>.','Partition assignments may or may not change depending on group state and assignor.'],tip:'Committed offset = restart position.'}},
    {type:'single',q:'What happens when a new consumer joins an existing consumer group?',opts:[{t:'It starts from earliest for all partitions.',c:false},{t:'It starts from latest for all partitions.',c:false},{t:'A rebalance assigns it partitions; it consumes from committed offsets for those partitions.',c:true},{t:'It waits until some future rebalance unrelated to joining.',c:false}],exp:{key:'Joining a group triggers a rebalance.',correct:['After assignment, the new member starts from the committed offsets for its assigned partitions.'],wrong:['Earliest/latest are fallback behaviors when committed offsets are absent or invalid.','The join itself is a rebalance event.'],tip:'Group membership change = rebalance.'}},
    {type:'single',q:'What is the purpose of <code>group.id</code> in a Kafka consumer?',opts:[{t:'Identify the individual consumer instance.',c:false},{t:'Identify the consumer group the consumer belongs to.',c:true},{t:'Identify the Kafka cluster.',c:false},{t:'Identify the partitions to read from.',c:false}],exp:{key:'<code>group.id</code> is the logical consumer group identifier.',correct:['Consumers with the same <code>group.id</code> cooperate and divide partitions. Different group IDs receive independent copies of the stream.'],wrong:['Individual members get separate member IDs.','Cluster and partition selection use other settings/APIs.'],tip:'Same group = share work. Different groups = independent consumption.'}},
    {type:'single',q:'What is the default behavior of <code>auto.offset.reset</code> in modern Kafka consumers?',opts:[{t:'Start from earliest if no committed offset exists.',c:false},{t:'Start from latest if no committed offset exists.',c:true},{t:'Throw an exception by default.',c:false},{t:'Wait for a committed offset.',c:false}],exp:{key:'The default consumer value is <code>latest</code>. It is used when no committed offset exists or the committed offset is out of range.',correct:['By default, a new group starts at the latest offset, meaning it consumes only new records produced after it starts.'],wrong:['Earliest must be configured explicitly.','<code>none</code> is the setting that causes an exception when no offset exists.','Kafka does not wait for an offset to appear.'],tip:'Default <code>auto.offset.reset=latest</code>. Use <code>earliest</code> for full replay.'}},
    {type:'single',q:'What happens when <code>enable.auto.commit=false</code> and the consumer calls <code>commitSync()</code>?',opts:[{t:'It commits offsets the application chooses/current consumer positions synchronously.',c:true},{t:'It commits fetched but unprocessed messages automatically.',c:false},{t:'It throws because auto commit is disabled.',c:false},{t:'It waits for the next batch before committing.',c:false}],exp:{key:'Disabling auto commit means the application performs commits manually.',correct:['<code>commitSync()</code> synchronously commits offsets, either current consumed positions or explicitly supplied offsets. Applications should call it only after processing records.'],wrong:['Kafka cannot know what your application has actually processed unless you commit at the right time.','Manual commits are allowed when auto commit is disabled.','It does not wait for the next batch by itself.'],tip:'Best practice: process first, then commit the next offset to read.'}},
    {type:'single',q:'What is the purpose of <code>isolation.level</code> in Kafka consumers?',opts:[{t:'Control visibility of transactional messages.',c:true},{t:'Set maximum records per batch.',c:false},{t:'Control partition reassignment behavior.',c:false},{t:'Set read consistency for replica quorum reads.',c:false}],exp:{key:'<code>isolation.level</code> controls whether consumers can see uncommitted transactional records.',correct:['<code>read_committed</code> hides aborted/uncommitted transactional messages. <code>read_uncommitted</code> reads them.'],wrong:['Batch size uses settings such as <code>max.poll.records</code>.','Reassignment uses group protocol/assignors.','Kafka consumers read from leaders; this setting is transaction visibility.'],tip:'Transactions on the consumer side = <code>isolation.level</code>.'}},
    {type:'single',q:'What happens if multiple threads call <code>poll()</code> on the same <code>KafkaConsumer</code> simultaneously?',opts:[{t:'The consumer automatically coordinates threads.',c:false},{t:'It always throws <code>ConcurrentModificationException</code>.',c:false},{t:'Behavior is unsafe/undefined and may cause errors.',c:true},{t:'Kafka serializes all calls safely.',c:false}],exp:{key:'<code>KafkaConsumer</code> is not thread-safe.',correct:['A single consumer instance should be used by one thread at a time. Concurrent access can corrupt state or trigger errors.'],wrong:['KafkaConsumer does not coordinate multi-threaded polling for you.','A specific exception type is not guaranteed.','Calls are not automatically serialized safely.'],tip:'One consumer instance, one polling thread.'}},
    {type:'single',q:'What is the recommended approach for concurrent processing using Kafka consumers?',opts:[{t:'Share one consumer among many polling threads.',c:false},{t:'Use multiple consumer instances, each in its own thread.',c:true},{t:'Always process from one consumer with no worker handoff.',c:false},{t:'Synchronize all access to one shared consumer as the main scaling strategy.',c:false}],exp:{key:'Kafka consumer instances are not thread-safe, but consumer groups scale through multiple consumers.',correct:['Multiple consumer instances in the same group can process different partitions in parallel.'],wrong:['Sharing one consumer for concurrent poll calls is unsafe.','Worker pools can be used carefully after polling, but the consumer itself should remain single-threaded.','Locks may avoid corruption but do not provide the best scaling model.'],tip:'Scale consumption by partitions + consumers.'}},
    {type:'single',q:'How does Kafka balance processing across multiple consumers in a group?',opts:[{t:'It assigns equal numbers of messages to each consumer.',c:false},{t:'It assigns partitions to consumers using the configured partition assignor.',c:true},{t:'It dynamically shifts partitions based on CPU load.',c:false},{t:'It relies on ZooKeeper to distribute messages.',c:false}],exp:{key:'Kafka balances at the partition level, not per-message load level.',correct:['Assignors such as Range, RoundRobin, Sticky, and CooperativeSticky determine partition ownership.'],wrong:['Kafka does not assign individual messages across consumers in one group.','Kafka does not automatically load-balance by CPU.','Modern consumer groups are broker-coordinated, not ZooKeeper-driven.'],tip:'One partition is consumed by at most one consumer in a group at a time.'}},
    {type:'single',q:'What is the primary benefit of Kafka zero-copy optimization?',opts:[{t:'Reduce memory and CPU overhead by avoiding unnecessary data copies.',c:true},{t:'Eliminate serialization and deserialization.',c:false},{t:'Encrypt data during transfer.',c:false},{t:'Increase parallelism by using all CPU cores.',c:false}],exp:{key:'Zero-copy allows Kafka to transfer bytes efficiently from filesystem/page cache to network sockets.',correct:['Avoiding extra user-space copies reduces CPU and memory overhead and improves throughput.'],wrong:['Serialization/deserialization still exist at producers/consumers.','Security is handled by TLS/SASL, not zero-copy.','Parallelism is a separate topic.'],tip:'Zero-copy = fewer copies, higher throughput.'}},
    {type:'single',q:'What is the default value of consumer <code>isolation.level</code>?',opts:[{t:'<code>read_uncommitted</code>',c:true},{t:'<code>read_committed</code>',c:false},{t:'<code>transactional</code>',c:false},{t:'<code>none</code>',c:false}],exp:{key:'Kafka consumers read uncommitted transactional data by default.',correct:['Default <code>read_uncommitted</code> means aborted transaction records may be returned.'],wrong:['Use <code>read_committed</code> explicitly to hide aborted/uncommitted transactional data.','<code>transactional</code> and <code>none</code> are not valid values.'],tip:'Default: <code>read_uncommitted</code>.'}},
    {type:'single',q:'A consumer with <code>isolation.level=read_committed</code> reaches records from an open transaction. What happens?',opts:[{t:'It reads them immediately.',c:false},{t:'It does not make them visible until the transaction commits.',c:true},{t:'It skips them permanently.',c:false},{t:'It throws and stops.',c:false}],exp:{key:'Read-committed consumers only expose committed transactional data.',correct:['Records from ongoing transactions are withheld until commit; aborted records are not returned.'],wrong:['Immediate read is <code>read_uncommitted</code> behavior.','They are not permanently skipped if the transaction commits.','An open transaction is not itself an error.'],tip:'Read committed may add latency near open transactions.'}},
    {type:'single',q:'What is the purpose of <code>max.poll.records</code>?',opts:[{t:'Maximum number of records returned in one poll.',c:true},{t:'Maximum data per second.',c:false},{t:'Maximum partitions to subscribe to.',c:false},{t:'Maximum consumers in a group.',c:false}],exp:{key:'<code>max.poll.records</code> limits records returned from each <code>poll()</code>.',correct:['It controls batch size from the application’s perspective. Default is commonly 500.'],wrong:['Throughput and subscription limits use other controls.','It does not cap group size.'],tip:'Tune it with processing time and <code>max.poll.interval.ms</code> in mind.'}},
    {type:'single',q:'How does <code>max.poll.interval.ms</code> affect consumer behavior?',opts:[{t:'Maximum wait before polling new records.',c:false},{t:'Maximum interval between polls before the consumer is considered failed for group management.',c:true},{t:'Maximum time before committing offsets.',c:false},{t:'Maximum records per poll.',c:false}],exp:{key:'<code>max.poll.interval.ms</code> protects the group from consumers that stop polling for too long.',correct:['If processing takes too long without another poll, the consumer can be removed from the group and partitions reassigned.'],wrong:['It is not the long-poll wait timeout.','It does not directly control commits.','Record count is <code>max.poll.records</code>.'],tip:'Long processing? Increase interval or reduce batch size.'}},
    {type:'single',q:'What happens when a consumer exceeds <code>max.poll.interval.ms</code>?',opts:[{t:'Its partitions may be revoked and reassigned during rebalance.',c:true},{t:'It must manually rejoin before any rebalance can happen.',c:false},{t:'Its committed offsets are rolled back.',c:false},{t:'It is permanently banned from the group.',c:false}],exp:{key:'The group coordinator treats the consumer as failed for progress purposes.',correct:['The group rebalances and assigns its partitions to active members. The slow consumer may later rejoin.'],wrong:['Offsets are not rolled back.','The consumer is not permanently removed.'],tip:'Poll interval failures cause rebalances and duplicate processing risk if offsets were not committed.'}},
    {type:'single',q:'What triggers a consumer group rebalance?',opts:[{t:'Adding any new topic to the Kafka cluster.',c:false},{t:'Changing a topic replication factor.',c:false},{t:'Adding a new consumer to the group.',c:true},{t:'Changing to a different <code>group.id</code>.',c:false}],exp:{key:'Rebalances happen when group membership or subscribed topic partitions change.',correct:['A new consumer joining the same group changes membership and triggers assignment.'],wrong:['Unrelated topics do not rebalance a group.','Replication factor changes do not directly rebalance consumers.','Changing <code>group.id</code> creates/uses a different group, not a rebalance of the old one.'],tip:'Membership change = rebalance.'}},
    {type:'single',q:'What happens to partition assignments during a consumer group rebalance?',opts:[{t:'Partitions are redistributed among active consumers according to the assignor.',c:true},{t:'Partitions are assigned based on group ID text.',c:false},{t:'Partitions are randomly assigned.',c:false},{t:'Partitions are assigned based only on topic name.',c:false}],exp:{key:'The partition assignor computes ownership among active group members.',correct:['Kafka uses configured assignors to distribute partitions and maintain group progress.'],wrong:['Group ID identifies the group, not the assignment algorithm.','Assignment is deterministic based on metadata and assignor, not random.','Topic name alone is not enough.'],tip:'Assignor decides distribution: Range, RoundRobin, Sticky, CooperativeSticky.'}},
    {type:'single',q:'How can you minimize the impact of consumer group rebalances?',opts:[{t:'Increase session timeout only.',c:false},{t:'Reduce partitions only.',c:false},{t:'Use only a custom assignor.',c:false},{t:'Use static group membership with <code>group.instance.id</code>.',c:true}],exp:{key:'Static membership helps consumers keep identity across restarts.',correct:['With <code>group.instance.id</code>, short restarts can avoid full disruptive rebalances and preserve assignments better.'],wrong:['Timeout tuning can reduce false failures but does not preserve member identity.','Reducing partitions reduces parallelism.','Custom assignors can help but are more complex and not the standard answer.'],tip:'Static membership is a key rebalance-minimization feature.'}},
    {type:'single',q:'When a consumer wants to read data from a specific partition, what information is needed?',opts:[{t:'Topic name and consumer group ID.',c:false},{t:'Topic name and offset only.',c:false},{t:'Topic name, partition number, and offset/position to read from.',c:true},{t:'Topic name, partition number, and group ID only.',c:false}],exp:{key:'A fetch is addressed to a specific topic partition and starts from an offset.',correct:['The topic, partition, and fetch offset identify what data to read.'],wrong:['Group ID is not enough to identify a fetch position.','Topic and offset without partition is incomplete.'],tip:'Kafka ordering and offsets are per partition.'}},
    {type:'single',q:'How does a consumer determine which broker to contact for a specific partition?',opts:[{t:'It contacts any bootstrap broker for metadata, then fetches from the partition leader.',c:true},{t:'It asks ZooKeeper directly.',c:false},{t:'It uses round-robin broker selection for every fetch.',c:false},{t:'It connects to all brokers simultaneously for the partition.',c:false}],exp:{key:'Kafka clients bootstrap through brokers and use metadata to find partition leaders.',correct:['The client can connect to any bootstrap broker, request metadata, then send fetches to the leader broker for that partition.'],wrong:['Consumers do not query ZooKeeper directly.','Fetches are not random round-robin if a specific leader owns the partition.','They do not need all brokers for one partition fetch.'],tip:'Bootstrap broker gives metadata; leader broker serves partition data.'}},
    {type:'single',q:'What happens if a consumer fetches from a partition that does not exist?',opts:[{t:'Broker creates the partition automatically.',c:false},{t:'Consumer gets an empty response.',c:false},{t:'Consumer receives an error indicating the partition does not exist.',c:true},{t:'Consumer is assigned a different partition automatically.',c:false}],exp:{key:'Invalid partitions are errors.',correct:['The broker returns an error such as unknown topic/partition or invalid partition.'],wrong:['Consumers do not auto-create partitions.','An empty response would mean no data at a valid offset, not invalid partition.','Kafka does not silently redirect the consumer.'],tip:'Use metadata APIs like <code>partitionsFor()</code> to validate partitions.'}},
    {type:'single',q:'When committing offsets, what offset should a consumer commit?',opts:[{t:'The last processed offset.',c:false},{t:'The next offset to process for each partition, scoped to the consumer group.',c:true},{t:'The individual consumer ID and last processed offset.',c:false},{t:'The individual consumer ID and next offset.',c:false}],exp:{key:'Kafka commits the next offset to read, not the last processed record offset.',correct:['After processing record offset N, commit N+1 for that partition. Commits are stored for the consumer group.'],wrong:['Saying “last processed offset” is a common off-by-one mistake.','Offsets are group-scoped, not individual-consumer scoped.'],tip:'Commit next offset. Process 42 → commit 43.'}},
    {type:'single',q:'A consumer commits offset N for a partition and crashes before processing the next message. Where will it resume?',opts:[{t:'At committed offset N, which is the next offset to read.',c:true},{t:'At N+1 automatically.',c:false},{t:'At the beginning of the partition.',c:false},{t:'Always on a different partition.',c:false}],exp:{key:'Committed offsets represent the next record to consume.',correct:['If the committed offset is N, restart begins from N. This is why applications commit N+1 after processing N.'],wrong:['N+1 would skip offset N.','Beginning only applies if there is no valid committed offset and reset policy says earliest.','Partition assignment is independent of this offset rule.'],tip:'Committed offset is a pointer to the next message.'}},
    {type:'single',q:'What is the purpose of <code>enable.auto.commit</code>?',opts:[{t:'Automatically commit offsets at configured intervals when enabled.',c:false},{t:'Commit after every individual message.',c:false},{t:'Enable or disable automatic offset commits.',c:true},{t:'Limit number of offsets per commit request.',c:false}],exp:{key:'<code>enable.auto.commit</code> controls whether the consumer commits offsets automatically.',correct:['When true, offsets are committed periodically according to <code>auto.commit.interval.ms</code>. When false, the app commits manually.'],wrong:['Option A describes behavior when enabled, but the property purpose is enabling/disabling auto commits.','It does not commit after every message.','It does not control request size.'],tip:'Auto commit is simple but gives less control over processing guarantees.'}},
    {type:'single',q:'A topic has RF=3 and <code>min.insync.replicas=2</code>. A consumer reads from a partition with only one ISR member, the leader. What happens?',opts:[{t:'The consumer can still read from the leader if it is available.',c:true},{t:'The consumer fails with <code>NotEnoughReplicasException</code>.',c:false},{t:'The consumer receives an empty response.',c:false},{t:'The request waits until another replica rejoins ISR.',c:false}],exp:{key:'<code>min.insync.replicas</code> affects writes with <code>acks=all</code>, not normal reads.',correct:['Consumers read from the leader. If the leader is available, reads can succeed even when ISR count is below min ISR.'],wrong:['Not enough replicas is a produce-side durability error.','Low ISR does not imply empty data.','Reads do not wait for min ISR.'],tip:'min ISR protects durable writes, not ordinary consumer fetches.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Kafka consumers, offsets, and rebalances.';else if(pct>=70)msg='Solid result; review offset commits, assignors, poll intervals, and transaction visibility.';else msg='Needs review: focus on consumer groups, committed offsets, assign vs subscribe, and rebalance behavior.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
