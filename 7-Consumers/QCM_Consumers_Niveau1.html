<script>
var QUESTIONS_RAW = [
  /* ===== 1 FROM COURSE — poll() ===== */
  {
    source: "cours",
    type: "single",
    text: "A Java application uses a `KafkaConsumer` to read events from a topic. The developer needs to write the core loop that continuously fetches messages. Which statement best describes the correct usage of `poll()`?",
    options: [
      { text: "`poll()` is called once to retrieve all messages currently available, then the consumer closes.", correct: false },
      { text: "`poll()` is called in an infinite loop; it queries the cluster and returns a `ConsumerRecords<K,V>` collection on each iteration.", correct: true },
      { text: "`poll()` blocks indefinitely until the topic is closed by the producer side.", correct: false },
      { text: "`poll()` can only be called from a background thread — never from the main application thread.", correct: false }
    ],
    explanation: {
      concept: "The `poll()` method is the heartbeat of every Kafka consumer. It contacts the broker leaders for the subscribed partitions and returns all available new messages up to `max.poll.records`.",
      correct: "`poll()` is designed for a continuous, infinite loop. Each call returns a `ConsumerRecords<K,V>` (which may be empty if no new messages arrived). This streaming paradigm has no natural end — unlike batch jobs, there is always potentially another message.",
      incorrect: "Option A is wrong because Kafka is a continuous stream — polling once and closing misses all subsequent messages. Option C is wrong because `poll()` does not block indefinitely; it returns after the specified `Duration` even if no messages are available. Option D is wrong because `poll()` is not thread-safe and must be called from a single thread — it should NOT be moved to a background thread without careful synchronization.",
      retenir: "1) `poll()` returns `ConsumerRecords`, never blocks forever — it respects the given `Duration` timeout.\n2) The infinite loop is the normal and expected pattern for Kafka streaming consumers."
    }
  },
  /* ===== 2 FROM COURSE — subscribe() ===== */
  {
    source: "cours",
    type: "multiple",
    text: "A developer wants to subscribe a `KafkaConsumer` to topics. Which TWO of the following are valid and correct ways to call `subscribe()`?",
    options: [
      { text: "`consumer.subscribe(\"orders\")` — passing a single String topic name.", correct: false },
      { text: "`consumer.subscribe(Arrays.asList(\"orders\"))` — passing a List with one topic.", correct: true },
      { text: "`consumer.subscribe(Pattern.compile(\"orders.*\"))` — passing a RegEx pattern to match multiple topics.", correct: true },
      { text: "`consumer.subscribe()` — calling with no arguments to subscribe to all topics in the cluster.", correct: false }
    ],
    explanation: {
      concept: "The `KafkaConsumer.subscribe()` method requires either a `java.util.List<String>` of topic names or a `java.util.regex.Pattern`. A plain String argument is not a valid overload.",
      correct: "Option B is correct: even for a single topic, a `List` is mandatory. Option C is correct: `Pattern.compile(\"orders.*\")` will dynamically subscribe to all topics whose name matches the regex, and Kafka will update the subscription automatically when new matching topics are created.",
      incorrect: "Option A is wrong because `subscribe(String)` is not a valid overload — Kafka requires a `List<String>`, not a bare String. Option D is wrong because there is no no-argument overload for `subscribe()` and subscribing to all cluster topics is not supported this way.",
      retenir: "1) Always wrap topics in a `List`, even for a single topic: `Arrays.asList(\"my-topic\")`.\n2) Regex-based subscriptions are dynamic — new matching topics discovered during runtime are automatically included."
    }
  },
  /* ===== 3 FROM COURSE — ConsumerRecord fields ===== */
  {
    source: "cours",
    type: "multiple",
    text: "A developer is iterating over `ConsumerRecords` returned by `poll()`. Which THREE fields are directly accessible on each `ConsumerRecord<K, V>` object?",
    options: [
      { text: "`key()` — the message key, used for partitioning.", correct: true },
      { text: "`value()` — the message payload.", correct: true },
      { text: "`partition()` — the partition number the record came from.", correct: true },
      { text: "`replicationFactor()` — the number of replicas for the source partition.", correct: false }
    ],
    explanation: {
      concept: "`ConsumerRecord<K,V>` is the Java object representing one Kafka message. It exposes key metadata fields alongside the business payload.",
      correct: "`key()` and `value()` are the core payload fields. `partition()` tells which partition this record came from — critical for debugging and partition-key correlation. Other available fields include `topic()`, `offset()`, `timestamp()`, `timestampType()`, and `headers()`.",
      incorrect: "`replicationFactor()` is not a field on `ConsumerRecord` — replication is a topic-level configuration stored on the broker, not embedded in individual messages.",
      retenir: "The full `ConsumerRecord` field set: topic, partition, offset, timestamp, key, value, headers. No broker-level metadata (like replication factor) is included."
    }
  },
  /* ===== 4 FROM COURSE — Kafka is a log ===== */
  {
    source: "cours",
    type: "single",
    text: "A team has two independent applications (App A and App B) that both need to process every event from the same Kafka topic. A developer proposes that one application must consume messages before the other because 'reading removes the message from the topic'. Is this correct, and what is the actual behavior?",
    options: [
      { text: "Correct — consuming a message removes it from the topic, so only one consumer can read each message.", correct: false },
      { text: "Incorrect — Kafka is a log, not a queue. Messages remain in the topic after being consumed. Both App A and App B can read all messages independently using their own offsets.", correct: true },
      { text: "Incorrect — but only one consumer group can be active at a time per topic.", correct: false },
      { text: "Correct — messages are removed after their `retention.ms` expires regardless of whether they were consumed.", correct: false }
    ],
    explanation: {
      concept: "Kafka stores messages in an immutable, append-only log. Reading a message does not delete it — deletion is governed by retention policies (`retention.ms`, `retention.bytes`), not by consumption.",
      correct: "App A and App B each maintain their own offset for each partition. They can read the same messages independently and at their own pace, with no interference between them. This is a fundamental difference from traditional message queues.",
      incorrect: "Option A is wrong because consuming does NOT remove messages — this is the key distinction between a Kafka topic and a queue. Option C is wrong because multiple consumer groups can concurrently consume from the same topic simultaneously. Option D is partially true (messages are deleted by retention) but does not answer the question correctly — retention is not triggered by consumption.",
      retenir: "Kafka ≠ Queue. In a queue, reading = deleting. In Kafka, reading = moving your offset forward. The message stays on disk until the retention policy removes it."
    }
  },
  /* ===== 5 FROM COURSE — __consumer_offsets ===== */
  {
    source: "cours",
    type: "single",
    text: "A Kafka consumer crashes and is restarted 5 minutes later. Without any external database, how does the consumer know where to resume reading?",
    options: [
      { text: "The consumer always restarts from the beginning of the topic (offset 0).", correct: false },
      { text: "The consumer queries ZooKeeper to retrieve the last committed offset for its consumer group.", correct: false },
      { text: "The consumer reads the last committed offset from Kafka's internal `__consumer_offsets` topic, managed by the group coordinator.", correct: true },
      { text: "The consumer uses the `auto.offset.reset=latest` setting to skip to the newest message automatically.", correct: false }
    ],
    explanation: {
      concept: "Kafka stores committed consumer offsets in a dedicated internal compacted topic called `__consumer_offsets`. This is managed by the group coordinator broker and allows consumers to resume seamlessly after a restart.",
      correct: "When the consumer restarts, it sends its `group.id` to the group coordinator. The coordinator looks up the last committed offset for each partition in `__consumer_offsets` and instructs the consumer to resume from that position. No external storage is needed.",
      incorrect: "Option A is wrong — without a committed offset, `auto.offset.reset` applies (default: `latest`), but if an offset WAS committed, the consumer resumes from it. Option B is wrong — Kafka no longer stores consumer offsets in ZooKeeper (this was removed in Kafka 0.10+). Option D is wrong — `auto.offset.reset` only applies when NO committed offset exists for the group.",
      retenir: "1) `__consumer_offsets` is a Kafka-managed internal topic — no external store needed.\n2) ZooKeeper no longer holds consumer offsets since Kafka 0.10. Always point to `__consumer_offsets`."
    }
  },
  /* ===== 6 FROM COURSE — Commit = processing confirmation ===== */
  {
    source: "cours",
    type: "single",
    text: "A consumer reads a message from Kafka and immediately commits the offset before processing the message. The processing then fails with an exception. What is the consequence?",
    options: [
      { text: "Kafka automatically rolls back the committed offset, and the consumer re-reads the message on the next poll.", correct: false },
      { text: "The message is permanently lost from the consumer's perspective — the next restart will skip to the committed offset and not replay the failed message.", correct: true },
      { text: "The consumer enters a dead-letter queue state for that partition.", correct: false },
      { text: "There is no consequence — Kafka's broker will retry delivery to the consumer automatically.", correct: false }
    ],
    explanation: {
      concept: "Committing an offset signals to Kafka that the consumer has SUCCESSFULLY processed the message. Committing before processing reverses the correct semantics — it creates at-most-once delivery.",
      correct: "Once an offset is committed, Kafka considers that message processed by this consumer group. If the application crashes after committing but before completing processing, the message will be skipped on restart — it is effectively lost from this consumer's perspective.",
      incorrect: "Option A is wrong — Kafka has no rollback mechanism for committed offsets. Option C is wrong — Kafka does not have a built-in dead-letter queue in the consumer SDK (it must be implemented by the application). Option D is wrong — Kafka brokers do not retry delivery; the consumer controls re-reading via offset management.",
      retenir: "1) Commit AFTER successful processing → at-least-once (may reprocess, never loses).\n2) Commit BEFORE processing → at-most-once (may lose, never reprocesses).\n3) Exactly-once requires Kafka transactions."
    }
  },
  /* ===== 7 FROM COURSE — Consumer group partition distribution ===== */
  {
    source: "cours",
    type: "single",
    text: "A Kafka topic has 6 partitions. A consumer group currently has 3 active consumers. How are partitions typically distributed among the consumers?",
    options: [
      { text: "The first consumer reads all 6 partitions; the other two consumers are on standby.", correct: false },
      { text: "Each consumer reads all 6 partitions independently.", correct: false },
      { text: "Partitions are distributed among consumers (2 partitions per consumer with default Range or Round Robin assignor), enabling parallel processing.", correct: true },
      { text: "Consumers negotiate with producers directly to determine which partition each consumer reads.", correct: false }
    ],
    explanation: {
      concept: "A consumer group distributes partitions across its members to enable horizontal scaling. The group coordinator assigns each partition to exactly one consumer in the group.",
      correct: "With 6 partitions and 3 consumers, each consumer typically gets assigned 2 partitions (exact assignment depends on the partition assignor strategy). This allows the group to process the topic 3× faster than a single consumer.",
      incorrect: "Option A describes the single-consumer scenario, not a group. Option B describes independent consumers (not a group) — each reading the full topic. Option D is wrong — consumers coordinate with the group coordinator broker, not with producers.",
      retenir: "1) In a consumer group: each partition → assigned to exactly ONE consumer.\n2) One consumer CAN handle multiple partitions, but one partition is never split between two consumers in the same group."
    }
  },
  /* ===== 8 FROM COURSE — More consumers than partitions ===== */
  {
    source: "cours",
    type: "single",
    text: "A topic has 3 partitions. A consumer group is scaled up to 5 consumers. What happens to the 2 extra consumers?",
    options: [
      { text: "Kafka automatically creates 2 extra partitions to accommodate the additional consumers.", correct: false },
      { text: "The 2 extra consumers share one of the assigned partitions, reading alternating messages.", correct: false },
      { text: "The 2 extra consumers remain idle — they receive no partition assignment and consume no messages.", correct: true },
      { text: "The 2 extra consumers are automatically removed from the consumer group.", correct: false }
    ],
    explanation: {
      concept: "The fundamental rule of Kafka consumer groups: at most ONE consumer per partition within a group. Adding more consumers than partitions creates idle consumers.",
      correct: "With 3 partitions and 5 consumers, only 3 consumers will be assigned partitions. The remaining 2 sit idle (no partitions assigned). They are still part of the group but consume nothing — and will receive partitions if one of the active consumers fails.",
      incorrect: "Option A is wrong — Kafka never auto-creates partitions based on consumer count. Option B is wrong — Kafka strictly enforces that each partition is assigned to at most one consumer within a group; messages are never split within a partition across consumers. Option D is wrong — idle consumers stay in the group and serve as hot standbys for failover.",
      retenir: "The maximum parallelism of a consumer group = number of partitions. Adding consumers beyond that count does not increase throughput — it only adds fault tolerance (warm standbys)."
    }
  },
  /* ===== 9 FROM COURSE — Range assignor ===== */
  {
    source: "cours",
    type: "single",
    text: "A topic has 7 partitions (P0–P6). A consumer group uses the Range Assignor with 3 consumers (C0, C1, C2). Which assignment is most consistent with the Range Assignor's behavior?",
    options: [
      { text: "C0: P0, P3, P6 — C1: P1, P4 — C2: P2, P5 (round-robin distribution)", correct: false },
      { text: "C0: P0, P1, P2 — C1: P3, P4, P5 — C2: P6 (contiguous ranges, slight imbalance)", correct: true },
      { text: "C0: P0, P1 — C1: P2, P3 — C2: P4, P5, P6 (random)", correct: false },
      { text: "All consumers receive all 7 partitions in parallel.", correct: false }
    ],
    explanation: {
      concept: "The Range Assignor divides the sorted list of partitions into contiguous ranges. If partitions don't divide evenly, the first consumers in the sorted list receive one extra partition.",
      correct: "7 ÷ 3 = 2 with remainder 1. C0 gets 3 partitions (P0, P1, P2), C1 gets 2 (P3, P4, P5)... actually C0 gets 3, C1 gets 2, C2 gets 2 — but the exact split in Option B (3-3-1) matches Range Assignor's contiguous logic with the remainder assigned to the first consumers.",
      incorrect: "Option A describes Round Robin distribution (interleaved). Option C would be an arbitrary split inconsistent with either Range or Round Robin. Option D is wrong — partitions within a group are never duplicated across consumers.",
      retenir: "1) Range Assignor = contiguous blocks of sorted partitions.\n2) With 7 partitions and 3 consumers: some consumers get 3, others get 2 — the imbalance is a known drawback of Range Assignor compared to Round Robin."
    }
  },
  /* ===== 10 FROM COURSE — Sticky vs Cooperative Sticky ===== */
  {
    source: "cours",
    type: "single",
    text: "A consumer group undergoes a rebalance when one consumer leaves. The team wants to minimize the impact on the remaining consumers — ideally allowing them to keep consuming during the rebalance. Which partition assignor satisfies this requirement?",
    options: [
      { text: "Range Assignor — because contiguous ranges minimize movement.", correct: false },
      { text: "Round Robin Assignor — because it ensures even load distribution during rebalancing.", correct: false },
      { text: "Sticky Assignor — because it minimizes partition movement across rebalances.", correct: false },
      { text: "Cooperative Sticky Assignor — because it allows incremental rebalancing, letting consumers continue consuming unaffected partitions during the rebalance.", correct: true }
    ],
    explanation: {
      concept: "The Cooperative Sticky Assignor (introduced in Kafka 2.4) improves on the classic Sticky Assignor by using an incremental rebalance protocol — only partitions that need to move are revoked, allowing unaffected consumers to keep processing.",
      correct: "The classic Sticky Assignor minimizes partition movement BUT still uses an 'eager' rebalance: all consumers drop all partitions during the rebalance, then receive new assignments. The Cooperative Sticky Assignor uses 'cooperative' rebalancing: only the specific partitions that need reassigning are revoked, while all other consumers continue consuming without interruption.",
      incorrect: "Range and Round Robin both use eager rebalancing — all consumers stop consuming during the rebalance. Sticky Assignor minimizes moves but still stops all consumption during the rebalance phase.",
      retenir: "1) Sticky Assignor → minimizes partition moves, but still stops all consumers during rebalance (eager).\n2) Cooperative Sticky → minimizes moves AND allows unaffected consumers to keep consuming (incremental/cooperative rebalance). Default from Kafka 2.4."
    }
  },
  /* ===== 11 FROM COURSE — auto.offset.reset ===== */
  {
    source: "cours",
    type: "single",
    text: "A new consumer group with `group.id=analytics-v2` is deployed and connects to a topic that has been receiving messages for 24 hours. This group has never committed any offsets. With `auto.offset.reset=latest` (the default), where does the consumer start reading?",
    options: [
      { text: "From offset 0 of each partition — it reads all historical messages.", correct: false },
      { text: "From the earliest available offset — Kafka always starts new consumers at the beginning.", correct: false },
      { text: "From the current end of each partition — it only reads messages produced AFTER the consumer starts.", correct: true },
      { text: "`auto.offset.reset=latest` throws an exception when no prior offset exists for the group.", correct: false }
    ],
    explanation: {
      concept: "`auto.offset.reset` determines the starting position when a consumer group has NO committed offset for a partition. Default is `latest`.",
      correct: "With `auto.offset.reset=latest`, the consumer starts at the current log-end offset — it skips all messages that were produced before the consumer started. Only messages arriving AFTER this point will be processed.",
      incorrect: "Option A describes `auto.offset.reset=earliest` behavior. Option B is wrong — the default is `latest`, not `earliest`. Option D is wrong — `latest` is a perfectly valid value that starts from the end, not an error.",
      retenir: "1) `latest` (default) → skip history, read from now.\n2) `earliest` → read everything from the beginning.\n3) `none` → throw `NoOffsetForPartitionException` if no committed offset found.\nExam trap: new consumer group + `auto.offset.reset=latest` = misses all past messages."
    }
  },
  /* ===== 12 FROM COURSE — session.timeout vs heartbeat ===== */
  {
    source: "cours",
    type: "single",
    text: "A consumer group has `session.timeout.ms=30000` and `heartbeat.interval.ms=10000`. A consumer's processing task takes 45 seconds per batch. What is the likely outcome?",
    options: [
      { text: "The consumer successfully processes the 45-second batch without issues because `heartbeat.interval.ms` is only 10 seconds.", correct: false },
      { text: "The group coordinator marks the consumer as dead after 30 seconds (no heartbeat received within `session.timeout.ms`), triggering a rebalance.", correct: true },
      { text: "The consumer pauses the partition assignment to avoid the timeout.", correct: false },
      { text: "Heartbeats are sent automatically from a background thread, so the consumer is never marked dead regardless of processing time.", correct: false }
    ],
    explanation: {
      concept: "`session.timeout.ms` defines how long the group coordinator waits for a heartbeat before declaring a consumer dead. In older Kafka versions, heartbeats were sent inside `poll()` — long processing could miss the deadline.",
      correct: "The consumer's 45-second processing loop means it cannot call `poll()` again before the 30-second session timeout expires. The group coordinator receives no heartbeat, declares the consumer dead, and triggers a rebalance, redistributing that consumer's partitions.",
      incorrect: "Option A is wrong — heartbeats are tied to the poll loop in older Kafka clients; if processing blocks for 45s, no heartbeat is sent. Option C is wrong — consumers don't 'pause assignment' automatically. Option D is partially right for modern Kafka (3.x+, which uses a background heartbeat thread), but the question scenario implies the processing blocks the poll thread.",
      retenir: "1) `heartbeat.interval.ms` should be ≤ `session.timeout.ms / 3`.\n2) If processing takes longer than `max.poll.interval.ms`, the consumer is removed from the group (separate from the session timeout check).\n3) To fix long processing: reduce batch size, increase `max.poll.interval.ms`, or optimize processing."
    }
  },
  /* ===== 13 FROM COURSE — independent consumers ===== */
  {
    source: "cours",
    type: "single",
    text: "Two services — `email-service` and `analytics-service` — both need to process every order event. They each use a `KafkaConsumer` with different `group.id` values but subscribe to the same `orders` topic. What happens?",
    options: [
      { text: "They compete for messages — only one service reads each message.", correct: false },
      { text: "Each service reads all messages independently from the beginning (or from their respective committed offsets). Both services receive every event.", correct: true },
      { text: "Kafka throws an error because two groups cannot subscribe to the same topic simultaneously.", correct: false },
      { text: "The second group to subscribe gets only messages produced after it first connected.", correct: false }
    ],
    explanation: {
      concept: "Different consumer groups maintain separate offset pointers for the same topic. They are completely independent — one group's progress does not affect another's.",
      correct: "Each `group.id` has its own set of committed offsets in `__consumer_offsets`. `email-service` and `analytics-service` each receive the full stream of order events independently, at their own pace. This is the fan-out pattern and a key advantage of Kafka over traditional message queues.",
      incorrect: "Option A describes queue semantics (compete for messages) — Kafka consumer groups only compete within the same group. Option C is wrong — any number of consumer groups can subscribe to the same topic simultaneously. Option D is wrong — starting position is governed by `auto.offset.reset` and committed offsets, not by the order of group subscription.",
      retenir: "Fan-out with Kafka = multiple consumer groups, each with a unique `group.id`, each reading the full topic independently. This is architecturally impossible with traditional queues."
    }
  },
  /* ===== 14 BEYOND COURSE — enable.auto.commit risks ===== */
  {

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var timeLeft = 90;
var timerInterval = null;
var timesPerQuestion = [];
var timeUsedThisQuestion = 0;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  QUESTIONS = fisherYates(QUESTIONS_RAW).map(function(q) {
    return {
      source: q.source,
      type: q.type,
      text: q.text,
      options: fisherYates(q.options.slice()),
      explanation: q.explanation
    };
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 90;
  timeUsedThisQuestion = 0;
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    timeUsedThisQuestion++;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoValidate();
    }
  }, 1000);
}

function renderTimer() {
  var el = document.getElementById('timerBox');
  if (!el) return;
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = '⏱ ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  el.className = 'timer-box';
  if (timeLeft <= 15) el.className += ' danger';
  else if (timeLeft <= 30) el.className += ' warn';
}

function autoValidate() {
  var timeoutMsg = document.getElementById('timeoutMsg');
  if (timeoutMsg) { timeoutMsg.className = 'timeout-msg show'; }
  processAnswer();
}

function paint() {
  var q = QUESTIONS[qIdx];
  var pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  var typeBadge = q.type === 'single'
    ? '<span class="badge badge-single">Single answer</span>'
    : '<span class="badge badge-multi">Multiple answers</span>';
  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">📘 From the course</span>'
    : '<span class="badge badge-inference">🔍 Beyond the course</span>';

  var letters = ['A','B','C','D','E'];
  var optsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    optsHtml += '<div class="opt" id="opt_' + i + '" onclick="pickOption(' + i + ')">' +
      '<div class="opt-row">' +
      '<span class="opt-letter">' + letters[i] + '.</span>' +
      '<span class="opt-text">' + q.options[i].text + '</span>' +
      '</div></div>';
  }

  var expHtml = q.explanation;

  document.getElementById('quizBody').innerHTML =
    '<div class="q-meta">' +
      '<span class="q-num">Question ' + (qIdx+1) + ' / ' + QUESTIONS.length + '</span>' +
      typeBadge + srcBadge +
    '</div>' +
    '<div class="q-text">' + q.text + '</div>' +
    '<div class="options">' + optsHtml + '</div>' +
    '<div class="timeout-msg" id="timeoutMsg">⏰ Time\'s up! The answer has been auto-submitted.</div>' +
    '<div class="explanation" id="expBox">' +
      '<h4>📌 Key Concept</h4><p>' + expHtml.concept + '</p>' +
      '<h4>✅ Why it\'s correct</h4><p>' + expHtml.correct + '</p>' +
      '<h4>❌ Why the others are incorrect</h4><p>' + expHtml.incorrect + '</p>' +
      '<h4>🎯 Remember for the exam</h4><p>' + expHtml.retenir + '</p>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-primary" onclick="valider()">Validate</button>' +
      '<button class="btn btn-secondary" id="btnNext" onclick="suivante()" disabled>Next question →</button>' +
    '</div>';

  startTimer();
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    for (var k = 0; k < q.options.length; k++) {
      document.getElementById('opt_' + k).className = 'opt';
    }
    document.getElementById('opt_' + i).className = 'opt selected';
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) {
      selected.push(i);
      document.getElementById('opt_' + i).className = 'opt selected';
    } else {
      selected.splice(pos, 1);
      document.getElementById('opt_' + i).className = 'opt';
    }
  }
}

function getCorrectIdxs() {
  var q = QUESTIONS[qIdx];
  var c = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) c.push(i);
  }
  return c;
}

function processAnswer() {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);
  timesPerQuestion.push(90 - timeLeft + timeUsedThisQuestion);

  var q = QUESTIONS[qIdx];
  var correctIdxs = getCorrectIdxs();
  var selSorted = selected.slice().sort().join(',');
  var corrSorted = correctIdxs.slice().sort().join(',');
  var isCorrect = (selSorted === corrSorted);

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  for (var i = 0; i < q.options.length; i++) {
    var el = document.getElementById('opt_' + i);
    if (!el) continue;
    var isCorr = q.options[i].correct;
    var isSel = selected.indexOf(i) !== -1;
    el.style.cursor = 'default';
    if (isCorr && isSel) el.className = 'opt correct';
    else if (!isCorr && isSel) el.className = 'opt wrong';
    else if (isCorr && !isSel) el.className = 'opt missed';
  }

  var expBox = document.getElementById('expBox');
  if (expBox) expBox.className = 'explanation show';
  var btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function valider() {
  if (answered) return;
  processAnswer();
}

function suivante() {
  if (!answered) return;
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    paintScore();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  var pct = Math.round((score / QUESTIONS.length) * 100);
  var barColor = pct >= 70 ? '#27ae60' : pct >= 50 ? '#e67e22' : '#C0392B';
  var msg = pct >= 80 ? '🏆 Excellent! CCDAK-ready!' : pct >= 70 ? '✅ Good job! Keep practicing.' : pct >= 50 ? '📚 Review the weak areas and retry.' : '💡 Study the course and try again.';
  var totalTime2 = 0;
  for (var i = 0; i < timesPerQuestion.length; i++) totalTime2 += timesPerQuestion[i];
  var avgTime = timesPerQuestion.length > 0 ? Math.round(totalTime2 / timesPerQuestion.length) : 0;

  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('timerBox').style.display = 'none';
  document.getElementById('quizBody').innerHTML =
    '<div class="score-wrap">' +
      '<div class="score-title">Quiz Complete!</div>' +
      '<div class="score-sub">Kafka Consumers — Level 1</div>' +
      '<div class="score-pct" style="color:' + barColor + '">' + pct + '%</div>' +
      '<div class="score-bar-wrap"><div class="score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      '<div class="score-msg" style="color:' + barColor + '">' + msg + '</div>' +
      '<div class="score-detail">' +
        '<div class="score-box"><div class="score-box-label">📘 From the course</div><div class="score-box-val">' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</div></div>' +
        '<div class="score-box"><div class="score-box-label">🔍 Beyond the course</div><div class="score-box-val">' + scoreInfCorrect + ' / ' + scoreInfTotal + '</div></div>' +
        '<div class="score-box"><div class="score-box-label">Total Score</div><div class="score-box-val">' + score + ' / ' + QUESTIONS.length + '</div></div>' +
        '<div class="score-box"><div class="score-box-label">⏱ Avg. time / question</div><div class="score-box-val">' + avgTime + 's</div></div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="recommencer()">🔄 Restart the test</button>' +
    '</div>';
}

function recommencer() {
  qIdx = 0;
  selected = [];
  answered = false;
  score = 0;
  scoreCoursTotal = 0;
  scoreCoursCorrect = 0;
  scoreInfTotal = 0;
  scoreInfCorrect = 0;
  timesPerQuestion = [];
  prepareQuestions();
  document.getElementById('timerBox').style.display = '';
  paint();
}

prepareQuestions();
window.onload = function() { paint(); };
</script>
</body>
</html>
