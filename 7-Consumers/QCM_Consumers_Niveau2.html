<script>
var QUESTIONS_RAW = [
  /* ===== 1. FROM COURSE — Cooperative Sticky vs Sticky ===== */
  {
    source: "cours",
    type: "single",
    question: "A high-throughput e-commerce platform runs a consumer group with 20 consumers reading from a 60-partition orders topic. During peak sales events, new consumer instances are added dynamically to handle load. The team reports that every time a new consumer joins, ALL consumers stop processing for several seconds. Which partition assignment strategy eliminates this full-stop behavior?",
    options: [
      { text: "Sticky Assignor — it minimizes the number of partitions reassigned during rebalances.", explanation: "Incorrect. The Sticky Assignor minimizes partition movement but still uses eager rebalancing — all consumers revoke ALL their partitions at the start of each rebalance before receiving new assignments. This causes the full-stop behavior described.", correct: false },
      { text: "Range Assignor — its contiguous partition blocks make rebalancing faster.", explanation: "Incorrect. The Range Assignor uses eager rebalancing and assigns contiguous partition ranges. While the assignment itself is predictable, the eager stop-the-world behavior during rebalance is unchanged.", correct: false },
      { text: "Cooperative Sticky Assignor — it uses incremental rebalancing, allowing consumers to keep their unaffected partitions and continue consuming while only the partitions that need moving are revoked.", explanation: "Correct. The Cooperative Sticky Assignor implements incremental cooperative rebalancing (KIP-429). Only the partitions that must be reassigned are revoked; all other consumers continue processing their unaffected partitions. This eliminates the full-stop behavior and is the preferred assignor for production workloads.", correct: true },
      { text: "Round Robin Assignor — it distributes partitions evenly, reducing the number of movements needed during rebalance.", explanation: "Incorrect. Round Robin also uses eager rebalancing, meaning all consumers stop processing during a rebalance. While it achieves better load balance than Range Assignor, it does not address the stop-the-world problem.", correct: false }
    ],
    globalExplanation: "Kafka rebalance strategies split into 'eager' (stop-the-world: Range, Round Robin, Sticky) and 'cooperative' (incremental: Cooperative Sticky). The Cooperative Sticky Assignor, default since Kafka 2.4 via `partition.assignment.strategy`, is the only built-in strategy that allows consumers to continue processing unaffected partitions during rebalances, making it the right choice for latency-sensitive high-throughput workloads."
  },
  /* ===== 2. FROM COURSE — auto.offset.reset=earliest ===== */
  {
    source: "cours",
    type: "single",
    question: "A data analytics team deploys a new consumer group called `reporting-v3` to reprocess all historical events from the past 7 days stored in a Kafka topic. The topic's retention is 14 days. The group has never consumed from this topic before. Which `auto.offset.reset` value ensures the consumer reads all available historical messages from the beginning?",
    options: [
      { text: "`auto.offset.reset=latest` — the consumer will read all new messages including historical ones that arrive after startup.", explanation: "Incorrect. `latest` starts reading from the current end of the partition — messages produced BEFORE the consumer started are entirely skipped. This is the opposite of what the team needs.", correct: false },
      { text: "`auto.offset.reset=earliest` — when no committed offset exists, the consumer starts from the oldest available message in each partition.", explanation: "Correct. Since `reporting-v3` has no committed offsets, `auto.offset.reset` determines the starting position. `earliest` begins at the oldest retained offset (offset 0 or the earliest available if retention has expired some segments), allowing full replay of the 7-day history.", correct: true },
      { text: "`auto.offset.reset=none` — Kafka will automatically calculate the correct historical starting position.", explanation: "Incorrect. `auto.offset.reset=none` throws a `NoOffsetForPartitionException` when no committed offset is found. It does NOT auto-calculate a starting position — it fails fast to force explicit handling.", correct: false },
      { text: "Set `enable.auto.commit=true` — auto-commit will ensure the consumer replays from the beginning.", explanation: "Incorrect. `enable.auto.commit` controls whether offsets are committed automatically after polling; it has no influence on where the consumer starts reading when no prior offset exists.", correct: false }
    ],
    globalExplanation: "`auto.offset.reset` (default: `latest`) only takes effect when no committed offset exists for the consumer group on a partition. For full historical replay by a new consumer group, `earliest` is required. For production deployments where missing messages is unacceptable and a committed offset must always exist, `none` is used to fail loudly."
  },
  /* ===== 3. FROM COURSE — max.poll.records to fix long processing ===== */
  {
    source: "cours",
    type: "single",
    question: "A logistics platform's Kafka consumer is being evicted from its consumer group every few minutes. Investigation shows that each `poll()` returns 500 records (default `max.poll.records`) and processing each batch takes 7–8 minutes — exceeding `max.poll.interval.ms=300000` (5 minutes). The team wants to keep `max.poll.interval.ms` at 5 minutes. Which configuration change most directly fixes the eviction?",
    options: [
      { text: "Increase `session.timeout.ms` to 10 minutes to give the consumer more time before being declared dead.", explanation: "Incorrect. `session.timeout.ms` governs heartbeat-based failure detection — it is separate from `max.poll.interval.ms`. The eviction is caused by the interval between `poll()` calls exceeding `max.poll.interval.ms`, not by missing heartbeats.", correct: false },
      { text: "Reduce `max.poll.records` from 500 to a smaller value (e.g., 50) so each batch completes processing within 5 minutes.", explanation: "Correct. Reducing `max.poll.records` decreases the number of records per batch, directly reducing the time needed to process each batch. With 50 records at the current processing rate, each batch completes well within the 5-minute `max.poll.interval.ms` limit.", correct: true },
      { text: "Set `enable.auto.commit=false` to prevent offset commits from interfering with processing time.", explanation: "Incorrect. `enable.auto.commit` controls offset commit strategy, not processing duration. Disabling it does not reduce the number of records fetched per poll or speed up processing.", correct: false },
      { text: "Increase `fetch.max.bytes` to allow the broker to send larger batches, reducing the number of fetches needed.", explanation: "Incorrect. Increasing `fetch.max.bytes` would cause MORE records to be fetched per poll, making the processing time per batch LONGER and worsening the eviction problem.", correct: false }
    ],
    globalExplanation: "`max.poll.interval.ms` (default: 300,000ms) is a liveness signal — if `poll()` is not called within this interval, the consumer proactively leaves the group and triggers a rebalance. When processing is slow, the fix is to reduce the work per poll cycle using `max.poll.records`, not to increase the timeout (which would mask the problem and delay detection of truly stuck consumers)."
  },
  /* ===== 4. FROM COURSE — session.timeout.ms and heartbeat.interval.ms ===== */
  {
    source: "cours",
    type: "single",
    question: "A Kafka administrator is tuning a consumer group for a fraud detection system. They want the group coordinator to detect a failed consumer quickly — within 15 seconds. They also want to avoid false positives (unnecessary rebalances) from transient network hiccups. Which combination of `session.timeout.ms` and `heartbeat.interval.ms` best satisfies both constraints?",
    options: [
      { text: "`session.timeout.ms=15000`, `heartbeat.interval.ms=5000`", explanation: "Correct. `session.timeout.ms=15000` ensures a failed consumer is detected within 15 seconds. Setting `heartbeat.interval.ms` to 1/3 of the session timeout (5000ms) gives the consumer 3 heartbeat opportunities per session window — providing resilience against transient network drops while still failing fast on genuine consumer failures.", correct: true },
      { text: "`session.timeout.ms=15000`, `heartbeat.interval.ms=14000`", explanation: "Incorrect. With `heartbeat.interval.ms` nearly equal to `session.timeout.ms`, the consumer has only one heartbeat attempt per window. A single missed heartbeat due to a transient network blip would immediately trigger a rebalance — this creates false positives.", correct: false },
      { text: "`session.timeout.ms=5000`, `heartbeat.interval.ms=5000`", explanation: "Incorrect. Setting `heartbeat.interval.ms` equal to `session.timeout.ms` is invalid — the consumer needs to send heartbeats MORE frequently than the timeout window. This configuration would continuously trigger rebalances.", correct: false },
      { text: "`session.timeout.ms=60000`, `heartbeat.interval.ms=5000`", explanation: "Incorrect. This achieves good resilience against false positives, but a 60-second session timeout means failed consumers take up to 60 seconds to be detected — violating the 15-second detection requirement.", correct: false }
    ],
    globalExplanation: "The recommended rule is `heartbeat.interval.ms <= session.timeout.ms / 3`. This ensures the consumer has at least 3 heartbeat attempts within the session window, providing robustness against transient delays without sacrificing failure detection speed. The `session.timeout.ms` must also be within the broker's configured `group.min.session.timeout.ms` and `group.max.session.timeout.ms` bounds."
  },
  /* ===== 5. FROM COURSE — enable.auto.commit + crash → at-least-once ===== */
  {
    source: "cours",
    type: "single",
    question: "A payment processing service uses a Kafka consumer with `enable.auto.commit=true` and `auto.commit.interval.ms=5000`. The consumer reads 200 payment records from `poll()`, begins processing them, and crashes after 3 seconds — before the 5-second auto-commit fires. What happens when the consumer restarts?",
    options: [
      { text: "The consumer resumes from the record immediately after the last successfully processed payment — Kafka tracks processing state.", explanation: "Incorrect. Kafka tracks committed OFFSETS, not application processing state. The consumer's application logic is opaque to Kafka — Kafka only knows that no offset was committed for this batch.", correct: false },
      { text: "The consumer resumes from the committed offset prior to the crash and re-reads all 200 payment records, potentially causing duplicate payments.", explanation: "Correct. Auto-commit had not fired before the crash, so the committed offset still points to the start of the batch that was being processed. On restart, the consumer re-reads all 200 records from the last committed offset — providing at-least-once semantics.", correct: true },
      { text: "The consumer resumes from the very beginning of the topic (offset 0) because the uncommitted records are discarded.", explanation: "Incorrect. The consumer resumes from the LAST COMMITTED offset, not from the beginning. The last committed offset is from the previous successful auto-commit cycle, not offset 0.", correct: false },
      { text: "Kafka automatically discards the uncommitted batch and advances to the next available offset.", explanation: "Incorrect. Kafka does not discard uncommitted records — they remain in the topic. The consumer simply re-reads them starting from the last committed offset when it restarts.", correct: false }
    ],
    globalExplanation: "Auto-commit provides at-least-once delivery: if the consumer crashes between reading records and the auto-commit firing, those records will be re-delivered on restart. For payment systems where duplicates cause double-charges, this is unacceptable. Solutions include: (1) making the payment processing idempotent, (2) using manual `commitSync()` after processing each batch, or (3) using Kafka Transactions for exactly-once semantics."
  },
  /* ===== 6. FROM COURSE — group.initial.rebalance.delay.ms ===== */
  {
    source: "cours",
    type: "single",
    question: "A DevOps team deploys 50 consumer instances simultaneously for a new consumer group on a large Kafka cluster. They observe a 'rebalance storm': the group coordinator initiates multiple rapid successive rebalances as instances come online one by one, delaying actual consumption by 2–3 minutes. Which configuration helps reduce this initial rebalance cascade?",
    options: [
      { text: "Increase `session.timeout.ms` to 60 seconds to give all consumers time to join before the first rebalance.", explanation: "Incorrect. `session.timeout.ms` controls how long until a consumer is declared dead — increasing it delays failure detection, not the initial rebalance behavior during startup.", correct: false },
      { text: "Set `group.initial.rebalance.delay.ms` to a higher value (e.g., 10000ms) so the coordinator waits for more consumers to join before triggering the first rebalance.", explanation: "Correct. `group.initial.rebalance.delay.ms` (default: 3000ms) instructs the group coordinator to wait before starting the initial rebalance, allowing more consumers to join in a single batch. Increasing it for large deployments reduces the number of successive rebalances during startup.", correct: true },
      { text: "Set `partition.assignment.strategy` to Round Robin to ensure faster initial partition distribution.", explanation: "Incorrect. The assignment strategy determines HOW partitions are distributed, not WHEN the initial rebalance starts. Changing the strategy does not reduce the number of rebalance iterations during startup.", correct: false },
      { text: "Increase `max.poll.interval.ms` to allow more time between polls during the startup phase.", explanation: "Incorrect. `max.poll.interval.ms` is the maximum time between `poll()` calls before a consumer is evicted. It is unrelated to the initial group formation rebalance cascade.", correct: false }
    ],
    globalExplanation: "`group.initial.rebalance.delay.ms` is specifically designed for batch deployments where many consumers start simultaneously. By waiting longer before the first rebalance, the coordinator can include more consumers in the initial assignment, reducing the number of successive rebalances. In large deployments, tuning this to 10–15 seconds can dramatically reduce startup rebalance storms."
  },
  /* ===== 7. FROM COURSE — fan-out with multiple consumer groups ===== */
  {
    source: "cours",
    type: "single",
    question: "A streaming platform has a `user-events` topic. Three independent downstream services need to process every event: a real-time notification service, a data warehouse ingestion pipeline, and a fraud detection model. All three must receive every event without interference. What is the correct architecture?",
    options: [
      { text: "Create one consumer group with 3 consumers, one per service. Each consumer handles one-third of the partitions.", explanation: "Incorrect. In a single consumer group, each partition is assigned to only one consumer — the messages are split across the three services, not duplicated. Each service would receive only a subset of events.", correct: false },
      { text: "Use a separate consumer group for each service, each with a unique `group.id`. All three groups read the full topic independently.", explanation: "Correct. Different consumer groups maintain independent offset pointers for the same topic. Each group receives every event without affecting the others — this is the Kafka fan-out pattern. It is impossible with a traditional queue.", correct: true },
      { text: "Replicate the `user-events` topic to 3 separate topics — one per downstream service — using a MirrorMaker process.", explanation: "Incorrect. While technically possible, this creates unnecessary data duplication, operational complexity, and latency. Kafka's native multi-group fan-out is the correct and simpler solution for this use case.", correct: false },
      { text: "Set `max.poll.records=1` on a shared consumer so all three services receive each message synchronously.", explanation: "Incorrect. `max.poll.records=1` only limits records per poll — it does not enable multiple services to receive the same message. This would still require either separate consumer groups or an application-layer broadcast.", correct: false }
    ],
    globalExplanation: "Kafka's consumer group isolation is one of its key architectural advantages over traditional queues. Multiple consumer groups with different `group.id` values each maintain their own committed offsets for the same topic, allowing full, independent fan-out to multiple downstream systems. The topic data is never consumed destructively — each group reads the log independently at its own pace."
  },
  /* ===== 8. FROM COURSE — fetch.min.bytes for low-throughput topic ===== */
  {
    source: "cours",
    type: "single",
    question: "A monitoring system produces heartbeat events to a Kafka topic at a rate of 1 event every 10 seconds. The consumer is making over 100 `poll()` requests per minute, the vast majority of which return empty batches. This creates unnecessary network overhead and CPU load on the broker. Which configuration reduces empty fetch requests by instructing the broker to wait for meaningful data before responding?",
    options: [
      { text: "Reduce `max.poll.interval.ms` to 5000ms so the consumer polls less frequently.", explanation: "Incorrect. `max.poll.interval.ms` is the maximum gap between polls before a consumer is evicted — reducing it would cause more frequent polls, worsening the problem. Also, reducing it could evict consumers if processing takes too long.", correct: false },
      { text: "Set `fetch.min.bytes=512` so the broker accumulates at least 512 bytes of data before responding to a fetch request.", explanation: "Correct. `fetch.min.bytes` (default: 1 byte) tells the broker to hold the fetch response until at least the specified amount of data is available. For low-throughput topics, setting a higher value dramatically reduces the number of empty fetch responses.", correct: true },
      { text: "Increase `max.poll.records` from 500 to 5000 to batch more records per request.", explanation: "Incorrect. `max.poll.records` caps how many records are returned per poll — increasing it when there are rarely more than 1 record available does nothing to reduce empty polls.", correct: false },
      { text: "Set `max.partition.fetch.bytes=100` to minimize the size of each fetch response.", explanation: "Incorrect. `max.partition.fetch.bytes` caps the maximum data fetched per partition per request. Reducing it would limit throughput without reducing the frequency of fetch requests.", correct: false }
    ],
    globalExplanation: "`fetch.min.bytes` (default: 1) works in conjunction with `fetch.max.wait.ms` (default: 500ms): the broker will respond when EITHER the data threshold is met OR the wait timeout expires. For low-throughput topics, increasing `fetch.min.bytes` (e.g., to 1KB or more) reduces empty round-trips significantly, improving efficiency for both the consumer and the broker."
  },
  /* ===== 9. FROM COURSE — max.partition.fetch.bytes OOM ===== */
  {
    source: "cours",
    type: "single",
    question: "A consumer application is experiencing `OutOfMemoryError` during heavy load. Analysis shows the topic contains large binary messages (avg. 800KB each) and the consumer is fetching 1MB per partition (default `max.partition.fetch.bytes`). With 30 partitions assigned to this consumer, a single `poll()` can return up to 30MB of data. What is the most targeted fix?",
    options: [
      { text: "Reduce `max.poll.records` from 500 to 10 to limit the number of records per poll.", explanation: "Partially helpful, but `max.poll.records` caps the count of records, not the total byte size. With 800KB records, even 10 records = 8MB per poll, which may still cause OOM if the consumer has limited heap.", correct: false },
      { text: "Reduce `max.partition.fetch.bytes` from 1MB to a value that, multiplied by the number of assigned partitions, fits within the consumer's available heap memory.", explanation: "Correct. `max.partition.fetch.bytes` directly controls the maximum data fetched per partition per request. Reducing it limits the maximum batch size per partition, preventing the consumer from loading excessive data into memory at once.", correct: true },
      { text: "Increase the consumer's JVM heap size using `-Xmx` to accommodate the large fetches.", explanation: "Incorrect. Scaling the JVM heap is a workaround, not a fix. The underlying fetch configuration is pulling more data per poll than necessary. The correct approach is to tune `max.partition.fetch.bytes` to match the consumer's processing capacity.", correct: false },
      { text: "Set `fetch.max.bytes=1048576` to cap the total data fetched per request to 1MB.", explanation: "Incorrect. `fetch.max.bytes` (default: 50MB) caps the total data per fetch request across ALL partitions. 1MB shared across 30 partitions would severely limit throughput. `max.partition.fetch.bytes` is the correct per-partition control.", correct: false }
    ],
    globalExplanation: "Three fetch size parameters work in layers: (1) `max.partition.fetch.bytes` — per partition cap; (2) `fetch.max.bytes` — total cap per fetch request; (3) `max.poll.records` — count cap. For OOM caused by large messages, `max.partition.fetch.bytes` is the most targeted lever. As a formula: max memory per poll ≈ `max.partition.fetch.bytes` × number of assigned partitions. Always tune this based on the consumer's heap and average message size."
  },
  /* ===== 10. FROM COURSE — isolation.level=read_committed ===== */
  {
    source: "cours",
    type: "single",
    question: "A financial platform uses a Kafka producer with `transactional.id=payments-producer-1` to atomically write payment events across two topics. Some transactions are occasionally aborted due to downstream failures. A downstream consumer group is reading from these topics and processing aborted transaction data, causing incorrect financial calculations. What configuration change on the consumer side fixes this?",
    options: [
      { text: "Set `enable.auto.commit=false` and use manual `commitSync()` after each transaction boundary.", explanation: "Incorrect. Manual offset commits improve processing guarantees on the consumer side but do not filter out messages from aborted producer transactions. The consumer still reads all records regardless of their transaction status.", correct: false },
      { text: "Set `isolation.level=read_committed` on the consumer so it only reads messages from committed transactions, filtering out aborted records.", explanation: "Correct. `isolation.level=read_committed` instructs the Kafka broker to only return records from committed transactions (and non-transactional records). Messages written as part of an aborted transaction are invisible to the consumer, preventing incorrect processing of rolled-back data.", correct: true },
      { text: "Set `auto.offset.reset=none` on the consumer to stop it from reading uncommitted offsets.", explanation: "Incorrect. `auto.offset.reset` controls the starting position when no committed offset exists — it has nothing to do with transactional isolation or filtering aborted records.", correct: false },
      { text: "Configure `acks=all` on the producer to ensure all records are fully replicated before being visible to consumers.", explanation: "Incorrect. `acks=all` controls producer durability — it ensures writes are replicated to all ISRs, but it does not filter out records from aborted transactions. The consumer still sees all records with `isolation.level=read_uncommitted`.", correct: false }
    ],
    globalExplanation: "For end-to-end exactly-once semantics in Kafka, the producer uses `transactional.id` to write atomically, and consumers must use `isolation.level=read_committed` to only read committed transaction data. The default `read_uncommitted` causes consumers to read ALL records including those from aborted transactions, which can corrupt downstream state. This producer-consumer contract is a critical CCDAK exam topic."
  },
  /* ===== 11. FROM COURSE — client.rack for rack-aware assignment ===== */
  {
    source: "cours",
    type: "single",
    question: "A company runs a multi-datacenter Kafka deployment where brokers and consumers are spread across two racks: `rack-a` and `rack-b`. The team observes high inter-rack network costs because consumers on `rack-a` are frequently fetching data from partition replicas on `rack-b`. Which configuration enables consumers to prefer fetching from replicas in their own rack?",
    options: [
      { text: "Set `partition.assignment.strategy=RoundRobinAssignor` to distribute partitions evenly across racks.", explanation: "Incorrect. Round Robin distributes partition assignments to consumers but does not influence WHICH REPLICA the consumer fetches from. Fetch routing is independent of the assignment strategy.", correct: false },
      { text: "Set `client.rack` on each consumer to match the broker rack ID (e.g., `client.rack=rack-a` for consumers in rack-a). Pair with `replica.selector.class=RackAwareReplicaSelector` on the broker.", explanation: "Correct. `client.rack` tags the consumer with its datacenter/rack location. When combined with `RackAwareReplicaSelector` on the broker, Kafka routes fetch requests to the nearest replica in the same rack, minimizing cross-rack traffic and latency.", correct: true },

      { text: "The consumer resets to `auto.offset.reset=latest` since it can no longer track the previous leader's offsets.", explanation: "Incorrect. Offsets are partition-level metadata that persists independently of leader changes. The committed offset in `__consumer_offsets` remains valid after a leader election — the consumer resumes from the same position on the new leader.", correct: false }
    ],
    globalExplanation: "⚠️ This concept was not explicitly in the course but is frequently tested in the CCDAK exam. `NotLeaderOrFollowerException` is a retriable error — the Kafka consumer client handles it transparently by: (1) marking the cached metadata for that partition as stale; (2) sending a metadata request to any bootstrap broker; (3) updating the partition leader mapping; (4) retrying the fetch to the new leader. This is entirely invisible to the application code. Consumer offsets are durable through leader elections."
  },
  /* ===== 25. BEYOND COURSE — fetch.max.wait.ms with fetch.min.bytes ===== */
  {
    source: "inference",
    type: "single",
    question: "A consumer group processes sensor events from an IoT platform. The team sets `fetch.min.bytes=65536` (64KB) to reduce empty fetch requests. However, they notice that for some low-activity sensors, the consumer waits up to 30 seconds before receiving any messages. What additional configuration is causing this extended wait?",
    options: [
      { text: "`max.poll.interval.ms` is too high, causing the consumer to wait before polling again.", explanation: "Incorrect. `max.poll.interval.ms` is the maximum gap between `poll()` calls — it is a ceiling to prevent consumer eviction, not a wait timer that introduces artificial delays.", correct: false },
      { text: "`fetch.max.wait.ms` has been set to 30000ms (30 seconds). The broker waits up to this duration before responding if `fetch.min.bytes` has not been met.", explanation: "Correct. `fetch.max.wait.ms` is the broker-side maximum wait time before responding to a fetch request if `fetch.min.bytes` has not been accumulated. The default is 500ms, but if the team or broker config set it to 30 seconds, the broker holds fetch responses for 30 seconds for low-traffic partitions.", correct: true },
      { text: "`session.timeout.ms=30000` is causing the consumer to delay polling until the session expires.", explanation: "Incorrect. `session.timeout.ms` is about heartbeat liveness detection, not poll scheduling. A session timeout expiring would cause a rebalance, not a 30-second poll delay.", correct: false },
      { text: "`linger.ms=30000` on the producer is delaying message availability at the broker.", explanation: "Incorrect. `linger.ms` is a producer configuration that delays batch assembly — but once messages are sent to the broker, they are available for consumers. Fetch delay is controlled by consumer-side `fetch.min.bytes` and `fetch.max.wait.ms`, not by the producer's `linger.ms`.", correct: false }
    ],
    globalExplanation: "⚠️ This concept was not explicitly in the course but is frequently tested in the CCDAK exam. `fetch.min.bytes` and `fetch.max.wait.ms` are a pair: the broker responds when EITHER `fetch.min.bytes` of data is available OR `fetch.max.wait.ms` elapses — whichever comes first. `fetch.max.wait.ms` default is 500ms, providing a safety valve for low-throughput scenarios. If `fetch.max.wait.ms` is set too high, consumers on low-volume partitions experience artificial latency spikes even when messages do exist but fall below the `fetch.min.bytes` threshold."
  }
];

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var totalTime = 90 * QUESTIONS_RAW.length;
var timeLeft = totalTime;
var timerInterval = null;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  QUESTIONS = fisherYates(QUESTIONS_RAW).map(function(q) {
    var opts = fisherYates(q.options.slice());
    return {
      source: q.source,
      type: q.type,
      question: q.question,
      options: opts,
      globalExplanation: q.globalExplanation
    };
  });
}

function startGlobalTimer() {
  clearInterval(timerInterval);
  timeLeft = totalTime;
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      suivanteAuto();
    }
  }, 1000);
}

function renderTimer() {
  var el = document.getElementById('timerWrap');
  if (!el) return;
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = '⏱ ' + (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  var pct = timeLeft / totalTime;
  el.className = 'timer-wrap';
  if (pct < 0.1) el.className += ' danger';
  else if (pct < 0.2) el.className += ' warning';
}

function suivanteAuto() {
  if (!answered) { processAnswer(); }
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    paintScore();
  }
}

function paint() {
  var q = QUESTIONS[qIdx];
  var pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progressBar').style.width = pct + '%';

  var typeBadge = q.type === 'single'
    ? '<span class="badge badge-single">Single answer</span>'
    : '<span class="badge badge-multi">Multiple answers</span>';
  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">📘 From the course</span>'
    : '<span class="badge badge-inference">🔍 Beyond the course</span>';

  var letters = ['A','B','C','D','E'];
  var optsHtml = '';
  for (var i = 0; i < q.options.length; i++) {
    optsHtml += '<div class="opt" id="opt_' + i + '" onclick="pickOption(' + i + ')">' +
      '<div class="opt-label">' +
      '<span class="opt-letter">' + letters[i] + '.</span>' +
      '<span class="opt-text">' + q.options[i].text + '</span>' +
      '</div>' +
      '<div class="opt-exp" id="optexp_' + i + '"></div>' +
      '</div>';
  }

  document.getElementById('quizBody').innerHTML =
    '<div class="q-meta">' +
      '<span class="q-num">Question ' + (qIdx+1) + ' / ' + QUESTIONS.length + '</span>' +
      typeBadge + srcBadge +
    '</div>' +
    '<div class="q-text">' + q.question + '</div>' +
    '<div class="options">' + optsHtml + '</div>' +
    '<div class="global-exp" id="globalExpBlock">' +
      '<div class="global-exp-title">💡 Key Concept</div>' +
      '<div class="global-exp-text" id="globalExpText"></div>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn btn-primary" onclick="valider()">Validate</button>' +
      '<button class="btn btn-secondary" id="btnNext" onclick="suivante()" disabled>Next question →</button>' +
    '</div>';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    for (var k = 0; k < q.options.length; k++) {
      document.getElementById('opt_' + k).className = 'opt';
    }
    document.getElementById('opt_' + i).className = 'opt selected';
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) {
      selected.push(i);
      document.getElementById('opt_' + i).className = 'opt selected';
    } else {
      selected.splice(pos, 1);
      document.getElementById('opt_' + i).className = 'opt';
    }
  }
}

function getCorrectIndices() {
  var q = QUESTIONS[qIdx];
  var c = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) c.push(i);
  }
  return c;
}

function processAnswer() {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[qIdx];
  var correctIdxs = getCorrectIndices();
  var selSorted = selected.slice().sort().join(',');
  var corrSorted = correctIdxs.slice().sort().join(',');
  var isCorrect = (selSorted === corrSorted);

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  var letters = ['A','B','C','D','E'];
  for (var i = 0; i < q.options.length; i++) {
    var opt = document.getElementById('opt_' + i);
    var expDiv = document.getElementById('optexp_' + i);
    var isCorr = q.options[i].correct;
    var isSel = selected.indexOf(i) !== -1;
    opt.style.cursor = 'default';
    if (isCorr && isSel) opt.className = 'opt correct';
    else if (!isCorr && isSel) opt.className = 'opt wrong';
    else if (isCorr && !isSel) opt.className = 'opt missed';
    expDiv.className = 'opt-exp show';
    var icon = isCorr
      ? '<span class="opt-exp-icon" style="color:#27ae60">✓</span>'
      : '<span class="opt-exp-icon" style="color:#C0392B">✗</span>';
    expDiv.innerHTML = icon + q.options[i].explanation;
  }

  document.getElementById('globalExpText').textContent = q.globalExplanation;
  document.getElementById('globalExpBlock').className = 'global-exp show';

  var btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.removeAttribute('disabled');
}

function valider() {
  if (answered) return;
  processAnswer();
}

function suivante() {
  if (!answered) return;
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    clearInterval(timerInterval);
    paintScore();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('timerWrap').style.display = 'none';
  var pct = Math.round((score / QUESTIONS.length) * 100);
  var barColor = pct >= 70 ? '#27ae60' : pct >= 50 ? '#e67e22' : '#C0392B';
  var msg = pct >= 80 ? '🏆 Excellent! CCDAK-ready!' : pct >= 70 ? '✅ Good job! Keep practicing.' : pct >= 50 ? '📚 Review and retry — almost there.' : '💡 Study the course materials and try again.';
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('quizBody').innerHTML =
    '<div class="score-card">' +
      '<div class="score-title">Quiz Complete!</div>' +
      '<div class="score-sub">Kafka Consumers — Level 2</div>' +
      '<div class="score-pct" style="color:' + barColor + '">' + pct + '%</div>' +
      '<div class="score-bar-wrap"><div class="score-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
      '<div class="score-msg" style="color:' + barColor + '">' + msg + '</div>' +
      '<div class="score-detail">' +
        '<div class="score-detail-box"><div class="score-detail-label">📘 From the course</div><div class="score-detail-val">' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</div></div>' +
        '<div class="score-detail-box"><div class="score-detail-label">🔍 Beyond the course</div><div class="score-detail-val">' + scoreInfCorrect + ' / ' + scoreInfTotal + '</div></div>' +
        '<div class="score-detail-box"><div class="score-detail-label">Total Score</div><div class="score-detail-val">' + score + ' / ' + QUESTIONS.length + '</div></div>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="recommencer()">🔄 Restart the test</button>' +
    '</div>';
}

function recommencer() {
  qIdx = 0;
  selected = [];
  answered = false;
  score = 0;
  scoreCoursTotal = 0;
  scoreCoursCorrect = 0;
  scoreInfTotal = 0;
  scoreInfCorrect = 0;
  prepareQuestions();
  document.getElementById('timerWrap').style.display = '';
  paint();
  startGlobalTimer();
}

prepareQuestions();
window.onload = function() { paint(); startGlobalTimer(); };
</script>
</body>
