<script>
var LETTERS = ['A','B','C','D','E','F'];

var QUESTIONS_RAW = [
  /* ======================== FROM COURSE ======================== */
  {
    source: "cours",
    type: "single",
    text: "What does the Kafka client configuration property security.protocol control?",
    options: [
      { text: "The encryption algorithm used for data at rest on broker disks", correct: false },
      { text: "The communication protocol used between Kafka clients and brokers — determining encryption and authentication", correct: true },
      { text: "The ACL rule enforcement mode (allow vs deny)", correct: false },
      { text: "The specific SASL mechanism (PLAIN, GSSAPI, SCRAM) used for login", correct: false }
    ],
    explanation: {
      concept: "security.protocol is a fundamental Kafka client configuration that governs how clients establish connections with brokers. It jointly determines whether the channel is encrypted (SSL) and whether SASL-based authentication is used.",
      correct_why: "'Communication protocol between clients and brokers' is correct because security.protocol selects the entire channel type: PLAINTEXT (no security), SSL (TLS encryption only), SASL_PLAINTEXT (SASL auth, no encryption), or SASL_SSL (both TLS + SASL auth). It directly controls the transport layer.",
      incorrect_why: "Encryption at rest is handled by broker-level storage settings, not security.protocol. ACL enforcement is configured via authorizer.class.name and kafka-acls.sh — not this property. The SASL mechanism is selected separately via sasl.mechanism.",
      retenir: "Memorize the 4 values: PLAINTEXT / SSL / SASL_PLAINTEXT / SASL_SSL. The name itself tells you what you get: SASL_ prefix = authentication ON, SSL suffix = encryption ON."
    }
  },
  {
    source: "cours",
    type: "multiple",
    text: "Which of the following are valid values for the security.protocol configuration property? (Select all that apply)",
    options: [
      { text: "PLAINTEXT", correct: true },
      { text: "SSL", correct: true },
      { text: "SASL_PLAINTEXT", correct: true },
      { text: "SASL_SSL", correct: true },
      { text: "KERBEROS", correct: false }
    ],
    explanation: {
      concept: "Kafka supports exactly four security protocols for client-broker communication, each representing a distinct combination of encryption and authentication features.",
      correct_why: "PLAINTEXT (no security), SSL (TLS encryption, no SASL), SASL_PLAINTEXT (SASL auth, no TLS), and SASL_SSL (both TLS encryption + SASL auth) are all valid protocol values, forming an orthogonal matrix of encryption × authentication.",
      incorrect_why: "KERBEROS is NOT a valid security.protocol value. Kerberos is an authentication system accessed through the GSSAPI SASL mechanism — you would set security.protocol=SASL_SSL and sasl.mechanism=GSSAPI to use Kerberos.",
      retenir: "Classic CCDAK trap: Kerberos (GSSAPI) is a SASL mechanism, not a protocol value. Never confuse security.protocol values with sasl.mechanism values — they are two separate config properties."
    }
  },
  {
    source: "cours",
    type: "single",
    text: "What is the primary security purpose of the ssl.endpoint.identification.algorithm property?",
    options: [
      { text: "To select the cipher suite for AES data encryption", correct: false },
      { text: "To verify that the server hostname matches its SSL certificate, preventing man-in-the-middle attacks", correct: true },
      { text: "To configure the SASL authentication handshake algorithm", correct: false },
      { text: "To specify the algorithm used to encrypt the contents of the keystore file", correct: false }
    ],
    explanation: {
      concept: "Hostname verification is a critical defense against Man-in-the-Middle (MITM) attacks in TLS connections. ssl.endpoint.identification.algorithm instructs the Kafka client to validate that the server certificate's CN/SAN field matches the broker's actual hostname.",
      correct_why: "When set to 'HTTPS' (the default), Kafka clients perform RFC 2818-compliant hostname verification. Without this check, an attacker could present any valid certificate and intercept the connection — TLS alone does not prevent MITM without hostname verification.",
      incorrect_why: "Cipher suite selection is handled by ssl.cipher.suites. The SASL handshake is governed by sasl.mechanism and sasl.jaas.config. Keystore encryption algorithm is outside Kafka's configuration scope (handled by the Java KeyStore tool).",
      retenir: "Default is 'https' which ENABLES hostname verification. Setting it to '' (empty string) DISABLES it — a major security risk in production. Exam trap: empty string = no MITM protection."
    }
  },
  {
    source: "cours",
    type: "multiple",
    text: "According to the course, which SASL mechanisms does Kafka support for client-server authentication? (Select all that apply)",
    options: [
      { text: "PLAIN", correct: true },
      { text: "GSSAPI (Kerberos)", correct: true },
      { text: "SCRAM", correct: true },
      { text: "NTLM", correct: false },
      { text: "DIGEST-MD5", correct: false }
    ],
    explanation: {
      concept: "Kafka supports multiple SASL mechanisms via the sasl.mechanism configuration property, each offering different security levels and use cases.",
      correct_why: "PLAIN (username/password in base64), GSSAPI/Kerberos (ticket-based mutual auth — strongest for enterprise), and SCRAM (Salted Challenge Response Authentication Mechanism — challenge-response, no password transmission) are all explicitly supported by Kafka.",
      incorrect_why: "NTLM (Windows authentication protocol) is not a supported Kafka SASL mechanism. DIGEST-MD5 was deprecated and removed from modern Kafka versions. Neither is listed in Kafka's supported SASL configurations.",
      retenir: "SASL mechanisms by security level: GSSAPI (strongest, enterprise Kerberos) > SCRAM-SHA-512 > SCRAM-SHA-256 > PLAIN (weakest — requires SSL). Also know OAUTHBEARER for OAuth2 integrations."
    }
  },
  {
    source: "cours",
    type: "single",
    text: "An Authorizer is configured on a Kafka cluster. A new topic 'analytics' is created but has NO ACLs defined. A regular authenticated user 'bob' attempts to produce to it. What happens by default?",
    options: [
      { text: "Bob can produce because he is successfully authenticated", correct: false },
      { text: "Bob is denied access — only super users can access resources with no ACLs when an Authorizer is active", correct: true },
      { text: "Bob gets read-only access by default as a fallback", correct: false },
      { text: "Kafka falls back to OS file system permissions to decide", correct: false }
    ],
    explanation: {
      concept: "Kafka's ACL system follows a deny-by-default model when an Authorizer is configured. Authentication (proving identity) does not equal authorization (permission to act). These are separate concerns.",
      correct_why: "When an Authorizer like SimpleAclAuthorizer is active and a resource has no ACLs, only principals listed in super.users can access it. Regular users — even authenticated ones — are denied. This is by design: security-first default.",
      incorrect_why: "Authentication grants identity, not permission — these are completely separate. There is no 'read-only by default' fallback. OS permissions are not consulted for Kafka ACLs; Kafka ACLs are stored in ZooKeeper (or KRaft metadata).",
      retenir: "Kafka ACL model: deny unless explicitly allowed (for non-super users). allow.everyone.if.no.acl.found=false (default) = most secure. Setting it to true opens resources without ACLs to everyone — risky in production."
    }
  },
  {
    source: "cours",
    type: "single",
    text: "What does the ssl.truststore.location file contain and why is it essential for SSL/TLS?",
    options: [
      { text: "The broker's private key used to encrypt outbound data", correct: false },
      { text: "The client's own public certificate to present during handshake", correct: false },
      { text: "Certificates of trusted Certificate Authorities (CAs), used to validate the remote party's certificate", correct: true },
      { text: "The JAAS authentication token cache for SASL sessions", correct: false }
    ],
    explanation: {
      concept: "In PKI-based TLS, trust is established through Certificate Authorities. A truststore holds the CA certificates that define which certificate issuers you consider trustworthy — it is used to validate incoming TLS certificates.",
      correct_why: "The truststore contains CA certificates. When a Kafka client connects to a broker, it uses the truststore to verify the broker's certificate was signed by a trusted CA. Without a truststore (or with an empty one), certificate validation fails and the connection is rejected.",
      incorrect_why: "Private keys belong in the keystore, not the truststore. Client certificates (for mutual TLS) are also in the keystore. JAAS tokens are configured via sasl.jaas.config, completely separate from SSL stores.",
      retenir: "Memory trick — Keystore: 'MY identity' (private key + my cert). Truststore: 'WHO I trust' (CA certs). A client connecting to a broker needs: truststore (to verify broker). For mutual TLS, both sides need both stores."
    }
  },
  {
    source: "cours",
    type: "single",
    text: "The course describes sasl.jaas.config as 'central' to SASL authentication setup. What does this property specifically configure?",
    options: [
      { text: "Only Kerberos-specific settings — keytab path and principal", correct: false },
      { text: "The SASL mechanism name (PLAIN, GSSAPI, SCRAM)", correct: false },
      { text: "Login modules and their options for the chosen SASL mechanism — credentials, keytabs, and authentication parameters", correct: true },
      { text: "The network port used by SASL for authentication exchanges", correct: false }
    ],
    explanation: {
      concept: "JAAS (Java Authentication and Authorization Service) is the Java framework underlying Kafka's SASL implementation. sasl.jaas.config is the inline JAAS configuration that connects the selected SASL mechanism to the actual credentials and parameters.",
      correct_why: "For GSSAPI: sasl.jaas.config specifies the Krb5LoginModule, keytab path, and principal. For PLAIN: it specifies username and password. For SCRAM: username and password. It is the 'glue' that makes SASL work regardless of the chosen mechanism.",
      incorrect_why: "sasl.jaas.config applies to ALL SASL mechanisms, not just Kerberos. The mechanism name is selected by sasl.mechanism. Network ports are a broker listener configuration. JAAS config is about credentials and login behavior, not network topology.",
      retenir: "sasl.jaas.config format: 'LoginModuleClass required/optional key=value;'. Example for PLAIN: 'org.apache.kafka.common.security.plain.PlainLoginModule required username=\"alice\" password=\"secret\";'"
    }
  },
  {
    source: "cours",
    type: "single",
    text: "A developer runs this command:\nkafka-acls.sh --authorizer-properties zookeeper.connect=localhost:2181 --add --allow-principal User:Andoni --allow-host test-host --operation read --operation write --topic test-topic\nWhat is the result?",
    options: [
      { text: "Denies user Andoni read and write access to test-topic", correct: false },
      { text: "Lists existing ACLs for user Andoni on test-topic", correct: false },
      { text: "Grants user Andoni read and write access to test-topic from test-host", correct: true },
      { text: "Removes existing read/write ACLs for Andoni on test-topic", correct: false }
    ],
    explanation: {
      concept: "kafka-acls.sh is the Kafka CLI tool for managing Access Control Lists. The --add flag creates new ACL entries, while --allow-principal and --allow-host specify who gets what permissions from where.",
      correct_why: "--add creates the ACL. --allow-principal User:Andoni specifies the beneficiary. --allow-host test-host restricts by origin host. --operation read --operation write grants both operations. --topic test-topic targets the resource. Combined: Andoni can read and write to test-topic from test-host.",
      incorrect_why: "Denial would use --deny-principal instead of --allow-principal. Listing uses --list flag, not --add. Removal uses --remove flag, not --add. The combination of --add + --allow-principal is always additive (granting), not subtractive.",
      retenir: "kafka-acls.sh flag pairs to memorize: --add/--remove (action), --allow-principal/--deny-principal (permission type), --list (read-only). You can use --operation multiple times in one command to grant multiple operations simultaneously."
    }
  },
  {
    source: "cours",
    type: "single",
    text: "What is the effect of setting allow.everyone.if.no.acl.found=true in Kafka broker configuration?",
    options: [
      { text: "All authenticated users automatically become super users", correct: false },
      { text: "Resources that have no ACLs defined are accessible to any user, bypassing the default deny behavior", correct: true },
      { text: "Kafka automatically generates permissive ACLs for newly created topics", correct: false },
      { text: "Unauthenticated (anonymous) users bypass SASL authentication entirely", correct: false }
    ],
    explanation: {
      concept: "allow.everyone.if.no.acl.found is a broker-level property that controls the fallback authorization behavior when a resource has no ACL entries defined.",
      correct_why: "With allow.everyone.if.no.acl.found=true, any user (authenticated or not) can access any resource that has no specific ACLs. This is effectively 'open access' for unprotected resources — useful in development but dangerous in production.",
      incorrect_why: "It does not elevate users to super users — super users are defined separately in super.users. No ACLs are auto-created; the decision is made at access time, not topic creation time. Authentication and authorization are separate — this property does not bypass SASL.",
      retenir: "Production recommendation: always keep allow.everyone.if.no.acl.found=false (default). Only set to true in development. With an Authorizer configured and this=false: no ACL = deny (except super users)."
    }
  },
  {
    source: "cours",
    type: "multiple",
    text: "What are the three core pillars of Kafka's comprehensive security model? (Select 3)",
    options: [
      { text: "Encryption (SSL/TLS for data in transit)", correct: true },
      { text: "Authentication (verifying client and broker identities via SASL/SSL)", correct: true },
      { text: "Authorization (ACL-based access control to Kafka resources)", correct: true },
      { text: "Compression (reducing message size to prevent data leakage)", correct: false },
      { text: "Replication (ensuring data durability across brokers)", correct: false }
    ],
    explanation: {
      concept: "Kafka's layered security architecture rests on three complementary pillars: you encrypt the channel, verify who is connecting, and control what they can do. No single pillar alone provides complete security.",
      correct_why: "Encryption (SSL/TLS): prevents eavesdropping on data in transit. Authentication (SASL/SSL client auth): verifies identities so only legitimate clients connect. Authorization (ACLs via SimpleAclAuthorizer): controls what each verified identity can do on which resources.",
      incorrect_why: "Compression (Snappy, LZ4, GZIP, ZSTD) is a performance/bandwidth optimization — it does not encrypt data and provides zero security. Replication (ISR, min.insync.replicas) ensures durability and availability — it is a fault-tolerance mechanism, not a security control.",
      retenir: "All three work together: Encryption prevents eavesdropping. Authentication prevents impersonation. Authorization prevents unauthorized access. Missing any one creates a security gap — e.g., encryption without auth = anyone can connect (just can't eavesdrop)."
    }
  },

  /* ======================== BEYOND COURSE ======================== */
  {
    source: "inference",
    type: "single",
    text: "A production Kafka cluster requires BOTH encryption in transit AND SASL-based identity verification. Which security.protocol value should be configured?",
    options: [
      { text: "SSL — provides TLS encryption but no SASL authentication", correct: false },
      { text: "SASL_PLAINTEXT — provides SASL auth but sends data without encryption", correct: false },
      { text: "SASL_SSL — provides both TLS encryption AND SASL authentication", correct: true },
      { text: "PLAINTEXT — provides neither encryption nor authentication", correct: false }
    ],
    explanation: {
      concept: "SASL_SSL is the most secure security.protocol value because it layers SASL authentication on top of TLS-encrypted transport. This gives you: encrypted channel (data cannot be intercepted) + verified identity (only authenticated clients connect).",
      correct_why: "SASL_SSL = SASL authentication mechanism (PLAIN, GSSAPI, SCRAM, etc.) running over an SSL/TLS encrypted TCP connection. The name is self-describing: SASL_ prefix = authentication, SSL suffix = encryption. Required for production-grade security.",
      incorrect_why: "SSL alone: encrypts but uses certificate-based auth only (no SASL mechanisms). SASL_PLAINTEXT: authenticates users but all Kafka data flows unencrypted — credentials are safe but messages are not. PLAINTEXT: no security whatsoever.",
      retenir: "Security ranking: SASL_SSL (best) > SSL > SASL_PLAINTEXT > PLAINTEXT (worst). For production: always SASL_SSL. Exam scenario: 'encryption AND authentication' = SASL_SSL without exception."
    }
  },
  {
    source: "inference",
    type: "single",
    text: "Which is the correct format for defining super users in Kafka broker configuration (server.properties)?",
    options: [
      { text: "super.users=admin,kafka", correct: false },
      { text: "super.users=User:admin;User:kafka", correct: true },
      { text: "super.users=admin:kafka", correct: false },
      { text: "super.users=[User:admin,User:kafka]", correct: false }
    ],
    explanation: {
      concept: "Super users in Kafka bypass all ACL checks — they have unrestricted access to all resources regardless of ACLs. The super.users property requires a specific principal format with semicolons as separators.",

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var timerInterval = null;
var timeLeft = 90;
var totalTimeUsed = 0;
var courseTotal = 0;
var courseCorrect = 0;
var inferenceTotal = 0;
var inferenceCorrect = 0;

function fisherYates(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}

function deepClone(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function prepareQuestions() {
  var raw = deepClone(QUESTIONS_RAW);
  fisherYates(raw);
  QUESTIONS = [];
  courseTotal = 0;
  inferenceTotal = 0;
  for (var i = 0; i < raw.length; i++) {
    var q = raw[i];
    fisherYates(q.options);
    QUESTIONS.push(q);
    if (q.source === 'cours') courseTotal++;
    else inferenceTotal++;
  }
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 90;
  renderTimer();
  timerInterval = setInterval(function() {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      document.getElementById('timeoutMsg').style.display = 'block';
      validerAuto();
    }
  }, 1000);
}

function renderTimer() {
  var el = document.getElementById('timerEl');
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  el.textContent = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  el.className = 'timer';
  if (timeLeft <= 15) el.className = 'timer danger';
  else if (timeLeft <= 30) el.className = 'timer warning';
}

function paint() {
  if (qIdx >= QUESTIONS.length) { paintScore(); return; }

  var q = QUESTIONS[qIdx];
  selected = [];
  answered = false;

  document.getElementById('progressBar').style.width = Math.round((qIdx / QUESTIONS.length) * 100) + '%';
  document.getElementById('timeoutMsg').style.display = 'none';

  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">&#128216; From the Course</span>'
    : '<span class="badge badge-inference">&#128269; Beyond the Course</span>';
  var typBadge = q.type === 'single'
    ? '<span class="badge badge-single">Single Answer</span>'
    : '<span class="badge badge-multiple">Multiple Answers</span>';
  document.getElementById('questionMeta').innerHTML =
    '<span class="q-num">Question ' + (qIdx + 1) + ' / ' + QUESTIONS.length + '</span>' + srcBadge + typBadge;

  document.getElementById('questionText').textContent = q.text;

  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  for (var i = 0; i < q.options.length; i++) {
    var div = document.createElement('div');
    div.className = 'option';
    div.id = 'opt_' + i;
    div.setAttribute('onclick', 'pickOption(' + i + ')');
    div.innerHTML = '<span class="opt-letter">' + LETTERS[i] + '</span><span class="opt-text">' + esc(q.options[i].text) + '</span>';
    container.appendChild(div);
  }

  document.getElementById('explanation').style.display = 'none';
  document.getElementById('explanation').innerHTML = '';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').disabled = true;

  startTimer();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function pickOption(idx) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    for (var i = 0; i < q.options.length; i++) {
      var el = document.getElementById('opt_' + i);
      if (el) el.className = 'option';
    }
    selected = [idx];
    var selEl = document.getElementById('opt_' + idx);
    if (selEl) selEl.className = 'option selected';
  } else {
    var pos = selected.indexOf(idx);
    var optEl = document.getElementById('opt_' + idx);
    if (pos === -1) {
      selected.push(idx);
      if (optEl) optEl.className = 'option selected';
    } else {
      selected.splice(pos, 1);
      if (optEl) optEl.className = 'option';
    }
  }
}

function valider() {
  if (answered) return;
  clearInterval(timerInterval);
  totalTimeUsed += (90 - timeLeft);
  processAnswer();
}

function validerAuto() {
  if (answered) return;
  totalTimeUsed += 90;
  processAnswer();
}

function processAnswer() {
  answered = true;
  var q = QUESTIONS[qIdx];

  var correctIdxs = [];
  for (var i = 0; i < q.options.length; i++) {
    if (q.options[i].correct) correctIdxs.push(i);
  }

  var isCorrect = false;
  if (selected.length === correctIdxs.length) {
    var s1 = selected.slice().sort().join(',');
    var s2 = correctIdxs.slice().sort().join(',');
    isCorrect = (s1 === s2);
  }

  if (isCorrect) {
    score++;
    if (q.source === 'cours') courseCorrect++;
    else inferenceCorrect++;
  }

  for (var i = 0; i < q.options.length; i++) {
    var el = document.getElementById('opt_' + i);
    if (!el) continue;
    var isSel = selected.indexOf(i) !== -1;
    var isCorr = correctIdxs.indexOf(i) !== -1;
    el.setAttribute('onclick', '');
    if (isSel && isCorr)       el.className = 'option correct disabled';
    else if (isSel && !isCorr) el.className = 'option incorrect disabled';
    else if (!isSel && isCorr) el.className = 'option missed disabled';
    else                        el.className = 'option disabled';
  }

  var expEl = document.getElementById('explanation');
  expEl.style.display = 'block';

  var warnHtml = '';
  if (q.source === 'inference') {
    warnHtml = '<div class="exp-warn">&#9888; This concept was not explicitly covered in the course but is frequently tested in the CCDAK exam.</div>';
  }

  expEl.innerHTML = warnHtml +
    '<div class="exp-section">' +
      '<h4>&#128273; Key Concept</h4><p>' + esc(q.explanation.concept) + '</p>' +
      '<h4>&#9989; Why Correct</h4><p>' + esc(q.explanation.correct_why) + '</p>' +
      '<h4>&#10060; Why Incorrect</h4><p>' + esc(q.explanation.incorrect_why) + '</p>' +
      '<h4>&#128204; Remember for the Exam</h4><p>' + esc(q.explanation.retenir) + '</p>' +
    '</div>';

  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
}

function suivante() {
  qIdx++;
  paint();
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';
  document.getElementById('progressBar').style.width = '100%';

  var total = QUESTIONS.length;
  var pct = Math.round((score / total) * 100);
  var avgTime = total > 0 ? Math.round(totalTimeUsed / total) : 0;

  document.getElementById('scoreTitle').textContent = 'Quiz Complete! 🎉';

  var bar = document.getElementById('scoreBar');
  bar.style.width = pct + '%';
  bar.className = 'score-bar ' + (pct >= 75 ? 'great' : pct >= 50 ? 'ok' : 'fail');

  document.getElementById('scorePct').textContent = pct + '%';

  var msg = '';
  if (pct >= 85) msg = '🏆 Excellent! You are ready for the CCDAK exam!';
  else if (pct >= 70) msg = '👍 Good job! A bit more review and you\'ll nail it.';
  else if (pct >= 50) msg = '📚 Keep studying — focus on the red questions.';
  else msg = '💪 Keep practicing! Review the Kafka Security chapter thoroughly.';
  document.getElementById('scoreMsg').textContent = msg;

  var cPct = courseTotal > 0 ? Math.round(courseCorrect / courseTotal * 100) : 0;
  var iPct = inferenceTotal > 0 ? Math.round(inferenceCorrect / inferenceTotal * 100) : 0;

  document.getElementById('scoreCards').innerHTML =
    '<div class="score-card"><div class="sc-label">Total Score</div><div class="sc-val">' + score + '/' + total + '</div><div class="sc-sub">' + pct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">📘 From the Course</div><div class="sc-val">' + courseCorrect + '/' + courseTotal + '</div><div class="sc-sub">' + cPct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">🔍 Beyond the Course</div><div class="sc-val">' + inferenceCorrect + '/' + inferenceTotal + '</div><div class="sc-sub">' + iPct + '%</div></div>' +
    '<div class="score-card"><div class="sc-label">Avg Time / Question</div><div class="sc-val">' + avgTime + 's</div><div class="sc-sub">out of 90s</div></div>';
}

function recommencer() {
  qIdx = 0;
  score = 0;
  selected = [];
  answered = false;
  totalTimeUsed = 0;
  courseCorrect = 0;
  inferenceCorrect = 0;

  prepareQuestions();

  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  document.getElementById('timerEl').className = 'timer';

  paint();
}

prepareQuestions();
window.onload = function() { paint(); };
</script>
