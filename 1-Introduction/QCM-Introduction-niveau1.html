    <style>
        body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f5f5f3; color:#1f2937; }    .wrap { max-width:980px; margin:0 auto; padding:28px 16px; }    .topbar { height:12px; background:#e5e7eb; border-radius:999px; overflow:hidden; margin-bottom:18px; border:1px solid #d1d5db; }    .topbar-fill { height:100%; background:#378ADD; width:0%; transition:width .25s ease; }    .card { background:#fff; border:1px solid #d9dee7; border-radius:12px; padding:26px; box-shadow:0 8px 22px rgba(15,23,42,.06); }    .head { display:flex; justify-content:space-between; gap:16px; align-items:flex-start; margin-bottom:12px; }    .meta { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }    .pill { display:inline-block; padding:6px 10px; border-radius:999px; font-size:13px; font-weight:700; background:#eef6ff; color:#2264a5; border:1px solid #cfe5fb; }    .timer { font-weight:800; color:#378ADD; border:1px solid #cfe5fb; padding:8px 12px; border-radius:999px; min-width:72px; text-align:center; }    .timer.orange { color:#d97706; border-color:#fed7aa; background:#fff7ed; }    .timer.red { color:#dc2626; border-color:#fecaca; background:#fef2f2; animation:pulse 1s infinite; }    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }    h1 { margin:0 0 10px; font-size:26px; }    h2 { margin:8px 0 18px; font-size:22px; line-height:1.35; }    h3 { margin:20px 0 8px; font-size:17px; color:#111827; }    p { line-height:1.55; }    .options { display:grid; gap:12px; margin:20px 0; }    .option { width:100%; text-align:left; display:flex; gap:12px; align-items:flex-start; border:1px solid #d7dce5; background:#fff; border-radius:12px; padding:14px 15px; cursor:pointer; transition:.15s ease; font-size:16px; }    .option:hover { background:#f8fafc; transform:translateY(-1px); }    .letter { flex:0 0 31px; height:31px; border-radius:999px; background:#edf2f7; display:inline-flex; align-items:center; justify-content:center; font-weight:800; color:#374151; }    .option.selected { border-color:#378ADD; background:#eef6ff; }    .option.correct { border-color:#16a34a; background:#ecfdf5; }    .option.wrong { border-color:#dc2626; background:#fef2f2; }    .option.missed { border-color:#16a34a; border-style:dashed; background:#f7fee7; }    .option.disabled { cursor:default; transform:none; }    .actions { display:flex; gap:12px; flex-wrap:wrap; margin-top:18px; }    button.primary, button.secondary { border:0; border-radius:10px; padding:12px 18px; font-weight:800; cursor:pointer; font-size:15px; }    button.primary { background:#378ADD; color:#fff; }    button.primary:disabled { opacity:.45; cursor:not-allowed; }    button.secondary { background:#eef2f7; color:#111827; }    .feedback { margin-top:20px; padding:18px; border-radius:12px; border:1px solid #dbeafe; background:#f8fbff; }    .feedback ul { margin-top:6px; }    .alert { margin-top:12px; color:#b91c1c; font-weight:800; }    .scorebox { text-align:center; padding:30px 10px; }    .score { font-size:46px; font-weight:900; color:#111827; margin:10px 0; }    .scorebar { height:20px; background:#e5e7eb; border-radius:999px; overflow:hidden; border:1px solid #d1d5db; margin:20px auto; max-width:560px; }    .scorefill { height:100%; width:0%; transition:width .4s ease; }    .muted { color:#6b7280; }    @media (max-width:640px){ .head{display:block}.timer{display:inline-block;margin-top:10px}.card{padding:18px} }

<script>
    var qIdx = 0;var selected = [];var answered = false;var score = 0;var timeLeft = 90;var timerInterval = null;var elapsedTimes = [];var timeoutMessage = "";var QUESTIONS = [  {    text:"In a data system modernization project, a team wants to use Kafka as a shared foundation. Which use cases directly match the role presented in the module?",    type:"multi",    options:[      {text:"Build data pipelines and real-time analytics", correct:true},      {text:"Connect microservices while reducing direct coupling between applications", correct:true},      {text:"Transfer data from third-party systems to a target system", correct:true},      {text:"Systematically replace all transactional relational databases", correct:false},      {text:"Serve only as a local in-memory cache for an application", correct:false}    ],    explanation:{      key:"Kafka is presented as a universal foundation for modern data systems, useful for pipelines, microservices, and inter-system data transfer.",      correct:["Pipelines and analytics use Kafka to move events toward BI, ML, or reporting.","Connecting microservices is a typical use case: Kafka decouples producers and consumers.","Transferring data from third-party systems corresponds to source/sink connectivity around Kafka."],      incorrect:["Kafka does not automatically replace all transactional databases: it often complements systems of record.","Kafka is not presented as a simple local cache: it is a distributed streaming platform."],      exam:["Kafka is often at the center, but not alone: broker, processing, governance, and connectors form the platform.","Do not confuse an event foundation with a universal replacement for all databases."]    }  },  {    text:"A team models a customer purchase. Which representation best matches the event-driven thinking promoted by Kafka?",    type:"single",    options:[      {text:"A customer state row updated with the latest purchase amount", correct:false},      {text:"A timestamped fact indicating that an item was sold at a specific moment", correct:true},      {text:"A daily CSV export containing all purchases from the previous day", correct:false},      {text:"A single table that overwrites the previous state with each transaction", correct:false}    ],    explanation:{      key:"An event is a fact that happened at a point in time: it captures an action or change, not only the current state of an entity.",      correct:["The timestamped sale exactly represents an observable fact over time, as in the course example."],      incorrect:["The customer row mostly describes an entity and its current state, which belongs more to the table paradigm.","The daily export is a batch approach, not immediate event capture.","Overwriting state loses the history of facts, unlike the event-driven approach."],      exam:["Event = timestamped fact, not just current state.","The classic trap is confusing the final state with the sequence of facts that produced it."]    }  },  {    text:"In the module, why does Kafka encourage moving from table-oriented thinking to event-oriented thinking?",    type:"single",    options:[      {text:"Because tables can never be queried", correct:false},      {text:"Because events capture what happens moment by moment", correct:true},      {text:"Because Kafka forbids any notion of schema", correct:false},      {text:"Because events are always anonymous and unstructured", correct:false}    ],    explanation:{      key:"The paradigm shift means no longer starting only from things or entities, but from the facts and changes that happen over time.",      correct:["Kafka focuses on the continuous capture of facts, enabling data in motion to be processed."],      incorrect:["Tables remain useful; the course contrasts two paradigms, it does not say tables are unusable.","Kafka can manage schemas through governance mechanisms such as Schema Registry.","Events have structure and can be governed by a schema; they are not necessarily anonymous or informal."],      exam:["Tables = state; events = facts over time.","Kafka stores events and can rebuild states, but the unit of thought remains the stream." ]    }  },  {    text:"A company collects web clicks into files and then runs an overnight job. Which diagnosis matches the contrast presented in the course?",    type:"single",    options:[      {text:"It is a batch approach, whereas Kafka aims to process data when the event occurs", correct:true},      {text:"It is optimal Kafka stream processing because processing is delayed", correct:false},      {text:"It is mandatory with Kafka, which cannot process clicks continuously", correct:false},      {text:"It is only a Schema Registry problem", correct:false}    ],    explanation:{      key:"Kafka is designed to process events as they occur, rather than storing them for delayed batch processing.",      correct:["Storing clicks followed by overnight processing illustrates the batch approach contrasted with real time in the module."],      incorrect:["Delayed processing is not the goal of Kafka stream processing in this module.","Kafka is specifically presented as suitable for continuous event processing.","Schema Registry concerns data structure and compatibility, not the batch vs real-time choice by itself."],      exam:["Batch = store first, process later; streaming = process on arrival.","Do not reduce Kafka to a waiting warehouse: immediate processing is central." ]    }  },  {    text:"The course states that Kafka retains past events. Which capabilities does this retention make possible?",    type:"multi",    options:[      {text:"Replay events for a delayed consumer", correct:true},      {text:"Feed a system that has fallen behind", correct:true},      {text:"Reconstruct state from history", correct:true},      {text:"Remove any need for schema governance", correct:false},      {text:"Guarantee that Kafka is only an ephemeral message bus", correct:false}    ],    explanation:{      key:"Kafka processes in real time but also retains events according to retention rules, making it more than an ephemeral bus.",      correct:["Replay is possible because events remain available during the retention period.","A consumer or system that is behind can catch up from the retained stream.","State can be reconstructed by replaying the sequence of events."],      incorrect:["Retention does not replace governance: schemas remain important for compatibility.","The course emphasizes precisely that Kafka is not merely ephemeral."],      exam:["Retention ≠ simple volatile queue: Kafka keeps a readable log.","Replay and state reconstruction are major arguments for event-driven architectures." ]    }  },  {    text:"A new service must read historical events to rebuild its local state. Which Kafka behavior from the module does it use?",    type:"single",    options:[      {text:"Event retention and replay", correct:true},      {text:"Immediate deletion of messages after the first read", correct:false},      {text:"Storage of schemas only inside Kafka", correct:false},      {text:"The obligation to wait for an overnight batch job", correct:false}    ],    explanation:{      key:"Event memory allows a consumer to request a replay for catch-up or reconstruction.",      correct:["The service rereads events retained by Kafka in order to rebuild its state."],      incorrect:["Deletion after the first read would correspond to an ephemeral bus/queue, not the Kafka retention described.","Schema Registry stores schemas; Kafka stores events in its topics.","Replay does not inherently require an overnight batch job: it can be used to catch up with a stream."],      exam:["Kafka is not only immediate publish/subscribe: it retains history according to retention settings.","Schema Registry does not store Kafka messages, only schemas." ]    }  },  {    text:"In an exchange between two teams, the producer changes the structure of the events. Which ecosystem component mentioned in the course helps govern this evolution?",    type:"single",    options:[      {text:"Schema Registry", correct:true},      {text:"A BI dashboard", correct:false},      {text:"A daily batch file", correct:false},      {text:"A rule requiring events to have no structure", correct:false}    ],    explanation:{      key:"Schema management defines and controls the structure of event data in order to support governance and compatibility.",      correct:["Schema Registry validates producers and consumers against schemas and their compatibility rules."],      incorrect:["BI consumes or analyzes data, but does not govern Kafka schema compatibility.","A batch file does not address continuous event governance needs.","The course says the opposite: events can have a governed schema."],      exam:["Schema Registry = schema governance, not event storage.","CCDAK trap: a schema protects producers and consumers from incompatible evolutions." ]    }  },  {    text:"Which statements respect the distinction between events and schemas as presented?",    type:"multi",    options:[      {text:"Events represent timestamped facts", correct:true},      {text:"Schemas describe the expected structure of the data flowing through the system", correct:true},      {text:"Schema governance helps compatibility between producers and consumers", correct:true},      {text:"The schema replaces the event and is enough to reconstruct business activity", correct:false},      {text:"The presence of a schema makes Kafka non-event-driven", correct:false}    ],    explanation:{      key:"The module presents a useful tension: Kafka thinks in events, but also manages their structures through schemas for governance.",      correct:["An event is a fact over time.","The schema defines the shape of exchanged data.","Compatibility prevents structural changes from breaking consuming applications."],      incorrect:["A schema does not contain business facts; it describes their structure.","Having a schema does not contradict the event-driven approach; it makes it governable."],      exam:["Event = produced business data; schema = structural contract.","Do not confuse governance with processing: Schema Registry does not transform the stream." ]    }  },  {    text:"An architecture must enrich events on the fly before exposing them to other systems. Which data streaming platform component matches this role in the course?",    type:"single",    options:[      {text:"Stream processing with Kafka Streams or Flink", correct:true},      {text:"Schema Registry only", correct:false},      {text:"A legacy source system", correct:false},      {text:"A static inventory table", correct:false}    ],    explanation:{      key:"Stream processing transforms, enriches, and computes on event streams continuously.",      correct:["Kafka Streams or Flink are cited as processing tools used to transform and enrich events on the fly."],      incorrect:["Schema Registry governs schemas; it does not perform business processing on the stream.","A legacy system may be a source, not the continuous transformation component.","A static table belongs more to a state-at-rest logic."],      exam:["Kafka Connect moves data; Kafka Streams/Flink transform it.","Processing is a component around the broker, not the broker itself." ]    }  },  {    text:"A team wants to connect an external database and a data warehouse to Kafka without writing the whole integration from scratch. Which course component is most suitable?",    type:"single",    options:[      {text:"Kafka Connect and its source/sink connectors", correct:true},      {text:"Only the notion of a timestamped event", correct:false},      {text:"Only a delayed replay consumer", correct:false},      {text:"A volume diagram", correct:false}    ],    explanation:{      key:"Connectors integrate Kafka with external systems, either as sources or sinks.",      correct:["Kafka Connect is the inter-system connectivity component cited for linking databases, legacy systems, data warehouses, or cloud storage."],      incorrect:["The concept of an event is fundamental but does not provide ready-made technical integration.","A consumer can read Kafka, but Kafka Connect is the dedicated component for reusable integrations.","Volume illustrates scale, not an integration solution."],      exam:["Connect = movement/integration; Streams = transformation.","Source pushes into Kafka; sink exports from Kafka to a target." ]    }  },  {    text:"The course discusses a data streaming platform around Kafka. Which elements are part of it?",    type:"multi",    options:[      {text:"The Apache Kafka broker as the core", correct:true},      {text:"Stream processing tools", correct:true},      {text:"Governance components such as Schema Registry", correct:true},      {text:"Connectors to external systems", correct:true},      {text:"A systematic rejection of managed cloud services", correct:false}    ],    explanation:{      key:"Kafka is the central broker, but the course broadens the view to a platform: processing, governance, connectors, and managed cloud.",      correct:["The broker is the center of event circulation.","Stream processing transforms and enriches streams.","Governance controls quality, compliance, and compatibility.","Connectors provide integration with non-Kafka systems."],      incorrect:["The course instead cites Confluent Cloud as a cloud-native managed service with differences from open-source Kafka."],      exam:["Apache Kafka is only one part of the Kafka/Confluent ecosystem.","Certification questions often test the difference between the broker component and platform components." ]    }  },  {    text:"Which statement best summarizes the course distinction between open-source Apache Kafka and Confluent Cloud?",    type:"single",    options:[      {text:"Apache Kafka is the open-source broker; Confluent Cloud is a cloud-native managed Kafka service", correct:true},      {text:"Confluent Cloud is simply another name for a local CSV file", correct:false},      {text:"Apache Kafka can never be used with connectors", correct:false},      {text:"Confluent Cloud removes the concept of events", correct:false}    ],    explanation:{      key:"The module distinguishes open-source Apache Kafka from cloud-native Kafka services such as Confluent Cloud.",      correct:["Confluent Cloud provides Kafka as a managed service within a cloud-native platform."],      incorrect:["Confluent Cloud is not a file format; it is a managed service.","Connectors are part of the ecosystem around Kafka, independently of this statement.","The event model remains central in managed Kafka services."],      exam:["Open-source Kafka ≠ complete managed offering.","Watch out for questions that mix product, broker, and platform." ]    }  },  {    text:"In the module, which examples are explicitly used to illustrate an event?",    type:"multi",    options:[      {text:"An item sold in a store", correct:true},      {text:"A connected-car driver activating a turn signal", correct:true},      {text:"A user clicking on a web page", correct:true},      {text:"A product table consulted once a month", correct:false},      {text:"A Kafka server configured with an ACL", correct:false}    ],    explanation:{      key:"The course illustrates an event as an action or observable change at a specific moment.",      correct:["The in-store sale is a timestamped business fact.","Activating the turn signal is a signal produced by a connected system.","The user click is a typical web event."],      incorrect:["A monthly table lookup suggests a static read, not the example of an instantaneous fact.","Kafka ACLs are not covered in this module and are not an example of a business event."],      exam:["Recognizing an event means looking for an action verb and a timestamp.","A static entity is not an event until you describe what happens to it." ]    }  },  {    text:"Leadership wants to justify Kafka for massive streams. Which volume scales are consistent with the course?",    type:"multi",    options:[      {text:"Millions of events per second", correct:true},      {text:"Billions of events per hour", correct:true},      {text:"Trillions of events per day", correct:true},      {text:"Only a few dozen events per month", correct:false},      {text:"Only occasional manual processing", correct:false}    ],    explanation:{      key:"The module highlights Kafka’s ability to support very high-volume pipelines.",      correct:["Millions per second, billions per hour, and trillions per day are the orders of magnitude cited."],      incorrect:["Kafka can run at small scale, but that is not the scale emphasized in this passage.","Occasional manual processing contradicts the idea of automated and continuous streams."],      exam:["Kafka is designed for stream scalability, not just occasional exchanges.","Scale figures often help distinguish industrial streaming from manual processing." ]    }  },  {    text:"Which comparison correctly describes data at rest and data in motion in the module?",    type:"single",    options:[      {text:"Tables usually represent data at rest; Kafka usually represents data in motion", correct:true},      {text:"Kafka only processes data at rest without continuous streams", correct:false},      {text:"Data in motion is necessarily without timestamps", correct:false},      {text:"Tables and events are strictly identical in purpose", correct:false}    ],    explanation:{      key:"The course contrasts data at rest, often represented by databases/tables, with data in motion, represented by event streams.",      correct:["Tables store queryable state; Kafka transports and retains events that flow."],      incorrect:["Kafka is specifically presented as infrastructure for data in motion.","An event is instead defined as a fact at a specific moment.","Tables and events can complement each other, but they embody two different ways of reasoning."],      exam:["Data at rest = state; data in motion = stream.","The trap is applying only SQL/table reasoning to a Kafka architecture." ]    }  },  {    text:"A real-time consumer processes events immediately, while another arrives later and replays them. Which course concept does this illustrate?",    type:"single",    options:[      {text:"The lifecycle of an event: publication, retention, immediate distribution, then delayed replay", correct:true},      {text:"Mandatory deletion after the first consumer reads it", correct:false},      {text:"The impossibility of having multiple consumers", correct:false},      {text:"Replacing the broker with Schema Registry", correct:false}    ],    explanation:{      key:"The course shows a producer, Kafka, retention memory, a real-time consumer, and a delayed replay consumer.",      correct:["Kafka can serve real time and allow later catch-up thanks to retained events."],      incorrect:["Kafka does not necessarily delete an event after a consumer reads it.","The diagram specifically shows multiple consumers with different timing.","Schema Registry validates schemas but does not replace the Kafka broker."],      exam:["Kafka enables multiple uses of the same stream: immediate, delayed, reconstruction.","Do not reason like with a classic destructive queue." ]    }  },  {    text:"A team says: ‘We no longer need to think about entities, only events.’ What nuance from the course should be added?",    type:"single",    options:[      {text:"Kafka encourages event thinking, but schema management reintroduces entity-like structure to govern data", correct:true},      {text:"Kafka forbids any data structure", correct:false},      {text:"Kafka requires only relational tables", correct:false},      {text:"Governance is useless once there is real time", correct:false}    ],    explanation:{      key:"The Kafka paradigm puts facts at the center, but events remain structured and governed by schemas.",      correct:["The course explains that the schema corresponds to logic closer to thing/entity thinking, useful for governance and compatibility."],      incorrect:["Kafka does not forbid structure; Schema Registry exists precisely to manage it.","Kafka does not require modeling only in relational tables.","Real time actually increases the importance of reliable data contracts."],      exam:["Thinking in events does not mean ignoring data contracts.","The schema describes the shape; the event describes the fact." ]    }  },  {    text:"Which sequence best matches the Kafka behavior presented for an event produced at time T?",    type:"single",    options:[      {text:"Producer publishes → Kafka retains → real-time consumer receives → another consumer can replay later", correct:true},      {text:"Consumer creates the schema → BI dashboard removes Kafka → producer reads the batch", correct:false},      {text:"Kafka always waits until midnight → creates a file → processes it the next day", correct:false},      {text:"Schema Registry stores the event → Kafka stores only the schema", correct:false}    ],    explanation:{      key:"The presented lifecycle combines publication, retention, immediate distribution, and the possibility of replay.",      correct:["This sequence reflects the roles of the producer, Kafka broker, retention, and consumers."],      incorrect:["This chain reverses roles and removes the broker without matching the course logic.","Waiting until midnight corresponds to batch, which the course contrasts with real time.","It is the opposite: Kafka stores events, Schema Registry manages schemas."],      exam:["Producer writes, Kafka retains and distributes, consumers read/replay.","Schema Registry is not event storage." ]    }  },  {    text:"In an event-driven architecture project, which decisions align with the implicit best practices of the module?",    type:"multi",    options:[      {text:"Identify important business facts and publish them as events", correct:true},      {text:"Plan structural compatibility through governed schemas", correct:true},      {text:"Allow multiple consumers to use the same stream at their own pace", correct:true},      {text:"Force all processing to wait for a periodic batch", correct:false},      {text:"Systematically overwrite history to keep only the latest state", correct:false}    ],    explanation:{      key:"The event-driven architecture from the course relies on timestamped facts, continuous streams, retention, and structural governance.",      correct:["Business facts are the raw material of the event model.","Schemas reduce breakages between producers and consumers.","Retention and decoupling allow different consumption rhythms."],      incorrect:["Periodic batch processing contradicts the goal of processing data as it flows.","Overwriting history prevents replay and state reconstruction, two capabilities highlighted in the module."],      exam:["Event-driven = produce facts, not just synchronize tables.","History + schema + decoupled consumers are key pillars to remember." ]    }  },  {    text:"The course cites BI, ML, and reporting as possible outcomes. Which main Kafka use case do they belong to?",    type:"single",    options:[      {text:"Data pipelines and analytics", correct:true},      {text:"Exclusive ACL management", correct:false},      {text:"Replacement of all web browsers", correct:false},      {text:"Removal of all external connectivity", correct:false}    ],    explanation:{      key:"Data pipelines and analytics are one of the three major Kafka use cases cited at the beginning of the module.",      correct:["Events feed dashboards, ML models, or reporting systems."],      incorrect:["ACLs are not covered in this module and do not correspond to the BI/ML/reporting passage.","Kafka has nothing to do with replacing browsers.","The course instead emphasizes integration with external systems."],      exam:["BI/ML/reporting usually point to pipelines and analytics.","Do not mix Kafka security with business use cases if the scenario discusses data analysis." ]    }  },  {    text:"In the context of the module, which statement would be a CCDAK exam trap?",    type:"single",    options:[      {text:"Kafka is only an ephemeral bus: a message disappears as soon as it is read", correct:true},      {text:"Kafka can process events in real time", correct:false},      {text:"Kafka can retain past events", correct:false},      {text:"Kafka integrates with an ecosystem of processing, governance, and connectors", correct:false}    ],    explanation:{      key:"The module emphasizes that Kafka is not only an ephemeral message bus thanks to its retention.",      correct:["This statement is the trap: it describes Kafka poorly because reading by a consumer does not automatically delete the retained event."],      incorrect:["Real-time processing is explicitly highlighted.","Retention of past events is a central principle of the module.","The complete ecosystem around the broker is explicitly presented."],      exam:["Trap: Kafka ≠ traditional destructive queue.","Retention and replay are essential to understanding Kafka for certification." ]    }  }];function shuffleOptions() {  var i;  for (i = 0; i < QUESTIONS.length; i++) {    var arr = QUESTIONS[i].options;    var j;    for (j = arr.length - 1; j > 0; j--) {      var k = Math.floor(Math.random() * (j + 1));      var tmp = arr[j];      arr[j] = arr[k];      arr[k] = tmp;    }  }}function formatTime(sec) {  var m = Math.floor(sec / 60);  var s = sec % 60;  return (m < 10 ? "0" + m : "" + m) + ":" + (s < 10 ? "0" + s : "" + s);}function startTimer() {  clearInterval(timerInterval);  timeLeft = 90;  timerInterval = setInterval(function(){    timeLeft = timeLeft - 1;    paintTimer();    if (timeLeft <= 0) {      clearInterval(timerInterval);      timeoutMessage = "Time is up!";      validate(true);    }  }, 1000);}function paintTimer() {  var el = document.getElementById("timer");  if (!el) { return; }  el.innerHTML = formatTime(timeLeft);  el.className = "timer";  if (timeLeft <= 15) { el.className = "timer red"; }  else if (timeLeft <= 30) { el.className = "timer orange"; }}function pickOption(i) {  if (answered) { return; }  var q = QUESTIONS[qIdx];  if (q.type === "single") {    selected = [i];  } else {    var pos = selected.indexOf(i);    if (pos >= 0) { selected.splice(pos, 1); }    else { selected.push(i); }  }  paint();}function isCorrectSelection() {  var q = QUESTIONS[qIdx];  var i;  for (i = 0; i < q.options.length; i++) {    var should = q.options[i].correct;    var has = selected.indexOf(i) >= 0;    if (should !== has) { return false; }  }  return true;}function validate(auto) {  if (answered) { return; }  answered = true;  clearInterval(timerInterval);  elapsedTimes.push(90 - timeLeft);  if (isCorrectSelection()) { score = score + 1; }  paint();}function nextQuestion() {  if (!answered) { return; }  qIdx = qIdx + 1;  selected = [];  answered = false;  timeoutMessage = "";  if (qIdx >= QUESTIONS.length) {    clearInterval(timerInterval);    paintScore();  } else {    paint();    startTimer();  }}function restart() {  clearInterval(timerInterval);  qIdx = 0;  selected = [];  answered = false;  score = 0;  timeLeft = 90;  elapsedTimes = [];  timeoutMessage = "";  shuffleOptions();  paint();  startTimer();}function letters(i) {  return String.fromCharCode(65 + i);}function paint() {  var q = QUESTIONS[qIdx];  var pct = Math.round((qIdx / QUESTIONS.length) * 100);  document.getElementById("progress").style.width = pct + "%";  var html = "";  html += "<div class='head'><div class='meta'><span class='pill'>Question " + (qIdx + 1) + " / " + QUESTIONS.length + "</span>";  html += "<span class='pill'>" + (q.type === "single" ? "Single answer" : "Multiple answers") + "</span></div>";  html += "<div id='timer' class='timer'>" + formatTime(timeLeft) + "</div></div>";  html += "<h1>Kafka CCDAK Quiz — Module 1</h1>";  html += "<h2>" + q.text + "</h2>";  html += "<div class='options'>";  var i;  for (i = 0; i < q.options.length; i++) {    var cls = "option";    var has
