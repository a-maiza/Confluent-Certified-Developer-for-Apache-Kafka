<script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'single',q:'A system must read data from an external database, perform light transformations, and store the results in a Kafka topic. Which approach is most suitable?',opts:[{t:'Consumer + Producer',c:false},{t:'Kafka Connect Source',c:true},{t:'Kafka Connect Sink',c:false},{t:'Kafka Streams',c:false}],exp:{key:'Kafka Connect Source connectors import data from external systems into Kafka.',correct:['A source connector reads from the database and writes records to Kafka. Single Message Transforms can handle lightweight transformations.'],wrong:['A sink connector exports from Kafka. Kafka Streams processes data already in Kafka. A custom consumer+producer is more code than needed.'],tip:'Source = into Kafka. Sink = out of Kafka.'}},
    {type:'single',q:'You need to aggregate real-time data from a Kafka topic, compute running totals, and publish those totals to another topic. Which tool should you use?',opts:[{t:'Consumer + Producer',c:false},{t:'Kafka Connect Source',c:false},{t:'Kafka Connect Sink',c:false},{t:'Kafka Streams',c:true}],exp:{key:'Kafka Streams is for stream processing, including stateful operations.',correct:['Running totals require aggregation and state stores, which are Kafka Streams strengths.'],wrong:['Connect moves data between systems; it is not a general aggregation engine.'],tip:'Transform/aggregate streams = Kafka Streams or ksqlDB.'}},
    {type:'single',q:'You need to export data from a Kafka topic to a relational database for storage and analysis. Which component fits best?',opts:[{t:'Consumer + Producer',c:false},{t:'Kafka Connect Source',c:false},{t:'Kafka Connect Sink',c:true},{t:'Kafka Streams',c:false}],exp:{key:'Sink connectors move data from Kafka to external systems.',correct:['A JDBC Sink Connector can write topic data into a relational database.'],wrong:['Source connectors import into Kafka. Streams transforms Kafka data but does not replace a database sink connector.'],tip:'Kafka → external system = Sink Connector.'}},
    {type:'single',q:'A bank needs real-time fraud analysis on sensitive mainframe transaction data. Which architecture best fits?',opts:[{t:'Use a mainframe source connector to ingest into Kafka, then Kafka Streams anonymizes sensitive fields before fraud analysis.',c:true},{t:'Directly connect the mainframe to Kafka Streams using a custom API.',c:false},{t:'Use ksqlDB to directly query the mainframe system.',c:false},{t:'Use batch extraction and later Kafka analysis.',c:false}],exp:{key:'Combine Connect for ingestion and Streams for real-time processing/anonymization.',correct:['Kafka Connect handles source integration; Kafka Streams can anonymize and analyze the stream in real time.'],wrong:['Direct coupling and batch approaches reduce scalability and real-time guarantees. ksqlDB queries Kafka, not arbitrary mainframes directly.'],tip:'Ingest first, process in Kafka, protect sensitive data early.'}},
    {type:'single',q:'An e-commerce company needs real-time recommendations from sensitive browsing/session data. How should Kafka be used?',opts:[{t:'Capture sessions into Kafka with a Source Connector, anonymize with stream processing, then aggregate for recommendations.',c:true},{t:'Use only a custom producer and avoid Connect.',c:false},{t:'Write sessions to NoSQL via Sink Connector first, then read from DB.',c:false},{t:'Have ksqlDB pull sessions directly from source systems.',c:false}],exp:{key:'Connect ingests data; stream processing anonymizes and derives recommendations.',correct:['This uses the Kafka ecosystem while preserving decoupling and privacy controls.'],wrong:['The other options add coupling, latency, or misuse Sink/ksqlDB.'],tip:'For sensitive events: source ingestion + stream anonymization + downstream topics.'}},
    {type:'single',q:'A company monitors infrastructure metrics from many sources, some with proprietary fields. Which approach best ensures only critical non-proprietary metrics are alerted on?',opts:[{t:'Use Source Connectors with filtering/SMTs where appropriate, then Kafka Streams for alerting.',c:true},{t:'Stream all data with custom producers and separate later.',c:false},{t:'Use ksqlDB to ingest all metrics directly.',c:false},{t:'Sink all metrics to a database, batch-filter, then reingest.',c:false}],exp:{key:'Filter early and process streams continuously.',correct:['Connect can ingest and filter/remove fields; Streams can implement alerting logic.'],wrong:['Batch and database round-trips undermine real-time alerting. Custom producers increase maintenance.'],tip:'SMTs are useful for lightweight field filtering; complex logic belongs in stream processing.'}},
    {type:'single',q:'A company must aggregate sales data from regional SQL databases and cloud storage into a centralized Kafka topic. What is best?',opts:[{t:'Deploy Kafka Streams near each regional source.',c:false},{t:'Use Kafka Connect with suitable Source Connectors for each source technology.',c:true},{t:'Implement custom producers in every regional system.',c:false},{t:'Use Sink Connectors for each regional system into Kafka.',c:false}],exp:{key:'Heterogeneous external systems into Kafka are a Kafka Connect Source use case.',correct:['Different source connectors can ingest from SQL and cloud storage into Kafka.'],wrong:['Sink direction is wrong. Streams expects Kafka input. Custom producers require more code.'],tip:'Diverse systems → Connect ecosystem.'}},
    {type:'single',q:'A media platform needs high-volume real-time clicks, views, and comments analyzed for recommendations. Which architecture best suits this?',opts:[{t:'Ingest interaction data into Kafka, then process with Kafka Streams for real-time recommendation updates.',c:true},{t:'Use only custom APIs and ksqlDB for everything.',c:false},{t:'Use batch jobs over an external database.',c:false},{t:'Sink to a big data platform first, then process externally.',c:false}],exp:{key:'Real-time interaction data should flow through Kafka and stream processing.',correct:['Kafka ingestion plus Kafka Streams enables scalable, low-latency processing.'],wrong:['Batch and external-first designs add latency and complexity.'],tip:'User interactions are classic streaming events.'}},
    {type:'single',q:'An IoT utility company wants near-real-time telemetry aggregation and anomaly detection. Which solution fits?',opts:[{t:'Use Sink Connectors to collect telemetry into Kafka, then Streams.',c:false},{t:'Use appropriate Source Connectors for device protocols, then Kafka Streams for aggregation/anomaly detection.',c:true},{t:'Use custom producers only and external tools to pull from Kafka.',c:false},{t:'Collect into a central DB first, then ingest to Kafka.',c:false}],exp:{key:'Device/external system data entering Kafka uses source connectors or producers; processing uses Streams.',correct:['Source connectors ingest telemetry; Kafka Streams aggregates and detects anomalies.'],wrong:['Sink direction is wrong; central DB first adds latency.'],tip:'Source connector when data starts outside Kafka.'}},
    {type:'single',q:'A marketing platform has fluctuating Kafka activity volume and must keep stream processing performant during peaks. What strategy is best?',opts:[{t:'Dynamically adjust topic partition count constantly.',c:false},{t:'Scale Kafka Streams application instances with processing load.',c:true},{t:'Change source connector tasks for already-ingested Kafka activity topics.',c:false},{t:'Modify replication factor during peaks.',c:false}],exp:{key:'Kafka Streams scales horizontally by adding application instances up to partition parallelism.',correct:['Scaling stream processors handles processing load without changing core topic topology frequently.'],wrong:['Changing partition count dynamically is operationally risky; replication factor affects durability, not processing capacity.'],tip:'Processing bottleneck → scale processors, assuming enough partitions.'}},
    {type:'single',q:'An e-commerce company sees huge order spikes during sales. Which approach helps Kafka storage/throughput capacity scale?',opts:[{t:'Create more topics automatically during spikes.',c:false},{t:'Use source connectors to adjust order volume.',c:false},{t:'Scale out the Kafka broker cluster and ensure topics have enough partitions to use the capacity.',c:true},{t:'Only change producer batch/linger dynamically.',c:false}],exp:{key:'Broker capacity and partitioning determine cluster throughput capacity.',correct:['Adding brokers can increase capacity, but topics must have enough partitions and balanced leadership to benefit.'],wrong:['More topics is not a scaling strategy by itself. Producer tuning helps but cannot overcome insufficient cluster capacity.'],tip:'Brokers add capacity; partitions expose parallelism.'}},
    {type:'single',q:'A streaming media company processes viewer watch history with peaks during releases. What should be scaled for variable processing load?',opts:[{t:'Replication factor in real time.',c:false},{t:'Kafka Connect Sink tasks to write into Kafka.',c:false},{t:'Kafka Streams application instances processing the watch history.',c:true},{t:'Constantly modify topic partitions during peaks.',c:false}],exp:{key:'Variable processing load is handled by scaling stream processors.',correct:['More Kafka Streams instances can process partitions in parallel, up to the number of input partitions.'],wrong:['Sink connectors export from Kafka; partition count changes are not a frequent load knob.'],tip:'The provided source text was contradictory here; the correct answer is Streams scaling.'}},
    {type:'single',q:'A logistics team skilled in SQL wants to centralize diverse database tracking data into Kafka and transform it. Which approach fits?',opts:[{t:'Use JDBC Source Connectors, then Kafka Streams Java code only.',c:false},{t:'Use custom scripts to extract and publish.',c:false},{t:'Pre-consolidate everything in RDBMS stored procedures first.',c:false},{t:'Ingest with JDBC Source Connectors and use ksqlDB for SQL-like transformations/routing.',c:true}],exp:{key:'ksqlDB is useful when teams prefer SQL-like stream processing.',correct:['JDBC Source Connectors ingest database data, and ksqlDB enables SQL-style transformations on Kafka streams.'],wrong:['Custom scripts and stored procedures add coupling and operational burden.'],tip:'SQL-skilled team + Kafka streams = consider ksqlDB.'}},
    {type:'single',q:'A retail team wants SQL-friendly real-time transaction transformation and querying from a legacy system. Best approach?',opts:[{t:'JDBC Source + Kafka Streams only.',c:false},{t:'CSV exports + custom producers.',c:false},{t:'JDBC Source into Kafka + ksqlDB for SQL-like transformation/querying.',c:true},{t:'Only transform in the legacy system first.',c:false}],exp:{key:'Use Connect for ingestion and ksqlDB for SQL-like stream work.',correct:['The team can query, transform, and join streams with SQL-like syntax.'],wrong:['CSV and batch-style exports are less real time. Legacy-only transformation increases coupling.'],tip:'ksqlDB is a good fit for SQL-friendly stream processing.'}},
    {type:'single',q:'An automotive team skilled in SQL needs real-time analytics on sensor data stored in a database. Which solution fits best?',opts:[{t:'JDBC Source into Kafka, then Kafka Streams Java transformations only.',c:false},{t:'Export to JSON manually, ingest, and visualize only.',c:false},{t:'Custom producers plus SQL procedures inside Kafka.',c:false},{t:'JDBC Source into Kafka, then ksqlDB for real-time analytics and transformations.',c:true}],exp:{key:'JDBC Source + ksqlDB combines database ingestion and SQL-like streaming analytics.',correct:['This minimizes custom code and matches the team’s SQL skill set.'],wrong:['Custom procedures/producers add unnecessary complexity.'],tip:'Use existing connectors before writing custom ingestion code.'}},
    {type:'single',q:'Which connector imports data from PostgreSQL into Kafka?',opts:[{t:'JDBC Source Connector',c:true},{t:'S3 Sink Connector',c:false},{t:'Elasticsearch Sink Connector',c:false},{t:'HDFS Sink Connector',c:false}],exp:{key:'Relational database into Kafka uses JDBC Source or CDC source connectors.',correct:['JDBC Source Connector can import rows from PostgreSQL into Kafka.'],wrong:['The other options are sinks from Kafka to external stores.'],tip:'PostgreSQL → Kafka: JDBC Source or CDC Source depending on latency/change-capture needs.'}},
    {type:'single',q:'Which connector exports Kafka topic data into Elasticsearch for text search?',opts:[{t:'JDBC Sink Connector',c:false},{t:'Elasticsearch Sink Connector',c:true},{t:'MongoDB Sink Connector',c:false},{t:'File Sink Connector',c:false}],exp:{key:'Elasticsearch Sink exports Kafka records into Elasticsearch indexes.',correct:['This enables search and analytics over streamed data.'],wrong:['Other sinks target other systems.'],tip:'Kafka → Elasticsearch = Elasticsearch Sink.'}},
    {type:'single',q:'A stream processing app stores processed events in Amazon S3 for long-term analysis. Which connector is appropriate?',opts:[{t:'JDBC Source Connector',c:false},{t:'S3 Sink Connector',c:true},{t:'MQTT Source Connector',c:false},{t:'File Source Connector',c:false}],exp:{key:'S3 Sink writes Kafka topic data into S3.',correct:['Processed events should be published to Kafka, then exported to S3 by a sink connector.'],wrong:['Source connectors import into Kafka, not export to S3.'],tip:'Kafka → object storage = Sink Connector.'}},
    {type:'single',q:'IoT sensor readings must be correlated with weather forecasts from an external API. Which architecture is best?',opts:[{t:'Ingest sensor data via MQTT Source, ingest forecasts via HTTP/API source into Kafka, then join with Kafka Streams.',c:true},{t:'Custom producers merge everything before Kafka.',c:false},{t:'Kafka Streams calls the weather API for every sensor record.',c:false},{t:'Round-trip through a database and cron jobs.',c:false}],exp:{key:'Represent both sensor data and reference/API data as Kafka streams, then join inside Kafka.',correct:['This avoids per-record API calls in stream processing and keeps data replayable.'],wrong:['Per-record API calls create latency and rate-limit issues. Database/cron round-trips are too complex and slow.'],tip:'External enrichment data should often be ingested into Kafka first.'}},
    {type:'single',q:'POS systems dump sales into local SQL databases with bandwidth limits. What strategy is optimal for real-time central analysis?',opts:[{t:'JDBC polling plus SMTs only.',c:false},{t:'Use log-based CDC connectors to stream only new/changed sales records into Kafka.',c:true},{t:'Custom producers with compression only.',c:false},{t:'Nightly central database aggregation.',c:false}],exp:{key:'CDC minimizes data movement by capturing changes rather than repeatedly scanning full tables.',correct:['CDC is bandwidth-efficient and near-real-time.'],wrong:['Polling may move more data; batch misses real-time requirements.'],tip:'Bandwidth-limited DB integration → CDC is often best.'}},
    {type:'single',q:'Viewer interaction logs are in distributed NoSQL databases and need low-latency analysis. Which setup is most appropriate?',opts:[{t:'Custom NoSQL Source Connectors for each location, then Kafka Streams.',c:false},{t:'NoSQL CDC/source connectors into Kafka, then ksqlDB or Streams for real-time insights.',c:true},{t:'MQTT brokers for database logs.',c:false},{t:'Nightly batch ETL.',c:false}],exp:{key:'Low-latency database-change ingestion should use source/CDC connectors when available.',correct:['Streaming changes into Kafka and processing continuously supports personalization use cases.'],wrong:['MQTT is not a natural database-log integration. Batch is not real time.'],tip:'Use CDC/source connectors for database-resident events.'}},
    {type:'single',q:'User reviews are stored in MongoDB and must feed near-real-time sentiment analysis. Which is best?',opts:[{t:'MongoDB Source/CDC connector captures new and updated reviews into Kafka, then Streams/ksqlDB processes them.',c:true},{t:'Cron export to CSV and File Source.',c:false},{t:'Only batch exports.',c:false},{t:'Kafka Streams directly polls MongoDB API without storing reviews in Kafka.',c:false}],exp:{key:'MongoDB changes into Kafka should use a source/CDC connector.',correct:['This captures recent feedback quickly and keeps Kafka as the replayable event backbone.'],wrong:['CSV/cron adds delay. Direct polling from Streams bypasses Kafka’s decoupling.'],tip:'Operational databases → source/CDC connector → Kafka.'}},
    {type:'single',q:'Legacy financial transactions must be enriched with real-time fraud signals and shown on a dashboard. What is most effective?',opts:[{t:'JDBC Source, Kafka Streams join, and Sink to dashboard store.',c:false},{t:'Custom producers enrich before Kafka.',c:false},{t:'Kafka Streams directly queries legacy databases.',c:false},{t:'CDC connectors stream legacy transactions to Kafka, Kafka Streams enriches, then ksqlDB/Sink prepares dashboard output.',c:true}],exp:{key:'CDC is strong for low-latency legacy database ingestion; Streams handles enrichment.',correct:['This keeps ingestion, enrichment, and presentation decoupled and real time.'],wrong:['Direct DB access from Streams and custom enrichment increase coupling. JDBC polling may be less real time than CDC.'],tip:'CDC + Streams is a common real-time enrichment architecture.'}},
    {type:'single',q:'Where are Kafka Connect connector configurations stored in distributed mode?',opts:[{t:'Separate config file on each worker.',c:false},{t:'Kafka broker config directory.',c:false},{t:'ZooKeeper under <code>/kafka-connect</code>.',c:false},{t:'Internal Kafka topic such as <code>connect-configs</code>.',c:true}],exp:{key:'Distributed Kafka Connect stores connector configs in an internal Kafka topic.',correct:['The configs topic is commonly named <code>connect-configs</code>, depending on worker configuration.'],wrong:['Worker property files configure the worker, not all connector configs. ZooKeeper is not used for connector configs.'],tip:'Connect internal topics: configs, offsets, status.'}},
    {type:'single',q:'You want to export Kafka topic data to a relational database. Which connector type?',opts:[{t:'Source Connector',c:false},{t:'Sink Connector',c:true},{t:'Transformation Connector',c:false},{t:'Import Connector',c:false}],exp:{key:'Sink connectors write Kafka records to external systems.',correct:['A JDBC Sink Connector is the usual choice for Kafka to relational database.'],wrong:['Source is the opposite direction. Transformation Connector and Import Connector are not connector categories.'],tip:'Sink = Kafka to outside.'}},
    {type:'single',q:'You need to stream a Twitter feed into Kafka. Which connector type?',opts:[{t:'Sink Connector',c:false},{t:'Source Connector',c:true},{t:'Transformation Connector',c:false},{t:'Export Connector',c:false}],exp:{key:'External feed into Kafka is a source connector use case.',correct:['A source connector produces records from the external feed into Kafka topics.'],wrong:['Sink/export is Kafka to external.'],tip:'Outside → Kafka = Source.'}},
    {type:'single',q:'You move data from an external source into Kafka, process with Kafka Streams, then store results in HDFS. Which connector types are needed?',opts:[{t:'Source Connector → Sink Connector',c:true},{t:'Sink Connector → Source Connector',c:false},{t:'Source Connector → Source Connector',c:false},{t:'Sink Connector → Sink Connector',c:false}],exp:{key:'The flow is external system into Kafka, then Kafka out to HDFS.',correct:['Source connector imports raw data; sink connector exports processed topic data to HDFS.'],wrong:['The other orders/directions do not match the data flow.'],tip:'Draw arrows: external → Kafka → external.'}},
    {type:'single',q:'A JDBC source connector copies one database table with 5 columns to Kafka. How many tasks are created?',opts:[{t:'1',c:true},{t:'5',c:false},{t:'Always equal to <code>tasks.max</code>.',c:false},{t:'Equal to target topic partitions.',c:false}],exp:{key:'JDBC source task parallelism is based on tables/query splits, not columns.',correct:['For a single table in typical JDBC Source behavior, one task handles that table.'],wrong:['Columns do not create tasks. Topic partitions do not directly decide source connector task count.'],tip:'Connector task parallelism depends on connector implementation.'}},
    {type:'single',q:'If <code>tasks.max</code> is less than the number of tables copied by a JDBC source connector, what happens?',opts:[{t:'It ignores <code>tasks.max</code> and creates one task per table.',c:false},{t:'It creates up to <code>tasks.max</code> tasks and assigns multiple tables to tasks.',c:true},{t:'It leaves some tables without tasks forever.',c:false},{t:'It always fails.',c:false}],exp:{key:'<code>tasks.max</code> limits the maximum number of connector tasks.',correct:['Connectors distribute work across the tasks they are allowed to create.'],wrong:['The limit is not ignored; tables are not intentionally skipped; insufficient tasks is not automatically fatal.'],tip:'<code>tasks.max</code> is a ceiling, not a guarantee of that many tasks.'}},
    {type:'multiple',q:'How can you increase JDBC source connector parallelism/performance? Select all that apply.',opts:[{t:'Increase the connector <code>tasks.max</code> when the connector workload can be split.',c:true},{t:'Increase target topic partitions only.',c:false},{t:'Increase a worker-wide <code>tasks.max</code> setting.',c:false},{t:'Use multiple connector instances for different subsets of tables.',c:true}],exp:{key:'Connector parallelism comes from connector tasks and workload splitting.',correct:['Increasing connector <code>tasks.max</code> can allow more tasks if the connector supports more splits.','Multiple connector instances can split table groups explicitly.'],wrong:['More target partitions may help downstream consumers but does not guarantee faster DB reads. There is no generic worker-wide <code>tasks.max</code> that increases a connector’s task count.'],tip:'Scale Connect by tasks and workers, but source system capacity matters.'}},
    {type:'multiple',q:'Which information is NOT stored in the <code>connect-status</code> topic? Select all that apply.',opts:[{t:'Connector and task configurations.',c:true},{t:'Current status of connectors and tasks.',c:false},{t:'Source connector offsets.',c:true},{t:'Worker node assignment/status metadata.',c:false}],exp:{key:'Kafka Connect has separate internal topics for configs, offsets, and status.',correct:['Configs are in <code>connect-configs</code>. Source offsets are in <code>connect-offsets</code>.'],wrong:['Status and task/worker state belong in the status topic.'],tip:'Configs ≠ offsets ≠ status.'}},
    {type:'single',q:'A topic has 10 partitions and a consumer group has 3 consumers. What is the maximum partitions assigned to one consumer?',opts:[{t:'3',c:false},{t:'4',c:true},{t:'5',c:false},{t:'10',c:false}],exp:{key:'Partitions are distributed as evenly as possible among consumers.',correct:['10 partitions across 3 consumers gives a 4/3/3 distribution, so the maximum is 4.'],wrong:['3 is the minimum for two consumers here, not the maximum. 10 would mean no balancing.'],tip:'Maximum is usually ceiling(partitions / consumers).'}},
    {type:'single',q:'A topic has 12 partitions and a group has 4 consumers. How many consumers actively consume?',opts:[{t:'1',c:false},{t:'3',c:false},{t:'4',c:true},{t:'12',c:false}],exp:{key:'A consumer can be active if at least one partition is assigned to it.',correct:['With 12 partitions and 4 consumers, each gets about 3 partitions, so all 4 are active.'],wrong:['Broker count is irrelevant to consumer activity here. The source answer claiming 3 was incorrect.'],tip:'Consumers beyond partition count are idle; here partitions exceed consumers.'}},
    {type:'single',q:'What is the purpose of the <code>connect-offsets</code> topic?',opts:[{t:'Store connector configurations.',c:false},{t:'Store connector task status.',c:false},{t:'Store source connector offsets.',c:true},{t:'Store sink connector output offsets only.',c:false}],exp:{key:'Kafka Connect tracks source positions in the offsets internal topic.',correct:['Source connectors store external-system offsets so they can resume after failures.'],wrong:['Configs and status have separate internal topics. Sink connectors primarily rely on Kafka consumer group offsets for Kafka topic positions.'],tip:'Source offsets are external-system positions.'}},
    {type:'single',q:'How does Kafka Connect scale connectors?',opts:[{t:'Automatically creates connector instances based on load.',c:false},{t:'Allows configuring connector task parallelism with <code>tasks.max</code>.',c:true},{t:'Dynamically changes task count by performance metrics.',c:false},{t:'Requires one Connect cluster per connector.',c:false}],exp:{key:'Kafka Connect parallelizes work using tasks.',correct:['You configure a connector’s maximum task count with <code>tasks.max</code>; Connect distributes tasks across workers.'],wrong:['It does not auto-scale task count by load in core Connect. Multiple connectors can share a Connect cluster.'],tip:'Connector = logical job; tasks = parallel units.'}},
    {type:'single',q:'What happens when a worker fails in a distributed Kafka Connect cluster?',opts:[{t:'Connectors and tasks on that worker are permanently lost.',c:false},{t:'Tasks are rebalanced and redistributed to remaining workers.',c:true},{t:'A new worker is automatically created by Kafka Connect itself.',c:false},{t:'The whole Connect cluster goes down.',c:false}],exp:{key:'Distributed Connect provides worker fault tolerance through rebalance.',correct:['Remaining workers take over tasks using internal topics for configs, offsets, and status.'],wrong:['Kafka Connect does not itself provision new machines. One worker failure does not kill the cluster if others remain.'],tip:'Distributed mode = fault-tolerant task reassignment.'}}
    ];

    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Kafka Connect, Streams, and ksqlDB.';else if(pct>=70)msg='Solid result; review source/sink direction, Connect internal topics, CDC, and processing choices.';else msg='Needs review: focus on Source vs Sink connectors, Kafka Streams vs Connect, and Connect task scaling.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
</body>
</html>
