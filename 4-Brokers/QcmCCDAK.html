    <style>
        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background:#378ADD;color:#fff}.btn.secondary{background:#eef2f7;color:#1f2937}.btn:disabled{background:#cbd5e1;color:#64748b;cursor:not-allowed}.explain{display:none;margin-top:18px;border-top:1px solid #e5e7eb;padding-top:16px}.explain h3{margin:14px 0 6px;font-size:16px;color:#111827}.explain p,.explain li{line-height:1.52}.warn{font-weight:800;color:#b91c1c}.scoreBox{text-align:center;padding:22px}.scoreNum{font-size:48px;font-weight:900;color:#378ADD}.resultBar{height:18px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin:18px 0}.resultFill{height:100%;background:#378ADD;width:0}.pill{display:inline-block;border:1px solid #d1d5db;border-radius:999px;padding:7px 11px;margin:4px;background:#fff}.hidden{display:none}.config{background:#f8fafc;border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:12px 0}.config ul{margin:6px 0 0}

<script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'single',q:'Assuming a Kafka topic is configured with <div class="config"><ul><li><code>log.segment.bytes=1073741824</code> (1 GB)</li><li><code>log.retention.ms=86400000</code> (1 day)</li><li><code>log.retention.bytes=-1</code></li></ul></div> Which statement accurately describes the log retention policy?',opts:[{t:'Logs are retained based on size; once the log size exceeds 1 GB, older segments are deleted.',c:false},{t:'Logs are retained for one day, with no size-based retention limit.',c:true},{t:'Logs are retained until the size exceeds 1 GB or for one day, whichever comes first.',c:false},{t:'Logs are retained indefinitely because <code>log.retention.bytes=-1</code> overrides other retention configurations.',c:false}],exp:{key:'<code>log.segment.bytes</code> controls segment rolling, not retention. <code>log.retention.ms</code> controls time-based retention. <code>log.retention.bytes=-1</code> disables size-based retention.',correct:['The active retention limit is time-based: one day. The topic has no size-based retention limit because <code>log.retention.bytes=-1</code>.'],wrong:['A 1 GB segment size does not mean delete after the log exceeds 1 GB.','There is no “whichever comes first” with a 1 GB total log limit here because size-based retention is disabled.','<code>-1</code> for retention bytes does not disable time-based retention.'],tip:'Segment size ≠ retention size. Segment settings decide when files roll; retention settings decide when old segments can be deleted.'}},
    {type:'single',q:'A topic has <div class="config"><ul><li><code>cleanup.policy=compact,delete</code></li><li><code>min.cleanable.dirty.ratio=0.5</code></li><li><code>delete.retention.ms=86400000</code> (1 day)</li><li><code>segment.ms=43200000</code> (12 hours)</li></ul></div> Which statement best describes compaction and deletion behavior?',opts:[{t:'Log compaction and deletion are mutually exclusive; only one policy can be active.',c:false},{t:'Both compaction and delete retention can apply; compaction becomes eligible based on dirty ratio, while delete policy can remove old segments according to retention settings.',c:true},{t:'Deleted records are removed immediately; <code>delete.retention.ms</code> is the retention time for all records.',c:false},{t:'<code>segment.ms</code> dictates the maximum lifespan of any record in the log.',c:false}],exp:{key:'Kafka can use <code>compact,delete</code> together. Compaction removes obsolete records by key, while delete cleanup can remove old segments according to retention constraints.',correct:['<code>min.cleanable.dirty.ratio=0.5</code> affects when compacted logs become eligible for cleaning. <code>delete.retention.ms</code> controls how long delete tombstones are retained for compaction consumers. <code>segment.ms</code> rolls segments; it does not define record lifetime.'],wrong:['Compaction and deletion are not mutually exclusive.','Tombstones are retained for a period before compaction removes them; they are not removed immediately.','<code>segment.ms</code> controls segment rolling, not maximum record lifetime.'],tip:'For compacted topics, remember tombstones: <code>delete.retention.ms</code> is about delete markers, not normal message retention.'}},
    {type:'multiple',q:'In a ZooKeeper-based Kafka cluster, which statements accurately describe the role and election of the Controller? Select two.',opts:[{t:'Elected by broker majority.',c:false},{t:'Elected through ZooKeeper controller registration.',c:true},{t:'Responsible for partition leader election.',c:true},{t:'Manages consumer group offsets.',c:false},{t:'Automatically assigns replicas to brokers based on load.',c:false}],exp:{key:'In ZooKeeper mode, one broker becomes the Kafka Controller through ZooKeeper coordination. The Controller manages partition state and leader elections.',correct:['The Controller is selected through ZooKeeper-based registration/coordination.','The Controller is responsible for partition leader elections and cluster metadata changes.'],wrong:['Controller election is not a broker-majority vote.','Consumer offsets are stored in Kafka internal topics such as <code>__consumer_offsets</code>, not managed by the Controller.','The Controller does not automatically balance replica placement based on load.'],tip:'ZooKeeper mode: Controller is a broker role coordinated by ZooKeeper. KRaft mode changes the controller architecture.'}},
    {type:'multiple',q:'For Kafka leadership scenarios in a ZooKeeper-based cluster, which answers are accurate? Select all that apply.',opts:[{t:'When the Controller broker fails, ZooKeeper coordination allows another broker to become Controller.',c:true},{t:'A new partition leader is normally chosen from the ISR, commonly following replica/ISR ordering among available replicas.',c:true},{t:'Brokers that lose ZooKeeper connectivity cannot safely continue normal leadership duties.',c:true},{t:'A broker majority inside an isolated segment elects a temporary Controller independently of ZooKeeper.',c:false},{t:'Partition leader election is determined by random selection among replicas with identical network latency.',c:false}],exp:{key:'ZooKeeper-based Kafka relies on ZooKeeper connectivity for controller coordination and cluster metadata. Partition leader election prefers eligible in-sync replicas, not random selection.',correct:['If the active Controller disappears, another broker can take over the controller role through ZooKeeper coordination.','Partition leaders are selected from eligible in-sync replicas to avoid data loss.','A broker isolated from ZooKeeper cannot reliably maintain normal cluster coordination.'],wrong:['Kafka does not let an isolated broker-majority create an independent temporary Controller outside ZooKeeper.','Network latency equality does not make leader election random.'],tip:'Leader election is metadata-driven and ISR-based, not latency-random.'}},
    {type:'single',q:'A producer uses <code>acks=all</code>. The topic has replication factor 3 and <code>min.insync.replicas=2</code>. The leader remains online, but both follower replicas go offline. What happens to successful writes?',opts:[{t:'The producer can publish successfully, but with potential data loss.',c:false},{t:'The producer cannot successfully write until at least one follower returns to the ISR.',c:true},{t:'The producer continues successfully without impact.',c:false},{t:'The producer automatically switches to another topic partition with all replicas available.',c:false}],exp:{key:'With <code>acks=all</code>, Kafka enforces <code>min.insync.replicas</code>. If ISR shrinks below 2, writes fail with not enough replicas.',correct:['Only the leader remains in the ISR, so ISR size is 1. Since <code>min.insync.replicas=2</code>, successful writes are rejected until at least one follower catches up and rejoins the ISR.'],wrong:['Kafka does not accept the write merely with data-loss risk when <code>min.insync.replicas</code> is not met.','There is an impact: writes to that partition fail.','Producers do not automatically redirect records to another topic or arbitrary partition to bypass ISR requirements.'],tip:'<code>acks=all</code> + <code>min.insync.replicas=2</code> means at least two ISR members must be available for successful writes.'}},
    {type:'single',q:'When a Kafka broker starts up in ZooKeeper mode, which task is NOT one of its normal startup tasks?',opts:[{t:'Registering itself with ZooKeeper.',c:false},{t:'Loading replica assignment metadata for partitions it hosts.',c:false},{t:'Creating a new ZooKeeper znode for each topic it has partitions for.',c:true},{t:'Initializing log directories for partitions it hosts.',c:false}],exp:{key:'A broker registers itself and loads metadata, but topic znodes/metadata are created when topics are created, not once per broker startup.',correct:['Creating a new ZooKeeper znode for each topic it has partitions for is not a normal broker startup task.'],wrong:['Broker registration with ZooKeeper is expected in ZooKeeper mode.','Loading partition and replica state is part of startup.','Initializing local log directories is required to serve partition data.'],tip:'Startup loads and registers broker state; topic metadata is not recreated per broker startup.'}},
    {type:'single',q:'How does the Kafka Controller ensure partition leadership is evenly distributed among brokers?',opts:[{t:'It periodically triggers rebalance operations to redistribute leadership.',c:false},{t:'It assigns leadership to the broker with the fewest leader partitions for every election.',c:false},{t:'It uses round-robin leadership assignment across brokers.',c:false},{t:'It does not actively optimize leadership distribution during normal leader election.',c:true}],exp:{key:'The Controller manages partition state and elects leaders, but it does not continuously optimize leadership balance by load.',correct:['Leader distribution mainly comes from replica assignment, preferred leader election, admin operations, and failure recovery, not a continuous controller balancing algorithm.'],wrong:['The Controller does not periodically rebalance leadership by itself.','It does not choose leaders simply by fewest current leaders.','It does not use round-robin for leader election.'],tip:'Controller handles correctness and state transitions; balancing is usually handled through assignment strategy, preferred leader election, or admin tooling.'}},
    {type:'single',q:'A ZooKeeper-based Kafka cluster has 5 brokers and a topic with 10 partitions and RF=3. A network partition splits brokers into Group A with 2 brokers and Group B with 3 brokers. Both groups can communicate with ZooKeeper. How does Kafka handle partition leadership?',opts:[{t:'Partitions with leaders in Group A continue normally, while Group B leaders go offline.',c:false},{t:'Group B automatically takes all leadership because it has the majority of brokers.',c:false},{t:'All partitions go offline until the network partition is resolved.',c:false},{t:'Behavior depends on Controller/ZooKeeper session ownership and ISR availability; Kafka does not simply use broker majority as a partition-leadership rule.',c:true}],exp:{key:'Classic Kafka with ZooKeeper does not make partition leadership decisions by broker-majority quorum. Leadership depends on the active Controller, ZooKeeper sessions, broker liveness, and eligible ISRs.',correct:['The “larger group wins all leadership” statement is too simplistic. If both groups can reach ZooKeeper, controller/session behavior and ISR membership determine which leaders remain or are re-elected.'],wrong:['Group A or Group B does not automatically win solely due to group size.','Kafka does not require a broker quorum for every partition leadership decision in ZooKeeper mode.','The Controller location and ZooKeeper view matter, so a majority-only explanation is misleading.'],tip:'Be careful with “majority” wording: Kafka replication is not Raft-style quorum replication in classic ZooKeeper mode.'}},
    {type:'single',q:'A broker has <code>num.io.threads=8</code>, <code>num.network.threads=4</code>, and <code>num.replica.fetchers=2</code>. What do these control?',opts:[{t:'I/O request handler threads, network processor threads, and follower fetcher threads used to fetch from leaders.',c:true},{t:'Network threads, disk I/O threads, and follower fetcher threads.',c:false},{t:'Disk I/O threads, network I/O threads, and threads used for pushing messages to followers.',c:false},{t:'Replication threads, disk threads, and network threads respectively.',c:false}],exp:{key:'These broker settings tune request processing, network handling, and follower replication fetch behavior.',correct:['<code>num.io.threads</code> controls broker I/O/request handler threads. <code>num.network.threads</code> controls network processor threads. <code>num.replica.fetchers</code> controls fetcher threads used by followers to fetch data from leaders.'],wrong:['Options that swap network and I/O thread meanings are incorrect.','Follower replication is pull-based: followers fetch from leaders.'],tip:'Replication followers fetch; leaders do not “push” records to followers in the usual mental model.'}},
    {type:'single',q:'A broker has <code>log.segment.bytes=1073741824</code>, <code>log.segment.ms=86400000</code>, <code>log.retention.bytes=-1</code>, and <code>log.retention.ms=604800000</code>. When does Kafka start a new segment, and how long are old segments retained?',opts:[{t:'New segment at 1 GB or after 24 hours, whichever comes first. Old segments retained for 7 days.',c:true},{t:'New segment at 1 GB or after 24 hours, whichever comes first. Old segments retained indefinitely.',c:false},{t:'New segment only at 1 GB. Old segments retained for 7 days or until total size exceeds 1 GB.',c:false},{t:'New segment only after 24 hours. Old segments retained for 7 days or until total size exceeds 1 GB.',c:false}],exp:{key:'Segment rolling and segment retention are separate. Segment rolling uses <code>log.segment.bytes</code> and <code>log.segment.ms</code>; retention uses <code>log.retention.ms</code> and <code>log.retention.bytes</code>.',correct:['The active segment rolls when it reaches 1 GB or 24 hours. Old segments are retained for 7 days because <code>log.retention.ms=604800000</code>. Size-based retention is disabled by <code>log.retention.bytes=-1</code>.'],wrong:['Retention is not indefinite because time-based retention is set.','Segment rolling is not only size-based.','Size-based retention is not 1 GB here.'],tip:'Roll policy answers “when do we create a new file?” Retention policy answers “when can old files be deleted?”'}},
    {type:'single',q:'A cluster has <code>default.replication.factor=2</code> and <code>min.insync.replicas=2</code>. What is the minimum replication factor needed to tolerate one broker failure while still serving writes with <code>acks=all</code>?',opts:[{t:'1',c:false},{t:'2',c:false},{t:'3',c:true},{t:'4',c:false}],exp:{key:'To tolerate one failed replica and still have two in-sync replicas, the topic needs at least three replicas.',correct:['With RF=3 and one broker failure, two replicas can remain in sync, satisfying <code>min.insync.replicas=2</code>. With RF=2, one failure leaves only one replica and writes fail.'],wrong:['RF=1 and RF=2 cannot tolerate one broker failure while still satisfying min ISR of 2.','RF=4 is more than the minimum.'],tip:'Formula intuition: to tolerate F failures with min ISR M, you generally need replication factor at least M + F.'}},
    {type:'single',q:'A topic uses defaults <code>num.partitions=6</code> and <code>default.replication.factor=3</code>. How many replicas are created in total?',opts:[{t:'6',c:false},{t:'9',c:false},{t:'12',c:false},{t:'18',c:true}],exp:{key:'Total replicas = number of partitions × replication factor.',correct:['6 partitions × 3 replicas each = 18 total replicas across the cluster.'],wrong:['6 counts only partitions.','9 and 12 do not match partitions multiplied by replication factor.'],tip:'Partitions are logical shards; replicas are copies of each shard.'}},
    {type:'single',q:'A cluster has <code>unclean.leader.election.enable=false</code>. What happens if a partition leader fails and no in-sync replicas are available?',opts:[{t:'The partition remains unavailable until the old leader recovers or an ISR becomes available.',c:true},{t:'Kafka elects an out-of-sync replica to maintain availability.',c:false},{t:'Kafka automatically creates a new replica to replace the failed leader.',c:false},{t:'The partition is automatically reassigned to another broker.',c:false}],exp:{key:'Disabling unclean leader election prioritizes consistency over availability.',correct:['Kafka will not elect an out-of-sync replica as leader. The partition remains unavailable until a safe leader can be elected.'],wrong:['Electing an out-of-sync replica is what unclean leader election allows when enabled.','Kafka does not instantly create a new replica to recover leadership.','Partition reassignment is not the automatic immediate response.'],tip:'Unclean leader election false = avoid data loss, accept possible unavailability.'}},
    {type:'single',q:'A broker has <code>num.replica.fetchers=4</code> and <code>replica.fetch.max.bytes=1048576</code>. What is the maximum data fetched for replication in a single fetch request?',opts:[{t:'1 MB',c:true},{t:'4 MB',c:false},{t:'1048576 bytes',c:true},{t:'4194304 bytes',c:false}],exp:{key:'<code>replica.fetch.max.bytes</code> limits the amount fetched per partition/request context, while fetcher count controls concurrency. In practical quiz terms, the per-request limit is 1 MB, or 1,048,576 bytes.',correct:['<code>1048576</code> bytes equals 1 MB. The number of fetcher threads does not multiply the maximum for one request.'],wrong:['4 MB incorrectly multiplies the per-request limit by the number of fetchers.','4,194,304 bytes is also that incorrect multiplication.'],tip:'Thread count affects parallelism; max bytes affects request size.'}},
    {type:'multiple',q:'A cluster has <code>log.retention.hours=48</code>, <code>log.retention.bytes=1073741824</code>, and <code>log.segment.bytes=536870912</code>. Which factors can cause old log segments to become eligible for deletion? Select all that apply.',opts:[{t:'A closed log segment is older than 48 hours.',c:true},{t:'A segment reaches <code>log.segment.bytes</code> and is rolled.',c:false},{t:'The total retained log size exceeds 1 GB.',c:true},{t:'All of the above.',c:false}],exp:{key:'Retention deletion is controlled by time and total log size. Segment size controls when segments roll, not directly when they are deleted.',correct:['Time-based retention can delete closed segments older than 48 hours.','Size-based retention can delete oldest segments when the total log size exceeds 1 GB.'],wrong:['A segment reaching <code>log.segment.bytes</code> causes segment rolling. It does not by itself mean the segment is eligible for deletion.','Because segment size is not itself a deletion trigger, “all of the above” is not accurate.'],tip:'Common trap: <code>log.segment.bytes</code> rolls files; <code>log.retention.bytes</code> deletes old files based on total size.'}},
    {type:'single',q:'A client sends a produce request and receives a <code>Not Enough Replicas</code> error. What should it generally do next?',opts:[{t:'Retry blindly on the same broker forever.',c:false},{t:'Refresh metadata and retry according to producer retry/backoff behavior.',c:true},{t:'Send the produce request to the controller broker.',c:false},{t:'Ask ZooKeeper directly for the controller broker.',c:false}],exp:{key:'Not Enough Replicas means the ISR requirement is not currently satisfied. The producer may retry, and metadata refresh helps ensure it has an up-to-date cluster view.',correct:['The practical client behavior is retry/backoff plus metadata refresh when necessary. The write can only succeed once enough replicas are in sync.'],wrong:['Blind retry without backoff or metadata awareness may just repeat the failure.','Clients do not send produce requests to the controller just because a partition lacks replicas.','Modern Kafka clients do not talk to ZooKeeper for normal produce operations.'],tip:'Client recovery usually means metadata refresh + retry, not direct ZooKeeper/controller interaction.'}},
    {type:'single',q:'A consumer fetch receives a <code>Replica Not Available</code> error. What is the best next action?',opts:[{t:'Back off and retry only, without refreshing metadata.',c:false},{t:'Commit offsets to trigger rebalancing.',c:false},{t:'Refresh metadata to update its view of leaders and replicas.',c:true},{t:'Close the connection and randomly connect to a different broker.',c:false}],exp:{key:'Replica/leader availability errors often indicate stale metadata or a cluster state change.',correct:['Refreshing metadata lets the consumer learn the current leader and replica state before retrying.'],wrong:['A delay alone may not fix stale metadata.','Offset commits do not trigger the right recovery path for replica availability.','Randomly changing brokers is not the main Kafka client mechanism.'],tip:'Metadata refresh is a core Kafka client response to many cluster topology errors.'}},
    {type:'single',q:'What happens if a producer writes to a non-existent topic and <code>auto.create.topics.enable=false</code>?',opts:[{t:'The broker creates the topic with defaults.',c:false},{t:'The request fails and the producer receives an unknown topic/partition-style error.',c:true},{t:'The producer creates the topic itself.',c:false},{t:'The producer waits indefinitely until the topic is created.',c:false}],exp:{key:'When automatic topic creation is disabled, Kafka will not create missing topics on produce or metadata access.',correct:['The produce attempt fails because the topic does not exist and the broker is not allowed to auto-create it.'],wrong:['The broker only auto-creates if the setting is enabled.','Producers do not create topics by themselves unless using AdminClient explicitly.','The normal behavior is failure/retry according to client settings, not indefinite waiting.'],tip:'Note: the typical error is not <code>TopicExistsException</code>; it is closer to unknown topic/partition metadata failure.'}},
    {type:'single',q:'What is the default value of <code>auto.create.topics.enable</code> in Apache Kafka?',opts:[{t:'<code>true</code>',c:true},{t:'<code>false</code>',c:false},{t:'It is not set by default.',c:false},{t:'It always depends on the Kafka version.',c:false}],exp:{key:'Apache Kafka defaults <code>auto.create.topics.enable</code> to true, although many production environments disable it.',correct:['By default, brokers can auto-create missing topics using broker defaults.'],wrong:['False is a common production choice but not the Apache Kafka default.','The setting has a default.','Managed platforms may differ, but the Apache Kafka default is true.'],tip:'Exam default: true. Production best practice often: disable and create topics intentionally.'}},
    {type:'single',q:'When a topic is automatically created because <code>auto.create.topics.enable=true</code>, which configurations are used?',opts:[{t:'The producer or consumer configurations.',c:false},{t:'The broker default topic configurations.',c:true},{t:'A mix of producer/consumer configuration and broker defaults.',c:false},{t:'No configurations; the topic is created empty.',c:false}],exp:{key:'Auto-created topics use broker defaults such as <code>num.partitions</code> and <code>default.replication.factor</code>.',correct:['Producer and consumer client settings do not define topic partition count or replication factor during broker auto-creation.'],wrong:['Client configs are not topic configs.','It is not an empty configuration; defaults apply.'],tip:'Auto-created topic = broker defaults, not application intent.'}},
    {type:'single',q:'Can Kafka zero-copy optimization be used together with compression?',opts:[{t:'Yes, zero-copy and compression can work together.',c:true},{t:'No, zero-copy is incompatible with compression.',c:false},{t:'Only with extra broker configuration.',c:false},{t:'Zero-copy is automatically disabled whenever compression is enabled.',c:false}],exp:{key:'Kafka can store and transfer compressed record batches. Zero-copy can transfer bytes efficiently without needing to decompress them on the broker.',correct:['Compression reduces bytes; zero-copy optimizes transfer of those bytes from disk/page cache to the socket. They are compatible concepts.'],wrong:['Compression does not inherently prevent zero-copy.','No special extra configuration is required just to combine the concepts.','Kafka does not automatically disable zero-copy just because compression is used.'],tip:'Kafka brokers usually avoid inspecting record contents; compressed batches can be stored and served efficiently.'}},
    {type:'single',q:'What is the relationship between topic <code>replication.factor</code> and <code>min.insync.replicas</code>?',opts:[{t:'<code>min.insync.replicas</code> must be less than or equal to the replication factor.',c:true},{t:'<code>min.insync.replicas</code> must be greater than the replication factor.',c:false},{t:'They are completely independent.',c:false},{t:'They must always be equal.',c:false}],exp:{key:'<code>min.insync.replicas</code> cannot be meaningfully higher than the number of replicas available for the partition.',correct:['If <code>min.insync.replicas</code> is greater than replication factor, writes with <code>acks=all</code> cannot be satisfied.'],wrong:['It does not have to be greater or exactly equal.','They are related because min ISR is bounded by replica count.'],tip:'Common durable setup: RF=3, min ISR=2, producer <code>acks=all</code>.'}},
    {type:'single',q:'What happens when a producer sends with <code>acks=all</code> to a topic where <code>min.insync.replicas</code> is greater than the current ISR count?',opts:[{t:'The producer receives an acknowledgment and the write succeeds.',c:false},{t:'The producer receives an error indicating the ISR requirement is not met.',c:true},{t:'The producer waits indefinitely until ISR count improves.',c:false},{t:'The producer ignores <code>min.insync.replicas</code>.',c:false}],exp:{key:'With <code>acks=all</code>, Kafka enforces <code>min.insync.replicas</code>. If too few replicas are in sync, writes fail.',correct:['The broker returns an error such as not enough replicas / not enough replicas after append, depending on timing.'],wrong:['The write is not acknowledged as successful.','The request does not wait forever; it fails according to request timeout/error behavior.','The setting is not ignored.'],tip:'If ISR &lt; min ISR, durable writes fail by design.'}},
    {type:'single',q:'What happens if both <code>log.retention.ms</code> and <code>log.retention.minutes</code> are set?',opts:[{t:'The larger unit value, minutes, takes precedence.',c:false},{t:'The smaller unit value, milliseconds, takes precedence.',c:true},{t:'Kafka averages both values.',c:false},{t:'Kafka always throws a configuration error.',c:false}],exp:{key:'Kafka retention time settings have unit precedence: milliseconds override minutes, which override hours.',correct:['If <code>log.retention.ms</code> is configured, it takes precedence over <code>log.retention.minutes</code> and <code>log.retention.hours</code>.'],wrong:['Minutes do not win over milliseconds.','Kafka does not average retention values.','This is not necessarily a configuration error; precedence resolves it.'],tip:'Most precise unit wins: ms > minutes > hours.'}},
    {type:'single',q:'How can you set a retention period of 2 weeks for a specific topic?',opts:[{t:'Set <code>retention.ms=1209600000</code> in the topic configuration.',c:true},{t:'Set <code>log.retention.hours=336</code> in the broker configuration.',c:false},{t:'Set <code>log.retention.ms=1209600000</code> in the broker configuration.',c:false},{t:'Set <code>retention.ms=1209600000</code> in the broker configuration.',c:false}],exp:{key:'Topic-level retention uses <code>retention.ms</code>. Broker-level defaults use <code>log.retention.*</code>.',correct:['2 weeks = 14 days = 1,209,600,000 milliseconds. Setting topic config <code>retention.ms=1209600000</code> affects that specific topic.'],wrong:['Broker-level retention affects defaults or all topics without overrides, not one specific topic.','<code>retention.ms</code> is the topic-level property, not the broker-level property.'],tip:'Topic config: <code>retention.ms</code>. Broker default: <code>log.retention.ms</code>.'}},
    {type:'single',q:'What is the default value of <code>log.retention.hours</code> in Kafka?',opts:[{t:'168 hours (1 week)',c:true},{t:'24 hours (1 day)',c:false},{t:'720 hours (30 days)',c:false},{t:'Infinite retention',c:false}],exp:{key:'The default Kafka log retention period is 168 hours, or 7 days, unless overridden.',correct:['168 hours equals one week.'],wrong:['24 hours and 30 days are not the default.','Default retention is not infinite.'],tip:'Default retention: one week. Always check topic overrides in real clusters.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on advanced Kafka configuration.';else if(pct>=70)msg='Solid result; review retention, ISR, controller behavior, and broker settings.';else msg='Needs review: focus on retention vs segment rolling, ISR durability, leader election, and topic defaults.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
