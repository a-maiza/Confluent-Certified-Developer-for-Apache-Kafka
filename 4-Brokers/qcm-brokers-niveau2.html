<script>
var QUESTIONS_MASTER = [
  /* ===== 1 — COURS ===== */
  {
    question: "A startup is building a proof-of-concept event streaming pipeline. Their operations team proposes deploying three Kafka broker instances on three Raspberry Pi 4 devices (4GB RAM) connected over a local network. A junior developer objects, claiming Kafka brokers require enterprise-grade server hardware. Which statement most accurately describes the physical requirements for running a Kafka broker?",
    type: "single",
    source: "cours",
    options: [
      { text: "A Kafka broker requires a dedicated bare-metal server with at least 32 GB of RAM and NVMe SSDs, making a Raspberry Pi unsuitable.", explanation: "Kafka imposes no minimum hardware specification. While high-throughput production clusters benefit from powerful hardware, the course explicitly states that any machine — including a Raspberry Pi — can run the Kafka JVM process and serve as a broker." },
      { text: "A Kafka broker is any machine — physical server, VM, cloud instance, or even a Raspberry Pi — running the Kafka JVM server process with access to local storage.", explanation: "Correct. The course defines a broker as any machine executing the Kafka JVM process. Hardware requirements depend on workload, not on architectural constraints. A Raspberry Pi is fully valid for development or PoC purposes." },
      { text: "A Kafka broker must run on the same machine as a ZooKeeper node to ensure low-latency metadata coordination.", explanation: "ZooKeeper has been completely removed since Apache Kafka 4.0. Even in older versions, ZooKeeper and brokers were separate processes and did not need to share the same machine." },
      { text: "A Kafka broker requires a minimum of 8 CPU cores and hardware RAID storage to handle concurrent partition I/O across topics.", explanation: "These are sizing guidelines for high-throughput production deployments, not hard requirements. There is no architectural minimum CPU or storage configuration specified for running a Kafka broker." }
    ],
    answers: [1],
    globalExplanation: "A Kafka broker is fundamentally defined as any machine running the Kafka JVM server process. The course makes this explicit with the Raspberry Pi example to show that hardware flexibility is a feature of the architecture, not a weakness. For development, testing, or learning, modest hardware is perfectly suitable. Production sizing depends on throughput, retention, and replication needs."
  },
  /* ===== 2 — COURS ===== */
  {
    question: "An operations team manages a Kafka 3.7 cluster that still uses a 3-node ZooKeeper ensemble for metadata coordination. They are planning a migration to Apache Kafka 4.0. A team member asks whether the ZooKeeper ensemble must be maintained after the upgrade, since several internal wikis still reference it. What is the definitive answer?",
    type: "single",
    source: "cours",
    options: [
      { text: "ZooKeeper must remain running after the Kafka 4.0 upgrade for backward compatibility with producers and consumers using older client libraries.", explanation: "ZooKeeper is not used by producers or consumers — it was only an internal coordination component for brokers. In Kafka 4.0, it is entirely removed. Client compatibility is unaffected by this change." },
      { text: "ZooKeeper can be kept optionally in Kafka 4.0 as a fallback metadata store; KRaft is just the recommended default.", explanation: "This is incorrect. ZooKeeper support was completely removed in Apache Kafka 4.0. There is no optional or hybrid mode — the migration to KRaft-only is mandatory." },
      { text: "The ZooKeeper ensemble can be fully decommissioned after upgrading to Kafka 4.0, because KRaft — Kafka's built-in Raft-based protocol — now handles all cluster metadata management internally.", explanation: "Correct. Since Kafka 4.0, KRaft replaces ZooKeeper entirely. All metadata (topics, partitions, leaders, ISR) is managed by the brokers themselves through the KRaft protocol. The ZooKeeper ensemble has no role and should be decommissioned." },
      { text: "ZooKeeper is still required in Kafka 4.0 for MirrorMaker 2 cross-datacenter replication and Schema Registry coordination.", explanation: "Neither MirrorMaker 2 nor Schema Registry require ZooKeeper. They communicate through the standard Kafka protocol. ZooKeeper has zero involvement in Kafka 4.0." }
    ],
    answers: [2],
    globalExplanation: "Apache Kafka 4.0 marks the complete and final removal of ZooKeeper. KRaft (Kafka Raft) is Kafka's own implementation of the Raft consensus algorithm that replaces ZooKeeper for all metadata management. The course stresses this as a key architectural evolution: any documentation still referencing ZooKeeper is obsolete for Kafka 4.0+ deployments."
  },
  /* ===== 3 — COURS ===== */
  {
    question: "A data engineering team creates a Kafka topic named 'clickstream' with 2 partitions on a 3-broker cluster. After creation, they observe via monitoring that Broker 3 has zero partition assignments for this topic, while Brokers 1 and 2 each host one partition. The team's SRE raises an alert, suspecting Broker 3 is malfunctioning. Is this concern warranted?",
    type: "single",
    source: "cours",
    options: [
      { text: "Yes — all brokers must hold at least one partition for every topic in the cluster; zero assignments on Broker 3 indicates a failure or misconfiguration.", explanation: "This is a misconception. Kafka distributes partitions across brokers according to the partition count, not across all available brokers. With 2 partitions, only 2 brokers receive assignments for this topic." },
      { text: "No — this is expected behavior. The number of partitions determines how many brokers are used for that topic. With 2 partitions, exactly 2 brokers host partitions; the third broker has no assignment for this specific topic and is working correctly.", explanation: "Correct. The course explicitly covers this case: if a topic has 2 partitions on a 3-broker cluster, only 2 brokers hold a partition for that topic. The third broker is healthy — it simply has no partition assignment for this topic." },
      { text: "Yes — this indicates the replication factor is misconfigured. Setting replication.factor=3 would force Broker 3 to receive a replica.", explanation: "While setting replication.factor=3 would cause all three brokers to hold a replica of each partition, this is a configuration choice — not evidence of broker failure. The current observation with 2 partitions and 2 assignments is entirely normal." },
      { text: "No — Kafka uses consistent hashing for partition assignment, which may intentionally skip some brokers to balance hash ring distribution.", explanation: "Kafka does not use consistent hashing for partition assignment. It uses a round-robin-based algorithm. The result here simply reflects that 2 partitions were distributed to 2 of the 3 available brokers." }
    ],
    answers: [1],
    globalExplanation: "This is a fundamental Kafka partitioning concept from the course: the number of partitions in a topic determines how many brokers are actively used for that topic. With 2 partitions on a 3-broker cluster, only 2 brokers receive partition assignments. This is by design — Kafka's scalability mechanism allows topic-level control over how many brokers are utilized. The third broker remains healthy and available for other topics."
  },
  /* ===== 4 — COURS ===== */
  {
    question: "A developer wants to quickly spin up a local Kafka development environment with 3 isolated broker instances without manually configuring Java, setting distinct port numbers, or managing separate log directories. Which approach does Apache Kafka documentation recommend for this scenario?",
    type: "single",
    source: "cours",
    options: [
      { text: "Download the Kafka tarball, extract it, and launch three separate JVM processes by running the startup script three times with different configuration files.", explanation: "This approach works but requires manually creating three distinct configuration files (different broker IDs, listeners, log directories). It is functional but error-prone and not the recommended approach for quick isolation." },
      { text: "Use Docker Compose, where each container in the compose file runs a Kafka JVM instance and automatically constitutes a separate, isolated broker.", explanation: "Correct. The course describes Docker Compose as the straightforward approach for running multiple isolated Kafka brokers locally. Each container is a distinct broker. Networking, port isolation, and configuration are handled declaratively through the compose file." },
      { text: "Use Confluent Cloud's free tier and configure 3 compute units, each representing one broker instance.", explanation: "Confluent Cloud is a managed cloud service, not a local development environment. The course notes that brokers are fully abstracted in Confluent Cloud — users cannot configure individual broker instances there." },
      { text: "Set num.partitions=3 on a single Kafka instance to simulate the effect of 3 separate brokers for development purposes.", explanation: "num.partitions sets the default partition count for auto-created topics, not the number of brokers. A single JVM process is a single broker. You cannot simulate multiple brokers with this configuration." }
    ],
    answers: [1],
    globalExplanation: "The course describes two startup approaches: (1) the tarball method — download, extract, run the startup script → one JVM process = one broker; and (2) Docker Compose — each container = one isolated broker. For a multi-broker local setup, Docker Compose is the preferred method because it handles isolation, networking, and per-container configuration declaratively without manual port/log management."
  },
  /* ===== 5 — COURS ===== */
  {
    question: "A company runs Apache Kafka self-managed on AWS EC2 instances. They are debating migrating to Confluent Cloud. A senior engineer argues: 'On Confluent Cloud, you never see brokers — so understanding them is a waste of time for our developers.' A junior architect disagrees. Which argument best supports the junior architect's position?",
    type: "single",
    source: "cours",
    options: [
      { text: "The senior engineer is correct — in Confluent Cloud, broker internals are irrelevant because everything is auto-managed and conceptually replaced by serverless abstractions.", explanation: "This is incorrect per the course. While Confluent Cloud abstracts broker operations, the underlying Kafka concepts (partitions, replication, ISR, leaders, read/write paths) still directly govern how topics, producers, and consumers must be configured. Ignorance of these concepts leads to misconfigured systems." },
      { text: "Understanding broker fundamentals — how partitions are hosted, how read/write requests are handled, how replication works — is essential for correctly configuring Kafka even when brokers are operationally invisible in managed services.", explanation: "Correct. The course explicitly states that even in managed services like Confluent Cloud, understanding broker abstractions remains necessary. Partition count, replication factor, producer acks, and consumer lag are all broker-derived concepts that impact every Kafka application." },
      { text: "Broker knowledge is only useful for setting replication factor and partition count; all other parameters are irrelevant in Confluent Cloud.", explanation: "This understates the scope. Broker mechanics affect producer acks settings, consumer group behavior, ISR-dependent durability guarantees, and operational troubleshooting (consumer lag, partition leadership). The knowledge is broadly applicable, not limited to two parameters." },
      { text: "Confluent Cloud uses a fundamentally different architecture from Apache Kafka, so broker knowledge from Kafka OSS does not apply.", explanation: "Confluent Cloud is built on Apache Kafka. The same partitioning, replication, and messaging model applies. Only the operational management layer is abstracted — the conceptual and logical model is identical." }
    ],
    answers: [1],
    globalExplanation: "The course makes a clear pedagogical point: broker knowledge is essential regardless of deployment model. Confluent Cloud hides operational complexity (no broker sizing, no storage management) but the logical behavior — partition distribution, replication, read/write paths — is identical to self-managed Kafka. Developers who understand brokers make better decisions about topic design, producer configuration, and consumer architecture."
  },
  /* ===== 6 — COURS ===== */
  {
    question: "A Kafka 4.0 cluster uses KRaft mode. The 3-node cluster has two brokers acting as 'controller candidates' and one as the 'controller leader'. The team asks: what specific responsibility distinguishes the controller leader from the other brokers in the KRaft quorum?",
    type: "single",
    source: "cours",
    options: [
      { text: "The controller leader handles all producer Produce requests and delegates consumer Fetch requests to candidate brokers for load balancing.", explanation: "The KRaft controller leader manages metadata, not client I/O. Produce and Fetch requests go directly to partition leaders, which are separate from the KRaft controller role." },
      { text: "The controller leader holds the active write lease for the Raft metadata log and is the authoritative source for all cluster metadata — topic configurations, partition assignments, broker states, and ISR lists.", explanation: "Correct. In KRaft mode, the controller leader owns the active log position in the Raft quorum. It processes all metadata changes (topic creation, partition leadership changes, ISR updates) and propagates them to follower controllers and brokers." },
      { text: "The controller leader stores all partition data for the cluster and coordinates replication across replica sets.", explanation: "The controller leader manages metadata, not partition data. Data storage and replication happen at the partition level, independently of the KRaft controller role." },
      { text: "The controller leader manages client authentication and authorization for all incoming broker connections.", explanation: "Authentication and authorization (ACLs) are handled by each individual broker's security subsystem (e.g., via SASL/SSL and an Authorizer), not by the KRaft controller leader." }
    ],
    answers: [1],
    globalExplanation: "In KRaft mode, the cluster forms a Raft quorum for metadata management. The controller leader holds the active Raft write lease and processes all metadata mutations: topic creation/deletion, partition leadership changes, ISR updates, and broker registrations. Controller candidates participate in voting and can take over leadership if the current leader fails. This architecture, described in the course via the quorum diagram, entirely replaces ZooKeeper's role."
  },
  /* ===== 7 — COURS ===== */
  {
    question: "An infrastructure architect proposes replacing the local NVMe SSDs on each Kafka broker with a centralized NAS (Network Attached Storage) array to simplify storage management and reduce hardware costs. A Kafka performance engineer strongly objects. Which concern most accurately reflects Apache Kafka's open-source storage architecture?",
    type: "single",
    source: "cours",
    options: [
      { text: "Kafka requires SSDs to be formatted with XFS, which NAS devices do not support.", explanation: "Kafka works with standard Linux filesystems including XFS and ext4. Filesystem format compatibility is not the architectural concern here — performance and coupling are." },
      { text: "Apache Kafka open-source is architecturally designed around tight coupling between the broker process and local storage. NAS introduces network latency and I/O jitter that fundamentally conflicts with Kafka's high-throughput, low-latency local disk design.", explanation: "Correct. The course explicitly identifies local storage coupling as a defining architectural characteristic of Apache Kafka OSS. The broker's high-performance design relies on fast local disk I/O with minimal latency. Network storage introduces unpredictable latency spikes and shared bandwidth contention." },
      { text: "NAS devices have a 2TB volume limit, which is insufficient for high-retention Kafka topics.", explanation: "Modern NAS systems support petabyte-scale storage. Capacity is not the concern. The architectural concern is latency and the tight coupling between the Kafka process and its storage." },
      { text: "Kafka requires SCSI protocol for partition I/O, which is incompatible with NFS-based NAS systems.", explanation: "Kafka does not require SCSI. It writes to standard OS file system paths. While NFS-based NAS can cause issues (file locking semantics), the primary architectural objection is performance degradation from network I/O, not a protocol incompatibility." }
    ],
    answers: [1],
    globalExplanation: "The course identifies local storage coupling as a key characteristic of Apache Kafka open-source: brokers are designed to store partition logs on physically local, fast SSDs. This tight coupling enables the high-throughput, sequential I/O performance that Kafka is known for. Introducing network storage breaks this model by adding latency and jitter. Note: Confluent's Tiered Storage feature explicitly decouples storage from compute, but this is a Confluent Platform extension, not part of Apache Kafka OSS."
  },
  /* ===== 8 — COURS ===== */
  {
    question: "During a CCDAK exam preparation session, a trainer asks: 'Name the three primary operational roles of a Kafka broker as described in the broker architecture.' A candidate provides four options — which one correctly identifies all three core broker responsibilities from the course?",
    type: "single",
    source: "cours",
    options: [
      { text: "Partition producers, message compressor, consumer group coordinator.", explanation: "None of these are core broker responsibilities. Producers are client applications, not broker functions. Message compression is an optional feature done by producers or storage — not a primary role. Consumer group coordination is a broker function but is not one of the three core roles described in the course." },
      { text: "Hosting partition data on local storage, handling client read/write requests (producer Produce + consumer Fetch), and replicating partition data between brokers for fault tolerance.", explanation: "Correct. The course explicitly identifies these three roles: (1) hosting partitions with local SSD storage, (2) processing producer write requests and consumer fetch requests (real I/O on partition logs), and (3) replicating partition data to follower replicas on other brokers. KRaft adds metadata management as a fourth role since Kafka 4.0." },
      { text: "Topic creation, consumer group offset management, and schema registry synchronization.", explanation: "Topic creation is a metadata operation, not a primary broker role. Offset management is a broker sub-function but not a primary architectural role. Schema Registry is a separate Confluent component, not part of the broker." },
      { text: "Partition balancing, leader election arbitration, and producer quota enforcement.", explanation: "While brokers participate in leader elections and quota enforcement, these are secondary functions. The three primary roles per the course are storage, request handling, and replication." }
    ],
    answers: [1],
    globalExplanation: "The course enumerates three core broker responsibilities: (1) Storage — hosting partition logs on local SSDs; (2) Request handling — processing Produce requests from producers (write I/O) and Fetch requests from consumers (read I/O); (3) Replication — replicating partition data to follower brokers to ensure fault tolerance. These three roles form the functional foundation of every Kafka broker, whether self-managed or in a managed service."
  },
  /* ===== 9 — COURS ===== */
  {
    question: "A platform team is preparing a Kafka cluster migration plan for a client currently on Kafka 3.5 with an external 5-node ZooKeeper ensemble. The target is Kafka 4.0. The client's operations team asks: 'After upgrading, where will metadata like topic configurations, partition assignments, and broker states be stored?' What is the correct answer?",
    type: "single",
    source: "cours",
    options: [
      { text: "In a dedicated metadata topic stored on the broker with the highest broker.id value.", explanation: "While KRaft does use an internal topic-like mechanism (__cluster_metadata) for the Raft log, metadata is not stored on a single broker. The KRaft quorum (all controller-eligible brokers) collectively maintains this log through Raft consensus." },
      { text: "In the existing ZooKeeper ensemble, which must be maintained in read-only mode after the Kafka 4.0 upgrade for audit trail purposes.", explanation: "ZooKeeper is completely removed in Kafka 4.0. There is no 'read-only' ZooKeeper mode. The ZooKeeper ensemble should be fully decommissioned after migrating to Kafka 4.0 with KRaft." },
      { text: "In Kafka's internal KRaft metadata log, maintained by the brokers themselves through the Raft consensus algorithm — replacing the external ZooKeeper ensemble entirely.", explanation: "Correct. KRaft stores all cluster metadata — topics, partitions, leaders, ISR, broker registrations — in an internal Raft-replicated log maintained by the controller-eligible brokers. This is the direct replacement for ZooKeeper." },
      { text: "In an etcd cluster that Kafka 4.0 uses as a cloud-native metadata store, compatible with Kubernetes deployments.", explanation: "Kafka 4.0 uses KRaft — its own internal Raft implementation. It does not use etcd or any other external coordination system. This is a common misconception given Kubernetes' use of etcd." }

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var questionResults = [];
var timerInterval = null;
var timeLeft = 0;
var TOTAL_SECONDS = 0;

function shuffleArray(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  QUESTIONS = [];
  for (var i = 0; i < QUESTIONS_MASTER.length; i++) {
    var q = JSON.parse(JSON.stringify(QUESTIONS_MASTER[i]));
    var indexed = [];
    for (var k = 0; k < q.options.length; k++) {
      indexed.push({ text: q.options[k].text, explanation: q.options[k].explanation, isCorrect: q.answers.indexOf(k) !== -1 });
    }
    indexed = shuffleArray(indexed);
    q.options = [];
    q.answers = [];
    for (var j = 0; j < indexed.length; j++) {
      q.options.push({ text: indexed[j].text, explanation: indexed[j].explanation });
      if (indexed[j].isCorrect) q.answers.push(j);
    }
    QUESTIONS.push(q);
  }
}

function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  TOTAL_SECONDS = QUESTIONS.length * 90;
  timeLeft = TOTAL_SECONDS;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
      autoSubmitAndAdvance();
    }
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('timerDisplay');
  if (!el) return;
  var pct = (TOTAL_SECONDS > 0) ? timeLeft / TOTAL_SECONDS : 1;
  var mins = Math.floor(Math.abs(timeLeft) / 60);
  var secs = Math.abs(timeLeft) % 60;
  el.textContent = '⏱ ' + (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  el.className = 'timer';
  if (pct <= 0.1) el.className = 'timer red';
  else if (pct <= 0.2) el.className = 'timer orange';
}

function autoSubmitAndAdvance() {
  if (!answered) {
    doValidate();
  }
  setTimeout(function() {
    if (qIdx < QUESTIONS.length - 1) {
      suivante();
    } else {
      showScore();
    }
  }, 2000);
}

    html += '</div>';
  }
  html += '</div>';

  html += '<div class="global-explanation" id="globalExp">';
  html += '<span class="ge-title">💡 Key Concept</span>';
  html += '<span id="globalExpText"></span>';
  html += '</div>';

  html += '<div class="btn-row">';
  html += '<button class="btn" id="btnValidate" onclick="valider()">Validate</button>';
  html += '<button class="btn-outline" id="btnNext" onclick="suivante()" disabled>Next question →</button>';
  html += '</div>';

  document.getElementById('quizArea').innerHTML = html;
}

function pickOption(idx) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [idx];
    for (var i = 0; i < q.options.length; i++) {
      var el = document.getElementById('opt_' + i);
      el.className = 'option' + (i === idx ? ' selected' : '');
    }
  } else {
    var pos = selected.indexOf(idx);
    if (pos === -1) selected.push(idx);
    else selected.splice(pos, 1);
    for (var j = 0; j < q.options.length; j++) {
      var oel = document.getElementById('opt_' + j);
      oel.className = 'option' + (selected.indexOf(j) !== -1 ? ' selected' : '');
    }
  }
}

function doValidate() {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  answered = true;

  var correctSorted = q.answers.slice().sort(function(a,b){return a-b;}).join(',');
  var selectedSorted = selected.slice().sort(function(a,b){return a-b;}).join(',');
  var isCorrect = (correctSorted === selectedSorted && selected.length > 0);
  if (isCorrect) score++;
  questionResults.push({ source: q.source, correct: isCorrect });

  var letters = ['A','B','C','D','E'];
  for (var i = 0; i < q.options.length; i++) {
    var el = document.getElementById('opt_' + i);
    var isAns = (q.answers.indexOf(i) !== -1);
    var isSel = (selected.indexOf(i) !== -1);
    var cls = 'option disabled';
    if (isAns && isSel)       cls += ' correct';
    else if (!isAns && isSel) cls += ' wrong';
    else if (isAns && !isSel) cls += ' missed';

    el.className = cls;
    el.onclick = null;

    var expEl = document.getElementById('exp_' + i);
    expEl.className = 'option-explanation show';
    var icon = isAns
      ? '<em class="icon" style="color:#2e7d32;font-style:normal">✓</em>'
      : '<em class="icon" style="color:#c62828;font-style:normal">✗</em>';
    expEl.innerHTML = icon + q.options[i].explanation;
  }

  var gEl = document.getElementById('globalExp');
  gEl.className = 'global-explanation show';
  document.getElementById('globalExpText').textContent = q.globalExplanation;

  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
}

function valider() {
  doValidate();
}

function suivante() {
  if (qIdx < QUESTIONS.length - 1) {
    qIdx++;
    selected = [];
    answered = false;
    paint();
  } else {
    showScore();
  }
}

function showScore() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  document.getElementById('progressBar').style.width = '100%';

  var pct = Math.round((score / QUESTIONS.length) * 100);
  var barClass = pct >= 70 ? 'high' : (pct >= 50 ? 'mid' : 'low');
  var icon, msg;
  if (pct >= 80) { icon = '🏆'; msg = 'Excellent! CCDAK-ready performance!'; }
  else if (pct >= 65) { icon = '👍'; msg = 'Good work — review the flagged topics.'; }
  else if (pct >= 50) { icon = '📚'; msg = "You're halfway there — keep practicing!"; }
  else { icon = '🔁'; msg = 'More practice needed. Revisit the course content.'; }

  var coursTotal = 0, coursRight = 0, inferTotal = 0, inferRight = 0;
  for (var i = 0; i < questionResults.length; i++) {
    if (questionResults[i].source === 'cours') {
      coursTotal++;
      if (questionResults[i].correct) coursRight++;
    } else {
      inferTotal++;
      if (questionResults[i].correct) inferRight++;
    }
  }
  // Fill in unanswered questions from QUESTIONS array
  if (questionResults.length < QUESTIONS.length) {
    for (var j = questionResults.length; j < QUESTIONS.length; j++) {
      if (QUESTIONS[j].source === 'cours') coursTotal++;
      else inferTotal++;
    }
  }

  var html = '<div class="score-screen">';
  html += '<div class="score-icon">' + icon + '</div>';
  html += '<div class="score-title">Quiz Complete!</div>';
  html += '<div class="score-fraction">You scored <strong>' + score + ' / ' + QUESTIONS.length + '</strong> &nbsp;(' + pct + '%)</div>';
  html += '<div class="score-bar-outer"><div class="score-bar-inner ' + barClass + '" style="width:' + pct + '%"></div></div>';
  html += '<div class="score-message">' + msg + '</div>';
  html += '<div class="score-breakdown">';
  html += '<div class="score-badge cours"><div class="bd-label">📘 From the course</div><div class="bd-num">' + coursRight + ' / ' + coursTotal + '</div></div>';
  html += '<div class="score-badge inference"><div class="bd-label">🔍 Beyond the course</div><div class="bd-num">' + inferRight + ' / ' + inferTotal + '</div></div>';
  html += '</div>';
  html += '<button class="btn" onclick="recommencer()">🔁 Restart the test</button>';
  html += '</div>';

  document.getElementById('quizArea').innerHTML = html;
}

function recommencer() {
  qIdx = 0;
  selected = [];
  answered = false;
  score = 0;
  questionResults = [];
  prepareQuestions();
  paint();
  startTimer();
}

// Initialize
prepareQuestions();
paint();
startTimer();
</script>
