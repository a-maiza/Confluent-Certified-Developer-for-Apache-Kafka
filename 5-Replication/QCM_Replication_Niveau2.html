<script>
var QUESTIONS_RAW = [
  {
    source: "cours",
    type: "single",
    question: "A fintech company runs a Kafka cluster with 5 brokers. They configure a critical payments topic with replication.factor=3. The SLA requires the system to survive the simultaneous loss of any 2 brokers without data loss. Does this configuration satisfy the SLA, and what is the maximum number of simultaneous broker failures the system can tolerate without losing data?",
    options: [
      { text: "Yes — replication.factor=3 tolerates up to 2 simultaneous broker failures per partition without data loss", explanation: "Correct. With RF=3, each partition has 3 copies on 3 different brokers. The cluster can tolerate RF-1 = 2 simultaneous broker failures per partition before data is at risk. The SLA is satisfied.", correct: true },
      { text: "No — only 1 broker failure is tolerated; the 2nd failure would leave only 1 replica which cannot serve reads", explanation: "Incorrect. With RF=3, losing 2 brokers leaves 1 surviving replica — and that single replica CAN serve as leader and serve reads/writes. Data is not lost as long as 1 replica remains intact.", correct: false },
      { text: "Yes — replication.factor=3 tolerates any number of broker failures as long as the leader survives", explanation: "Incorrect. RF=3 tolerates exactly RF-1 = 2 failures. If all 3 brokers hosting replicas for a partition fail, data is permanently lost. The leader being alive is not the only requirement.", correct: false },
      { text: "No — with 5 brokers, the effective replication is distributed across all 5, limiting fault tolerance", explanation: "Incorrect. Even on a 5-broker cluster, each partition has exactly RF=3 replicas on 3 specific brokers. Fault tolerance is determined by RF, not total broker count.", correct: false }
    ],
    answers: [0],
    globalExplanation: "Kafka's replication fault tolerance formula is: maximum simultaneous failures tolerated = RF - 1. With RF=3, the system survives the loss of any 2 brokers that host replicas for a given partition, as long as the 3rd replica remains intact. Data is safe as long as at least 1 replica survives — this is the fundamental guarantee of Kafka's replication mechanism."
  },
  {
    source: "cours",
    type: "single",
    question: "A high-throughput event streaming platform has producers writing 100,000 messages per second to a Kafka topic. The topic has replication.factor=3. A performance engineer proposes routing some write requests directly to follower replicas to reduce leader bottleneck. The lead architect rejects this proposal. Which of the following correctly justifies the rejection?",
    options: [
      { text: "All writes must go to the partition leader — followers are passive replicas that only fetch from the leader and cannot accept producer writes", explanation: "Correct. Kafka's architecture mandates that ALL producer writes go exclusively to the partition leader. Followers replicate by fetching from the leader — they have no write API exposed to producers.", correct: true },
      { text: "Writing to followers is allowed but only if replication.factor > 3", explanation: "Incorrect. There is no replication.factor threshold that enables direct follower writes. Follower replicas NEVER accept producer writes, regardless of RF value.", correct: false },
      { text: "Followers can accept writes only if the leader is in a different availability zone", explanation: "Incorrect. Network topology (AZ placement) has no effect on write routing. All writes always go to the leader regardless of geographic placement.", correct: false },
      { text: "Write routing to followers requires enabling unclean.leader.election.enable=true on the broker", explanation: "Incorrect. unclean.leader.election.enable controls whether out-of-ISR replicas can be elected as leader during failover — it has nothing to do with enabling producer writes to followers.", correct: false }
    ],
    answers: [0],
    globalExplanation: "Kafka's replication model is fundamentally leader-centric: the partition leader is the sole entry point for ALL producer writes. Followers are passive consumers of the leader's data, continuously fetching new messages to stay in sync. This design ensures consistency (single write point) at the cost of making the leader a potential bottleneck — which is addressed by partitioning the topic, not by routing writes to followers."
  },
  {
    source: "cours",
    type: "single",
    question: "A Kafka topic is created with replication.factor=5 on a cluster with 8 brokers. How many follower replicas exist per partition, and on how many brokers are they distributed?",
    options: [
      { text: "4 follower replicas distributed across 4 different brokers (total 5 copies: 1 leader + 4 followers)", explanation: "Correct. replication.factor=5 means 5 total copies: 1 leader + (5-1) = 4 followers. Each copy is placed on a different broker, so 5 out of 8 brokers host this partition's replicas.", correct: true },
      { text: "5 follower replicas distributed across 5 brokers — RF=5 means 5 followers plus 1 leader = 6 total copies", explanation: "Incorrect. RF=5 means 5 TOTAL copies (leader + followers), not 5 followers in addition to the leader. The formula is: followers = RF - 1 = 4.", correct: false },
      { text: "2 follower replicas — replication.factor defines the number of followers, not the total copies", explanation: "Incorrect. replication.factor defines the TOTAL number of copies (leader + all followers). With RF=5: 4 followers, not 2.", correct: false },
      { text: "It depends on the rack configuration — rack-aware assignment may reduce the number of replicas per partition", explanation: "Incorrect. Rack-aware assignment influences WHICH brokers host the replicas (to spread across racks), but does NOT change the total number of replicas. RF=5 always produces 5 copies.", correct: false }
    ],
    answers: [0],
    globalExplanation: "The replication.factor parameter defines the total number of copies for each partition, following the formula: total copies = 1 leader + (RF - 1) followers. With RF=5: 4 follower replicas on 4 different brokers, plus 1 leader, totaling 5 copies across 5 different brokers. The cluster must have at least RF brokers to place each replica on a distinct broker."
  },
  {
    source: "cours",
    type: "single",
    question: "A retail analytics platform has Kafka consumers in EU-West-2 (London) reading from a topic whose partition leader is in EU-West-1 (Ireland). The team observes 40ms cross-region read latency. They want to reduce consumer read latency without compromising write consistency. The topic has replication.factor=3 with a follower in EU-West-2. Which configuration achieves this?",
    options: [
      { text: "Set client.rack on the consumer to match the EU-West-2 broker's rack identifier — Kafka will route fetch requests to the nearest replica", explanation: "Correct. The client.rack property tells Kafka the consumer's rack/AZ. Kafka's rack-aware replica assignment then routes consumer fetch requests to the nearest in-sync follower (in EU-West-2), reducing the cross-region 40ms penalty.", correct: true },
      { text: "Move the partition leader to EU-West-2 using kafka-reassign-partitions.sh — reads and writes will then occur locally", explanation: "Incorrect. Moving the leader to EU-West-2 fixes consumer latency but increases producer write latency for producers in EU-West-1 (now cross-region writes). The question specifies not compromising write consistency.", correct: false },
      { text: "Set fetch.min.bytes=1 on the consumer — this ensures the broker returns data immediately, reducing latency", explanation: "Incorrect. fetch.min.bytes controls the minimum response size threshold, not the geographic routing of fetch requests. It would not reduce cross-region network latency.", correct: false },
      { text: "Increase replication.factor to 5 — more replicas reduce individual replica load and lower latency", explanation: "Incorrect. Increasing RF adds more copies but does not route fetch requests to the nearest one by default. The client.rack configuration is required to enable proximity-based routing.", correct: false }
    ],
    answers: [0],
    globalExplanation: "Kafka's follower fetch feature (introduced in KIP-392) allows consumers to read from the nearest replica instead of always fetching from the leader. Configuring client.rack on the consumer and ensuring brokers have broker.rack set enables this rack-aware routing. The trade-off: follower reads may return slightly stale data (up to the follower's replication lag behind the leader's high watermark), so this is suitable for use cases tolerating eventual consistency."
  },
  {
    source: "cours",
    type: "single",
    question: "A cost-optimized Kafka deployment for non-critical event logging uses replication.factor=1 to minimize storage costs. During a routine maintenance window, the single broker hosting a partition's data experiences a disk failure. What is the outcome and what does this reveal about the RF=1 design choice?",
    options: [
      { text: "All data on that partition is permanently lost — RF=1 provides zero fault tolerance; a disk or broker failure causes irreversible data loss", explanation: "Correct. With RF=1, there is only one copy of the data. A disk or broker failure with no other replicas means the data is permanently gone. There is no follower to elect as leader, and no recovery is possible.", correct: true },
      { text: "The broker restarts and Kafka replays the data from producer buffers — no data is lost because producers retry automatically", explanation: "Incorrect. A disk failure destroys the local log. Kafka has no mechanism to replay data from producer buffers after a disk failure — producers may have already received acks and cleared their buffers. Data IS lost.", correct: false },
      { text: "Kafka automatically reroutes the partition to another broker using the default replication mechanism", explanation: "Incorrect. With RF=1, there is no other broker hosting this partition. There are no replicas to promote or reroute to. The partition simply becomes unavailable and data is unrecoverable.", correct: false },
      { text: "Data is preserved in the Kafka commit log on other brokers due to the ISR mechanism", explanation: "Incorrect. ISR (In-Sync Replicas) only includes replicas that exist. With RF=1, there is only 1 replica and therefore only 1 ISR member. No other broker holds any copy of this data.", correct: false }
    ],
    answers: [0],
    globalExplanation: "replication.factor=1 is the most dangerous production configuration: a single disk or broker failure results in permanent, unrecoverable data loss for all partitions on that broker. The course explicitly warns against this. Even for non-critical data, RF=1 should be avoided unless data loss is truly acceptable. RF=2 provides basic fault tolerance; RF=3 is the production standard for any data worth keeping."
  },
  {
    source: "cours",
    type: "single",
    question: "A streaming platform's Kafka cluster undergoes an unplanned broker failure. The broker hosted the leader for 12 partitions across 3 topics. Within 8 seconds, producers resume writing and consumers resume reading without any application code changes. Which Kafka mechanism made this recovery transparent to clients?",
    options: [
      { text: "Automatic leader election — Kafka's controller detected the broker failure and elected new leaders from ISR members for all affected partitions; clients fetched updated metadata and reconnected", explanation: "Correct. Kafka's controller continuously monitors broker liveness. On detecting a failure, it triggers leader elections for all affected partitions, electing new leaders from the ISR. Clients automatically retry and fetch new leader metadata, making the failover transparent.", correct: true },
      { text: "Kafka's active-active replication — both the leader and followers accept writes simultaneously, so no election is needed", explanation: "Incorrect. Kafka uses active-passive replication: only the leader accepts writes. Followers are passive. There is no active-active write model in standard Kafka.", correct: false },
      { text: "ZooKeeper restarted the failed broker automatically — no leader election was needed", explanation: "Incorrect. ZooKeeper (or KRaft in newer Kafka) handles coordination but does NOT restart failed brokers. Leader election, not broker restart, is the recovery mechanism.", correct: false },
      { text: "Kafka's quorum-based replication ensured no leader election was necessary — any replica could serve reads and writes", explanation: "Incorrect. Kafka is NOT quorum-based in the Raft sense for normal read/write operations. A dedicated leader per partition is always required; any-replica-serves-all is not a Kafka concept.", correct: false }
    ],
    answers: [0],
    globalExplanation: "Kafka's controller (or KRaft controller in newer versions) is responsible for monitoring broker health and triggering leader elections when a broker fails. The election is automatic and transparent to clients: producers and consumers receive a new leader metadata response on their next request and seamlessly reconnect. The course correctly emphasizes that failover is 'automatic and transparent to client applications' — a key CCDAK exam point."
  },
  {
    source: "cours",
    type: "single",
    question: "After a planned maintenance window requiring a broker restart, a Kafka operations team runs kafka-topics.sh --describe and finds that the payments topic has under-replicated partitions: only 2 out of 3 RF=3 replicas are ISR members. The restored broker has rejoined the cluster. What must the team do to return the cluster to its intended resilience level?",
    options: [
      { text: "Trigger replica restoration — either wait for automatic catch-up or use kafka-reassign-partitions.sh to ensure the 3rd replica re-syncs and the partition returns to fully replicated state", explanation: "Correct. As the course states, after a failure or maintenance, restoring the replica count to the RF target is necessary to regain the full resilience level. The restored broker will catch up by fetching from the leader; the team should monitor URP count until it reaches 0.", correct: true },
      { text: "Delete and recreate the topic with a higher replication factor — this is the only way to restore replicas", explanation: "Incorrect. Deleting the topic destroys all data. Replica restoration does not require topic recreation — the rejoined broker catches up by fetching from the leader and re-joins the ISR.", correct: false },
      { text: "No action is needed — Kafka permanently reduces the RF to 2 after a single broker failure", explanation: "Incorrect. Kafka does NOT permanently reduce the topic's replication factor. The configured RF remains 3; the cluster is simply temporarily under-replicated until the 3rd replica catches up.", correct: false },
      { text: "Restart all remaining brokers to trigger a full replica redistribution", explanation: "Incorrect. Restarting healthy brokers would cause additional disruption and is completely unnecessary. The rejoined broker should catch up by fetching from the leader without any additional restarts.", correct: false }
    ],
    answers: [0],
    globalExplanation: "After a broker failure or maintenance, the Kafka cluster operates in an under-replicated state (fewer ISR members than the configured RF) until the affected replicas catch up. The course emphasizes: 'it remains necessary to restore the replica count after failure to regain the desired resilience level.' Monitor under-replicated partitions via JMX or kafka-topics.sh --describe. Until URPs reach 0, the cluster has degraded fault tolerance — another failure during this window could cause data loss."
  },
  {
    source: "cours",
    type: "single",
    question: "A gaming analytics company has consumers in 3 geographic regions (US, EU, APAC) reading from a single Kafka cluster. The head of engineering wants to minimize read latency for all regions while keeping writes in the US (where the leader resides). The team enables follower reads. A developer warns that this introduces a trade-off. Which trade-off is the developer referring to?",
    options: [
      { text: "Follower reads may return slightly stale data — a follower that is not fully caught up with the leader's high watermark may serve records that are behind the leader's latest offset", explanation: "Correct. As the course warns: 'reading from a follower can introduce a slight lag if the follower is not fully synchronized.' Followers replicate asynchronously — a follower may be several messages behind the leader at any instant.", correct: true },
      { text: "Follower reads require acks=all on all producers to maintain consistency", explanation: "Incorrect. Consumer read routing (follower vs leader) is independent of producer ack configuration. acks=all is a producer durability setting, not a prerequisite for enabling follower reads.", correct: false },
      { text: "Follower reads increase overall cluster CPU utilization beyond safe operating thresholds", explanation: "Incorrect. Follower reads shift CPU load from the leader to follower brokers — they do not inherently increase total cluster CPU beyond what was already being consumed for replication.", correct: false },
      { text: "Follower reads require a dedicated follower topic to be created for each region", explanation: "Incorrect. No separate topics are created. Follower reads use the same topic and partitions — the routing is transparent, controlled by the client.rack consumer configuration.", correct: false }
    ],
    answers: [0],
    globalExplanation: "Follower reads (enabled via client.rack) reduce cross-region network latency but introduce eventual consistency: a consumer may read slightly stale data if the local follower hasn't yet replicated the latest messages from the leader. This lag is bounded by the follower's replication speed and is typically very small (milliseconds to seconds). The course explicitly reserves this option 'for cases where performance takes priority over strict consistency.'"
  },
  {
    source: "cours",
    type: "single",
    question: "A startup team uses Confluent Cloud for their Kafka deployment. They ask the platform team whether they need to configure replication.factor, monitor under-replicated partitions, and run leader election scripts as part of their operational responsibilities. What is the correct answer?",
    options: [
      { text: "No — managed cloud services handle replication automatically in the background; the team has no operational replication responsibilities", explanation: "Correct. The course explicitly states: 'if you use a managed cloud Kafka service, replication is handled automatically in the background — you do not need to worry about it operationally.' Confluent Cloud manages RF, ISR health, leader elections, and failover automatically.", correct: true },
      { text: "Yes — even on Confluent Cloud, teams must set replication.factor=3 manually for each topic", explanation: "Incorrect. Confluent Cloud sets replication policies automatically. While teams can sometimes influence topic config, monitoring URPs and running election scripts are provider responsibilities.", correct: false },
      { text: "Partially — replication is automated but teams must manually trigger leader elections after broker failures", explanation: "Incorrect. On fully managed services, leader elections are entirely automated by the provider. No manual intervention is required or possible for these internal operations.", correct: false },
      { text: "No — Confluent Cloud uses a different architecture that doesn't use replication at all", explanation: "Incorrect. Confluent Cloud is built on Apache Kafka and absolutely uses replication for fault tolerance — it's just managed transparently. The replication mechanism is the same; only the operational responsibility differs.", correct: false }
    ],
    answers: [0],
    globalExplanation: "One of Kafka's key operational distinctions tested on the CCDAK is self-managed vs. managed deployments. On self-hosted Kafka (bare metal, EC2, K8s), teams are responsible for configuring RF, monitoring URP, running preferred leader elections, and maintaining replica health. On managed services (Confluent Cloud, Amazon MSK), the provider handles all of this — teams focus on topic design and application logic, not cluster operations."
  },
  {
    source: "cours",
    type: "multiple",
    question: "A payment processing platform is reviewing their Kafka topic configuration to ensure maximum data reliability. The SRE team identifies two critical risks: (1) data loss if a broker fails before replication completes, and (2) the cluster accepting writes even when resilience is dangerously degraded. Which TWO actions address these risks directly?",
    options: [
      { text: "Set replication.factor=3 — ensures 3 copies of each partition across different brokers, tolerating up to 2 broker failures", explanation: "Correct. RF=3 provides 3 copies and ensures the cluster can survive RF-1=2 broker failures per partition without data loss. This directly addresses risk #1 by ensuring data survives broker failures.", correct: true },
      { text: "Avoid replication.factor=1 — a single copy provides zero fault tolerance, meaning one disk failure causes permanent data loss", explanation: "Correct. This directly addresses risk #1: RF=1 is the textbook example of zero fault tolerance. Any disk or broker failure results in irreversible data loss. For a payment system, RF=1 is unacceptable.", correct: true },
      { text: "Set auto.offset.reset=earliest on all consumers — this ensures consumers reprocess all messages after a failure", explanation: "Incorrect. auto.offset.reset controls consumer behavior when no committed offset exists — it does not affect data durability or replication. Consumer offset reset is unrelated to broker-level data reliability.", correct: false },
      { text: "Disable follower reads by removing client.rack configuration — follower reads introduce lag that degrades reliability", explanation: "Incorrect. Follower reads introduce eventual consistency for reads (slight lag) but do not affect data durability or replication integrity. Disabling them is unrelated to protecting against data loss.", correct: false }
    ],
    answers: [0, 1],
    globalExplanation: "The course identifies two replication anti-patterns that directly threaten data reliability: (1) RF=1 — zero fault tolerance, one failure = data loss; (2) failing to restore replicas after a failure — leaving the cluster under-replicated degrades resilience. The remedies are RF ≥ 2 (preferably 3 for production) and active monitoring/restoration of under-replicated partitions. These are foundational CCDAK replication concepts."
  },
  {
    source: "cours",
    type: "single",
    question: "A Kafka architect is designing a topic for a real-time fraud detection system. Producers must confirm that each write has been committed before alerting the fraud team. Consumers require the most up-to-date data with strict consistency — no stale reads. Given these requirements, which combination of configurations satisfies both constraints?",
    options: [
      { text: "Producer acks=1, consumer reads from nearest follower replica via client.rack", explanation: "Incorrect. acks=1 means only the leader confirms the write — if the leader fails before replication, the ack is given but the message is lost. Follower reads introduce potential lag, violating the strict consistency requirement.", correct: false },
      { text: "Producer acks=all, consumer reads from the partition leader (default behavior)", explanation: "Correct. acks=all ensures the producer only gets confirmation after all ISR members have replicated the message — maximum write durability. Default leader reads ensure consumers always read the most up-to-date data at or below the high watermark — no stale reads.", correct: true },
      { text: "Producer acks=0, consumer reads from the partition leader", explanation: "Incorrect. acks=0 means fire-and-forget — no acknowledgment at all. The producer has no confirmation that the message was written, which is incompatible with the fraud detection use case.", correct: false },
      { text: "Producer acks=all, consumer reads from nearest follower replica via client.rack", explanation: "Incorrect. While acks=all satisfies write durability, follower reads may return slightly stale data — violating the strict consistency requirement for the fraud detection system.", correct: false }
    ],
    answers: [1],
    globalExplanation: "For strict consistency requirements: (1) acks=all on the producer ensures write durability — the producer waits for all ISR members to confirm. (2) Default leader reads ensure consumers see only fully replicated data (up to the high watermark) — no stale reads. Follower reads are reserved for use cases where performance takes priority over strict consistency, as the course explicitly states. This combination is the correct answer for latency-sensitive, consistency-critical systems."
  },
  {
    source: "inference",
    type: "single",

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var totalTime = 0;
var timeLeft = 0;
var timerInterval = null;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  var shuffled = fisherYates(QUESTIONS_RAW);
  QUESTIONS = shuffled.map(function(q) {
    var idxMap = [];
    for (var i = 0; i < q.options.length; i++) { idxMap.push(i); }
    var shuffledMap = fisherYates(idxMap);
    var newOptions = [];
    for (var j = 0; j < shuffledMap.length; j++) {
      var origIdx = shuffledMap[j];
      newOptions.push({
        text: q.options[origIdx].text,
        explanation: q.options[origIdx].explanation,
        correct: q.answers.indexOf(origIdx) !== -1
      });
    }
    var newAnswers = [];
    for (var k = 0; k < newOptions.length; k++) {
      if (newOptions[k].correct) newAnswers.push(k);
    }
    return {
      source: q.source,
      type: q.type,
      question: q.question,
      options: newOptions,
      answers: newAnswers,
      globalExplanation: q.globalExplanation
    };
  });
}

function startGlobalTimer() {
  clearInterval(timerInterval);
  totalTime = 90 * QUESTIONS.length;
  timeLeft = totalTime;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoAdvance();
    }
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('timerDisplay');
  var mins = Math.floor(timeLeft / 60);
  var secs = timeLeft % 60;
  el.textContent = '⏱ ' + (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  el.className = 'timer-global';
  var pct = timeLeft / totalTime;
  if (pct < 0.10) { el.className = 'timer-global danger'; }
  else if (pct < 0.20) { el.className = 'timer-global warn'; }
}

function autoAdvance() {
  if (!answered) {
    answered = true;
    var q = QUESTIONS[qIdx];
    if (q.source === 'cours') scoreCoursTotal++;
    else scoreInfTotal++;
    q.options.forEach(function(o, i) {
      var wrap = document.getElementById('opt_' + i);
      if (o.correct) { wrap.className = 'option-wrap missed'; }
      var expEl = document.getElementById('optexp_' + i);
      if (expEl) {
        expEl.style.display = 'block';
        expEl.className = 'opt-exp ' + (o.correct ? 'correct-exp' : 'wrong-exp');
        expEl.innerHTML = '<span class="icon">' + (o.correct ? '✓' : '✗') + '</span>' + o.explanation;
      }
    });
    document.getElementById('globalExpText').textContent = q.globalExplanation;
    document.getElementById('globalExpBox').style.display = 'block';
    document.getElementById('btnValidate').disabled = true;
    document.getElementById('btnNext').disabled = false;
  }
  if (qIdx >= QUESTIONS.length - 1) {
    setTimeout(function() { paintScore(); }, 1500);
  } else {
    setTimeout(function() { qIdx++; paint(); }, 1500);
  }
}

function paint() {
  var q = QUESTIONS[qIdx];
  selected = [];
  answered = false;

  var bType = document.getElementById('badgeType');
  bType.className = 'badge ' + (q.type === 'single' ? 'badge-single' : 'badge-multiple');
  bType.textContent = q.type === 'single' ? 'Single answer' : 'Multiple answers';

  var bSrc = document.getElementById('badgeSource');
  bSrc.className = 'badge ' + (q.source === 'cours' ? 'badge-cours' : 'badge-inference');
  bSrc.textContent = q.source === 'cours' ? '📘 From the course' : '🔍 Beyond the course';

  document.getElementById('questionText').textContent = (qIdx + 1) + '. ' + q.question;

  var letters = ['A','B','C','D','E'];
  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach(function(o, i) {
    var wrap = document.createElement('div');
    wrap.className = 'option-wrap';
    wrap.id = 'opt_' + i;
    wrap.setAttribute('onclick', 'pickOption(' + i + ')');
    var header = document.createElement('div');
    header.className = 'option-header';
    header.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span class="option-text">' + o.text + '</span>';
    var expDiv = document.createElement('div');
    expDiv.className = 'opt-exp';
    expDiv.id = 'optexp_' + i;
    expDiv.style.display = 'none';
    wrap.appendChild(header);
    wrap.appendChild(expDiv);
    container.appendChild(wrap);
  });

  document.getElementById('globalExpBox').style.display = 'none';
  document.getElementById('globalExpText').textContent = '';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').disabled = true;

  document.getElementById('progBar').style.width = (qIdx / QUESTIONS.length * 100) + '%';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    q.options.forEach(function(o, idx) {
      document.getElementById('opt_' + idx).className = 'option-wrap' + (idx === i ? ' selected' : '');
    });
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) { selected.push(i); document.getElementById('opt_' + i).classList.add('selected'); }
    else { selected.splice(pos, 1); document.getElementById('opt_' + i).classList.remove('selected'); }
  }
}

function valider() {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[qIdx];
  var correctIdxs = q.answers.slice();
  var isCorrect = selected.slice().sort().join(',') === correctIdxs.slice().sort().join(',');

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  q.options.forEach(function(o, i) {
    var wrap = document.getElementById('opt_' + i);
    wrap.className = 'option-wrap';
    var sel = selected.indexOf(i) !== -1;
    if (o.correct && sel) { wrap.className = 'option-wrap correct'; }
    else if (!o.correct && sel) { wrap.className = 'option-wrap wrong'; }
    else if (o.correct && !sel) { wrap.className = 'option-wrap missed'; }
    var expEl = document.getElementById('optexp_' + i);
    if (expEl) {
      expEl.style.display = 'block';
      expEl.className = 'opt-exp ' + (o.correct ? 'correct-exp' : 'wrong-exp');
      expEl.innerHTML = '<span class="icon">' + (o.correct ? '✓' : '✗') + '</span>' + o.explanation;
    }
  });

  document.getElementById('globalExpText').textContent = q.globalExplanation;
  document.getElementById('globalExpBox').style.display = 'block';
  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
  document.getElementById('progBar').style.width = ((qIdx + 1) / QUESTIONS.length * 100) + '%';
}

function suivante() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) { paintScore(); }
  else { paint(); }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';

  var pct = Math.round((score / QUESTIONS.length) * 100);
  var msg = pct >= 80 ? '🎉 Excellent! You\'re well prepared for the CCDAK.' :
            pct >= 60 ? '👍 Good effort. Review the highlighted topics.' :
            '📚 Keep studying — revisit the Replication concepts.';

  document.getElementById('scoreTitle').textContent = score + ' / ' + QUESTIONS.length + ' (' + pct + '%)';
  document.getElementById('scoreMsg').textContent = msg;

  var bar = document.getElementById('scoreBar');
  bar.style.width = pct + '%';
  bar.style.background = pct >= 80 ? '#27ae60' : pct >= 60 ? '#f39c12' : '#C0392B';

  document.getElementById('scoreDetail').innerHTML =
    '<p><strong>📘 From the course:</strong> ' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</p>' +
    '<p><strong>🔍 Beyond the course:</strong> ' + scoreInfCorrect + ' / ' + scoreInfTotal + '</p>';
}

function recommencer() {
  qIdx = 0; selected = []; answered = false; score = 0;
  scoreCoursTotal = 0; scoreCoursCorrect = 0;
  scoreInfTotal = 0; scoreInfCorrect = 0;
  prepareQuestions();
  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  startGlobalTimer();
  paint();
}

prepareQuestions();
window.onload = function() { startGlobalTimer(); paint(); };
</script>
</body>
</html>
