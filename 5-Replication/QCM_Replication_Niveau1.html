var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var timeLeft = 90;
var timerInterval = null;
var timesPerQuestion = [];
var timeUsedThisQuestion = 0;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  var shuffled = fisherYates(QUESTIONS_RAW);
  QUESTIONS = shuffled.map(function(q) {
    return {
      source: q.source,
      type: q.type,
      text: q.text,
      options: fisherYates(q.options.slice()),
      explanation: q.explanation
    };
  });
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = 90;
  timeUsedThisQuestion = 0;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    timeUsedThisQuestion++;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoSubmit();
    }
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('timerDisplay');
  var mins = Math.floor(timeLeft / 60);
  var secs = timeLeft % 60;
  el.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  el.className = 'timer';
  if (timeLeft <= 15) { el.className = 'timer danger'; }
  else if (timeLeft <= 30) { el.className = 'timer warn'; }
}

function autoSubmit() {
  var q = QUESTIONS[qIdx];
  var correctIdxs = [];
  q.options.forEach(function(o, i) { if (o.correct) correctIdxs.push(i); });
  q.options.forEach(function(o, i) {
    var el = document.getElementById('opt_' + i);
    if (el && o.correct) { el.classList.add('missed'); }
  });
  var expBox = document.getElementById('explanationBox');
  expBox.style.display = 'block';
  expBox.innerHTML = '<span class="timeout-msg">⏱ Time\'s up!</span><br><br>' + buildExplanationHTML(q);
  answered = true;
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;
  timesPerQuestion.push(90);
  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
  updateProgress();
}

function buildExplanationHTML(q) {
  var e = q.explanation;
  return '<h4>🧠 Key Concept</h4><p>' + e.concept + '</p>' +
    '<h4>✅ Why it\'s correct</h4><p>' + e.correct + '</p>' +
    '<h4>❌ Why others are incorrect</h4><p>' + e.incorrect + '</p>' +
    '<h4>📌 Remember for the exam</h4><p>' + e.retenir + '</p>';
}

function paint() {
  var q = QUESTIONS[qIdx];
  selected = [];
  answered = false;

  var bType = document.getElementById('badgeType');
  bType.className = 'badge ' + (q.type === 'single' ? 'badge-single' : 'badge-multiple');
  bType.textContent = q.type === 'single' ? 'Single answer' : 'Multiple answers';

  var bSrc = document.getElementById('badgeSource');
  bSrc.className = 'badge ' + (q.source === 'cours' ? 'badge-cours' : 'badge-inference');
  bSrc.textContent = q.source === 'cours' ? '📘 From the course' : '🔍 Beyond the course';

  document.getElementById('questionText').textContent = (qIdx + 1) + '. ' + q.text;

  var letters = ['A','B','C','D','E'];
  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach(function(o, i) {
    var div = document.createElement('div');
    div.className = 'option';
    div.id = 'opt_' + i;
    div.setAttribute('onclick', 'pickOption(' + i + ')');
    div.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span class="option-text">' + o.text + '</span>';
    container.appendChild(div);
  });

  document.getElementById('explanationBox').style.display = 'none';
  document.getElementById('explanationBox').innerHTML = '';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').disabled = true;

  updateProgress();
  startTimer();
}

function updateProgress() {
  var pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progBar').style.width = pct + '%';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    q.options.forEach(function(o, idx) {
      document.getElementById('opt_' + idx).className = 'option' + (idx === i ? ' selected' : '');
    });
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) { selected.push(i); document.getElementById('opt_' + i).classList.add('selected'); }
    else { selected.splice(pos, 1); document.getElementById('opt_' + i).classList.remove('selected'); }
  }
}

function valider() {
  if (answered) return;
  clearInterval(timerInterval);
  timesPerQuestion.push(90 - timeLeft);
  answered = true;

  var q = QUESTIONS[qIdx];
  var correctIdxs = [];
  q.options.forEach(function(o, i) { if (o.correct) correctIdxs.push(i); });

  var isCorrect = selected.slice().sort().join(',') === correctIdxs.slice().sort().join(',');
  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  q.options.forEach(function(o, i) {
    var el = document.getElementById('opt_' + i);
    el.className = 'option';
    if (o.correct && selected.indexOf(i) !== -1) { el.classList.add('correct'); }
    else if (!o.correct && selected.indexOf(i) !== -1) { el.classList.add('wrong'); }
    else if (o.correct && selected.indexOf(i) === -1) { el.classList.add('missed'); }
  });

  var expBox = document.getElementById('explanationBox');
  expBox.style.display = 'block';
  expBox.innerHTML = buildExplanationHTML(q);

  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;
  updateProgress();
}

function suivante() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) {
    paintScore();
  } else {
    paint();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';

  var pct = Math.round((score / QUESTIONS.length) * 100);
  var msg = pct >= 80 ? '🎉 Excellent! You\'re well prepared for the CCDAK.' :
            pct >= 60 ? '👍 Good effort. Review the highlighted topics.' :
            '📚 Keep studying — revisit the Replication concepts.';

  document.getElementById('scoreTitle').textContent = score + ' / ' + QUESTIONS.length + ' (' + pct + '%)';
  document.getElementById('scoreMsg').textContent = msg;

  var bar = document.getElementById('scoreBar');
  bar.style.width = pct + '%';
  bar.style.background = pct >= 80 ? '#27ae60' : pct >= 60 ? '#f39c12' : '#C0392B';

  var totalTime = 0;
  timesPerQuestion.forEach(function(t) { totalTime += t; });
  var avg = timesPerQuestion.length > 0 ? Math.round(totalTime / timesPerQuestion.length) : 0;
  document.getElementById('avgTimeDisplay').textContent = '⏱ Average time per question: ' + avg + 's';

  document.getElementById('scoreDetail').innerHTML =
    '<p><strong>📘 From the course:</strong> ' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</p>' +
    '<p><strong>🔍 Beyond the course:</strong> ' + scoreInfCorrect + ' / ' + scoreInfTotal + '</p>';
}

function recommencer() {
  qIdx = 0; selected = []; answered = false; score = 0;
  scoreCoursTotal = 0; scoreCoursCorrect = 0;
  scoreInfTotal = 0; scoreInfCorrect = 0;
  timesPerQuestion = [];
  prepareQuestions();
  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  paint();
}

prepareQuestions();
window.onload = function() { paint(); };
</script>
