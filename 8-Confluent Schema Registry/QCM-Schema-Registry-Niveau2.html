<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCDAK Prep — Level 2 — Confluent Schema Registry</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1a1a2e;
  min-height: 100vh;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 32px 16px 64px;
}
.card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #dde3f0;
  width: 100%;
  max-width: 860px;
  padding: 32px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
}
/* Header */
.card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
}
.header-left .ccdak-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: #C0392B;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.header-left .ccdak-sub {
  font-size: 0.78rem;
  color: #666;
  margin-top: 3px;
}
.timer-wrap {
  text-align: right;
  flex-shrink: 0;
}
.timer-label {
  font-size: 0.68rem;
  color: #888;
  margin-bottom: 3px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.timer-box {
  font-size: 1.35rem;
  font-weight: 800;
  color: #1a6fa8;
  background: #eaf4fb;
  border: 2px solid #1a6fa8;
  border-radius: 8px;
  padding: 6px 18px;
  min-width: 90px;
  text-align: center;
  transition: color 0.4s, border-color 0.4s, background 0.4s;
  letter-spacing: 1px;
}
.timer-box.warn  { color: #e67e22; border-color: #e67e22; background: #fff8f0; }
.timer-box.danger{ color: #C0392B; border-color: #C0392B; background: #fff0f0; animation: pulse 0.7s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
/* Progress */
.progress-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: #888;
  margin-bottom: 6px;
}
.progress-bar-wrap {
  background: #eee;
  border-radius: 8px;
  height: 7px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, #C0392B, #e74c3c);
  border-radius: 8px;
  transition: width 0.4s ease;
}
/* Badges */
.badges-row { margin-bottom: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge {
  display: inline-block;
  font-size: 0.7rem;
  font-weight: 700;
  border-radius: 20px;
  padding: 3px 11px;
  letter-spacing: 0.4px;
}
.badge-single   { background: #eaf4fb; color: #1a6fa8; }
.badge-multiple { background: #fef5e4; color: #b7770d; }
.badge-cours    { background: #e8f4fd; color: #1a6fa8; }
.badge-infer    { background: #f0e8fd; color: #6a1ab8; }
/* Question */
.question-text {
  font-size: 1rem;
  font-weight: 600;
  color: #1a1a2e;
  line-height: 1.6;
  margin-bottom: 20px;
}
/* Options */
.option {
  border: 2px solid #dde3f0;
  border-radius: 9px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  overflow: hidden;
}
.option:hover .option-top { background: #f7f8ff; }
.option.selected .option-top { background: #eaf4fb; }
.option.selected { border-color: #1a6fa8; }
.option.correct  { border-color: #27ae60; }
.option.correct .option-top { background: #eafaf1; }
.option.wrong    { border-color: #C0392B; }
.option.wrong .option-top { background: #fff0f0; }
.option.missed   { border-color: #27ae60; border-style: dashed; }
.option.missed .option-top { background: #f0fff4; }
.option.disabled { cursor: default; }
.option-top {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 14px;
  transition: background 0.15s;
}
.opt-letter {
  min-width: 28px; height: 28px;
  border-radius: 50%;
  background: #eee;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.82rem; color: #333;
  flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.option.selected .opt-letter { background: #1a6fa8; color: #fff; }
.option.correct .opt-letter  { background: #27ae60; color: #fff; }
.option.wrong .opt-letter    { background: #C0392B; color: #fff; }
.option.missed .opt-letter   { background: #27ae60; color: #fff; }
.opt-text { font-size: 0.93rem; color: #222; line-height: 1.45; padding-top: 3px; }
/* Per-option explanation */
.opt-explanation {
  display: none;
  padding: 9px 14px 10px 54px;
  font-size: 0.82rem;
  line-height: 1.5;
  border-top: 1px solid #f0f0f0;
  color: #444;
}
.opt-explanation.show { display: block; }
.opt-explanation.expl-correct { color: #1e7e4a; background: #f5fff9; }
.opt-explanation.expl-wrong   { color: #8b1a0e; background: #fff5f5; }
.opt-explanation.expl-missed  { color: #1e7e4a; background: #f0fff4; }
/* Buttons */
.btn-validate {
  display: block; width: 100%; margin-top: 20px;
  padding: 13px; background: #C0392B; color: #fff;
  border: none; border-radius: 9px; font-size: 1rem; font-weight: 700;
  cursor: pointer; letter-spacing: 0.5px; transition: background 0.2s;
}
.btn-validate:hover { background: #a93226; }
.btn-validate:disabled { background: #ccc; cursor: not-allowed; }
.btn-next {
  display: none; width: 100%; margin-top: 10px;
  padding: 13px; background: #1a6fa8; color: #fff;
  border: none; border-radius: 9px; font-size: 1rem; font-weight: 700;
  cursor: pointer; transition: background 0.2s;
}
.btn-next:hover { background: #15588a; }
/* Global explanation block */
.global-explanation {
  display: none;
  margin-top: 18px;
  border-radius: 9px;
  border-left: 4px solid #C0392B;
  background: #1e1e30;
  padding: 16px 18px;
}
.global-explanation.show { display: block; }
.global-explanation .ge-title {
  font-size: 0.8rem;
  font-weight: 700;
  color: #e0a0a0;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}
.global-explanation .ge-text {
  font-size: 0.9rem;
  color: #d0d8f0;
  line-height: 1.6;
}
/* Timeout */
.timeout-msg {
  display: none;
  text-align: center;
  color: #C0392B;
  font-weight: 700;
  font-size: 0.95rem;
  margin-top: 12px;
  padding: 8px;
  background: #fff0f0;
  border-radius: 6px;
}
/* Score screen */
.score-screen { display: none; }
.score-screen.show { display: block; }
.quiz-screen.hide  { display: none; }
.score-title {
  font-size: 1.6rem; font-weight: 800; color: #1a1a2e;
  text-align: center; margin-bottom: 6px;
}
.score-subtitle {
  text-align: center; font-size: 1rem; color: #555; margin-bottom: 24px;
}
.score-bar-wrap {
  background: #eee; border-radius: 10px; height: 26px;
  margin-bottom: 12px; overflow: hidden;
}
.score-bar-fill {
  height: 100%; border-radius: 10px; transition: width 1s ease;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 12px; font-size: 0.8rem; font-weight: 700; color: #fff;
}
.score-bar-fill.low  { background: linear-gradient(90deg,#C0392B,#e74c3c); }
.score-bar-fill.mid  { background: linear-gradient(90deg,#e67e22,#f39c12); }
.score-bar-fill.high { background: linear-gradient(90deg,#27ae60,#2ecc71); }
.score-msg {
  text-align: center; font-size: 1rem; font-weight: 700;
  margin-bottom: 24px; padding: 14px; border-radius: 9px;
}
.score-msg.low  { background: #fff0f0; color: #C0392B; }
.score-msg.mid  { background: #fff8f0; color: #e67e22; }
.score-msg.high { background: #eafaf1; color: #27ae60; }
.score-detail { display: flex; gap: 16px; margin-bottom: 20px; }
.score-box {
  flex: 1; border-radius: 10px; padding: 18px; text-align: center;
}
.score-box.cours     { background: #e8f4fd; border: 1px solid #b3d9f5; }
.score-box.inference { background: #f0e8fd; border: 1px solid #d0b3f5; }
.score-box .sb-label { font-size: 0.72rem; font-weight: 700; color: #555; margin-bottom: 6px; }
.score-box .sb-val   { font-size: 1.9rem; font-weight: 800; }
.score-box.cours .sb-val     { color: #1a6fa8; }
.score-box.inference .sb-val { color: #6a1ab8; }
.score-box .sb-pct   { font-size: 0.78rem; color: #888; margin-top: 4px; }
.score-meta { text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 24px; }
.btn-restart {
  display: block; width: 100%; padding: 14px;
  background: #C0392B; color: #fff; border: none; border-radius: 9px;
  font-size: 1rem; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
  transition: background 0.2s;
}
.btn-restart:hover { background: #a93226; }
</style>
</head>
<body>
<div class="card">

  <!-- ===== QUIZ SCREEN ===== -->
  <div class="quiz-screen" id="quizScreen">
    <div class="card-header">
      <div class="header-left">
        <div class="ccdak-title">CCDAK Prep — Level 2</div>
        <div class="ccdak-sub">Confluent Schema Registry</div>
      </div>
      <div class="timer-wrap">
        <div class="timer-label">⏱ Time Remaining</div>
        <div class="timer-box" id="timerBox">30:00</div>
      </div>
    </div>
    <div class="progress-meta">
      <span id="progressLabel">Question 1 / 20</span>
      <span id="scoreLabel">Score: 0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:5%"></div>
    </div>
    <div id="qContent"></div>
    <div class="timeout-msg" id="timeoutMsg">⏱ Time's up! Auto-validated.</div>
    <button class="btn-validate" id="btnValidate" onclick="valider()">✔ Validate Answer</button>
    <button class="btn-next" id="btnNext" onclick="suivante()">Next question →</button>
    <div class="global-explanation" id="globalExplanation">
      <div class="ge-title">💡 Key Concept</div>
      <div class="ge-text" id="globalExplanationText"></div>
    </div>
  </div>

  <!-- ===== SCORE SCREEN ===== -->
  <div class="score-screen" id="scoreScreen">
    <div class="score-title">🎓 Quiz Complete!</div>
    <div class="score-subtitle" id="scoreSubtitle"></div>
    <div class="score-bar-wrap">
      <div class="score-bar-fill" id="scoreBarFill" style="width:0%"></div>
    </div>
    <div class="score-msg" id="scoreMsg"></div>
    <div class="score-detail">
      <div class="score-box cours">
        <div class="sb-label">📘 From the Course</div>
        <div class="sb-val" id="scoreCours">—</div>
        <div class="sb-pct" id="scoreCoursPct"></div>
      </div>
      <div class="score-box inference">
        <div class="sb-label">🔍 Beyond the Course</div>
        <div class="sb-val" id="scoreInfer">—</div>
        <div class="sb-pct" id="scoreInferPct"></div>
      </div>
    </div>
    <div class="score-meta" id="scoreMeta"></div>
    <button class="btn-restart" onclick="recommencer()">🔄 Restart the test</button>
  </div>

</div>

<script>
// ============================================================
// QUESTION DATA
// ============================================================
var QUESTIONS_RAW = [
  {
    source: "cours",
    question: "A large e-commerce platform with 60+ microservices experiences recurring production incidents caused by schema mismatches between deployments. The architecture team mandates a solution that: (1) validates schema compatibility BEFORE messages are written to any topic, (2) caches schemas locally to minimize network overhead on every serialize/deserialize operation, and (3) can be deployed with redundancy to eliminate a single point of failure. Which component and configuration best satisfies ALL three requirements?",
    type: "single",
    options: [
      {
        text: "Deploy Confluent Schema Registry as a standalone service with multiple instances behind a load balancer; configure producers and consumers with KafkaAvroSerializer / KafkaAvroDeserializer and schema.registry.url",
        explanation: "✓ CORRECT. Schema Registry validates schemas at registration time (requirement 1), maintains an in-memory cache of schemas for low-latency lookups (requirement 2), and supports multi-instance HA deployment behind a load balancer (requirement 3).",
        correct: true
      },
      {
        text: "Implement a custom Kafka broker interceptor that validates message schemas at the broker level using a shared Redis schema store",
        explanation: "✗ INCORRECT. Kafka brokers are completely schema-agnostic and provide no schema validation interception API. A custom Redis-backed solution lacks compatibility rule enforcement, HA features, caching semantics, and the REST API that Schema Registry provides natively.",
        correct: false
      },
      {
        text: "Use Kafka Connect with a JSON Schema Transformation (SMT) to validate messages as they flow through connectors",
        explanation: "✗ INCORRECT. SMTs operate only within Kafka Connect pipeline connectors and cannot intercept direct producer writes to a topic. They do not provide schema versioning, compatibility enforcement, or a central schema repository.",
        correct: false
      },
      {
        text: "Configure per-topic Kafka ACLs to restrict producers to a specific schema format using a Kafka policy plugin",
        explanation: "✗ INCORRECT. Kafka ACLs control authorization (who can produce/consume) but have no concept of message schema or format enforcement. No standard Kafka broker plugin exists for schema validation at the broker level.",
        correct: false
      }
    ],
    answers: [0],
    globalExplanation: "Confluent Schema Registry is the standard solution for schema governance in Kafka. It validates compatibility at schema registration time (proactively), serves subsequent lookups from an in-memory cache (performance), and supports multi-instance HA deployment. Producers embed only a compact 4-byte schema ID per message instead of the full schema — minimizing overhead while retaining full schema traceability."
  },
  {
    source: "cours",
    question: "A retail company's OrderService produces events using Avro schema v1: {orderId: string, amount: double}. The Analytics team wants to add an optional field 'currency: string' (with default: null) to create v2. The Analytics consumer MUST be deployed BEFORE the OrderService producer is updated — rolling deployment with no downtime window. The team configures the Schema Registry subject accordingly. Which combination of compatibility mode and Avro rule correctly supports this phased rollout?",
    type: "single",
    options: [
      {
        text: "BACKWARD compatibility + add 'currency' field with default:null — new consumers (v2 schema) can read old v1 messages; missing 'currency' is resolved using the declared default",
        explanation: "✓ CORRECT. BACKWARD compatibility = deploy consumer first. The new v2 consumer schema can read v1-produced messages because the new 'currency' field has a default (null), which Avro uses when the field is absent in the writer schema.",
        correct: true
      },
      {
        text: "FORWARD compatibility + add 'currency' as a required field with no default — ensures old consumers can still read new producer messages",
        explanation: "✗ INCORRECT. FORWARD applies when the producer is deployed first. Additionally, adding a required field without a default breaks BACKWARD compatibility — Schema Registry would reject this schema under BACKWARD mode because old messages (v1) lack the field.",
        correct: false
      },
      {
        text: "NONE compatibility + add 'currency' with default:null — the default value makes the change safe regardless of compatibility mode",
        explanation: "✗ INCORRECT. While the Avro schema change itself is safe, setting NONE disables all validation guardrails. This means future developers could accidentally register breaking schemas, creating a ticking time bomb in production. NONE is inappropriate for production topics.",
        correct: false
      },
      {
        text: "BACKWARD compatibility + add 'currency' as a required field without a default — BACKWARD mode automatically supplies null for missing required fields",
        explanation: "✗ INCORRECT. BACKWARD compatibility does NOT automatically supply null for required fields. Schema Registry will REJECT this schema registration because the Avro BACKWARD compatibility check requires that the new schema can read all messages produced with v1 — which is impossible for a required field with no default when v1 messages lack the field.",
        correct: false
      }
    ],
    answers: [0],
    globalExplanation: "BACKWARD compatibility = deploy consumer first. The key Avro rule: to maintain backward compatibility, any new field MUST have a default value (so the new schema can read old messages where the field is absent). Memory aid — BACKWARD = consumer is 'ahead' of the producer; it must be able to read 'backward' into older messages using defaults."
  },
  {
    source: "cours",
    question: "A logistics company operates 20 legacy consumer applications on the 'shipments' topic using Avro schema v1: {shipmentId: string, destination: string}. The ShipmentService team must deploy a new producer with schema v2 — adding optional field 'estimatedDelivery: long' (default: -1) — BEFORE any consumer updates. Several legacy consumers will never be upgraded. The team needs to register the new v2 schema. Which compatibility mode must be configured on the 'shipments-value' subject to allow this rollout without any consumer failures?",
    type: "single",
    options: [
      {
        text: "FORWARD — old consumers (v1 reader schema) can safely read new v2 messages because Avro field projection allows them to ignore the unknown 'estimatedDelivery' field",
        explanation: "✓ CORRECT. FORWARD compatibility = deploy producer first. With FORWARD, Schema Registry verifies that the old consumer schema (v1) can still read messages written with the new schema (v2). Avro allows readers to ignore writer fields that are absent in the reader schema.",
        correct: true
      },
      {
        text: "BACKWARD — new consumers must always handle old messages, which transitively covers all producer-first deployments",
        explanation: "✗ INCORRECT. BACKWARD ensures new consumers can read old producer messages — it does NOT protect old consumers from new producer messages. In a producer-first deployment, old consumers will receive v2 messages; BACKWARD provides no guarantee for that direction.",
        correct: false
      },
      {
        text: "NONE — gives the team maximum flexibility since the schema change is safe anyway",
        explanation: "✗ INCORRECT. NONE removes all guardrails. Even if this particular change is safe, future schema changes could break consumers without any warning. NONE is never the right answer for a production topic requiring controlled evolution.",
        correct: false
      },
      {
        text: "FULL — always the safest option since it covers both directions",
        explanation: "✗ INCORRECT. FULL would also work technically, but it imposes bidirectional constraints that are more restrictive than needed. More importantly, FULL is not the MINIMUM correct answer to 'which mode enables producer-first deployment without breaking consumers'. FORWARD is the precise answer. The question asks for the mode that allows the rollout, not the most restrictive one.",
        correct: false
      }
    ],
    answers: [0],
    globalExplanation: "FORWARD compatibility = producer is deployed first. Old consumers must be able to read new messages. Avro's schema resolution handles this: when a reader (old consumer v1) encounters a writer field ('estimatedDelivery') absent in its own schema, it simply ignores that field. Memory aid — FORWARD = producer leads; old consumers 'follow' by ignoring new fields."
  },
  {
    source: "cours",
    question: "A payments platform CI/CD pipeline must automatically validate that a proposed Avro schema change (adding field 'transactionFee: double' with default 0.0) is compatible with the current registered schema for subject 'payments-value' — WITHOUT registering the new version or deploying any code. A failed compatibility check should fail the CI build. Which approach correctly implements this gate?",
    type: "single",
    options: [
      {
        text: "Call POST /compatibility/subjects/payments-value/versions/latest with the candidate schema in the request body; fail the CI build if the response contains {\"is_compatible\": false}",
        explanation: "✓ CORRECT. The /compatibility endpoint tests a candidate schema against registered versions WITHOUT registering it. It returns {\"is_compatible\": true/false}, making it the exact tool for a CI/CD compatibility gate.",
        correct: true
      },
      {
        text: "Deploy the new producer schema to a staging Schema Registry, check staging consumer logs for deserialization errors, then promote if clean",
        explanation: "✗ INCORRECT. This approach requires actual deployment and relies on runtime error detection — the opposite of a pre-deployment CI gate. It is slow, resource-intensive, and may affect the staging environment.",
        correct: false
      },
      {
        text: "Run the Gradle Avro Plugin in the CI pipeline; a successful compilation guarantees Schema Registry compatibility",
        explanation: "✗ INCORRECT. The Gradle Avro Plugin validates Avro schema syntax and generates POJOs, but it does NOT query Schema Registry. A successful build only confirms valid Avro syntax — not compatibility with the currently registered schema version.",
        correct: false
      },
      {
        text: "Set auto.register.schemas=false in the CI test producer config; if the schema is incompatible, the producer will throw an exception during integration tests",
        explanation: "✗ INCORRECT. auto.register.schemas=false prevents auto-registration but does NOT perform a compatibility check. It throws SerializationException only if the schema is NOT REGISTERED (not found), not because it is incompatible. An unregistered schema and an incompatible schema are different error conditions.",
        correct: false
      }
    ],
    answers: [0],
    globalExplanation: "The Schema Registry /compatibility REST endpoint is the purpose-built tool for pre-deployment schema validation. It evaluates the candidate schema using the subject's configured compatibility mode without any side effects. This enables fail-fast CI/CD pipelines where schema incompatibilities are caught before code reaches a deployment stage — a key architectural advantage of the Schema Registry workflow highlighted in the course."
  },
  {
    source: "cours",
    question: "A data engineer receives this consumer error: 'org.apache.kafka.common.errors.SerializationException: Error deserializing Avro message — Unknown magic byte!'. Using a hex dump tool, they discover that the Kafka topic contains two types of messages: some starting with bytes '00 00 00 00 07 ...' and others starting with '7b 22 6f 72 64 65 72 ...' (which is the ASCII encoding of '{\"order...'). What is the root cause of the deserialization failure?",
    type: "single",
    options: [
      {
        text: "The topic contains messages serialized with Confluent's KafkaAvroSerializer (magic byte 0x00) mixed with plain JSON messages (starting with '{', byte 0x7b). The KafkaAvroDeserializer fails on non-Confluent-format messages because their first byte (0x7b) is not the expected magic byte 0x00",
        explanation: "✓ CORRECT. Confluent's wire format begins with magic byte 0x00. JSON messages start with '{' (0x7b). The KafkaAvroDeserializer checks the first byte — if it is not 0x00, it throws 'Unknown magic byte!' before any Schema Registry lookup. Mixed serializers on the same topic is the root cause.",
        correct: true
      },
      {
        text: "Two different schema versions are registered in Schema Registry; the deserializer cannot handle both versions simultaneously",
        explanation: "✗ INCORRECT. Multiple schema versions are a normal, expected condition. The KafkaAvroDeserializer resolves schema IDs dynamically from Schema Registry for each message. Multiple versions never cause 'Unknown magic byte!' — this error is exclusively about the first byte not being 0x00.",
        correct: false
      },
      {
        text: "The Schema Registry instance is overloaded and returning corrupted schema definitions, causing the deserializer to misinterpret message bytes",
        explanation: "✗ INCORRECT. The 'Unknown magic byte!' error is checked BEFORE any Schema Registry call. It is a local byte-level check in the deserializer. Schema Registry availability or response quality is irrelevant to this specific error.",
        correct: false
      },
      {
        text: "The consumer's schema.registry.url points to a wrong endpoint, causing the schema ID bytes to be misread as message content",
        explanation: "✗ INCORRECT. A wrong schema.registry.url would cause an HTTP connection error during schema lookup — which happens AFTER the magic byte check passes. The 'Unknown magic byte!' error fires in the very first step of deserialization, before any network call.",
        correct: false
      }
    ],
    answers: [0],
    globalExplanation: "Confluent's Schema Registry wire format: [0x00 magic byte] + [4-byte big-endian schema ID] + [serialized payload]. The magic byte is a format version indicator. KafkaAvroDeserializer validates it as the FIRST step — any byte other than 0x00 immediately throws 'Unknown magic byte!'. This error is a definitive signal that the topic contains messages NOT serialized with KafkaAvroSerializer."
  },
  {
    source: "cours",
    question: "A FinTech startup configured all Schema Registry subjects with compatibility mode NONE during development to maximize iteration speed. The system is now processing 15,000 payment transactions per second in production. A developer deploys a schema change that: renames field 'amount' (double) to 'transactionAmount' (string). No consumer teams were notified. What is the MOST severe and MOST immediate production impact?",
    type: "single",
    options: [
      {
        text: "All consumers deserializing the 'amount' field as double will throw SerializationException at runtime. With NONE compatibility, Schema Registry accepted the breaking change without any pre-flight validation, so at 15,000 TPS the consumer failure is immediate and widespread",
        explanation: "✓ CORRECT. NONE compatibility allows ANY schema change, including breaking type changes and field renames, without validation. Consumers expecting 'amount: double' encounter either a missing field or a type mismatch, causing immediate SerializationException — at scale, this means total consumer failure across all instances.",
        correct: true
      },

// ============================================================
// GLOBAL STATE
// ============================================================
var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCours = 0;
var scoreInfer = 0;
var totalCours = 0;
var totalInfer = 0;
var timerInterval = null;
var timeLeft = 0;
var totalTime = 0;
var LETTERS = ['A','B','C','D','E','F'];

// ============================================================
// FISHER-YATES SHUFFLE
// ============================================================
function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

// ============================================================
// SHUFFLE QUESTIONS + OPTIONS
// ============================================================
function shuffleQuestions() {
  QUESTIONS = fisherYates(QUESTIONS_RAW).map(function(q) {
    var shuffledOpts = fisherYates(q.options);
    // Build new answers array based on correct flags
    var newAnswers = [];
    for (var i = 0; i < shuffledOpts.length; i++) {
      if (shuffledOpts[i].correct) newAnswers.push(i);
    }
    return {
      source: q.source,
      question: q.question,
      type: q.type,
      options: shuffledOpts,
      answers: newAnswers,
      globalExplanation: q.globalExplanation
    };
  });
  totalCours = 0; totalInfer = 0;
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (QUESTIONS[i].source === 'cours') totalCours++;
    else totalInfer++;
  }
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
  clearInterval(timerInterval);
  totalTime = 90 * QUESTIONS.length;
  timeLeft = totalTime;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) {
        document.getElementById('timeoutMsg').style.display = 'block';
        valider();
      }
      if (qIdx < QUESTIONS.length - 1) {
        setTimeout(function() { suivante(); }, 1200);
      } else {
        setTimeout(function() { paintScore(); }, 1200);
      }
    }
  }, 1000);
}

function updateTimerDisplay() {
  var m = Math.floor(timeLeft / 60);
  var s = timeLeft % 60;
  var txt = (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  document.getElementById('timerBox').textContent = txt;
  var box = document.getElementById('timerBox');
  var pct = totalTime > 0 ? timeLeft / totalTime : 1;
  if (pct < 0.10) box.className = 'timer-box danger';
  else if (pct < 0.20) box.className = 'timer-box warn';
  else box.className = 'timer-box';
}

// ============================================================
// RENDER QUESTION
// ============================================================
function paint() {
  var q = QUESTIONS[qIdx];
  var total = QUESTIONS.length;

  document.getElementById('progressLabel').textContent = 'Question ' + (qIdx+1) + ' / ' + total;
  document.getElementById('scoreLabel').textContent = 'Score: ' + score;
  document.getElementById('progressBar').style.width = Math.round(((qIdx+1)/total)*100) + '%';

  var typeBadge = q.type === 'multiple'
    ? '<span class="badge badge-multiple">Multiple answers</span>'
    : '<span class="badge badge-single">Single answer</span>';
  var srcBadge = q.source === 'cours'
    ? '<span class="badge badge-cours">📘 From the course</span>'
    : '<span class="badge badge-infer">🔍 Beyond the course</span>';

  var html = '<div class="badges-row">' + typeBadge + srcBadge + '</div>';
  html += '<div class="question-text">' + q.question + '</div>';

  for (var i = 0; i < q.options.length; i++) {
    html += '<div class="option" id="opt_' + i + '" onclick="pickOption(' + i + ')">';
    html += '  <div class="option-top">';
    html += '    <div class="opt-letter">' + LETTERS[i] + '</div>';
    html += '    <div class="opt-text">' + q.options[i].text + '</div>';
    html += '  </div>';
    html += '  <div class="opt-explanation" id="expl_' + i + '"></div>';
    html += '</div>';
  }

  document.getElementById('qContent').innerHTML = html;
  document.getElementById('globalExplanation').className = 'global-explanation';
  document.getElementById('globalExplanationText').textContent = '';
  document.getElementById('btnValidate').style.display = 'block';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('timeoutMsg').style.display = 'none';
  selected = [];
  answered = false;
}

// ============================================================
// PICK OPTION
// ============================================================
function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'multiple') {
    var idx2 = selected.indexOf(i);
    if (idx2 === -1) {
      selected.push(i);
      document.getElementById('opt_' + i).className = 'option selected';
    } else {
      selected.splice(idx2, 1);
      document.getElementById('opt_' + i).className = 'option';
    }
  } else {
    if (selected.length > 0) {
      document.getElementById('opt_' + selected[0]).className = 'option';
    }
    selected = [i];
    document.getElementById('opt_' + i).className = 'option selected';
  }
}

// ============================================================
// VALIDATE
// ============================================================
function valider() {
  if (answered) return;
  answered = true;

  var q = QUESTIONS[qIdx];
  var correctSet = q.answers.slice().sort();
  var selSet = selected.slice().sort();

  var isCorrect = false;
  if (selSet.length === correctSet.length) {
    isCorrect = true;
    for (var k = 0; k < correctSet.length; k++) {
      if (selSet[k] !== correctSet[k]) { isCorrect = false; break; }
    }
  }

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCours++;
    else scoreInfer++;
  }
  document.getElementById('scoreLabel').textContent = 'Score: ' + score;

  for (var j = 0; j < q.options.length; j++) {
    var optEl = document.getElementById('opt_' + j);
    var explEl = document.getElementById('expl_' + j);
    var isCorrectOpt = (correctSet.indexOf(j) !== -1);
    var wasSelected = (selected.indexOf(j) !== -1);

    var explClass = 'opt-explanation show ';
    if (isCorrectOpt && wasSelected) {
      optEl.className = 'option correct disabled';
      explClass += 'expl-correct';
    } else if (!isCorrectOpt && wasSelected) {
      optEl.className = 'option wrong disabled';
      explClass += 'expl-wrong';
    } else if (isCorrectOpt && !wasSelected) {
      optEl.className = 'option missed disabled';
      explClass += 'expl-missed';
    } else {
      optEl.className = 'option disabled';
      explClass += 'expl-wrong';
    }
    explEl.className = explClass;
    explEl.innerHTML = q.options[j].explanation;
  }

  document.getElementById('globalExplanationText').textContent = q.globalExplanation;
  document.getElementById('globalExplanation').className = 'global-explanation show';
  document.getElementById('btnValidate').style.display = 'none';
  document.getElementById('btnNext').style.display = 'block';
}

// ============================================================
// NEXT QUESTION
// ============================================================
function suivante() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) {
    paintScore();
  } else {
    paint();
  }
}

// ============================================================
// SCORE SCREEN
// ============================================================
function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('quizScreen').className = 'quiz-screen hide';
  document.getElementById('scoreScreen').className = 'score-screen show';

  var total = QUESTIONS.length;
  var pct = Math.round((score / total) * 100);

  document.getElementById('scoreSubtitle').textContent = 'Final score: ' + score + ' / ' + total + ' (' + pct + '%)';

  var fill = document.getElementById('scoreBarFill');
  fill.style.width = pct + '%';
  fill.textContent = pct + '%';
  fill.className = 'score-bar-fill ' + (pct >= 75 ? 'high' : pct >= 50 ? 'mid' : 'low');

  var msg = document.getElementById('scoreMsg');
  if (pct >= 75) {
    msg.textContent = '🎉 Excellent! You are well prepared for the CCDAK exam on Confluent Schema Registry.';
    msg.className = 'score-msg high';
  } else if (pct >= 50) {
    msg.textContent = '📈 Good effort! Review the per-option explanations and retry the questions you missed.';
    msg.className = 'score-msg mid';
  } else {
    msg.textContent = '📚 Keep studying! Re-read the course, go through each explanation carefully, and try again.';
    msg.className = 'score-msg low';
  }

  document.getElementById('scoreCours').textContent = scoreCours + ' / ' + totalCours;
  document.getElementById('scoreCoursPct').textContent = Math.round((scoreCours / (totalCours || 1)) * 100) + '% success';
  document.getElementById('scoreInfer').textContent = scoreInfer + ' / ' + totalInfer;
  document.getElementById('scoreInferPct').textContent = Math.round((scoreInfer / (totalInfer || 1)) * 100) + '% success';

  var timeUsed = totalTime - timeLeft;
  var avgSec = total > 0 ? Math.round(timeUsed / total) : 0;
  document.getElementById('scoreMeta').textContent =
    'Time used: ' + Math.floor(timeUsed/60) + 'm ' + (timeUsed%60) + 's — Average per question: ' + avgSec + 's';
}

// ============================================================
// RESTART
// ============================================================
function recommencer() {
  score = 0; scoreCours = 0; scoreInfer = 0;
  qIdx = 0; selected = []; answered = false;
  clearInterval(timerInterval);
  shuffleQuestions();
  document.getElementById('scoreScreen').className = 'score-screen';
  document.getElementById('quizScreen').className = 'quiz-screen';
  paint();
  startTimer();
}

// ============================================================
// INIT
// ============================================================
shuffleQuestions();
paint();
startTimer();
</script>
