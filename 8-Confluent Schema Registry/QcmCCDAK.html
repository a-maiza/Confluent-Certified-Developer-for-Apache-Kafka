    <style>
        body{margin:0;background:#f5f5f3;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937}.wrap{max-width:980px;margin:0 auto;padding:28px 16px 44px}.top{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-bottom:18px;border:1px solid #d1d5db}.bar{height:100%;width:0;background:#378ADD;transition:width .3s ease}.card{background:#fff;border:1px solid #d9d9d6;border-radius:12px;padding:24px;box-shadow:0 8px 22px rgba(0,0,0,.04)}.head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;margin-bottom:16px}h1{font-size:24px;margin:0 0 4px}h2{font-size:21px;margin:12px 0 14px;line-height:1.35}code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 5px;font-size:.95em}.muted{color:#6b7280;font-size:14px}.badge{display:inline-block;background:#eaf4ff;color:#155e9f;border:1px solid #b8daf8;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.timer{font-weight:800;border:1px solid #cbd5e1;border-radius:999px;padding:8px 12px;color:#378ADD;min-width:64px;text-align:center}.timer.orange{color:#c77700;border-color:#f59e0b;background:#fff7ed}.timer.red{color:#b91c1c;border-color:#ef4444;background:#fef2f2;animation:pulse .8s infinite alternate}@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.04)}}.opts{display:grid;gap:10px;margin:18px 0}.opt{border:1px solid #d1d5db;border-radius:10px;padding:13px 14px;cursor:pointer;background:#fff;display:flex;gap:10px;line-height:1.35;transition:.15s}.opt:hover{background:#f8fafc;border-color:#9dc8ef}.opt.sel{border-color:#378ADD;background:#eef6ff}.opt.good{border-color:#15803d;background:#dcfce7}.opt.bad{border-color:#b91c1c;background:#fee2e2}.opt.missed{border:2px dashed #15803d;background:#f0fdf4}.letter{font-weight:800;min-width:24px;color:#374151}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer;background: <script>
    var qIdx=0,selected={},answered=false,score=0,timeLeft=90,timerInterval=null,totalTimeSpent=0,lastTimeUp=false;
    var QUESTIONS=[
    {type:'single',q:'Where does Confluent Schema Registry store registered schema information?',opts:[{t:'In ZooKeeper under the <code>/schemas</code> znode',c:false},{t:'In a special Kafka topic named <code>_schemas</code>',c:true},{t:'In a relational database configured in Schema Registry',c:false},{t:'In the Kafka broker\'s <code>schema</code> directory on disk',c:false}],exp:{key:'Schema Registry uses Kafka as its durable storage layer for schema metadata.',correct:['Registered schemas are stored in the internal Kafka topic <code>_schemas</code> by default.'],wrong:['Schemas are not stored in ZooKeeper.','Schema Registry does not use a relational database by default.','Schemas are not stored directly in a broker filesystem directory.'],tip:'Remember the internal topic: <code>_schemas</code>.'}},
    {type:'multiple',q:'What schema formats are supported by Confluent Schema Registry? Select all that apply.',opts:[{t:'Avro',c:true},{t:'Protobuf',c:true},{t:'JSON Schema',c:true},{t:'XML Schema',c:false},{t:'Thrift',c:false}],exp:{key:'Schema Registry supports Avro, Protobuf, and JSON Schema.',correct:['Avro is the classic and most common format.','Protobuf is supported.','JSON Schema is supported.'],wrong:['XML Schema and Thrift are not supported schema types in Confluent Schema Registry.'],tip:'Schema Registry formats: Avro, Protobuf, JSON Schema.'}},
    {type:'multiple',q:'Which programming languages have Confluent-supported client libraries for Schema Registry use? Select three.',opts:[{t:'Java',c:true},{t:'Python',c:true},{t:'Go',c:true},{t:'C++',c:false},{t:'JavaScript',c:false},{t:'Ruby',c:false}],exp:{key:'Confluent commonly provides first-class Schema Registry integrations through its Java, Python, and Go client ecosystems.',correct:['Java has official Schema Registry client support.','Python support is available through Confluent Kafka client libraries.','Go support is available through Confluent Kafka client libraries.'],wrong:['Other languages can often use the REST API or community libraries, but they are not the expected official choices here.'],tip:'For exams, associate official Confluent clients with Java, Python, and Go.'}},
    {type:'single',q:'What is the purpose of the compatibility setting in Confluent Schema Registry?',opts:[{t:'It defines which serialization format is used.',c:false},{t:'It controls how schemas can evolve over time.',c:true},{t:'It sets compatibility between different Schema Registry versions.',c:false},{t:'It configures compatibility between Schema Registry and Kafka brokers.',c:false}],exp:{key:'Compatibility settings define schema evolution rules.',correct:['Compatibility modes such as BACKWARD, FORWARD, FULL, and NONE control which schema changes are allowed.'],wrong:['The serialization format is separate from compatibility mode.','Compatibility is about schema versions, not Schema Registry software versions.','It does not define broker compatibility.'],tip:'Compatibility = schema evolution policy.'}},
    {type:'single',q:'In Avro, what is the effect of adding a field to a record schema without a default value?',opts:[{t:'It is backward compatible.',c:false},{t:'It is forward compatible.',c:true},{t:'It is both backward and forward compatible.',c:false},{t:'It is always incompatible.',c:false}],exp:{key:'Adding a field without a default lets old readers ignore new data, but new readers cannot read old data without that field.',correct:['It is forward compatible because old schemas can read new data by ignoring the extra field.'],wrong:['It is not backward compatible because new schemas require the new field when reading old data.','It is not full compatibility.','It is not completely incompatible because forward compatibility still holds.'],tip:'Add field + no default = forward only. Add field + default = usually backward too.'}},
    {type:'single',q:'What is the Avro schema evolution rule for removing a field?',opts:[{t:'It is always compatible.',c:false},{t:'It is backward compatible.',c:true},{t:'It is forward compatible.',c:false},{t:'It is always incompatible.',c:false}],exp:{key:'Removing a field allows the new schema to read old data by ignoring the removed field.',correct:['Removing a field is backward compatible in the common Avro compatibility model.'],wrong:['It is not always compatible.','It is not forward compatible unless the old reader has a default for the missing field.','It is not always incompatible.'],tip:'Remove field = backward compatible; add field without default = forward compatible.'}},
    {type:'single',q:'In Avro, what is the compatibility implication of changing the name of a record schema without aliases?',opts:[{t:'Backward compatible',c:false},{t:'Forward compatible',c:false},{t:'Both backward and forward compatible',c:false},{t:'Incompatible',c:true}],exp:{key:'Avro record names are part of schema resolution. Changing the record name without aliases breaks resolution.',correct:['Without aliases, changing a record name is incompatible.'],wrong:['Backward or forward compatibility may require aliases; without them, the change is unsafe.'],tip:'Renames need aliases if you want compatibility.'}},
    {type:'single',q:'What happens when a Kafka consumer using <code>KafkaAvroDeserializer</code> encounters a message without a Confluent schema ID?',opts:[{t:'The consumer throws a serialization/deserialization exception.',c:true},{t:'The consumer automatically skips the message.',c:false},{t:'The consumer deserializes using the latest schema.',c:false},{t:'The consumer falls back to <code>GenericRecord</code> automatically.',c:false}],exp:{key:'Confluent Avro wire format includes a magic byte and schema ID. The deserializer needs that ID.',correct:['If the schema ID is missing or the payload is not in the expected format, deserialization fails.'],wrong:['Skipping is an application-level decision, not automatic deserializer behavior.','The latest schema is not guessed without the wire-format ID.','GenericRecord is a representation choice, not an automatic fallback for invalid payloads.'],tip:'KafkaAvroDeserializer expects Confluent wire format.'}},
    {type:'single',q:'How can a Kafka consumer handle a deserialization exception from <code>KafkaAvroDeserializer</code>?',opts:[{t:'Retry forever with random deserializers.',c:false},{t:'Route or skip the bad record intentionally, for example by committing past it after logging/dead-letter handling.',c:true},{t:'Always manually retrieve schemas and deserialize the same bytes.',c:false},{t:'Ignore it and assume Kafka will fix the message.',c:false}],exp:{key:'Bad records require explicit error-handling strategy in the consumer application.',correct:['A common approach is to log the error, send the raw record to a dead-letter topic if possible, and commit past it only if data loss is acceptable.'],wrong:['Trying random deserializers is not a robust strategy.','Manual schema retrieval does not help when the payload lacks valid Confluent wire format.','Kafka will not modify the bad message.'],tip:'Do not silently skip production data unless your operational process accepts that loss.'}},
    {type:'multiple',q:'What are benefits of using Confluent Schema Registry with Kafka Avro serializers/deserializers? Select all that apply.',opts:[{t:'Schema evolution and compatibility checks',c:true},{t:'Compact binary serialization with Avro',c:true},{t:'Deserialization using schema IDs without embedding the full schema in every message',c:true},{t:'Guaranteed automatic correction of incompatible producer code',c:false}],exp:{key:'Schema Registry centralizes schemas and the serializer/deserializer use schema IDs to encode and decode data efficiently.',correct:['Compatibility checks help govern schema evolution.','Avro provides compact binary encoding.','The message carries a schema ID, not the full schema.'],wrong:['Schema Registry rejects incompatible schemas, but it does not automatically correct application code.'],tip:'Schema Registry gives contracts, not magic application fixes.'}},
    {type:'single',q:'Which configuration defines the Schema Registry URL in Kafka clients?',opts:[{t:'<code>schema.registry.url</code>',c:true},{t:'<code>schema.registry.endpoint</code>',c:false},{t:'<code>schema.registry.address</code>',c:false},{t:'<code>schema.registry.host</code>',c:false}],exp:{key:'Clients using Confluent serializers/deserializers use <code>schema.registry.url</code>.',correct:['This property tells the client where to reach Schema Registry.'],wrong:['The other names are not the standard Confluent client property.'],tip:'Client property: <code>schema.registry.url</code>.'}},
    {type:'single',q:'What is the primary purpose of a subject in Confluent Schema Registry?',opts:[{t:'To group schemas by format type',c:false},{t:'To manage versions of a schema for a topic, entity, or naming strategy',c:true},{t:'To specify schema storage location',c:false},{t:'To define security policies',c:false}],exp:{key:'A subject is the namespace under which schema versions evolve.',correct:['Subjects group versions of related schemas, often derived from topic-name strategy such as <code>topic-value</code> or <code>topic-key</code>.'],wrong:['Subjects are not primarily grouped by Avro/Protobuf/JSON type.','They do not define storage or security policies.'],tip:'Subject = schema version timeline.'}},
    {type:'single',q:'By default, how does Schema Registry check compatibility when registering a new schema version?',opts:[{t:'By comparing the new schema with the latest previous version.',c:true},{t:'By comparing with all previous versions.',c:false},{t:'By comparing with a random previous version.',c:false},{t:'By ignoring previous versions.',c:false}],exp:{key:'Default compatibility modes check against the latest version. Transitive modes check against all previous versions.',correct:['Standard BACKWARD/FORWARD/FULL compatibility checks are against the latest version by default.'],wrong:['All previous versions are checked only with transitive modes such as BACKWARD_TRANSITIVE.','Registry does not randomly choose versions.','Compatibility checks are not ignored unless mode is NONE.'],tip:'Latest version by default; transitive modes check full history.'}},
    {type:'single',q:'What compatibility mode allows a new schema to read old data and old schemas to read new data?',opts:[{t:'BACKWARD',c:false},{t:'FORWARD',c:false},{t:'FULL',c:true},{t:'NONE',c:false}],exp:{key:'FULL compatibility combines backward and forward compatibility.',correct:['FULL means the change must satisfy both directions of compatibility.'],wrong:['BACKWARD and FORWARD are one-directional. NONE disables checks.'],tip:'FULL = BACKWARD + FORWARD.'}},
    {type:'multiple',q:'Which schema types are supported by Confluent Schema Registry but are not Avro schema types? Select all that apply.',opts:[{t:'Protobuf',c:true},{t:'Thrift',c:false},{t:'JSON Schema',c:true},{t:'XML Schema',c:false}],exp:{key:'Schema Registry supports formats beyond Avro.',correct:['Protobuf is supported by Schema Registry and is not Avro.','JSON Schema is supported by Schema Registry and is not Avro.'],wrong:['Thrift and XML Schema are not supported Schema Registry schema types.'],tip:'Beyond Avro: Protobuf and JSON Schema.'}},
    {type:'single',q:'In Schema Registry usage, what is a main advantage of Avro over JSON Schema?',opts:[{t:'Avro schemas are the only human-readable schemas.',c:false},{t:'Avro provides compact and fast binary serialization.',c:true},{t:'Avro does not require schema registration.',c:false},{t:'Avro supports all JSON types natively.',c:false}],exp:{key:'Avro is popular for Kafka because of compact binary encoding and schema evolution support.',correct:['Avro data is encoded compactly and efficiently compared with plain JSON payloads.'],wrong:['JSON Schema is human-readable too.','Avro usually benefits from schema registration.','JSON Schema is the format centered on JSON types.'],tip:'Avro advantage: compact binary data + schema evolution.'}},
    {type:'single',q:'What is the default compatibility mode in Confluent Schema Registry?',opts:[{t:'BACKWARD',c:true},{t:'FORWARD',c:false},{t:'FULL',c:false},{t:'NONE',c:false}],exp:{key:'The default global compatibility mode is BACKWARD.',correct:['BACKWARD means a new schema can read data written with the previous schema.'],wrong:['FORWARD, FULL, and NONE are available but not the default.'],tip:'Default: BACKWARD.'}},
    {type:'single',q:'How does Schema Registry handle schema evolution?',opts:[{t:'By automatically converting all old data to the new schema.',c:false},{t:'By storing schema versions and applying compatibility checks.',c:true},{t:'By changing producer code directly.',c:false},{t:'By modifying consumer applications.',c:false}],exp:{key:'Schema Registry stores schemas and validates new versions against compatibility rules.',correct:['It preserves versions and rejects incompatible registrations according to the configured mode.'],wrong:['It does not rewrite existing Kafka data automatically.','It does not edit application code.'],tip:'Schema evolution governance happens at registration time.'}},
    {type:'single',q:'What happens if a schema fails compatibility checks when being registered?',opts:[{t:'It is registered with a warning.',c:false},{t:'It is rejected and an error is returned.',c:true},{t:'It is registered and compatibility is disabled.',c:false},{t:'It is registered with lower priority.',c:false}],exp:{key:'Compatibility checks are enforcement points.',correct:['If the new schema violates compatibility rules, Schema Registry rejects the registration.'],wrong:['It is not accepted with a warning or lower priority.','Compatibility is not automatically disabled.'],tip:'Registry blocks incompatible schemas when compatibility mode requires it.'}},
    {type:'single',q:'Which CLI approach is commonly used to interact with Schema Registry?',opts:[{t:'<code>kafka-schema-registry</code>',c:false},{t:'Confluent CLI or REST API tooling for Schema Registry',c:true},{t:'<code>confluent-hub</code>',c:false},{t:'<code>kafka-schema-cli</code>',c:false}],exp:{key:'Schema Registry is primarily exposed through a REST API; Confluent tooling can interact with it. There is not a universal Apache Kafka CLI named <code>schema-registry-cli</code> in the same way as Kafka broker tools.',correct:['The safe answer is to use Confluent CLI/REST API tooling, depending on your environment.'],wrong:['<code>confluent-hub</code> installs connectors and components, not primarily manages schemas.','The other names are not standard universal Schema Registry tools.'],tip:'For exact operations, REST API endpoints are exam-safe and portable.'}},
    {type:'single',q:'What is the purpose of Confluent Schema Registry in a Kafka ecosystem?',opts:[{t:'To store and manage schemas for Kafka message data.',c:true},{t:'To provide a REST API for producing and consuming Kafka messages.',c:false},{t:'To handle Kafka client authentication and authorization.',c:false},{t:'To monitor Kafka cluster performance.',c:false}],exp:{key:'Schema Registry centralizes schemas and compatibility for structured Kafka data.',correct:['It stores schemas, assigns IDs, supports evolution, and helps producers and consumers agree on data contracts.'],wrong:['Producing/consuming over REST is Kafka REST Proxy, not Schema Registry.','Security and monitoring are separate platform concerns.'],tip:'Schema Registry = data contracts.'}},
    {type:'single',q:'How does Schema Registry ensure compatibility between schema versions?',opts:[{t:'By enforcing BACKWARD compatibility for every subject regardless of configuration.',c:false},{t:'By allowing only changes that are always both backward and forward compatible.',c:false},{t:'By generating reports but not enforcing rules.',c:false},{t:'By using a configured compatibility setting to validate allowed schema evolution.',c:true}],exp:{key:'Compatibility mode controls validation behavior per subject or globally.',correct:['The registry validates new schemas against the configured mode such as BACKWARD, FORWARD, FULL, NONE, or transitive variants.'],wrong:['It does not always enforce BACKWARD if configured differently.','FULL is optional, not mandatory.','It enforces rules; it does not only report.'],tip:'Compatibility is configurable globally and per subject.'}},
    {type:'single',q:'How do you retrieve the latest version of a schema using the Schema Registry REST API?',opts:[{t:'GET <code>/subjects/&lt;subject&gt;/versions/latest</code>',c:true},{t:'POST <code>/schemas/&lt;subject&gt;/versions/latest</code>',c:false},{t:'GET <code>/schemas/&lt;subject&gt;/versions/latest</code>',c:false},{t:'POST <code>/subjects/&lt;subject&gt;/versions/latest</code>',c:false}],exp:{key:'Subjects and versions are addressed through the <code>/subjects</code> REST path.',correct:['The latest schema for a subject is retrieved with <code>GET /subjects/{subject}/versions/latest</code>.'],wrong:['The other method/path combinations are not the correct endpoint.'],tip:'REST pattern: <code>/subjects/{subject}/versions/{version}</code>.'}},
    {type:'single',q:'What is the purpose of <code>kafkastore.topic</code> in Schema Registry?',opts:[{t:'To specify the Kafka topic where Schema Registry stores schema data.',c:true},{t:'To define compatibility mode.',c:false},{t:'To set schema update polling frequency.',c:false},{t:'To configure retention for old schema versions.',c:false}],exp:{key:'<code>kafkastore.topic</code> names the backing Kafka topic for schema storage.',correct:['By default, this topic is <code>_schemas</code>, but the configuration can customize it.'],wrong:['Compatibility uses config endpoints/settings, not <code>kafkastore.topic</code>.','It is not a polling or retention setting.'],tip:'<code>kafkastore.topic</code> → usually <code>_schemas</code>.'}},
    {type:'single',q:'How can you change compatibility for a specific subject using the REST API?',opts:[{t:'PUT <code>/config/&lt;subject&gt;</code>',c:true},{t:'POST <code>/config/&lt;subject&gt;</code>',c:false},{t:'PUT <code>/compatibility/&lt;subject&gt;</code>',c:false},{t:'POST <code>/compatibility/&lt;subject&gt;</code>',c:false}],exp:{key:'Subject-level compatibility is changed through the <code>/config/{subject}</code> endpoint.',correct:['Use <code>PUT /config/{subject}</code> with a JSON body such as <code>{"compatibility":"FULL"}</code>.'],wrong:['POST is not the standard method for updating subject config.','<code>/compatibility</code> endpoints are used for compatibility checks, not setting config.'],tip:'Set config: <code>PUT /config/{subject}</code>.'}},
    {type:'single',q:'What is the impact of removing a required field that has a default value in an Avro schema?',opts:[{t:'Backward compatible',c:true},{t:'Forward compatible',c:false},{t:'Both backward and forward compatible',c:false},{t:'Incompatible',c:false}],exp:{key:'A removed field can be ignored by new readers when reading old data. If old readers read new data, they need a default for the missing field.',correct:['The common exam answer is backward compatible: the new schema can read old data by ignoring the removed field.'],wrong:['Forward compatibility depends on the old schema being able to supply a default for the missing field. The simplified answer here is backward only.'],tip:'For Avro, defaults determine whether missing fields can be resolved.'}},
    {type:'single',q:'What compatibility level is maintained when adding a new optional field with a default value to an Avro schema?',opts:[{t:'Backward compatibility only',c:false},{t:'Forward compatibility only',c:false},{t:'Full compatibility',c:true},{t:'No compatibility',c:false}],exp:{key:'Adding an optional/defaulted field is safe in both directions in the usual Avro model.',correct:['Old readers ignore the new field, and new readers can use the default when reading old data.'],wrong:['It is not only one-directional when the new field has a default.'],tip:'Add optional/defaulted field = usually FULL compatible.'}},
    {type:'single',q:'What is the effect of changing the data type of a field in an Avro schema without a valid Avro promotion path?',opts:[{t:'Backward compatible',c:false},{t:'Forward compatible',c:false},{t:'Both backward and forward compatible',c:false},{t:'Incompatible',c:true}],exp:{key:'Changing field types is generally incompatible unless Avro type promotion rules apply.',correct:['A type change such as int to string typically breaks readers and writers.'],wrong:['Some numeric promotions can be allowed, but arbitrary type changes are not compatible.'],tip:'Treat field type changes as dangerous unless Avro promotion explicitly allows them.'}},
    {type:'single',q:'Where does modern Confluent Schema Registry store its schema data and operational state?',opts:[{t:'ZooKeeper',c:false},{t:'Kafka, primarily in the configured schema topic such as <code>_schemas</code>',c:true},{t:'Only on the local filesystem',c:false},{t:'A relational database',c:false}],exp:{key:'Modern Schema Registry uses Kafka as the source of truth for schemas. Older ZooKeeper-era explanations are obsolete for schema storage.',correct:['The backing Kafka topic stores schemas and related metadata.'],wrong:['ZooKeeper is not where schemas are stored.','Filesystem and relational database storage are not the default architecture.'],tip:'Avoid outdated ZooKeeper answers for Schema Registry schema storage.'}},
    {type:'single',q:'How does Schema Registry support high availability?',opts:[{t:'Run multiple instances; instances coordinate so writes are handled consistently while reads can be served by available instances.',c:true},{t:'Only by relying on one Kafka broker.',c:false},{t:'By storing every schema in ZooKeeper replicas.',c:false},{t:'By requiring a separate relational database cluster.',c:false}],exp:{key:'Schema Registry can run multiple instances behind a load balancer. Kafka-backed storage provides durable shared state.',correct:['Multiple instances provide availability. The system coordinates writes and all healthy instances can serve reads.'],wrong:['It does not rely on one broker only.','Schemas are not replicated through ZooKeeper storage.','A relational database is not required.'],tip:'HA pattern: multiple Schema Registry instances + Kafka-backed schema topic.'}},
    {type:'single',q:'What is the default compatibility setting for new schemas in Schema Registry?',opts:[{t:'BACKWARD',c:true},{t:'FORWARD',c:false},{t:'FULL',c:false},{t:'NONE',c:false}],exp:{key:'The default compatibility mode is BACKWARD.',correct:['BACKWARD is the default and commonly preferred for Kafka because new consumers can read older topic data.'],wrong:['FORWARD, FULL, and NONE are not the default.'],tip:'Default compatibility appears often: BACKWARD.'}},
    {type:'single',q:'Which statement best describes BACKWARD compatibility in Schema Registry?',opts:[{t:'New schema can read data written with the previous schema.',c:true},{t:'Old schema can read data written with the new schema.',c:false},{t:'Both old and new schemas can read each other\'s data.',c:false},{t:'No compatibility checks are performed.',c:false}],exp:{key:'BACKWARD compatibility focuses on new readers reading old data.',correct:['This is useful when consumers upgrade after producers or when replaying old topic data with newer code.'],wrong:['Old readers reading new data is FORWARD.','Both directions is FULL.','No checks is NONE.'],tip:'BACKWARD = new reads old.'}}
    ];
    function shuffleOptions(){for(var i=0;i<QUESTIONS.length;i++){var arr=QUESTIONS[i].opts;for(var j=arr.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var tmp=arr[j];arr[j]=arr[k];arr[k]=tmp;}}}
    function initQuiz(){shuffleOptions();paint();}
    function fmt(s){var m=Math.floor(s/60),r=s%60;return(m<10?'0'+m:m)+':'+(r<10?'0'+r:r)}
    function startTimer(){clearInterval(timerInterval);timeLeft=90;lastTimeUp=false;paintTimer();timerInterval=setInterval(function(){timeLeft--;paintTimer();if(timeLeft<=0){clearInterval(timerInterval);lastTimeUp=true;valider();}},1000)}
    function paintTimer(){var el=document.getElementById('timer');el.innerHTML=fmt(timeLeft);el.className='timer';if(timeLeft<=30&&timeLeft>=15)el.className='timer orange';if(timeLeft<15)el.className='timer red'}
    function pickOption(i){if(answered)return;var q=QUESTIONS[qIdx];if(q.type==='single'){selected={};selected[i]=true}else{selected[i]=!selected[i];if(!selected[i])delete selected[i]}paintOptions()}
    function paintOptions(){var q=QUESTIONS[qIdx],box=document.getElementById('options'),html='',letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';for(var i=0;i<q.opts.length;i++){var cls='opt';if(selected[i])cls+=' sel';if(answered){if(q.opts[i].c&&selected[i])cls='opt good';if(!q.opts[i].c&&selected[i])cls='opt bad';if(q.opts[i].c&&!selected[i])cls='opt missed'}html+='<div class="'+cls+'" onclick="pickOption('+i+')"><span class="letter">'+letters.charAt(i)+'.</span><span>'+q.opts[i].t+'</span></div>'}box.innerHTML=html}
    function isCorrect(){var q=QUESTIONS[qIdx];for(var i=0;i<q.opts.length;i++){if(q.opts[i].c&&!selected[i])return false;if(!q.opts[i].c&&selected[i])return false}return true}
    function valider(){if(answered)return;clearInterval(timerInterval);answered=true;totalTimeSpent+=(90-timeLeft);var ok=isCorrect();if(ok)score++;document.getElementById('validateBtn').disabled=true;document.getElementById('nextBtn').disabled=false;document.getElementById('status').innerHTML=lastTimeUp?'<span class="warn">Time’s up!</span>':(ok?'Correct.':'Incorrect.');paintOptions();paintExplanation();paintScore()}
    function paintExplanation(){var q=QUESTIONS[qIdx],e=q.exp,html='';html+='<h3>1. Key Concept</h3><p>'+e.key+'</p>';html+='<h3>2. Why it is correct</h3><ol>';for(var i=0;i<e.correct.length;i++)html+='<li>'+e.correct[i]+'</li>';html+='</ol><h3>3. Why it is incorrect</h3><ol>';for(i=0;i<e.wrong.length;i++)html+='<li>'+e.wrong[i]+'</li>';html+='</ol><h3>4. Exam Tip (CCDAK)</h3><p>'+e.tip+'</p>';document.getElementById('explanation').style.display='block';document.getElementById('explanation').innerHTML=html}
    function paint(){var q=QUESTIONS[qIdx];selected={};answered=false;document.getElementById('quiz').className='card';document.getElementById('final').className='card hidden';document.getElementById('meta').innerHTML='Question '+(qIdx+1)+' / '+QUESTIONS.length+' · Score '+score;document.getElementById('badge').innerHTML=q.type==='single'?'Single answer':'Multiple answers';document.getElementById('question').innerHTML=q.q;document.getElementById('status').innerHTML='';document.getElementById('explanation').style.display='none';document.getElementById('validateBtn').disabled=false;document.getElementById('nextBtn').disabled=true;paintOptions();paintScore();startTimer()}
    function paintScore(){var pct=(qIdx/QUESTIONS.length)*100;if(answered)pct=((qIdx+1)/QUESTIONS.length)*100;document.getElementById('progress').style.width=pct+'%'}
    function suivante(){if(!answered)return;qIdx++;if(qIdx>=QUESTIONS.length)showFinal();else paint()}
    function showFinal(){clearInterval(timerInterval);document.getElementById('quiz').className='card hidden';var pct=Math.round((score/QUESTIONS.length)*100),avg=Math.round(totalTimeSpent/QUESTIONS.length),msg='';if(pct>=85)msg='Excellent level on Schema Registry and schema evolution.';else if(pct>=70)msg='Solid result; review compatibility modes, subjects, and Avro evolution rules.';else msg='Needs review: focus on _schemas, subjects, compatibility, and Avro defaults.';document.getElementById('final').className='card';document.getElementById('final').innerHTML='<div class="scoreBox"><h1>Final Score</h1><div class="scoreNum">'+score+' / '+QUESTIONS.length+'</div><div class="resultBar"><div class="resultFill" style="width:'+pct+'%"></div></div><p><strong>'+pct+'%</strong> — '+msg+'</p><p><span class="pill">Average time per question: '+avg+'s</span><span class="pill">Questions: '+QUESTIONS.length+'</span></p><button class="btn" onclick="recommencer()">Restart Quiz</button></div>';document.getElementById('progress').style.width='100%'}
    function recommencer(){clearInterval(timerInterval);qIdx=0;selected={};answered=false;score=0;timeLeft=90;totalTimeSpent=0;lastTimeUp=false;shuffleOptions();paint()}
</script>
</body>
</html>
