<script>
var QUESTIONS_RAW = [
  {
    source: "cours",
    type: "single",
    question: "A retail company is building a ksqlDB pipeline to track the latest loyalty points balance per customer. Each incoming event with the same customer ID should overwrite the previous balance, not append a new record. A developer creates a ksqlDB entity and notices that inserting a record with a null customer ID is silently ignored. Which ksqlDB entity was created and what is the correct explanation for this behavior?",
    options: [
      { text: "A STREAM was created — streams silently drop null-key records to enforce ordering", explanation: "Incorrect. STREAMs allow null keys. Null-key records are NOT dropped in streams — they are processed normally with no special meaning assigned to the null key.", correct: false },
      { text: "A TABLE was created — null keys are not allowed in tables because a primary key is required to identify which row to update", explanation: "Correct. A TABLE requires a valid primary key to route and update the appropriate row. Records with null keys cannot be assigned to any row and are silently dropped at the table level.", correct: true },
      { text: "A TABLE was created — null-key records are routed to a special partition reserved for unkeyed records", explanation: "Incorrect. There is no special partition for null keys in ksqlDB tables. Null-key records are simply dropped — they are never stored or routed.", correct: false },
      { text: "A STREAM was created — null-key records trigger a deserialization error and are sent to the dead letter queue", explanation: "Incorrect. Null keys in streams are not deserialization errors and do not trigger DLQ routing. They are valid in streams and processed normally.", correct: false }
    ],
    answers: [1],
    globalExplanation: "In ksqlDB, TABLE semantics require a primary key for every record because tables model mutable state (latest value per key). Records with null keys cannot be mapped to any table row and are silently dropped before processing. In contrast, STREAMs treat every record — including null-key records — as independent immutable events, allowing null keys freely."
  },
  {
    source: "cours",
    type: "single",
    question: "A data engineering team creates a new ksqlDB STREAM over a Kafka topic that already contains 50,000 historical records. After creating the stream with default settings and running a SELECT query with EMIT CHANGES, they observe that no historical data is returned — only new records arrive. What configuration is responsible for this behavior and how should it be changed to reprocess historical data?",
    options: [
      { text: "processing.guarantee=at_least_once is filtering historical records; set it to exactly_once to reprocess them", explanation: "Incorrect. The processing.guarantee property controls exactly-once semantics for stateful operations — it has no effect on which offsets are read at stream startup.", correct: false },
      { text: "auto.offset.reset defaults to 'latest' in ksqlDB; change it to 'earliest' to read from the beginning of the topic", explanation: "Correct. ksqlDB's auto.offset.reset defaults to 'latest', causing new streams to consume only records produced after stream creation. Setting it to 'earliest' in the stream's WITH clause causes ksqlDB to read from offset 0.", correct: true },
      { text: "The EMIT CHANGES clause restricts queries to live data only; use a SELECT without EMIT CHANGES to access historical records", explanation: "Incorrect. EMIT CHANGES defines a push query that streams results continuously — it has no effect on which offset position the consumer starts from. A pull query (no EMIT CHANGES) would also be subject to auto.offset.reset.", correct: false },
      { text: "ksqlDB always starts from the latest offset and cannot be reconfigured to read historical data", explanation: "Incorrect. While the default is 'latest', ksqlDB streams can be configured with auto.offset.reset='earliest' in the WITH clause to read all historical records from the beginning of the topic.", correct: false }
    ],
    answers: [1],
    globalExplanation: "ksqlDB's default auto.offset.reset='latest' means new streams only consume records arriving after their creation — historical records are skipped. To reprocess historical data, create the stream with WITH (auto.offset.reset='earliest'). This directly mirrors the Kafka consumer auto.offset.reset property behavior that ksqlDB exposes at the stream level."
  },
  {
    source: "cours",
    type: "single",
    question: "A DevOps team is deploying ksqlDB to production. Their security policy requires that no ad-hoc SQL queries can be submitted to the production cluster and that only a pre-approved, version-controlled set of queries runs on the cluster. Additionally, the REST API endpoint must be disabled. Which deployment approach satisfies all these requirements?",
    options: [
      { text: "Interactive mode with RBAC policies restricting which users can submit queries", explanation: "Incorrect. Interactive mode always exposes a REST API endpoint. RBAC can restrict who submits queries but cannot disable the REST API or prevent ad-hoc query submission as a whole.", correct: false },
      { text: "Standalone mode with a single ksqlDB server and no load balancer", explanation: "Incorrect. Standalone mode refers to the deployment topology (one server), not the interactivity model. It does not disable the REST API or prevent ad-hoc queries.", correct: false },
      { text: "Headless mode — start ksqlDB servers with a predefined .sql file via --queries-file or ksql.queries.file; the REST endpoint is automatically disabled", explanation: "Correct. Headless (application) mode is the recommended production deployment. Providing a .sql file at startup compiles queries into Kafka Streams applications and automatically disables the REST endpoint, preventing any interactive or ad-hoc query submission.", correct: true },
      { text: "Interactive mode with ksql.access.control.allow.methods set to GET only", explanation: "Incorrect. Restricting HTTP methods to GET limits what can be done via the REST API but does not disable interactive access. Query submission uses POST requests — restricting to GET may break monitoring but won't prevent all interactivity.", correct: false }
    ],
    answers: [2],
    globalExplanation: "Headless ksqlDB mode is the canonical production deployment pattern: queries are predefined in a version-controlled .sql file passed at startup via --queries-file or ksql.queries.file. When ksqlDB starts in headless mode, the REST endpoint is automatically disabled, making the cluster a locked-down, automated stream processing service with no interactive access possible."
  },
  {
    source: "cours",
    type: "single",
    question: "A headless ksqlDB cluster processing critical financial streams must be restarted after a configuration change. The team needs to ensure that all queries are rebuilt with exactly the same configuration used at first startup. Where does ksqlDB store the original startup properties to guarantee this compatibility?",
    options: [
      { text: "In a local JSON file at the path specified by ksql.streams.state.dir", explanation: "Incorrect. ksql.streams.state.dir specifies the directory for RocksDB state storage used by stateful operations — it is not used to store ksqlDB server configuration properties.", correct: false },
      { text: "In the ksqlDB config topic in Kafka", explanation: "Correct. In headless mode, ksqlDB stores its startup properties in an internal Kafka config topic. On every restart, it reads this topic to ensure queries are compiled with the same configuration, guaranteeing restart compatibility.", correct: true },
      { text: "In Apache ZooKeeper under the /ksqldb/config znode", explanation: "Incorrect. ZooKeeper is used for service discovery in clustered deployments. ksqlDB does not store configuration properties in ZooKeeper — it uses a Kafka config topic for this purpose.", correct: false },
      { text: "In a snapshot file under the ksql.streams.state.dir directory", explanation: "Incorrect. The state directory contains RocksDB state snapshots for stateful queries — not server configuration properties.", correct: false }
    ],
    answers: [1],
    globalExplanation: "In headless mode, ksqlDB stores its initialization properties in an internal Kafka config topic. This allows each server restart to validate that the current configuration is compatible with the queries originally compiled. It is a key mechanism for ensuring deterministic, reproducible query execution across cluster restarts and rolling upgrades."
  },
  {
    source: "cours",
    type: "multiple",
    question: "A ksqlDB developer submits the following query: SELECT user_id, COUNT(*) FROM clicks WINDOW TUMBLING (SIZE 10 MINUTES) GROUP BY user_id. They need to expose these results to downstream client applications, some of which need real-time streaming results and others that need a single point-in-time snapshot. Which TWO query mechanisms should the developer use for each use case?",
    options: [
      { text: "Use CREATE TABLE AS SELECT … to create a persistent query writing results to a Kafka topic, then use push queries (EMIT CHANGES) for real-time clients", explanation: "Correct. A persistent query (CTAS) continuously updates a result table. Push queries on that table (SELECT … EMIT CHANGES) stream live result updates to real-time clients as new windows close.", correct: true },
      { text: "Use pull queries (SELECT without EMIT CHANGES) against the materialized table for point-in-time snapshots", explanation: "Correct. Pull queries execute once and return a bounded result set — perfect for clients that need a snapshot of the current windowed counts without subscribing to a continuous stream.", correct: true },
      { text: "Use push queries without a persistent backing table — results will be stored automatically by ksqlDB", explanation: "Incorrect. Push queries (SELECT … EMIT CHANGES) without a backing persistent query do not persist results to a Kafka topic. Results are streamed to the client connection only and are lost when the connection closes.", correct: false },
      { text: "Pull queries can be executed directly on the source STREAM without a materialized table", explanation: "Incorrect. Pull queries can only be executed on materialized tables that have a defined primary key. They cannot be run against non-materialized streams or tables without a primary key.", correct: false }
    ],
    answers: [0, 1],
    globalExplanation: "ksqlDB's query model has three layers: (1) persistent queries (CTAS/CSAS) that continuously write results to Kafka topics and materialize state; (2) push queries (EMIT CHANGES) for real-time streaming to clients; (3) pull queries for point-in-time lookups. Pull queries require a materialized view (persistent table with a primary key) as their backing source."
  },
  {
    source: "cours",
    type: "single",
    question: "A ksqlDB developer is enriching a real-time `transactions` stream with merchant data from a `merchants` table. Both reside on topics with identical key types (String) and the same number of partitions (12). The developer writes a CREATE STREAM AS SELECT … JOIN statement. The query runs successfully. Three months later, the merchants topic is repartitioned to 24 partitions. What impact does this change have on the existing join query?",
    options: [
      { text: "No impact — ksqlDB automatically handles repartitioning and adjusts the join dynamically", explanation: "Incorrect. ksqlDB does not automatically detect and adjust to partition count changes in the backing topics of running queries. The co-partitioning validation was done at query creation time.", correct: false },
      { text: "The join breaks co-partitioning: the query may produce incorrect results or fail because the streams no longer have the same number of partitions", explanation: "Correct. Stream-Table joins require co-partitioning (same key type and same partition count). After the merchants topic is repartitioned to 24 partitions, co-partitioning is broken. The join query must be dropped and recreated after repartitioning the transactions stream as well.", correct: true },
      { text: "The join automatically uses GlobalKTable semantics to bypass the co-partitioning requirement", explanation: "Incorrect. ksqlDB does not automatically switch between KTable and GlobalKTable semantics. A GlobalKTable must be explicitly used at query creation time and has a different creation syntax.", correct: false },
      { text: "The join continues to work correctly because ksqlDB validates co-partitioning at query execution time, not at definition time", explanation: "Incorrect. ksqlDB validates co-partitioning at query definition/compilation time, not continuously at runtime. Changing partitions after the query is created will not trigger revalidation.", correct: false }
    ],
    answers: [1],
    globalExplanation: "Co-partitioning (same key type, same partition count, same partitioning strategy) is a hard requirement for Stream-Table and Stream-Stream joins in ksqlDB. Changing the partition count of any joined topic after query creation breaks this requirement. The query must be dropped, the topics must be re-aligned, and the query must be recreated. This is a common operational pitfall in production ksqlDB environments."
  },
  {
    source: "cours",
    type: "single",
    question: "A ksqlDB developer needs to inspect the serialization format of a stream named `sensor_readings` to diagnose why records from an Avro-encoded topic are failing to deserialize. Which single ksqlDB command provides the most complete metadata including the VALUE_FORMAT?",
    options: [
      { text: "SHOW STREAMS", explanation: "Incorrect. SHOW STREAMS lists stream names and their backing topics but does not include detailed schema or serialization format information.", correct: false },
      { text: "DESCRIBE EXTENDED sensor_readings", explanation: "Correct. DESCRIBE EXTENDED provides comprehensive metadata including the stream's schema, VALUE_FORMAT, backing Kafka topic, partition count, replication factor, and runtime statistics — everything needed to diagnose a deserialization mismatch.", correct: true },
      { text: "EXPLAIN SELECT * FROM sensor_readings EMIT CHANGES", explanation: "Incorrect. EXPLAIN shows the execution plan and topology of a query — it reveals how ksqlDB will process the query, but does not show stream metadata like VALUE_FORMAT.", correct: false },
      { text: "SHOW TOPICS EXTENDED", explanation: "Incorrect. SHOW TOPICS lists Kafka topics and their partition/replication details but does not show ksqlDB stream schema or serialization configuration.", correct: false }
    ],
    answers: [1],
    globalExplanation: "DESCRIBE EXTENDED is the primary diagnostic command in ksqlDB for inspecting stream and table metadata. It returns the full schema definition, VALUE_FORMAT, KEY_FORMAT, backing topic details, and query statistics. When troubleshooting deserialization failures, comparing the VALUE_FORMAT shown by DESCRIBE EXTENDED against the actual topic encoding is the recommended first step."
  },
  {
    source: "cours",
    type: "single",
    question: "A ksqlDB cluster running windowed aggregations is experiencing slow I/O performance on stateful queries. The operations team suspects that RocksDB is writing to a slow network-attached storage volume. Which ksqlDB configuration property must be changed to redirect RocksDB state to a faster local SSD?",
    options: [
      { text: "ksql.queries.file", explanation: "Incorrect. ksql.queries.file specifies the path to the SQL file used in headless mode — it has no relation to RocksDB state storage location.", correct: false },
      { text: "ksql.schema.registry.url", explanation: "Incorrect. ksql.schema.registry.url defines the URL of the Confluent Schema Registry — it is unrelated to local RocksDB state storage.", correct: false },
      { text: "ksql.streams.state.dir", explanation: "Correct. ksql.streams.state.dir defines the filesystem directory where ksqlDB's underlying Kafka Streams (RocksDB) persists local state for stateful operations. Redirecting this to a fast local NVMe SSD directly improves stateful query throughput.", correct: true },
      { text: "auto.offset.reset", explanation: "Incorrect. auto.offset.reset controls the consumer offset behavior (latest/earliest/none) — it has no impact on the storage location of stateful query state.", correct: false }
    ],
    answers: [2],
    globalExplanation: "ksqlDB uses RocksDB (embedded in Kafka Streams) as the local state store for stateful operations such as aggregations, joins, and windowed computations. The `ksql.streams.state.dir` property maps directly to the Kafka Streams `state.dir` setting. For production deployments, this directory should reside on fast local storage (NVMe SSD) to prevent I/O bottlenecks during state reads and changelog recovery."
  },
  {
    source: "cours",
    type: "single",
    question: "A streaming analytics platform needs to guarantee that its ksqlDB pipelines produce correct, non-duplicate results even in the event of server failures or restarts. The team is willing to accept slightly higher latency in exchange for this guarantee. Which ksqlDB configuration enables end-to-end exactly-once processing semantics?",
    options: [
      { text: "Set enable.idempotence=true in the underlying Kafka producer configuration", explanation: "Incorrect. enable.idempotence guarantees idempotent producer delivery (no duplicates from a single producer session) but does not cover the read-process-write cycle. It alone does not achieve exactly-once semantics for stateful stream processing.", correct: false },
      { text: "Set processing.guarantee=exactly_once_v2 in the ksqlDB server configuration", explanation: "Correct. processing.guarantee=exactly_once_v2 enables end-to-end exactly-once semantics for ksqlDB's underlying Kafka Streams processing. It ensures that each input record is processed exactly once and the output is written transactionally — even in the event of failures.", correct: true },
      { text: "Set acks=all and min.insync.replicas=2 on the output topics", explanation: "Incorrect. acks=all and min.insync.replicas ensure that written records are durably replicated, but they do not prevent duplicate processing in the read-process-write pipeline after a failure and restart.", correct: false },
      { text: "Set isolation.level=read_committed in the ksqlDB consumer configuration", explanation: "Incorrect. isolation.level=read_committed is the consumer-side complement to transactional writes — it filters out uncommitted transactional messages. However, it must be combined with the full processing.guarantee=exactly_once_v2 configuration to achieve exactly-once end-to-end.", correct: false }
    ],
    answers: [1],
    globalExplanation: "ksqlDB's processing.guarantee setting maps directly to Kafka Streams' processing.guarantee property. Setting it to exactly_once_v2 (preferred over the older exactly_once since Kafka 2.5+) enables transactional read-process-write cycles: each batch of consumed records is atomically processed and the results are committed in a single transaction, ensuring no duplicate output even after failures."
  },
  {
    source: "cours",
    type: "single",
    question: "A ksqlDB stream named `orders` is queried with SELECT ROWTIME, ROWKEY, amount FROM orders EMIT CHANGES. A developer expects ROWTIME to reflect the application timestamp embedded in the order payload, but instead receives the Kafka broker ingestion time. What does ROWTIME actually represent in ksqlDB?",
    options: [
      { text: "The wall-clock time of the ksqlDB server when the query was executed", explanation: "Incorrect. ROWTIME is not the query execution time. It is derived from the Kafka record's timestamp metadata, not from the ksqlDB server's clock at query time.", correct: false },
      { text: "The Kafka message timestamp of the underlying topic record — by default this is the broker ingestion time (CreateTime or LogAppendTime depending on topic configuration)", explanation: "Correct. ROWTIME reflects the timestamp field of the Kafka ConsumerRecord. By default this is the producer's CreateTime. If the topic is configured with message.timestamp.type=LogAppendTime, it becomes the broker's ingestion time. ROWTIME does NOT come from the message payload.", correct: true },
      { text: "A user-defined timestamp column that must be declared in the CREATE STREAM statement", explanation: "Incorrect. ROWTIME is an implicit, always-available pseudo-column in ksqlDB streams. It does not need to be declared and cannot be overridden in the column list — though the timestamp extraction can be configured via TIMESTAMP and TIMESTAMP_FORMAT WITH clause properties.", correct: false },
      { text: "The offset of the Kafka record within its partition", explanation: "Incorrect. The offset is represented by ROWOFFSET (in newer ksqlDB versions) or is accessible through metadata functions. ROWTIME specifically refers to the record's timestamp, not its position in the partition log.", correct: false }
    ],
    answers: [1],
    globalExplanation: "ROWTIME is an implicit metadata pseudo-column available on every ksqlDB stream record, representing the Kafka record's timestamp (message.timestamp.type determines whether this is producer time or broker ingestion time). For event-time processing with application-generated timestamps, use the WITH (TIMESTAMP='payload_field', TIMESTAMP_FORMAT='...') clause to tell ksqlDB which field to use as event time instead of the Kafka record timestamp."
  },
  {
    source: "cours",
    type: "single",
    question: "A ksqlDB TABLE named `inventory` receives a Kafka record with a valid String key `'product-42'` and a null value. What is the effect of this record on the table?",
    options: [
      { text: "The record is inserted into the table with all value columns set to NULL", explanation: "Incorrect. A null value in a ksqlDB TABLE is not stored as a row with null columns — it is treated as a tombstone, which triggers the deletion of the existing row for that key.", correct: false },
      { text: "The record is treated as a tombstone: the row for 'product-42' is deleted from the table", explanation: "Correct. In ksqlDB TABLE semantics (mirroring compacted topic semantics), a null value is a tombstone record — it signals deletion of the row associated with the key 'product-42'. This is consistent with Kafka's log compaction tombstone mechanism.", correct: true },
      { text: "The record causes a deserialization error because null values are not allowed in ksqlDB tables", explanation: "Incorrect. Null values in ksqlDB tables are a valid, intentional mechanism (tombstones). They do not cause deserialization errors. Only null keys in tables are problematic (they are silently dropped).", correct: false },
      { text: "The record is forwarded to the dead letter queue because it fails value schema validation", explanation: "Incorrect. A null value is semantically meaningful in a table context (tombstone for deletion). It is not an error and does not trigger DLQ routing. DLQs are for deserialization or production failures, not tombstone records.", correct: false }
    ],
    answers: [1],
    globalExplanation: "ksqlDB TABLE semantics mirror Kafka's compacted topic model: a null value (tombstone) signals that the row for the given key should be deleted from the table's materialized state. This is the standard mechanism for deleting entries from a ksqlDB table. In contrast, ksqlDB STREAMs treat null values as ordinary events with no special deletion semantics."
  },
  {
    source: "inference",
    type: "single",
    question: "A streaming company deploys a ksqlDB pipeline using CREATE TABLE AS SELECT customer_id, SUM(amount) AS total_spend FROM purchases GROUP BY customer_id. A month later, they add three new ksqlDB servers to the cluster and the input topic has 12 partitions. How many ksqlDB servers will actively process this persistent query after the scale-out?",

var QUESTIONS = [];
var qIdx = 0;
var selected = [];
var answered = false;
var score = 0;
var scoreCoursTotal = 0;
var scoreCoursCorrect = 0;
var scoreInfTotal = 0;
var scoreInfCorrect = 0;
var totalTime = 0;
var timeLeft = 0;
var timerInterval = null;

function fisherYates(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function prepareQuestions() {
  var shuffled = fisherYates(QUESTIONS_RAW);
  QUESTIONS = shuffled.map(function(q) {
    var idxMap = [];
    for (var i = 0; i < q.options.length; i++) { idxMap.push(i); }
    var shuffledMap = fisherYates(idxMap);
    var newOptions = [];
    var newAnswers = [];
    for (var j = 0; j < shuffledMap.length; j++) {
      var origIdx = shuffledMap[j];
      newOptions.push({ text: q.options[origIdx].text, explanation: q.options[origIdx].explanation, correct: q.answers.indexOf(origIdx) !== -1 });
    }
    for (var k = 0; k < newOptions.length; k++) {
      if (newOptions[k].correct) newAnswers.push(k);
    }
    return {
      source: q.source,
      type: q.type,
      question: q.question,
      options: newOptions,
      answers: newAnswers,
      globalExplanation: q.globalExplanation
    };
  });
}

function startGlobalTimer() {
  clearInterval(timerInterval);
  totalTime = 90 * QUESTIONS.length;
  timeLeft = totalTime;
  updateTimerDisplay();
  timerInterval = setInterval(function() {
    timeLeft--;
    updateTimerDisplay();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      autoAdvance();
    }
  }, 1000);
}

function updateTimerDisplay() {
  var el = document.getElementById('timerDisplay');
  var mins = Math.floor(timeLeft / 60);
  var secs = timeLeft % 60;
  el.textContent = '⏱ ' + (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
  el.className = 'timer-global';
  var pct = timeLeft / totalTime;
  if (pct < 0.10) { el.className = 'timer-global danger'; }
  else if (pct < 0.20) { el.className = 'timer-global warn'; }
}

function autoAdvance() {
  if (!answered) {
    answered = true;
    var q = QUESTIONS[qIdx];
    if (q.source === 'cours') scoreCoursTotal++;
    else scoreInfTotal++;
    q.options.forEach(function(o, i) {
      var wrap = document.getElementById('opt_' + i);
      if (o.correct) { wrap.className = 'option-wrap missed'; }
      var expEl = document.getElementById('optexp_' + i);
      if (expEl) {
        expEl.style.display = 'block';
        expEl.className = 'opt-exp ' + (o.correct ? 'correct-exp' : 'wrong-exp');
        expEl.innerHTML = '<span class="icon">' + (o.correct ? '✓' : '✗') + '</span>' + o.explanation;
      }
    });
    var ge = document.getElementById('globalExpBox');
    document.getElementById('globalExpText').textContent = q.globalExplanation;
    ge.style.display = 'block';
    document.getElementById('btnValidate').disabled = true;
    document.getElementById('btnNext').disabled = false;
  }
  if (qIdx >= QUESTIONS.length - 1) {
    setTimeout(function() { paintScore(); }, 1500);
  } else {
    setTimeout(function() { qIdx++; paint(); }, 1500);
  }
}

function paint() {
  var q = QUESTIONS[qIdx];
  selected = [];
  answered = false;

  var bType = document.getElementById('badgeType');
  bType.className = 'badge ' + (q.type === 'single' ? 'badge-single' : 'badge-multiple');
  bType.textContent = q.type === 'single' ? 'Single answer' : 'Multiple answers';

  var bSrc = document.getElementById('badgeSource');
  bSrc.className = 'badge ' + (q.source === 'cours' ? 'badge-cours' : 'badge-inference');
  bSrc.textContent = q.source === 'cours' ? '📘 From the course' : '🔍 Beyond the course';

  document.getElementById('questionText').textContent = (qIdx + 1) + '. ' + q.question;

  var letters = ['A','B','C','D','E'];
  var container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach(function(o, i) {
    var wrap = document.createElement('div');
    wrap.className = 'option-wrap';
    wrap.id = 'opt_' + i;
    wrap.setAttribute('onclick', 'pickOption(' + i + ')');
    var header = document.createElement('div');
    header.className = 'option-header';
    header.innerHTML = '<span class="option-letter">' + letters[i] + '</span><span class="option-text">' + o.text + '</span>';
    var expDiv = document.createElement('div');
    expDiv.className = 'opt-exp';
    expDiv.id = 'optexp_' + i;
    expDiv.style.display = 'none';
    wrap.appendChild(header);
    wrap.appendChild(expDiv);
    container.appendChild(wrap);
  });

  document.getElementById('globalExpBox').style.display = 'none';
  document.getElementById('globalExpText').textContent = '';
  document.getElementById('btnValidate').disabled = false;
  document.getElementById('btnNext').disabled = true;

  var pct = (qIdx / QUESTIONS.length) * 100;
  document.getElementById('progBar').style.width = pct + '%';
}

function pickOption(i) {
  if (answered) return;
  var q = QUESTIONS[qIdx];
  if (q.type === 'single') {
    selected = [i];
    q.options.forEach(function(o, idx) {
      document.getElementById('opt_' + idx).className = 'option-wrap' + (idx === i ? ' selected' : '');
    });
  } else {
    var pos = selected.indexOf(i);
    if (pos === -1) { selected.push(i); document.getElementById('opt_' + i).classList.add('selected'); }
    else { selected.splice(pos, 1); document.getElementById('opt_' + i).classList.remove('selected'); }
  }
}

function valider() {
  if (answered) return;
  answered = true;
  var q = QUESTIONS[qIdx];
  var correctIdxs = q.answers.slice();
  var isCorrect = selected.slice().sort().join(',') === correctIdxs.slice().sort().join(',');

  if (isCorrect) {
    score++;
    if (q.source === 'cours') scoreCoursCorrect++;
    else scoreInfCorrect++;
  }
  if (q.source === 'cours') scoreCoursTotal++;
  else scoreInfTotal++;

  q.options.forEach(function(o, i) {
    var wrap = document.getElementById('opt_' + i);
    wrap.className = 'option-wrap';
    var sel = selected.indexOf(i) !== -1;
    if (o.correct && sel) { wrap.className = 'option-wrap correct'; }
    else if (!o.correct && sel) { wrap.className = 'option-wrap wrong'; }
    else if (o.correct && !sel) { wrap.className = 'option-wrap missed'; }

    var expEl = document.getElementById('optexp_' + i);
    if (expEl) {
      expEl.style.display = 'block';
      expEl.className = 'opt-exp ' + (o.correct ? 'correct-exp' : 'wrong-exp');
      expEl.innerHTML = '<span class="icon">' + (o.correct ? '✓' : '✗') + '</span>' + o.explanation;
    }
  });

  document.getElementById('globalExpText').textContent = q.globalExplanation;
  document.getElementById('globalExpBox').style.display = 'block';
  document.getElementById('btnValidate').disabled = true;
  document.getElementById('btnNext').disabled = false;

  var pct = ((qIdx + 1) / QUESTIONS.length) * 100;
  document.getElementById('progBar').style.width = pct + '%';
}

function suivante() {
  qIdx++;
  if (qIdx >= QUESTIONS.length) {
    paintScore();
  } else {
    paint();
  }
}

function paintScore() {
  clearInterval(timerInterval);
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('scoreScreen').style.display = 'block';

  var pct = Math.round((score / QUESTIONS.length) * 100);
  var msg = pct >= 80 ? '🎉 Excellent! You\'re well prepared for the CCDAK.' :
            pct >= 60 ? '👍 Good effort. Review the highlighted topics.' :
            '📚 Keep studying — revisit the ksqlDB concepts.';

  document.getElementById('scoreTitle').textContent = score + ' / ' + QUESTIONS.length + ' (' + pct + '%)';
  document.getElementById('scoreMsg').textContent = msg;

  var bar = document.getElementById('scoreBar');
  bar.style.width = pct + '%';
  bar.style.background = pct >= 80 ? '#27ae60' : pct >= 60 ? '#f39c12' : '#C0392B';

  document.getElementById('scoreDetail').innerHTML =
    '<p><strong>📘 From the course:</strong> ' + scoreCoursCorrect + ' / ' + scoreCoursTotal + '</p>' +
    '<p><strong>🔍 Beyond the course:</strong> ' + scoreInfCorrect + ' / ' + scoreInfTotal + '</p>';
}

function recommencer() {
  qIdx = 0; selected = []; answered = false; score = 0;
  scoreCoursTotal = 0; scoreCoursCorrect = 0;
  scoreInfTotal = 0; scoreInfCorrect = 0;
  prepareQuestions();
  document.getElementById('scoreScreen').style.display = 'none';
  document.getElementById('quizArea').style.display = 'block';
  startGlobalTimer();
  paint();
}

prepareQuestions();
window.onload = function() {
  startGlobalTimer();
  paint();
};
</script>
</body>
